3E\u0930\u0940"]],["The Sahara covers much of North Africa. India has the Thar Desert.","\u0938\u0939\u093E\u0930\u093E \u0909\u0924\u094D\u0924\u0930\u0940 \u0905\u092B\u093C\u094D\u0930\u0940\u0915\u093E \u0915\u0947 \u092C\u0921\u093C\u0947 \u092D\u093E\u0917 \u092E\u0947\u0902 \u092B\u0948\u0932\u093E \u0939\u0948\u0964 \u092D\u093E\u0930\u0924 \u092E\u0947\u0902 \u0925\u093E\u0930 \u092E\u0930\u0941\u0938\u094D\u0925\u0932 \u0939\u0948\u0964"]],["Which imaginary line divides the Earth into northern and southern halves?","\u0915\u094C\u0928-\u0938\u0940 \u0915\u093E\u0932\u094D\u092A\u0928\u093F\u0915 \u0930\u0947\u0916\u093E \u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u094B \u0909\u0924\u094D\u0924\u0930\u0940 \u0914\u0930 \u0926\u0915\u094D\u0937\u093F\u0923\u0940 \u092D\u093E\u0917\u094B\u0902 \u092E\u0947\u0902 \u092C\u093E\u0901\u091F\u0924\u0940 \u0939\u0948?",["Equator","\u092D\u0942\u092E\u0927\u094D\u092F \u0930\u0947\u0916\u093E"],[["Prime Meridian","\u092A\u094D\u0930\u0927\u093E\u0928 \u092E\u0927\u094D\u092F\u093E\u0939\u094D\u0928 \u0930\u0947\u0916\u093E"],["Tropic of Cancer","\u0915\u0930\u094D\u0915 \u0930\u0947\u0916\u093E"],["Arctic Circle","\u0906\u0930\u094D\u0915\u091F\u093F\u0915 \u0935\u0943\u0924\u094D\u0924"]],["The equator is at 0\xB0 latitude. The Tropic of Cancer passes through India.","\u092D\u0942\u092E\u0927\u094D\u092F \u0930\u0947\u0916\u093E 0\xB0 \u0905\u0915\u094D\u0937\u093E\u0902\u0936 \u092A\u0930 \u0939\u0948\u0964 \u0915\u0930\u094D\u0915 \u0930\u0947\u0916\u093E \u092D\u093E\u0930\u0924 \u0938\u0947 \u0939\u094B\u0915\u0930 \u0917\u0941\u091C\u093C\u0930\u0924\u0940 \u0939\u0948\u0964"]]]),L("g.scientists",6,s("Great scientists and inventions","\u092E\u0939\u093E\u0928 \u0935\u0948\u091C\u094D\u091E\u093E\u0928\u093F\u0915 \u0914\u0930 \u0906\u0935\u093F\u0937\u094D\u0915\u093E\u0930"),["g.india"],s("Link each person to one discovery and one reason it mattered.","\u0939\u0930 \u0935\u094D\u092F\u0915\u094D\u0924\u093F \u0915\u094B \u090F\u0915 \u0916\u094B\u091C \u0914\u0930 \u0909\u0938\u0915\u0947 \u092E\u0939\u0924\u094D\u0935 \u0915\u0947 \u090F\u0915 \u0915\u093E\u0930\u0923 \u0938\u0947 \u091C\u094B\u0921\u093C\u093F\u090F\u0964"),[['Who is known as the "Missile Man of India"?','"\u092D\u093E\u0930\u0924 \u0915\u0947 \u092E\u093F\u0938\u093E\u0907\u0932 \u092E\u0948\u0928" \u0915\u093F\u0928\u094D\u0939\u0947\u0902 \u0915\u0939\u093E \u091C\u093E\u0924\u093E \u0939\u0948?',["A. P. J. Abdul Kalam","\u090F. \u092A\u0940. \u091C\u0947. \u0905\u092C\u094D\u0926\u0941\u0932 \u0915\u0932\u093E\u092E"],[["C. V. Raman","\u0938\u0940. \u0935\u0940. \u0930\u092E\u0928"],["Homi J. Bhabha","\u0939\u094B\u092E\u0940 \u091C\u0947. \u092D\u093E\u092D\u093E"],["Vikram Sarabhai","\u0935\u093F\u0915\u094D\u0930\u092E \u0938\u093E\u0930\u093E\u092D\u093E\u0908"]],["Dr Kalam led India's missile programme and later became President.","\u0921\u0949. \u0915\u0932\u093E\u092E \u0928\u0947 \u092D\u093E\u0930\u0924 \u0915\u0947 \u092E\u093F\u0938\u093E\u0907\u0932 \u0915\u093E\u0930\u094D\u092F\u0915\u094D\u0930\u092E \u0915\u093E \u0928\u0947\u0924\u0943\u0924\u094D\u0935 \u0915\u093F\u092F\u093E \u0914\u0930 \u092C\u093E\u0926 \u092E\u0947\u0902 \u0930\u093E\u0937\u094D\u091F\u094D\u0930\u092A\u0924\u093F \u092C\u0928\u0947\u0964"]],["Which Indian scientist won the Nobel Prize in Physics for work on the scattering of light?","\u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u0947 \u092A\u094D\u0930\u0915\u0940\u0930\u094D\u0923\u0928 \u092A\u0930 \u0915\u093E\u0930\u094D\u092F \u0915\u0947 \u0932\u093F\u090F \u092D\u094C\u0924\u093F\u0915\u0940 \u0915\u093E \u0928\u094B\u092C\u0947\u0932 \u092A\u0941\u0930\u0938\u094D\u0915\u093E\u0930 \u0915\u093F\u0938 \u092D\u093E\u0930\u0924\u0940\u092F \u0935\u0948\u091C\u094D\u091E\u093E\u0928\u093F\u0915 \u0915\u094B \u092E\u093F\u0932\u093E?",["C. V. Raman","\u0938\u0940. \u0935\u0940. \u0930\u092E\u0928"],[["Jagadish Chandra Bose","\u091C\u0917\u0926\u0940\u0936 \u091A\u0902\u0926\u094D\u0930 \u092C\u094B\u0938"],["Srinivasa Ramanujan","\u0936\u094D\u0930\u0940\u0928\u093F\u0935\u093E\u0938 \u0930\u093E\u092E\u093E\u0928\u0941\u091C\u0928"],["Satyendra Nath Bose","\u0938\u0924\u094D\u092F\u0947\u0902\u0926\u094D\u0930 \u0928\u093E\u0925 \u092C\u094B\u0938"]],["C. V. Raman won it in 1930 for the Raman effect. 28 February is National Science Day.","\u0938\u0940. \u0935\u0940. \u0930\u092E\u0928 \u0915\u094B 1930 \u092E\u0947\u0902 \u0930\u092E\u0928 \u092A\u094D\u0930\u092D\u093E\u0935 \u0915\u0947 \u0932\u093F\u090F \u092F\u0939 \u092E\u093F\u0932\u093E\u0964 28 \u092B\u093C\u0930\u0935\u0930\u0940 \u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0940\u092F \u0935\u093F\u091C\u094D\u091E\u093E\u0928 \u0926\u093F\u0935\u0938 \u0939\u0948\u0964"]],["Srinivasa Ramanujan is famous for his work in:","\u0936\u094D\u0930\u0940\u0928\u093F\u0935\u093E\u0938 \u0930\u093E\u092E\u093E\u0928\u0941\u091C\u0928 \u0915\u093F\u0938 \u0915\u094D\u0937\u0947\u0924\u094D\u0930 \u0915\u0947 \u0932\u093F\u090F \u092A\u094D\u0930\u0938\u093F\u0926\u094D\u0927 \u0939\u0948\u0902?",["Mathematics","\u0917\u0923\u093F\u0924"],[["Chemistry","\u0930\u0938\u093E\u092F\u0928 \u0935\u093F\u091C\u094D\u091E\u093E\u0928"],["Medicine","\u091A\u093F\u0915\u093F\u0924\u094D\u0938\u093E"],["Astronomy only","\u0915\u0947\u0935\u0932 \u0916\u0917\u094B\u0932 \u0935\u093F\u091C\u094D\u091E\u093E\u0928"]],["Ramanujan was a self-taught genius in mathematics. 22 December is National Mathematics Day.","\u0930\u093E\u092E\u093E\u0928\u0941\u091C\u0928 \u0917\u0923\u093F\u0924 \u0915\u0947 \u0938\u094D\u0935\u092F\u0902-\u0936\u093F\u0915\u094D\u0937\u093F\u0924 \u092A\u094D\u0930\u0924\u093F\u092D\u093E\u0936\u093E\u0932\u0940 \u0935\u093F\u0926\u094D\u0935\u093E\u0928 \u0925\u0947\u0964 22 \u0926\u093F\u0938\u0902\u092C\u0930 \u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0940\u092F \u0917\u0923\u093F\u0924 \u0926\u093F\u0935\u0938 \u0939\u0948\u0964"]],["Who invented the telephone?","\u091F\u0947\u0932\u0940\u092B\u093C\u094B\u0928 \u0915\u093E \u0906\u0935\u093F\u0937\u094D\u0915\u093E\u0930 \u0915\u093F\u0938\u0928\u0947 \u0915\u093F\u092F\u093E?",["Alexander Graham Bell","\u0905\u0932\u0947\u0915\u094D\u091C\u093C\u0947\u0902\u0921\u0930 \u0917\u094D\u0930\u093E\u0939\u092E \u092C\u0947\u0932"],[["Thomas Edison","\u0925\u0949\u092E\u0938 \u090F\u0921\u093F\u0938\u0928"],["Isaac Newton","\u0906\u0907\u091C\u093C\u0915 \u0928\u094D\u092F\u0942\u091F\u0928"],["Albert Einstein","\u0905\u0932\u094D\u092C\u0930\u094D\u091F \u0906\u0907\u0902\u0938\u094D\u091F\u0940\u0928"]],["Bell received the patent for the telephone in 1876.","\u092C\u0947\u0932 \u0915\u094B 1876 \u092E\u0947\u0902 \u091F\u0947\u0932\u0940\u092B\u093C\u094B\u0928 \u0915\u093E \u092A\u0947\u091F\u0947\u0902\u091F \u092E\u093F\u0932\u093E\u0964"]],["Which ancient Indian mathematician and astronomer is India's first satellite named after?","\u092D\u093E\u0930\u0924 \u0915\u093E \u092A\u0939\u0932\u093E \u0909\u092A\u0917\u094D\u0930\u0939 \u0915\u093F\u0938 \u092A\u094D\u0930\u093E\u091A\u0940\u0928 \u092D\u093E\u0930\u0924\u0940\u092F \u0917\u0923\u093F\u0924\u091C\u094D\u091E \u0914\u0930 \u0916\u0917\u094B\u0932\u0936\u093E\u0938\u094D\u0924\u094D\u0930\u0940 \u0915\u0947 \u0928\u093E\u092E \u092A\u0930 \u0939\u0948?",["Aryabhata","\u0906\u0930\u094D\u092F\u092D\u091F"],[["Brahmagupta","\u092C\u094D\u0930\u0939\u094D\u092E\u0917\u0941\u092A\u094D\u0924"],["Bhaskara","\u092D\u093E\u0938\u094D\u0915\u0930"],["Varahamihira","\u0935\u0930\u093E\u0939\u092E\u093F\u0939\u093F\u0930"]],["Aryabhata was launched in 1975.","\u0906\u0930\u094D\u092F\u092D\u091F \u0909\u092A\u0917\u094D\u0930\u0939 1975 \u092E\u0947\u0902 \u092A\u094D\u0930\u0915\u094D\u0937\u0947\u092A\u093F\u0924 \u0915\u093F\u092F\u093E \u0917\u092F\u093E\u0964"]],["Who gave the laws of motion and the idea of gravity?","\u0917\u0924\u093F \u0915\u0947 \u0928\u093F\u092F\u092E \u0914\u0930 \u0917\u0941\u0930\u0941\u0924\u094D\u0935\u093E\u0915\u0930\u094D\u0937\u0923 \u0915\u093E \u0938\u093F\u0926\u094D\u0927\u093E\u0902\u0924 \u0915\u093F\u0938\u0928\u0947 \u0926\u093F\u092F\u093E?",["Isaac Newton","\u0906\u0907\u091C\u093C\u0915 \u0928\u094D\u092F\u0942\u091F\u0928"],[["Galileo Galilei","\u0917\u0948\u0932\u0940\u0932\u093F\u092F\u094B \u0917\u0948\u0932\u0940\u0932\u0940"],["Charles Darwin","\u091A\u093E\u0930\u094D\u0932\u094D\u0938 \u0921\u093E\u0930\u094D\u0935\u093F\u0928"],["Marie Curie","\u092E\u0948\u0930\u0940 \u0915\u094D\u092F\u0942\u0930\u0940"]],["Newton described three laws of motion and universal gravitation.","\u0928\u094D\u092F\u0942\u091F\u0928 \u0928\u0947 \u0917\u0924\u093F \u0915\u0947 \u0924\u0940\u0928 \u0928\u093F\u092F\u092E \u0914\u0930 \u0938\u093E\u0930\u094D\u0935\u0924\u094D\u0930\u093F\u0915 \u0917\u0941\u0930\u0941\u0924\u094D\u0935\u093E\u0915\u0930\u094D\u0937\u0923 \u0915\u093E \u0935\u0930\u094D\u0923\u0928 \u0915\u093F\u092F\u093E\u0964"]]])],yn=[L("c.ai1",5,s("AI basics: what AI is","AI \u0915\u0940 \u092E\u0942\u0932 \u092C\u093E\u0924\u0947\u0902: AI \u0915\u094D\u092F\u093E \u0939\u0948"),[],s("AI learns patterns from many examples. It can be very useful and it can also be wrong, so we check it.","AI \u092C\u0939\u0941\u0924 \u0938\u093E\u0930\u0947 \u0909\u0926\u093E\u0939\u0930\u0923\u094B\u0902 \u0938\u0947 \u092A\u0948\u091F\u0930\u094D\u0928 \u0938\u0940\u0916\u0924\u093E \u0939\u0948\u0964 \u092F\u0939 \u092C\u0939\u0941\u0924 \u0909\u092A\u092F\u094B\u0917\u0940 \u0939\u094B \u0938\u0915\u0924\u093E \u0939\u0948 \u0914\u0930 \u0917\u0932\u0924 \u092D\u0940 \u0939\u094B \u0938\u0915\u0924\u093E \u0939\u0948, \u0907\u0938\u0932\u093F\u090F \u0939\u092E \u0907\u0938\u0947 \u091C\u093E\u0901\u091A\u0924\u0947 \u0939\u0948\u0902\u0964"),[["How does an AI model learn to recognise cats in photos?","AI \u092E\u0949\u0921\u0932 \u0924\u0938\u094D\u0935\u0940\u0930\u094B\u0902 \u092E\u0947\u0902 \u092C\u093F\u0932\u094D\u0932\u0940 \u092A\u0939\u091A\u093E\u0928\u0928\u093E \u0915\u0948\u0938\u0947 \u0938\u0940\u0916\u0924\u093E \u0939\u0948?",["By studying many example photos","\u092C\u0939\u0941\u0924 \u0938\u093E\u0930\u0940 \u0909\u0926\u093E\u0939\u0930\u0923 \u0924\u0938\u094D\u0935\u0940\u0930\u0947\u0902 \u0926\u0947\u0916\u0915\u0930"],[["By being born knowing it","\u091C\u0928\u094D\u092E \u0938\u0947 \u0939\u0940 \u091C\u093E\u0928\u0915\u0930"],["By asking a cat","\u092C\u093F\u0932\u094D\u0932\u0940 \u0938\u0947 \u092A\u0942\u091B\u0915\u0930"],["It cannot learn anything","\u0935\u0939 \u0915\u0941\u091B \u092D\u0940 \u0928\u0939\u0940\u0902 \u0938\u0940\u0916 \u0938\u0915\u0924\u093E"]],["AI finds patterns in a large number of examples. This is called training.","AI \u092C\u0921\u093C\u0940 \u0938\u0902\u0916\u094D\u092F\u093E \u092E\u0947\u0902 \u0909\u0926\u093E\u0939\u0930\u0923\u094B\u0902 \u092E\u0947\u0902 \u092A\u0948\u091F\u0930\u094D\u0928 \u0916\u094B\u091C\u0924\u093E \u0939\u0948\u0964 \u0907\u0938\u0947 \u092A\u094D\u0930\u0936\u093F\u0915\u094D\u0937\u0923 (training) \u0915\u0939\u0924\u0947 \u0939\u0948\u0902\u0964"]],["The examples used to teach an AI are called:","AI \u0915\u094B \u0938\u093F\u0916\u093E\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0926\u093F\u090F \u0917\u090F \u0909\u0926\u093E\u0939\u0930\u0923\u094B\u0902 \u0915\u094B \u0915\u094D\u092F\u093E \u0915\u0939\u0924\u0947 \u0939\u0948\u0902?",["Training data","\u092A\u094D\u0930\u0936\u093F\u0915\u094D\u0937\u0923 \u0921\u0947\u091F\u093E (training data)"],[["Hardware","\u0939\u093E\u0930\u094D\u0921\u0935\u0947\u092F\u0930"],["A password","\u092A\u093E\u0938\u0935\u0930\u094D\u0921"],["An app store","\u0910\u092A \u0938\u094D\u091F\u094B\u0930"]],["Good training data helps AI learn well; poor data teaches it mistakes.","\u0905\u091A\u094D\u091B\u093E \u092A\u094D\u0930\u0936\u093F\u0915\u094D\u0937\u0923 \u0921\u0947\u091F\u093E AI \u0915\u094B \u0920\u0940\u0915 \u0938\u0947 \u0938\u093F\u0916\u093E\u0924\u093E \u0939\u0948; \u0916\u0930\u093E\u092C \u0921\u0947\u091F\u093E \u0909\u0938\u0947 \u0917\u0932\u0924\u093F\u092F\u093E\u0901 \u0938\u093F\u0916\u093E\u0924\u093E \u0939\u0948\u0964"]],["A chatbot gives you a fact for your homework. What should you do?","\u090F\u0915 \u091A\u0948\u091F\u092C\u0949\u091F \u0906\u092A\u0915\u0947 \u0917\u0943\u0939\u0915\u093E\u0930\u094D\u092F \u0915\u0947 \u0932\u093F\u090F \u0915\u094B\u0908 \u0924\u0925\u094D\u092F \u092C\u0924\u093E\u0924\u093E \u0939\u0948\u0964 \u0906\u092A\u0915\u094B \u0915\u094D\u092F\u093E \u0915\u0930\u0928\u093E \u091A\u093E\u0939\u093F\u090F?",["Check it in your textbook or another trusted source","\u0909\u0938\u0947 \u092A\u093E\u0920\u094D\u092F\u092A\u0941\u0938\u094D\u0924\u0915 \u092F\u093E \u0915\u093F\u0938\u0940 \u0905\u0928\u094D\u092F \u092D\u0930\u094B\u0938\u0947\u092E\u0902\u0926 \u0938\u094D\u0930\u094B\u0924 \u092E\u0947\u0902 \u091C\u093E\u0901\u091A\u0928\u093E"],[["Copy it without reading","\u092C\u093F\u0928\u093E \u092A\u0922\u093C\u0947 \u0928\u0915\u0932 \u0915\u0930 \u0932\u0947\u0928\u093E"],["Believe it because a computer said it","\u092E\u093E\u0928 \u0932\u0947\u0928\u093E \u0915\u094D\u092F\u094B\u0902\u0915\u093F \u0915\u0902\u092A\u094D\u092F\u0942\u091F\u0930 \u0928\u0947 \u0915\u0939\u093E \u0939\u0948"],["Share it with everyone at once","\u0924\u0941\u0930\u0902\u0924 \u0938\u092C\u0915\u094B \u092D\u0947\u091C \u0926\u0947\u0928\u093E"]],["AI can sound sure and still be wrong. Checking a second source is a habit of smart learners.","AI \u092A\u0942\u0930\u0947 \u0935\u093F\u0936\u094D\u0935\u093E\u0938 \u0938\u0947 \u092C\u094B\u0932\u0915\u0930 \u092D\u0940 \u0917\u0932\u0924 \u0939\u094B \u0938\u0915\u0924\u093E \u0939\u0948\u0964 \u0926\u0942\u0938\u0930\u0947 \u0938\u094D\u0930\u094B\u0924 \u0938\u0947 \u091C\u093E\u0901\u091A\u0928\u093E \u0938\u092E\u091D\u0926\u093E\u0930 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u0940 \u0915\u0940 \u0906\u0926\u0924 \u0939\u0948\u0964"]],["Which of these is an example of AI in daily life?","\u0907\u0928\u092E\u0947\u0902 \u0938\u0947 \u0915\u094C\u0928 \u0926\u0948\u0928\u093F\u0915 \u091C\u0940\u0935\u0928 \u092E\u0947\u0902 AI \u0915\u093E \u0909\u0926\u093E\u0939\u0930\u0923 \u0939\u0948?",["A phone that turns speech into text","\u092C\u094B\u0932\u0940 \u0915\u094B \u0932\u093F\u0916\u093F\u0924 \u0936\u092C\u094D\u0926\u094B\u0902 \u092E\u0947\u0902 \u092C\u0926\u0932\u0928\u0947 \u0935\u093E\u0932\u093E \u092B\u093C\u094B\u0928"],[["A wooden chair","\u0932\u0915\u0921\u093C\u0940 \u0915\u0940 \u0915\u0941\u0930\u094D\u0938\u0940"],["A pencil sharpener","\u092A\u0947\u0902\u0938\u093F\u0932 \u0936\u093E\u0930\u094D\u092A\u0928\u0930"],["A plain light switch","\u0938\u093E\u0927\u093E\u0930\u0923 \u092C\u093F\u091C\u0932\u0940 \u0915\u093E \u0938\u094D\u0935\u093F\u091A"]],["Speech recognition learns from many voice recordings, so it is AI.","\u0906\u0935\u093E\u091C\u093C \u092A\u0939\u091A\u093E\u0928\u0928\u0947 \u0935\u093E\u0932\u0940 \u0924\u0915\u0928\u0940\u0915 \u092C\u0939\u0941\u0924 \u0938\u093E\u0930\u0940 \u0930\u093F\u0915\u0949\u0930\u094D\u0921\u093F\u0902\u0917 \u0938\u0947 \u0938\u0940\u0916\u0924\u0940 \u0939\u0948, \u0907\u0938\u0932\u093F\u090F \u092F\u0939 AI \u0939\u0948\u0964"]],["What should you never type into an AI chatbot or website?","\u0915\u093F\u0938\u0940 AI \u091A\u0948\u091F\u092C\u0949\u091F \u092F\u093E \u0935\u0947\u092C\u0938\u093E\u0907\u091F \u092E\u0947\u0902 \u0906\u092A\u0915\u094B \u0915\u092D\u0940 \u0915\u094D\u092F\u093E \u0928\u0939\u0940\u0902 \u0932\u093F\u0916\u0928\u093E \u091A\u093E\u0939\u093F\u090F?",["Your home address or passwords","\u0905\u092A\u0928\u093E \u0918\u0930 \u0915\u093E \u092A\u0924\u093E \u092F\u093E \u092A\u093E\u0938\u0935\u0930\u094D\u0921"],[["A maths question","\u0917\u0923\u093F\u0924 \u0915\u093E \u092A\u094D\u0930\u0936\u094D\u0928"],["The name of a planet","\u0915\u093F\u0938\u0940 \u0917\u094D\u0930\u0939 \u0915\u093E \u0928\u093E\u092E"],["A request for a story","\u0915\u0939\u093E\u0928\u0940 \u0915\u093E \u0905\u0928\u0941\u0930\u094B\u0927"]],["Keep personal details private online, and ask a parent if you are unsure.","\u0911\u0928\u0932\u093E\u0907\u0928 \u0905\u092A\u0928\u0940 \u0928\u093F\u091C\u0940 \u091C\u093E\u0928\u0915\u093E\u0930\u0940 \u0917\u0941\u092A\u094D\u0924 \u0930\u0916\u093F\u090F, \u0914\u0930 \u0938\u0902\u0926\u0947\u0939 \u0939\u094B \u0924\u094B \u092E\u093E\u0924\u093E-\u092A\u093F\u0924\u093E \u0938\u0947 \u092A\u0942\u091B\u093F\u090F\u0964"]]]),L("c.ai2",6,s("Using AI wisely","AI \u0915\u093E \u0938\u092E\u091D\u0926\u093E\u0930\u0940 \u0938\u0947 \u0909\u092A\u092F\u094B\u0917"),["c.ai1"],s("Use AI to help you think, not to think for you. You stay responsible for your own work.","AI \u0915\u094B \u0938\u094B\u091A\u0928\u0947 \u092E\u0947\u0902 \u092E\u0926\u0926 \u0915\u0947 \u0932\u093F\u090F \u0909\u092A\u092F\u094B\u0917 \u0915\u0940\u091C\u093F\u090F, \u0905\u092A\u0928\u0940 \u091C\u0917\u0939 \u0938\u094B\u091A\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0928\u0939\u0940\u0902\u0964 \u0905\u092A\u0928\u0947 \u0915\u093E\u092E \u0915\u0940 \u091C\u093C\u093F\u092E\u094D\u092E\u0947\u0926\u093E\u0930\u0940 \u0906\u092A\u0915\u0940 \u0939\u0940 \u0939\u0948\u0964"),[["If an AI was trained mostly on photos of one kind of face, it may:","\u092F\u0926\u093F AI \u0915\u094B \u091C\u093C\u094D\u092F\u093E\u0926\u093E\u0924\u0930 \u090F\u0915 \u0939\u0940 \u0924\u0930\u0939 \u0915\u0947 \u091A\u0947\u0939\u0930\u094B\u0902 \u0915\u0940 \u0924\u0938\u094D\u0935\u0940\u0930\u094B\u0902 \u0938\u0947 \u0938\u093F\u0916\u093E\u092F\u093E \u0917\u092F\u093E \u0939\u094B, \u0924\u094B \u0935\u0939:",["Work worse for other faces (bias)","\u0926\u0942\u0938\u0930\u0947 \u091A\u0947\u0939\u0930\u094B\u0902 \u0915\u0947 \u0932\u093F\u090F \u0915\u092E \u0920\u0940\u0915 \u0915\u093E\u092E \u0915\u0930\u0947\u0917\u093E (\u092A\u0915\u094D\u0937\u092A\u093E\u0924)"],[["Work perfectly for everyone","\u0938\u092C\u0915\u0947 \u0932\u093F\u090F \u092C\u093F\u0932\u094D\u0915\u0941\u0932 \u0938\u0939\u0940 \u0915\u093E\u092E \u0915\u0930\u0947\u0917\u093E"],["Stop working at night","\u0930\u093E\u0924 \u092E\u0947\u0902 \u0915\u093E\u092E \u0915\u0930\u0928\u093E \u092C\u0902\u0926 \u0915\u0930 \u0926\u0947\u0917\u093E"],["Become faster every day by itself","\u0905\u092A\u0928\u0947 \u0906\u092A \u0939\u0930 \u0926\u093F\u0928 \u0924\u0947\u091C\u093C \u0939\u094B \u091C\u093E\u090F\u0917\u093E"]],["When data leaves people out, AI can be unfair to them. This is called bias.","\u091C\u092C \u0921\u0947\u091F\u093E \u092E\u0947\u0902 \u0915\u0941\u091B \u0932\u094B\u0917 \u091B\u0942\u091F \u091C\u093E\u0924\u0947 \u0939\u0948\u0902, \u0924\u094B AI \u0909\u0928\u0915\u0947 \u0938\u093E\u0925 \u0905\u0928\u0941\u091A\u093F\u0924 \u0939\u094B \u0938\u0915\u0924\u093E \u0939\u0948\u0964 \u0907\u0938\u0947 \u092A\u0915\u094D\u0937\u092A\u093E\u0924 (bias) \u0915\u0939\u0924\u0947 \u0939\u0948\u0902\u0964"]],["What is the best way to use AI for a school project?","\u0935\u093F\u0926\u094D\u092F\u093E\u0932\u092F \u0915\u0947 \u092A\u094D\u0930\u094B\u091C\u0947\u0915\u094D\u091F \u0915\u0947 \u0932\u093F\u090F AI \u0915\u093E \u0938\u092C\u0938\u0947 \u0905\u091A\u094D\u091B\u093E \u0909\u092A\u092F\u094B\u0917 \u0915\u094D\u092F\u093E \u0939\u0948?",["Ask it for ideas, then do the work and write it in your own words","\u0909\u0938\u0938\u0947 \u0935\u093F\u091A\u093E\u0930 \u0932\u0947\u0902, \u092B\u093F\u0930 \u0915\u093E\u092E \u0938\u094D\u0935\u092F\u0902 \u0915\u0930\u0947\u0902 \u0914\u0930 \u0905\u092A\u0928\u0947 \u0936\u092C\u094D\u0926\u094B\u0902 \u092E\u0947\u0902 \u0932\u093F\u0916\u0947\u0902"],[["Let it write everything and submit it as your own","\u0938\u092C \u0915\u0941\u091B \u0909\u0938\u0938\u0947 \u0932\u093F\u0916\u0935\u093E\u0915\u0930 \u0905\u092A\u0928\u0947 \u0928\u093E\u092E \u0938\u0947 \u091C\u092E\u093E \u0915\u0930\u0947\u0902"],["Never read what it says","\u0935\u0939 \u091C\u094B \u0915\u0939\u0947 \u0909\u0938\u0947 \u0915\u092D\u0940 \u0928 \u092A\u0922\u093C\u0947\u0902"],["Copy a friend's AI answer","\u0915\u093F\u0938\u0940 \u092E\u093F\u0924\u094D\u0930 \u0915\u093E AI \u0909\u0924\u094D\u0924\u0930 \u0928\u0915\u0932 \u0915\u0930\u0947\u0902"]],["Your learning grows only when you do the thinking yourself.","\u0906\u092A\u0915\u0940 \u092A\u0922\u093C\u093E\u0908 \u0924\u092D\u0940 \u092C\u0922\u093C\u0924\u0940 \u0939\u0948 \u091C\u092C \u0938\u094B\u091A\u0928\u0947 \u0915\u093E \u0915\u093E\u092E \u0906\u092A \u0938\u094D\u0935\u092F\u0902 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964"]],["A clear question to an AI gets a better answer. Which question is clearer?","AI \u0938\u0947 \u0938\u094D\u092A\u0937\u094D\u091F \u092A\u094D\u0930\u0936\u094D\u0928 \u092A\u0942\u091B\u0928\u0947 \u092A\u0930 \u092C\u0947\u0939\u0924\u0930 \u0909\u0924\u094D\u0924\u0930 \u092E\u093F\u0932\u0924\u093E \u0939\u0948\u0964 \u0915\u094C\u0928-\u0938\u093E \u092A\u094D\u0930\u0936\u094D\u0928 \u0905\u0927\u093F\u0915 \u0938\u094D\u092A\u0937\u094D\u091F \u0939\u0948?",["Explain photosynthesis for a class 6 student in 5 short points","\u0915\u0915\u094D\u0937\u093E 6 \u0915\u0947 \u0935\u093F\u0926\u094D\u092F\u093E\u0930\u094D\u0925\u0940 \u0915\u0947 \u0932\u093F\u090F \u092A\u094D\u0930\u0915\u093E\u0936 \u0938\u0902\u0936\u094D\u0932\u0947\u0937\u0923 \u0915\u094B 5 \u091B\u094B\u091F\u0947 \u092C\u093F\u0902\u0926\u0941\u0913\u0902 \u092E\u0947\u0902 \u0938\u092E\u091D\u093E\u0907\u090F"],[["Tell me stuff","\u092E\u0941\u091D\u0947 \u0915\u0941\u091B \u092C\u0924\u093E\u0913"],["Plants?","\u092A\u094C\u0927\u0947?"],["Science","\u0935\u093F\u091C\u094D\u091E\u093E\u0928"]],["Say who it is for, what you want and in what form. This skill is called prompting.","\u092C\u0924\u093E\u0907\u090F \u0915\u093F \u0909\ 0940 \u0938\u0940\u0916\u0924\u0947 \u0938\u092E\u092F \u0930\u093E\u091C\u094D\u092F \u0915\u094B \u0928\u0915\u094D\u0936\u0947 \u092A\u0930 \u0916\u094B\u091C\u093F\u090F\u0964"),[["What is the capital of Jharkhand?","\u091D\u093E\u0930\u0916\u0902\u0921 \u0915\u0940 \u0930\u093E\u091C\u0927\u093E\u0928\u0940 \u0915\u094D\u092F\u093E \u0939\u0948?",["Ranchi","\u0930\u093E\u0902\u091A\u0940"],[["Patna","\u092A\u091F\u0928\u093E"],["Dhanbad","\u0927\u0928\u092C\u093E\u0926"],["Jamshedpur","\u091C\u092E\u0936\u0947\u0926\u092A\u0941\u0930"]],["Jharkhand became a separate state in the year 2000, with Ranchi as its capital.","\u091D\u093E\u0930\u0916\u0902\u0921 \u0935\u0930\u094D\u0937 2000 \u092E\u0947\u0902 \u0905\u0932\u0917 \u0930\u093E\u091C\u094D\u092F \u092C\u0928\u093E \u0914\u0930 \u0930\u093E\u0902\u091A\u0940 \u0909\u0938\u0915\u0940 \u0930\u093E\u091C\u0927\u093E\u0928\u0940 \u0939\u0948\u0964"]],["What is the capital of Bihar?","\u092C\u093F\u0939\u093E\u0930 \u0915\u0940 \u0930\u093E\u091C\u0927\u093E\u0928\u0940 \u0915\u094D\u092F\u093E \u0939\u0948?",["Patna","\u092A\u091F\u0928\u093E"],[["Ranchi","\u0930\u093E\u0902\u091A\u0940"],["Gaya","\u0917\u092F\u093E"],["Lucknow","\u0932\u0916\u0928\u090A"]],["Patna lies on the Ganga.","\u092A\u091F\u0928\u093E \u0917\u0902\u0917\u093E \u0915\u0947 \u0915\u093F\u0928\u093E\u0930\u0947 \u0939\u0948\u0964"]],["What is the capital of West Bengal?","\u092A\u0936\u094D\u091A\u093F\u092E \u092C\u0902\u0917\u093E\u0932 \u0915\u0940 \u0930\u093E\u091C\u0927\u093E\u0928\u0940 \u0915\u094D\u092F\u093E \u0939\u0948?",["Kolkata","\u0915\u094B\u0932\u0915\u093E\u0924\u093E"],[["Howrah","\u0939\u093E\u0935\u0921\u093C\u093E"],["Darjeeling","\u0926\u093E\u0930\u094D\u091C\u093F\u0932\u093F\u0902\u0917"],["Siliguri","\u0938\u093F\u0932\u0940\u0917\u0941\u0921\u093C\u0940"]],["Kolkata was once the capital of British India.","\u0915\u094B\u0932\u0915\u093E\u0924\u093E \u0915\u092D\u0940 \u092C\u094D\u0930\u093F\u091F\u093F\u0936 \u092D\u093E\u0930\u0924 \u0915\u0940 \u0930\u093E\u091C\u0927\u093E\u0928\u0940 \u0925\u0940\u0964"]],["What is the capital of Rajasthan?","\u0930\u093E\u091C\u0938\u094D\u0925\u093E\u0928 \u0915\u0940 \u0930\u093E\u091C\u0927\u093E\u0928\u0940 \u0915\u094D\u092F\u093E \u0939\u0948?",["Jaipur","\u091C\u092F\u092A\u0941\u0930"],[["Jodhpur","\u091C\u094B\u0927\u092A\u0941\u0930"],["Udaipur","\u0909\u0926\u092F\u092A\u0941\u0930"],["Ajmer","\u0905\u091C\u092E\u0947\u0930"]],["Jaipur is called the Pink City.","\u091C\u092F\u092A\u0941\u0930 \u0915\u094B \u0917\u0941\u0932\u093E\u092C\u0940 \u0928\u0917\u0930 \u0915\u0939\u0924\u0947 \u0939\u0948\u0902\u0964"]],["What is the capital of Tamil Nadu?","\u0924\u092E\u093F\u0932\u0928\u093E\u0921\u0941 \u0915\u0940 \u0930\u093E\u091C\u0927\u093E\u0928\u0940 \u0915\u094D\u092F\u093E \u0939\u0948?",["Chennai","\u091A\u0947\u0928\u094D\u0928\u0908"],[["Madurai","\u092E\u0926\u0941\u0930\u0948"],["Coimbatore","\u0915\u094B\u092F\u0902\u092C\u091F\u0942\u0930"],["Bengaluru","\u092C\u0947\u0902\u0917\u0932\u0941\u0930\u0941"]],["Chennai is on the Bay of Bengal coast.","\u091A\u0947\u0928\u094D\u0928\u0908 \u092C\u0902\u0917\u093E\u0932 \u0915\u0940 \u0916\u093E\u0921\u093C\u0940 \u0915\u0947 \u0924\u091F \u092A\u0930 \u0939\u0948\u0964"]],["What is the capital of Maharashtra?","\u092E\u0939\u093E\u0930\u093E\u0937\u094D\u091F\u094D\u0930 \u0915\u0940 \u0930\u093E\u091C\u0927\u093E\u0928\u0940 \u0915\u094D\u092F\u093E \u0939\u0948?",["Mumbai","\u092E\u0941\u0902\u092C\u0908"],[["Pune","\u092A\u0941\u0923\u0947"],["Nagpur","\u0928\u093E\u0917\u092A\u0941\u0930"],["Nashik","\u0928\u093E\u0938\u093F\u0915"]],["Mumbai is the capital; Nagpur holds the winter session of the legislature.","\u092E\u0941\u0902\u092C\u0908 \u0930\u093E\u091C\u0927\u093E\u0928\u0940 \u0939\u0948; \u0928\u093E\u0917\u092A\u0941\u0930 \u092E\u0947\u0902 \u0935\u093F\u0927\u093E\u0928\u092E\u0902\u0921\u0932 \u0915\u093E \u0936\u0940\u0924\u0915\u093E\u0932\u0940\u0928 \u0938\u0924\u094D\u0930 \u0939\u094B\u0924\u093E \u0939\u0948\u0964"]],["What is the capital of Kerala?","\u0915\u0947\u0930\u0932 \u0915\u0940 \u0930\u093E\u091C\u0927\u093E\u0928\u0940 \u0915\u094D\u092F\u093E \u0939\u0948?",["Thiruvananthapuram","\u0924\u093F\u0930\u0941\u0935\u0928\u0902\u0924\u092A\u0941\u0930\u092E"],[["Kochi","\u0915\u094B\u091A\u094D\u091A\u093F"],["Kozhikode","\u0915\u094B\u091D\u093F\u0915\u094B\u0921"],["Thrissur","\u0924\u094D\u0930\u093F\u0936\u0942\u0930"]],["Kochi is the biggest city but Thiruvananthapuram is the capital.","\u0915\u094B\u091A\u094D\u091A\u093F \u0938\u092C\u0938\u0947 \u092C\u0921\u093C\u093E \u0936\u0939\u0930 \u0939\u0948, \u092A\u0930 \u0930\u093E\u091C\u0927\u093E\u0928\u0940 \u0924\u093F\u0930\u0941\u0935\u0928\u0902\u0924\u092A\u0941\u0930\u092E \u0939\u0948\u0964"]]]),L("g.civics",6,s("Our Constitution and democracy","\u0939\u092E\u093E\u0930\u093E \u0938\u0902\u0935\u093F\u0927\u093E\u0928 \u0914\u0930 \u0932\u094B\u0915\u0924\u0902\u0924\u094D\u0930"),["g.india"],s("In a democracy, people choose their government. The Constitution gives rights and duties.","\u0932\u094B\u0915\u0924\u0902\u0924\u094D\u0930 \u092E\u0947\u0902 \u0932\u094B\u0917 \u0905\u092A\u0928\u0940 \u0938\u0930\u0915\u093E\u0930 \u091A\u0941\u0928\u0924\u0947 \u0939\u0948\u0902\u0964 \u0938\u0902\u0935\u093F\u0927\u093E\u0928 \u0905\u0927\u093F\u0915\u093E\u0930 \u0914\u0930 \u0915\u0930\u094D\u0924\u0935\u094D\u092F \u0926\u0947\u0924\u093E \u0939\u0948\u0964"),[["Who is known as the Father of the Indian Constitution?","\u092D\u093E\u0930\u0924\u0940\u092F \u0938\u0902\u0935\u093F\u0927\u093E\u0928 \u0915\u093E \u091C\u0928\u0915 \u0915\u093F\u0938\u0947 \u0915\u0939\u093E \u091C\u093E\u0924\u093E \u0939\u0948?",["Dr B. R. Ambedkar","\u0921\u0949. \u092C\u0940. \u0906\u0930. \u0906\u0902\u092C\u0947\u0921\u0915\u0930"],[["Mahatma Gandhi","\u092E\u0939\u093E\u0924\u094D\u092E\u093E \u0917\u093E\u0902\u0927\u0940"],["Jawaharlal Nehru","\u091C\u0935\u093E\u0939\u0930\u0932\u093E\u0932 \u0928\u0947\u0939\u0930\u0942"],["Sardar Patel","\u0938\u0930\u0926\u093E\u0930 \u092A\u091F\u0947\u0932"]],["Dr Ambedkar chaired the Drafting Committee.","\u0921\u0949. \u0906\u0902\u092C\u0947\u0921\u0915\u0930 \u092A\u094D\u0930\u093E\u0930\u0942\u092A \u0938\u092E\u093F\u0924\u093F \u0915\u0947 \u0905\u0927\u094D\u092F\u0915\u094D\u0937 \u0925\u0947\u0964"]],["Who elects the Lok Sabha members?","\u0932\u094B\u0915\u0938\u092D\u093E \u0915\u0947 \u0938\u0926\u0938\u094D\u092F\u094B\u0902 \u0915\u094B \u0915\u094C\u0928 \u091A\u0941\u0928\u0924\u093E \u0939\u0948?",["The people, by voting","\u091C\u0928\u0924\u093E, \u092E\u0924\u0926\u093E\u0928 \u0926\u094D\u0935\u093E\u0930\u093E"],[["The President","\u0930\u093E\u0937\u094D\u091F\u094D\u0930\u092A\u0924\u093F"],["The Prime Minister","\u092A\u094D\u0930\u0927\u093E\u0928\u092E\u0902\u0924\u094D\u0930\u0940"],["The Army","\u0938\u0947\u0928\u093E"]],["Every citizen aged 18 or more can vote.","18 \u0935\u0930\u094D\u0937 \u092F\u093E \u0909\u0938\u0938\u0947 \u0905\u0927\u093F\u0915 \u0906\u092F\u0941 \u0915\u093E \u0939\u0930 \u0928\u093E\u0917\u0930\u093F\u0915 \u092E\u0924\u0926\u093E\u0928 \u0915\u0930 \u0938\u0915\u0924\u093E \u0939\u0948\u0964"]],["Who is the head of the government in India?","\u092D\u093E\u0930\u0924 \u092E\u0947\u0902 \u0938\u0930\u0915\u093E\u0930 \u0915\u093E \u092A\u094D\u0930\u0927\u093E\u0928 \u0915\u094C\u0928 \u0939\u094B\u0924\u093E \u0939\u0948?",["Prime Minister","\u092A\u094D\u0930\u0927\u093E\u0928\u092E\u0902\u0924\u094D\u0930\u0940"],[["President","\u0930\u093E\u0937\u094D\u091F\u094D\u0930\u092A\u0924\u093F"],["Chief Justice","\u092E\u0941\u0916\u094D\u092F \u0928\u094D\u092F\u093E\u092F\u093E\u0927\u0940\u0936"],["Speaker","\u0905\u0927\u094D\u092F\u0915\u094D\u0937"]],["The President is the head of the state; the Prime Minister heads the government.","\u0930\u093E\u0937\u094D\u091F\u094D\u0930\u092A\u0924\u093F \u0930\u093E\u0937\u094D\u091F\u094D\u0930 \u0915\u093E \u092A\u094D\u0930\u0927\u093E\u0928 \u0939\u0948; \u092A\u094D\u0930\u0927\u093E\u0928\u092E\u0902\u0924\u094D\u0930\u0940 \u0938\u0930\u0915\u093E\u0930 \u0915\u093E \u092A\u094D\u0930\u0927\u093E\u0928 \u0939\u0948\u0964"]],["Which one is a Fundamental Right?","\u0907\u0928\u092E\u0947\u0902 \u0938\u0947 \u092E\u094C\u0932\u093F\u0915 \u0905\u0927\u093F\u0915\u093E\u0930 \u0915\u094C\u0928-\u0938\u093E \u0939\u0948?",["Right to Education","\u0936\u093F\u0915\u094D\u0937\u093E \u0915\u093E \u0905\u0927\u093F\u0915\u093E\u0930"],[["Right to free sweets","\u092E\u0941\u092B\u093C\u094D\u0924 \u092E\u093F\u0920\u093E\u0908 \u0915\u093E \u0905\u0927\u093F\u0915\u093E\u0930"],["Right to skip school","\u0938\u094D\u0915\u0942\u0932 \u0928 \u091C\u093E\u0928\u0947 \u0915\u093E \u0905\u0927\u093F\u0915\u093E\u0930"],["Right to harm others","\u0926\u0942\u0938\u0930\u094B\u0902 \u0915\u094B \u0939\u093E\u0928\u093F \u092A\u0939\u0941\u0901\u091A\u093E\u0928\u0947 \u0915\u093E \u0905\u0927\u093F\u0915\u093E\u0930"]],["Education for children aged 6 to 14 is a fundamental right.","6 \u0938\u0947 14 \u0935\u0930\u094D\u0937 \u0915\u0947 \u092C\u091A\u094D\u091A\u094B\u0902 \u0915\u0940 \u0936\u093F\u0915\u094D\u0937\u093E \u092E\u094C\u0932\u093F\u0915 \u0905\u0927\u093F\u0915\u093E\u0930 \u0939\u0948\u0964"]],["Which one is a Fundamental Duty of a citizen?","\u0928\u093E\u0917\u0930\u093F\u0915 \u0915\u093E \u092E\u094C\u0932\u093F\u0915 \u0915\u0930\u094D\u0924\u0935\u094D\u092F \u0915\u094C\u0928-\u0938\u093E \u0939\u0948?",["Protecting public property","\u0938\u093E\u0930\u094D\u0935\u091C\u0928\u093F\u0915 \u0938\u0902\u092A\u0924\u094D\u0924\u093F \u0915\u0940 \u0930\u0915\u094D\u0937\u093E \u0915\u0930\u0928\u093E"],[["Ignoring the law","\u0915\u093E\u0928\u0942\u0928 \u0915\u0940 \u0905\u0928\u0926\u0947\u0916\u0940 \u0915\u0930\u0928\u093E"],["Wasting water","\u092A\u093E\u0928\u0940 \u092C\u0930\u094D\u092C\u093E\u0926 \u0915\u0930\u0928\u093E"],["Breaking traffic rules","\u092F\u093E\u0924\u093E\u092F\u093E\u0924 \u0928\u093F\u092F\u092E \u0924\u094B\u0921\u093C\u0928\u093E"]],["Rights come with duties: respect the flag, the law and the environment.","\u0905\u0927\u093F\u0915\u093E\u0930\u094B\u0902 \u0915\u0947 \u0938\u093E\u0925 \u0915\u0930\u094D\u0924\u0935\u094D\u092F \u0906\u0924\u0947 \u0939\u0948\u0902: \u0927\u094D\u0935\u091C, \u0915\u093E\u0928\u0942\u0928 \u0914\u0930 \u092A\u0930\u094D\u092F\u093E\u0935\u0930\u0923 \u0915\u093E \u0938\u092E\u094D\u092E\u093E\u0928\u0964"]]]),L("g.verify",5,s("Check before you believe","\u092E\u093E\u0928\u0928\u0947 \u0938\u0947 \u092A\u0939\u0932\u0947 \u091C\u093E\u0901\u091A\u093F\u090F"),[],s("Ask: who made this, what proof is there, and do other trusted sources agree?","\u092A\u0942\u091B\u093F\u090F: \u092F\u0939 \u0915\u093F\u0938\u0928\u0947 \u092C\u0928\u093E\u092F\u093E, \u092A\u094D\u0930\u092E\u093E\u0923 \u0915\u094D\u092F\u093E \u0939\u0948, \u0914\u0930 \u0915\u094D\u092F\u093E \u0926\u0942\u0938\u0930\u0947 \u092D\u0930\u094B\u0938\u0947\u092E\u0902\u0926 \u0938\u094D\u0930\u094B\u0924 \u092D\u0940 \u092F\u0939\u0940 \u0915\u0939\u0924\u0947 \u0939\u0948\u0902?"),[['A message says "Forward this to everyone or something bad will happen". What should you do?','\u090F\u0915 \u0938\u0902\u0926\u0947\u0936 \u0915\u0939\u0924\u093E \u0939\u0948 "\u0907\u0938\u0947 \u0938\u092C\u0915\u094B \u092D\u0947\u091C\u094B \u0935\u0930\u0928\u093E \u092C\u0941\u0930\u093E \u0939\u094B\u0917\u093E"\u0964 \u0906\u092A\u0915\u094B \u0915\u094D\u092F\u093E \u0915\u0930\u0928\u093E \u091A\u093E\u0939\u093F\u090F?',["Do not forward it; show it to an adult","\u0906\u0917\u0947 \u0928 \u092D\u0947\u091C\u0947\u0902; \u0915\u093F\u0938\u0940 \u092C\u0921\u093C\u0947 \u0915\u094B \u0926\u093F\u0916\u093E\u090F\u0901"],[["Forward it to everyone","\u0938\u092C\u0915\u094B \u092D\u0947\u091C \u0926\u0947\u0902"],["Believe it fully","\u092A\u0942\u0930\u0940 \u0924\u0930\u0939 \u092E\u093E\u0928 \u0932\u0947\u0902"],["Reply with your address","\u0905\u092A\u0928\u093E \u092A\u0924\u093E \u0932\u093F\u0916\u0915\u0930 \u091C\u0935\u093E\u092C \u0926\u0947\u0902"]],["Chain messages that use fear are usually false.","\u0921\u0930 \u0926\u093F\u0916\u093E\u0928\u0947 \u0935\u093E\u0932\u0947 \u091A\u0947\u0928 \u0938\u0902\u0926\u0947\u0936 \u0905\u0915\u094D\u0938\u0930 \u091D\u0942\u0920\u0947 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Which source is the most trustworthy for a science fact?","\u0935\u093F\u091C\u094D\u091E\u093E\u0928 \u0915\u0947 \u0924\u0925\u094D\u092F \u0915\u0947 \u0932\u093F\u090F \u0938\u092C\u0938\u0947 \u092D\u0930\u094B\u0938\u0947\u092E\u0902\u0926 \u0938\u094D\u0930\u094B\u0924 \u0915\u094C\u0928-\u0938\u093E \u0939\u0948?",["A school textbook","\u0938\u094D\u0915\u0942\u0932 \u0915\u0940 \u092A\u093E\u0920\u094D\u092F\u092A\u0941\u0938\u094D\u0924\u0915"],[["An unknown post with many likes","\u092C\u0939\u0941\u0924 \u0932\u093E\u0907\u0915 \u0935\u093E\u0932\u0940 \u0905\u0928\u091C\u093E\u0928 \u092A\u094B\u0938\u094D\u091F"],["A friend's guess","\u0915\u093F\u0938\u0940 \u0926\u094B\u0938\u094D\u0924 \u0915\u093E \u0905\u0928\u0941\u092E\u093E\u0928"],["An advert","\u0915\u094B\u0908 \u0935\u093F\u091C\u094D\u091E\u093E\u092A\u0928"]],["Likes show popularity, not truth.","\u0932\u093E\u0907\u0915 \u0932\u094B\u0915\u092A\u094D\u0930\u093F\u092F\u0924\u093E \u0926\u093F\u0916\u093E\u0924\u0947 \u0939\u0948\u0902, \u0938\u091A\u094D\u091A\u093E\u0908 \u0928\u0939\u0940\u0902\u0964"]],['A stranger online asks for your photo and says "keep it secret". What should you do?','\u0911\u0928\u0932\u093E\u0907\u0928 \u0915\u094B\u0908 \u0905\u091C\u0928\u092C\u0940 \u0906\u092A\u0915\u0940 \u092B\u093C\u094B\u091F\u094B \u092E\u093E\u0901\u0917\u0915\u0930 \u0915\u0939\u0924\u093E \u0939\u0948 "\u0930\u093E\u091C\u093C \u0930\u0916\u0928\u093E"\u0964 \u0906\u092A\u0915\u094B \u0915\u094D\u092F\u093E \u0915\u0930\u0928\u093E \u091A\u093E\u0939\u093F\u090F?',["Say no, stop talking and tell a trusted adult","\u092E\u0928\u093E \u0915\u0930\u0947\u0902, \u092C\u093E\u0924 \u092C\u0902\u0926 \u0915\u0930\u0947\u0902 \u0914\u0930 \u0915\u093F\u0938\u0940 \u092D\u0930\u094B\u0938\u0947\u092E\u0902\u0926 \u092C\u0921\u093C\u0947 \u0915\u094B \u092C\u0924\u093E\u090F\u0901"],[["Send it","\u092D\u0947\u091C \u0926\u0947\u0902"],["Send only one","\u092C\u0938 \u090F\u0915 \u092D\u0947\u091C \u0926\u0947\u0902"],["Tell nobody","\u0915\u093F\u0938\u0940 \u0915\u094B \u0928 \u092C\u0924\u093E\u090F\u0901"]],["Safe adults do not ask children for secrets. It is never your fault to tell.","\u0938\u0941\u0930\u0915\u094D\u0937\u093F\u0924 \u092C\u0921\u093C\u0947 \u092C\u091A\u094D\u091A\u094B\u0902 \u0938\u0947 \u0930\u093E\u091C\u093C \u0928\u0939\u0940\u0902 \u092E\u093E\u0901\u0917\u0924\u0947\u0964 \u092C\u0924\u093E\u0928\u093E \u0915\u092D\u0940 \u0906\u092A\u0915\u0940 \u0917\u0932\u0924\u0940 \u0928\u0939\u0940\u0902 \u0939\u0948\u0964"]],["A video online looks very unreal, as if made by a computer. First step?","\u0911\u0928\u0932\u093E\u0907\u0928 \u090F\u0915 \u0935\u0940\u0921\u093F\u092F\u094B \u092C\u0939\u0941\u0924 \u0905\u0935\u093E\u0938\u094D\u0924\u0935\u093F\u0915 \u0932\u0917\u0924\u093E \u0939\u0948, \u091C\u0948\u0938\u0947 \u0915\u0902\u092A\u094D\u092F\u0942\u091F\u0930 \u0938\u0947 \u092C\u0928\u093E \u0939\u094B\u0964 \u092A\u0939\u0932\u093E \u0915\u0926\u092E?",["Ask where it came from and look for other sources","\u092A\u0942\u091B\u093F\u090F \u092F\u0939 \u0915\u0939\u093E\u0901 \u0938\u0947 \u0906\u092F\u093E \u0914\u0930 \u0926\u0942\u0938\u0930\u0947 \u0938\u094D\u0930\u094B\u0924 \u0916\u094B\u091C\u093F\u090F"],[["Believe it because you can see it","\u092E\u093E\u0928 \u0932\u0947\u0902 \u0915\u094D\u092F\u094B\u0902\u0915\u093F \u0926\u093F\u0916 \u0930\u0939\u093E \u0939\u0948"],["Share it at once","\u0924\u0941\u0930\u0902\u0924 \u0938\u093E\u091D\u093E \u0915\u0930\u0947\u0902"],["Edit it and post again","\u092C\u0926\u0932\u0915\u0930 \u092B\u093F\u0930 \u092A\u094B\u0938\u094D\u091F \u0915\u0930\u0947\u0902"]],["AI can make realistic fake images and videos. Seeing is not always believing.","AI \u092F\u0925\u093E\u0930\u094D\u0925 \u091C\u0948\u0938\u0940 \u0928\u0915\u0932\u0940 \u0924\u0938\u094D\u0935\u0940\u0930\u0947\u0902 \u0914\u0930 \u0935\u0940\u0921\u093F\u092F\u094B \u092C\u0928\u093E \u0938\u0915\u0924\u093E \u0939\u0948\u0964 \u0926\u0947\u0916\u0928\u093E \u0939\u092E\u0947\u0936\u093E \u092E\u093E\u0928\u0928\u093E \u0928\u0939\u0940\u0902 \u0939\u0948\u0964"]],["A strong password should be:","\u092E\u091C\u093C\u092C\u0942\u0924 \u092A\u093E\u0938\u0935\u0930\u094D\u0921 \u0915\u0948\u0938\u093E \u0939\u094B\u0928\u093E \u091A\u093E\u0939\u093F\u090F?",["Long, mixed, and not shared except with a parent","\u0932\u0902\u092C\u093E, \u092E\u093F\u0932\u093E-\u091C\u0941\u0932\u093E, \u0914\u0930 \u092E\u093E\u0924\u093E-\u092A\u093F\u0924\u093E \u0915\u0947 \u0905\u0932\u093E\u0935\u093E \u0915\u093F\u0938\u0940 \u0938\u0947 \u0938\u093E\u091D\u093E \u0928\u0939\u0940\u0902"],[["Your name","\u0906\u092A\u0915\u093E \u0928\u093E\u092E"],["Easy to guess","\u0905\u0928\u0941\u092E\u093E\u0928 \u0932\u0917\u093E\u0928\u0947 \u092E\u0947\u0902 \u0906\u0938\u093E\u0928"],["Your birthday","\u0906\u092A\u0915\u093E \u091C\u0928\u094D\u092E\u0926\u093F\u0928"]],["Use a different password for each important account.","\u0939\u0930 \u091C\u093C\u0930\u0942\u0930\u0940 \u0916\u093E\u0924\u0947 \u0915\u0947 \u0932\u093F\u090F \u0905\u0932\u0917 \u092A\u093E\u0938\u0935\u0930\u094D\u0921 \u0930\u0916\u093F\u090F\u0964"]]])];var ye={face_value:s("Place value is the digit times the value of its place, not the digit alone.","\u0938\u094D\u0925\u093E\u0928\u0940\u092F \u092E\u093E\u0928 = \u0905\u0902\u0915 \xD7 \u0909\u0938\u0915\u0947 \u0938\u094D\u0925\u093E\u0928 \u0915\u093E \u092E\u093E\u0928; \u0915\u0947\u0935\u0932 \u0905\u0902\u0915 \u0928\u0939\u0940\u0902\u0964"),carry:s("When a column adds up to 10 or more, carry 1 to the next column.","\u091C\u092C \u0915\u093F\u0938\u0940 \u0938\u094D\u0924\u0902\u092D \u0915\u093E \u092F\u094B\u0917 10 \u092F\u093E \u0905\u0927\u093F\u0915 \u0939\u094B, \u0924\u094B 1 \u0939\u093E\u0938\u093F\u0932 \u0905\u0917\u0932\u0947 \u0938\u094D\u0924\u0902\u092D \u092E\u0947\u0902 \u0932\u0947 \u091C\u093E\u0907\u090F\u0964"),borrow:s("Always take the bottom digit from the top digit. If the top digit is smaller, borrow from the next column.","\u0939\u092E\u0947\u0936\u093E \u090A\u092A\u0930 \u0915\u0947 \u0905\u0902\u0915 \u092E\u0947\u0902 \u0938\u0947 \u0928\u0940\u091A\u0947 \u0915\u093E \u0905\u0902\u0915 \u0918\u091F\u093E\u0907\u090F\u0964 \u090A\u092A\u0930 \u0915\u093E \u0905\u0902\u0915 \u091B\u094B\u091F\u093E \u0939\u094B \u0924\u094B \u0905\u0917\u0932\u0947 \u0938\u094D\u0924\u0902\u092D \u0938\u0947 \u0909\u0927\u093E\u0930 \u0932\u0940\u091C\u093F\u090F\u0964"),mul_place:s("The tens digit stands for tens: multiply by it and write the result one place to the left.","\u0926\u0939\u093E\u0908 \u0915\u093E \u0905\u0902\u0915 \u0926\u0939\u093E\u0907\u092F\u093E\u0901 \u092C\u0924\u093E\u0924\u093E \u0939\u0948: \u0909\u0938\u0938\u0947 \u0917\u0941\u0923\u093E \u0915\u0930\u0915\u0947 \u092A\u0930\u093F\u0923\u093E\u092E \u090F\u0915 \u0938\u094D\u0925\u093E\u0928 \u092C\u093E\u0908\u0902 \u0913\u0930 \u0932\u093F\u0916\u093F\u090F\u0964"),round_half:s("Look at the digit to the right: 5 or more rounds up, less than 5 rounds down.","\u0926\u093E\u0908\u0902 \u0913\u0930 \u0915\u093E \u0905\u0902\u0915 \u0926\u0947\u0916\u093F\u090F: 5 \u092F\u093E \u0905\u0927\u093F\u0915 \u0939\u094B \u0924\u094B \u090A\u092A\u0930, 5 \u0938\u0947 \u0915\u092E \u0939\u094B \u0924\u094B \u0928\u0940\u091A\u0947 \u092A\u0942\u0930\u094D\u0923\u093E\u0902\u0915\u093F\u0924 \u0915\u0940\u091C\u093F\u090F\u0964"),factor_multiple:s("A factor divides the number exactly. A multiple is what you get by multiplying the number.","\u0917\u0941\u0923\u0928\u0916\u0902\u0921 \u0938\u0902\u0916\u094D\u092F\u093E \u0915\u094B \u092A\u0942\u0930\u093E-\u092A\u0942\u0930\u093E \u0935\u093F\u092D\u093E\u091C\u093F\u0924 \u0915\u0930\u0924\u093E \u0939\u0948\u0964 \u0917\u0941\u0923\u091C \u0938\u0902\u0916\u094D\u092F\u093E \u0915\u094B \u0917\u0941\u0923\u093E \u0915\u0930\u0928\u0947 \u0938\u0947 \u092E\u093F\u0932\u0924\u093E \u0939\u0948\u0964"),odd_prime:s("Not every odd number is prime. Check whether 3, 5 or 7 divides it.","\u0939\u0930 \u0935\u093F\u0937\u092E \u0938\u0902\u0916\u094D\u092F\u093E \u0905\u092D\u093E\u091C\u094D\u092F \u0928\u0939\u0940\u0902 \u0939\u094B\u0924\u0940\u0964 \u091C\u093E\u0901\u091A\u093F\u090F \u0915\u093F \u0935\u0939 3, 5 \u092F\u093E 7 \u0938\u0947 \u0935\u093F\u092D\u093E\u091C\u093F\u0924 \u0939\u094B\u0924\u0940 \u0939\u0948 \u092F\u093E \u0928\u0939\u0940\u0902\u0964"),hcf_lcm:s("HCF is the biggest number that divides both. LCM is the smallest number both divide into.","HCF \u0935\u0939 \u0938\u092C\u0938\u0947 \u092C\u0921\u093C\u0940 \u0938\u0902\u0916\u094D\u092F\u093E \u0939\u0948 \u091C\u094B \u0926\u094B\u0928\u094B\u0902 \u0915\u094B \u0935\u093F\u092D\u093E\u091C\u093F\u0924 \u0915\u0930\u0947\u0964 LCM \u0935\u0939 \u0938\u092C\u0938\u0947 \u091B\u094B\u091F\u0940 \u0938\u0902\u0916\u094D\u092F\u093E \u0939\u0948 \u091C\u094B \u0926\u094B\u0928\u094B\u0902 \u0938\u0947 \u0935\u093F\u092D\u093E\u091C\u093F\u0924 \u0939\u094B\u0964"),hcf_not_highest:s("That is a common factor, but not the highest one.","\u092F\u0939 \u090F\u0915 \u0909\u092D\u092F\u0928\u093F\u0937\u094D\u0920 \u0917\u0941\u0923\u0928\u0916\u0902\u0921 \u0939\u0948, \u092A\u0930 \u0938\u092C\u0938\u0947 \u092C\u0921\u093C\u093E \u0928\u0939\u0940\u0902\u0964"),lcm_product:s("The product is a common multiple, but not always the smallest one.","\u0917\u0941\u0923\u0928\u092B\u0932 \u090F\u0915 \u0909\u092D\u092F\u0928\u093F\u0937\u094D\u0920 \u0917\u0941\u0923\u091C \u0939\u0948, \u092A\u0930 \u0939\u092E\u0947\u0936\u093E \u0938\u092C\u0938\u0947 \u091B\u094B\u091F\u093E \u0928\u0939\u0940\u0902\u0964"),frac_eq_add:s("To make an equal fraction, multiply top and bottom by the same number. Do not add.","\u0938\u092E\u0924\u0941\u0932\u094D\u092F \u092D\u093F\u0928\u094D\u0928 \u092C\u0928\u093E\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0905\u0902\u0936 \u0914\u0930 \u0939\u0930 \u0915\u094B \u090F\u0915 \u0939\u0940 \u0938\u0902\u0916\u094D\u092F\u093E \u0938\u0947 \u0917\u0941\u0923\u093E \u0915\u0940\u091C\u093F\u090F\u0964 \u091C\u094B\u0921\u093C\u093F\u090F \u0928\u0939\u0940\u0902\u0964"),frac_cmp:s("A bigger denominator means smaller parts. Compare with a common denominator or by cross-multiplying.","\u092C\u0921\u093C\u093E \u0939\u0930 \u092F\u093E\u0928\u0940 \u091B\u094B\u091F\u0947 \u092D\u093E\u0917\u0964 \u0938\u092E\u093E\u0928 \u0939\u0930 \u092C\u0928\u093E\u0915\u0930 \u092F\u093E \u0924\u093F\u0930\u094D\u092F\u0915 \u0917\u0941\u0923\u093E \u0915\u0930\u0915\u0947 \u0924\u0941\u0932\u0928\u093E \u0915\u0940\u091C\u093F\u090F\u0964"),frac_add_den:s("Never add the denominators. Make the denominators the same, then add only the numerators.","\u0939\u0930\u094B\u0902 \u0915\u094B \u0915\u092D\u0940 \u092E\u0924 \u091C\u094B\u0921\u093C\u093F\u090F\u0964 \u0939\u0930 \u0938\u092E\u093E\u0928 \u0915\u0940\u091C\u093F\u090F, \u092B\u093F\u0930 \u0915\u0947\u0935\u0932 \u0905\u0902\u0936 \u091C\u094B\u0921\u093C\u093F\u090F\u0964"),dec_longer:s("More digits does not mean a bigger decimal. Compare tenths first, then hundredths.","\u0905\u0927\u093F\u0915 \u0905\u0902\u0915 \u0939\u094B\u0928\u0947 \u0938\u0947 \u0926\u0936\u092E\u0932\u0935 \u092C\u0921\u093C\u093E \u0928\u0939\u0940\u0902 \u0939\u094B\u0924\u093E\u0964 \u092A\u0939\u0932\u0947 \u0926\u0936\u093E\u0902\u0936, \u092B\u093F\u0930 \u0936\u0924\u093E\u0902\u0936 \u0915\u0940 \u0924\u0941\u0932\u0928\u093E \u0915\u0940\u091C\u093F\u090F\u0964"),dec_pv:s("After the decimal point the places are tenths, then hundredths.","\u0926\u0936\u092E\u0932\u0935 \u092C\u093F\u0902\u0926\u0941 \u0915\u0947 \u092C\u093E\u0926 \u092A\u0939\u0932\u093E \u0938\u094D\u0925\u093E\u0928 \u0926\u0936\u093E\u0902\u0936 \u0914\u0930 \u0926\u0942\u0938\u0930\u093E \u0936\u0924\u093E\u0902\u0936 \u0939\u094B\u0924\u093E \u0939\u0948\u0964"),dec_align:s("Line up the decimal points before adding or subtracting.","\u091C\u094B\u0921\u093C\u0928\u0947 \u092F\u093E \u0918\u091F\u093E\u0928\u0947 \u0938\u0947 \u092A\u0939\u0932\u0947 \u0926\u0936\u092E\u0932\u0935 \u092C\u093F\u0902\u0926\u0941\u0913\u0902 \u0915\u094B \u090F\u0915 \u0938\u0940\u0927 \u092E\u0947\u0902 \u0930\u0916\u093F\u090F\u0964"),dec_shift:s("Multiplying by 10 moves the digits one place left; dividing by 10 moves them one place right.","10 \u0938\u0947 \u0917\u0941\u0923\u093E \u0915\u0930\u0928\u0947 \u092A\u0930 \u0905\u0902\u0915 \u090F\u0915 \u0938\u094D\u0925\u093E\u0928 \u092C\u093E\u0908\u0902 \u0913\u0930, \u0914\u0930 \u092D\u093E\u0917 \u0926\u0947\u0928\u0947 \u092A\u0930 \u090F\u0915 \u0938\u094D\u0925\u093E\u0928 \u0926\u093E\u0908\u0902 \u0913\u0930 \u0916\u093F\u0938\u0915\u0924\u0947 \u0939\u0948\u0902\u0964"),pct_100:s("Percent means out of 100: divide by 100, not by 10.","\u092A\u094D\u0930\u0924\u093F\u0936\u0924 \u0915\u093E \u0905\u0930\u094D\u0925 \u0939\u0948 100 \u092E\u0947\u0902 \u0938\u0947: 100 \u0938\u0947 \u092D\u093E\u0917 \u0926\u0940\u091C\u093F\u090F, 10 \u0938\u0947 \u0928\u0939\u0940\u0902\u0964"),area_perim:s("Perimeter is the distance around (add the sides). Area is the space inside (length \xD7 breadth).","\u092A\u0930\u093F\u092E\u093E\u092A \u091A\u093E\u0930\u094B\u0902 \u0913\u0930 \u0915\u0940 \u0926\u0942\u0930\u0940 \u0939\u0948 (\u092D\u0941\u091C\u093E\u090F\u0901 \u091C\u094B\u0921\u093C\u093F\u090F)\u0964 \u0915\u094D\u0937\u0947\u0924\u094D\u0930\u092B\u0932 \u0905\u0902\u0926\u0930 \u0915\u0940 \u091C\u0917\u0939 \u0939\u0948 (\u0932\u0902\u092C\u093E\u0908 \xD7 \u091A\u094C\u0921\u093C\u093E\u0908)\u0964"),perim_half:s("A rectangle has two lengths and two breadths: add all four sides.","\u0906\u092F\u0924 \u092E\u0947\u0902 \u0926\u094B \u0932\u0902\u092C\u093E\u0907\u092F\u093E\u0901 \u0914\u0930 \u0926\u094B \u091A\u094C\u0921\u093C\u093E\u0907\u092F\u093E\u0901 \u0939\u094B\u0924\u0940 \u0939\u0948\u0902: \u091A\u093E\u0930\u094B\u0902 \u092D\u0941\u091C\u093E\u090F\u0901 \u091C\u094B\u0921\u093C\u093F\u090F\u0964"),tri_half:s("A triangle is half of a rectangle: area = \xBD \xD7 base \xD7 height.","\u0924\u094D\u0930\u093F\u092D\u0941\u091C \u0906\u092F\u0924 \u0915\u093E \u0906\u0927\u093E \u0939\u094B\u0924\u093E \u0939\u0948: \u0915\u094D\u0937\u0947\u0924\u094D\u0930\u092B\u0932 = \xBD \xD7 \u0906\u0927\u093E\u0930 \xD7 \u090A\u0901\u091A\u093E\u0908\u0964"),time_base60:s("An hour has 60 minutes, not 100. Count up to the next hour, then on.","\u090F\u0915 \u0918\u0902\u091F\u0947 \u092E\u0947\u0902 60 \u092E\u093F\u0928\u091F \u0939\u094B\u0924\u0947 \u0939\u0948\u0902, 100 \u0928\u0939\u0940\u0902\u0964 \u092A\u0939\u0932\u0947 \u0905\u0917\u0932\u0947 \u0918\u0902\u091F\u0947 \u0924\u0915 \u0917\u093F\u0928\u093F\u090F, \u092B\u093F\u0930 \u0906\u0917\u0947\u0964"),avg_sum:s("After adding, divide by how many numbers there are.","\u091C\u094B\u0921\u093C\u0928\u0947 \u0915\u0947 \u092C\u093E\u0926 \u0938\u0902\u0916\u094D\u092F\u093E\u0913\u0902 \u0915\u0940 \u0917\u093F\u0928\u0924\u0940 \u0938\u0947 \u092D\u093E\u0917 \u0926\u0940\u091C\u093F\u090F\u0964"),int_sign:s("Think of a number line: adding a negative moves left, adding a positive moves right.","\u0938\u0902\u0916\u094D\u092F\u093E \u0930\u0947\u0916\u093E \u0938\u094B\u091A\u093F\u090F: \u090B\u0923\u093E\u0924\u094D\u092E\u0915 \u091C\u094B\u0921\u093C\u0928\u0947 \u092A\u0930 \u092C\u093E\u0908\u0902 \u0913\u0930, \u0927\u0928\u093E\u0924\u094D\u092E\u0915 \u091C\u094B\u0921\u093C\u0928\u0947 \u092A\u0930 \u0926\u093E\u0908\u0902 \u0913\u0930 \u091A\u0932\u093F\u090F\u0964"),int_sub_neg:s("Subtracting a negative is the same as adding its positive.","\u090B\u0923\u093E\u0924\u094D\u092E\u0915 \u0938\u0902\u0916\u094D\u092F\u093E \u0918\u091F\u093E\u0928\u093E, \u0909\u0938\u0915\u0940 \u0927\u0928\u093E\u0924\u094D\u092E\u0915 \u0938\u0902\u0916\u094D\u092F\u093E \u091C\u094B\u0921\u093C\u0928\u0947 \u0915\u0947 \u092C\u0930\u093E\u092C\u0930 \u0939\u0948\u0964"),int_sign_mul:s("Different signs give a negative answer; same signs give a positive answer.","\u0905\u0932\u0917 \u091A\u093F\u0939\u094D\u0928 \u0939\u094B\u0902 \u0924\u094B \u0909\u0924\u094D\u0924\u0930 \u090B\u0923\u093E\u0924\u094D\u092E\u0915, \u0938\u092E\u093E\u0928 \u091A\u093F\u0939\u094D\u0928 \u0939\u094B\u0902 \u0924\u094B \u0927\u0928\u093E\u0924\u094D\u092E\u0915\u0964"),ratio_order:s("Order matters in a ratio: keep the terms in the order they were given.","\u0905\u0928\u0941\u092A\u093E\u0924 \u092E\u0947\u0902 \u0915\u094D\u0930\u092E \u092E\u0939\u0924\u094D\u0935\u092A\u0942\u0930\u094D\u0923 \u0939\u0948: \u092A\u0926\u094B\u0902 \u0915\u094B \u0926\u093F\u090F \u0917\u090F \u0915\u094D\u0930\u092E \u092E\u0947\u0902 \u0939\u0940 \u0930\u0916\u093F\u090F\u0964"),ratio_partial:s("Keep dividing both terms until no common factor is left.","\u0926\u094B\u0928\u094B\u0902 \u092A\u0926\u094B\u0902 \u0915\u094B \u0924\u092C \u0924\u0915 \u092D\u093E\u0917 \u0926\u0947\u0924\u0947 \u0930\u0939\u093F\u090F \u091C\u092C \u0924\u0915 \u0915\u094B\u0908 \u0909\u092D\u092F\u0928\u093F\u0937\u094D\u0920 \u0917\u0941\u0923\u0928\u0916\u0902\u0921 \u0928 \u092C\u091A\u0947\u0964"),ratio_parts:s("First add the parts of the ratio, then find the value of one part.","\u092A\u0939\u0932\u0947 \u0905\u0928\u0941\u092A\u093E\u0924 \u0915\u0947 \u092D\u093E\u0917\u094B\u0902 \u0915\u094B \u091C\u094B\u0921\u093C\u09
