3E\u091F \u092B\u0932\u0915 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902?"),options:[s("4","4"),s("6","6"),s("8","8")],answer:1,hint:s("Count the top, the bottom and the four sides.","\u090A\u092A\u0930, \u0928\u0940\u091A\u0947 \u0914\u0930 \u091A\u093E\u0930\u094B\u0902 \u0915\u093F\u0928\u093E\u0930\u094B\u0902 \u0915\u094B \u0917\u093F\u0928\u094B\u0964"),why:s("A cube has 6 square faces, 12 edges and 8 corners. A dice is a cube.","\u0918\u0928 \u0915\u0947 6 \u0935\u0930\u094D\u0917\u093E\u0915\u093E\u0930 \u092B\u0932\u0915, 12 \u0915\u093F\u0928\u093E\u0930\u0947 \u0914\u0930 8 \u0915\u094B\u0928\u0947 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902\u0964 \u0932\u0942\u0921\u094B \u0915\u093E \u092A\u093E\u0938\u093E \u0918\u0928 \u0939\u0948\u0964")},{q:s("Which shape has two flat circular faces and one curved surface?","\u0915\u093F\u0938 \u0906\u0915\u093E\u0930 \u0915\u0947 \u0926\u094B \u0938\u092A\u093E\u091F \u0935\u0943\u0924\u094D\u0924\u093E\u0915\u093E\u0930 \u092B\u0932\u0915 \u0914\u0930 \u090F\u0915 \u0918\u0941\u092E\u093E\u0935\u0926\u093E\u0930 \u0938\u0924\u0939 \u0939\u094B\u0924\u0940 \u0939\u0948?"),options:[s("Cone","\u0936\u0902\u0915\u0941"),s("Sphere","\u0917\u094B\u0932\u093E"),s("Cylinder","\u092C\u0947\u0932\u0928")],answer:2,hint:s("A tin of sweets and a water pipe have this shape.","\u092E\u093F\u0920\u093E\u0908 \u0915\u093E \u0921\u093F\u092C\u094D\u092C\u093E \u0914\u0930 \u092A\u093E\u0928\u0940 \u0915\u093E \u092A\u093E\u0907\u092A \u0907\u0938\u0940 \u0906\u0915\u093E\u0930 \u0915\u0947 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902\u0964"),why:s("A cylinder has a circle at each end and a curved surface between them \u2014 like a tin or a pipe.","\u092C\u0947\u0932\u0928 \u0915\u0947 \u0926\u094B\u0928\u094B\u0902 \u0938\u093F\u0930\u094B\u0902 \u092A\u0930 \u0935\u0943\u0924\u094D\u0924 \u0914\u0930 \u092C\u0940\u091A \u092E\u0947\u0902 \u0918\u0941\u092E\u093E\u0935\u0926\u093E\u0930 \u0938\u0924\u0939 \u0939\u094B\u0924\u0940 \u0939\u0948 \u2014 \u091C\u0948\u0938\u0947 \u0921\u093F\u092C\u094D\u092C\u093E \u092F\u093E \u092A\u093E\u0907\u092A\u0964")},{q:s("How many corners (vertices) does a cone have?","\u0936\u0902\u0915\u0941 \u0915\u0947 \u0915\u093F\u0924\u0928\u0947 \u0915\u094B\u0928\u0947 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902?"),options:[s("0","0"),s("1","1"),s("2","2")],answer:1,hint:s("See the pointed top, and the round base that has no corner.","\u0928\u0941\u0915\u0940\u0932\u093E \u090A\u092A\u0930 \u0926\u0947\u0916\u094B, \u0914\u0930 \u0917\u094B\u0932 \u0924\u0932 \u091C\u093F\u0938\u0915\u093E \u0915\u094B\u0908 \u0915\u094B\u0928\u093E \u0928\u0939\u0940\u0902\u0964"),why:s("A cone has one vertex at its tip. Its base is a circle, so it adds no corners.","\u0936\u0902\u0915\u0941 \u0915\u093E \u090F\u0915 \u0915\u094B\u0928\u093E \u0909\u0938\u0915\u0940 \u0928\u094B\u0915 \u092A\u0930 \u0939\u094B\u0924\u093E \u0939\u0948\u0964 \u0906\u0927\u093E\u0930 \u0935\u0943\u0924\u094D\u0924 \u0939\u0948, \u0907\u0938\u0932\u093F\u090F \u0935\u0939\u093E\u0901 \u0915\u094B\u0908 \u0915\u094B\u0928\u093E \u0928\u0939\u0940\u0902\u0964")}]},{id:"labs.water",strand:"s",grade:4,scene:"water",skill:"s.water_air",icon:"\u{1F4A7}",title:s("Water goes round","\u092A\u093E\u0928\u0940 \u0915\u093E \u091A\u0915\u094D\u0915\u0930"),blurb:s("Warm the pond, watch the water rise, gather as clouds and return as rain.","\u0924\u093E\u0932\u093E\u092C \u0915\u094B \u0917\u0930\u092E \u0915\u0930\u094B, \u092A\u093E\u0928\u0940 \u0915\u094B \u090A\u092A\u0930 \u0909\u0920\u0924\u0947, \u092C\u093E\u0926\u0932 \u092C\u0928\u0924\u0947 \u0914\u0930 \u092C\u093E\u0930\u093F\u0936 \u092C\u0928\u0915\u0930 \u0932\u094C\u091F\u0924\u0947 \u0926\u0947\u0916\u094B\u0964"),notice:s("Move the warmth slider slowly. Watch the pond, the sky and the rain together.","\u0917\u0930\u094D\u092E\u0940 \u0915\u093E \u0938\u094D\u0932\u093E\u0907\u0921\u0930 \u0927\u0940\u0930\u0947-\u0927\u0940\u0930\u0947 \u091A\u0932\u093E\u0913\u0964 \u0924\u093E\u0932\u093E\u092C, \u0906\u0938\u092E\u093E\u0928 \u0914\u0930 \u092C\u093E\u0930\u093F\u0936 \u0915\u094B \u0938\u093E\u0925-\u0938\u093E\u0925 \u0926\u0947\u0916\u094B\u0964"),alt:s("A small landscape with a pond, two hills, a bright Sun and clouds. Rain falls when the warmth is raised.","\u090F\u0915 \u091B\u094B\u091F\u093E \u0926\u0943\u0936\u094D\u092F: \u0924\u093E\u0932\u093E\u092C, \u0926\u094B \u092A\u0939\u093E\u0921\u093C\u093F\u092F\u093E\u0901, \u091A\u092E\u0915\u0924\u093E \u0938\u0942\u0930\u091C \u0914\u0930 \u092C\u093E\u0926\u0932\u0964 \u0917\u0930\u094D\u092E\u0940 \u092C\u0922\u093C\u093E\u0928\u0947 \u092A\u0930 \u092C\u093E\u0930\u093F\u0936 \u0939\u094B\u0924\u0940 \u0939\u0948\u0964"),control:s("Warmth from the Sun","\u0938\u0942\u0930\u091C \u0915\u0940 \u0917\u0930\u094D\u092E\u0940"),steps:[{q:s("What makes water rise from the pond into the air?","\u0924\u093E\u0932\u093E\u092C \u0938\u0947 \u092A\u093E\u0928\u0940 \u0939\u0935\u093E \u092E\u0947\u0902 \u090A\u092A\u0930 \u0915\u094D\u092F\u094B\u0902 \u0909\u0920\u0924\u093E \u0939\u0948?"),options:[s("The Sun's heat","\u0938\u0942\u0930\u091C \u0915\u0940 \u0917\u0930\u094D\u092E\u0940"),s("The Moon's light","\u091A\u093E\u0901\u0926 \u0915\u0940 \u0930\u094B\u0936\u0928\u0940"),s("The wind alone","\u0915\u0947\u0935\u0932 \u0939\u0935\u093E")],answer:0,hint:s("Raise the warmth slider and watch the pale droplets rise.","\u0917\u0930\u094D\u092E\u0940 \u092C\u0922\u093C\u093E\u0913 \u0914\u0930 \u0939\u0932\u094D\u0915\u0940 \u092C\u0942\u0901\u0926\u094B\u0902 \u0915\u094B \u090A\u092A\u0930 \u091C\u093E\u0924\u0947 \u0926\u0947\u0916\u094B\u0964"),why:s("Heat from the Sun turns water into vapour. This is evaporation, and the vapour is invisible.","\u0938\u0942\u0930\u091C \u0915\u0940 \u0917\u0930\u094D\u092E\u0940 \u092A\u093E\u0928\u0940 \u0915\u094B \u0935\u093E\u0937\u094D\u092A \u092E\u0947\u0902 \u092C\u0926\u0932\u0924\u0940 \u0939\u0948\u0964 \u0907\u0938\u0947 \u0935\u093E\u0937\u094D\u092A\u0940\u0915\u0930\u0923 \u0915\u0939\u0924\u0947 \u0939\u0948\u0902; \u0935\u093E\u0937\u094D\u092A \u0926\u093F\u0916\u0924\u0940 \u0928\u0939\u0940\u0902\u0964")},{q:s("What are clouds made of?","\u092C\u093E\u0926\u0932 \u0915\u093F\u0938\u0938\u0947 \u092C\u0928\u0947 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902?"),options:[s("Tiny water droplets and ice","\u091B\u094B\u091F\u0940-\u091B\u094B\u091F\u0940 \u092A\u093E\u0928\u0940 \u0915\u0940 \u092C\u0942\u0901\u0926\u0947\u0902 \u0914\u0930 \u092C\u0930\u094D\u092B"),s("Cotton","\u0930\u0941\u0908"),s("Smoke","\u0927\u0941\u0906\u0901")],answer:0,hint:s("When vapour cools high up, it turns back into tiny droplets.","\u090A\u092A\u0930 \u0920\u0902\u0921\u093E \u0939\u094B\u0915\u0930 \u0935\u093E\u0937\u094D\u092A \u092B\u093F\u0930 \u091B\u094B\u091F\u0940 \u092C\u0942\u0901\u0926\u094B\u0902 \u092E\u0947\u0902 \u092C\u0926\u0932 \u091C\u093E\u0924\u0940 \u0939\u0948\u0964"),why:s("Cooled vapour condenses into tiny droplets or ice crystals. Millions together look white \u2014 a cloud.","\u0920\u0902\u0921\u0940 \u0935\u093E\u0937\u094D\u092A \u091B\u094B\u091F\u0940 \u092C\u0942\u0901\u0926\u094B\u0902 \u092F\u093E \u092C\u0930\u094D\u092B \u0915\u0947 \u0915\u0923\u094B\u0902 \u092E\u0947\u0902 \u092C\u0926\u0932 \u091C\u093E\u0924\u0940 \u0939\u0948\u0964 \u0932\u093E\u0916\u094B\u0902 \u092E\u093F\u0932\u0915\u0930 \u0938\u092B\u093C\u0947\u0926 \u092C\u093E\u0926\u0932 \u092C\u0928\u093E\u0924\u0947 \u0939\u0948\u0902\u0964")},{q:s("Rain, river, sea, clouds, rain again. What is this going round called?","\u092C\u093E\u0930\u093F\u0936, \u0928\u0926\u0940, \u0938\u092E\u0941\u0926\u094D\u0930, \u092C\u093E\u0926\u0932, \u092B\u093F\u0930 \u092C\u093E\u0930\u093F\u0936\u0964 \u0907\u0938 \u091A\u0915\u094D\u0915\u0930 \u0915\u094B \u0915\u094D\u092F\u093E \u0915\u0939\u0924\u0947 \u0939\u0948\u0902?"),options:[s("The water cycle","\u091C\u0932 \u091A\u0915\u094D\u0930"),s("The food chain","\u0916\u093E\u0926\u094D\u092F \u0936\u0943\u0902\u0916\u0932\u093E"),s("Day and night","\u0926\u093F\u0928 \u0914\u0930 \u0930\u093E\u0924")],answer:0,hint:s("The same water keeps moving between land, air and sea.","\u0935\u0939\u0940 \u092A\u093E\u0928\u0940 \u091C\u093C\u092E\u0940\u0928, \u0939\u0935\u093E \u0914\u0930 \u0938\u092E\u0941\u0926\u094D\u0930 \u0915\u0947 \u092C\u0940\u091A \u0918\u0942\u092E\u0924\u093E \u0930\u0939\u0924\u093E \u0939\u0948\u0964"),why:s("This endless movement is the water cycle. The water on Earth today is the same water the rivers have always carried.","\u092F\u0939 \u0905\u0902\u0924\u0939\u0940\u0928 \u091A\u0915\u094D\u0915\u0930 \u091C\u0932 \u091A\u0915\u094D\u0930 \u0939\u0948\u0964 \u0906\u091C \u0915\u093E \u092A\u093E\u0928\u0940 \u0935\u0939\u0940 \u0939\u0948 \u091C\u094B \u0928\u0926\u093F\u092F\u093E\u0901 \u0938\u0926\u093E \u0938\u0947 \u092C\u0939\u093E\u0924\u0940 \u0906\u0908 \u0939\u0948\u0902\u0964")}]},{id:"labs.earth",strand:"s",grade:5,scene:"earth",skill:"s.space",icon:"\u{1F30D}",title:s("Day and night","\u0926\u093F\u0928 \u0914\u0930 \u0930\u093E\u0924"),blurb:s("Turn the Earth beside the Sun. See why one side is lit while the other is dark.","\u0938\u0942\u0930\u091C \u0915\u0947 \u092A\u093E\u0938 \u092A\u0943\u0925\u094D\u0935\u0940 \u0918\u0941\u092E\u093E\u0913\u0964 \u0926\u0947\u0916\u094B \u0915\u093F \u090F\u0915 \u0924\u0930\u092B\u093C \u0909\u091C\u093E\u0932\u093E \u0914\u0930 \u0926\u0942\u0938\u0930\u0940 \u0924\u0930\u092B\u093C \u0905\u0902\u0927\u0947\u0930\u093E \u0915\u094D\u092F\u094B\u0902 \u0939\u0948\u0964"),notice:s("Move the time slider through 24 hours. Find India, then find the dark side.","\u0938\u092E\u092F \u0938\u094D\u0932\u093E\u0907\u0921\u0930 \u0915\u094B 24 \u0918\u0902\u091F\u0947 \u0924\u0915 \u091A\u0932\u093E\u0913\u0964 \u092D\u093E\u0930\u0924 \u0915\u094B \u0922\u0942\u0901\u0922\u094B, \u092B\u093F\u0930 \u0905\u0902\u0927\u0947\u0930\u0940 \u0924\u0930\u092B\u093C \u0926\u0947\u0916\u094B\u0964"),alt:s("A blue Earth with green land turning beside a bright Sun. The side facing away from the Sun is dark.","\u091A\u092E\u0915\u0924\u0947 \u0938\u0942\u0930\u091C \u0915\u0947 \u092A\u093E\u0938 \u0918\u0942\u092E\u0924\u0940 \u0928\u0940\u0932\u0940 \u092A\u0943\u0925\u094D\u0935\u0940, \u091C\u093F\u0938 \u092A\u0930 \u0939\u0930\u0940 \u091C\u093C\u092E\u0940\u0928 \u0939\u0948\u0964 \u0938\u0942\u0930\u091C \u0938\u0947 \u0926\u0942\u0930 \u0935\u093E\u0932\u093E \u092D\u093E\u0917 \u0905\u0902\u0927\u0947\u0930\u093E \u0930\u0939\u0924\u093E \u0939\u0948\u0964"),control:s("Time of day","\u0926\u093F\u0928 \u0915\u093E \u0938\u092E\u092F"),steps:[{q:s("Why do we have day and night?","\u0926\u093F\u0928 \u0914\u0930 \u0930\u093E\u0924 \u0915\u094D\u092F\u094B\u0902 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902?"),options:[s("The Earth spins on its axis","\u092A\u0943\u0925\u094D\u0935\u0940 \u0905\u092A\u0928\u0940 \u0927\u0941\u0930\u0940 \u092A\u0930 \u0918\u0942\u092E\u0924\u0940 \u0939\u0948"),s("The Sun goes round the Earth","\u0938\u0942\u0930\u091C \u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u0947 \u091A\u093E\u0930\u094B\u0902 \u0913\u0930 \u0918\u0942\u092E\u0924\u093E \u0939\u0948"),s("Clouds cover the Sun","\u092C\u093E\u0926\u0932 \u0938\u0942\u0930\u091C \u0915\u094B \u0922\u0915 \u0932\u0947\u0924\u0947 \u0939\u0948\u0902")],answer:0,hint:s("Watch the Earth turn: the lit half changes, and so does the dark half.","\u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u094B \u0918\u0942\u092E\u0924\u0947 \u0926\u0947\u0916\u094B: \u0909\u091C\u0932\u0940 \u0906\u0927\u0940 \u0914\u0930 \u0905\u0902\u0927\u0947\u0930\u0940 \u0906\u0927\u0940 \u092C\u0926\u0932\u0924\u0940 \u0930\u0939\u0924\u0940 \u0939\u0948\u0964"),why:s("The Earth spins once about every 24 hours. The half facing the Sun has day; the other half has night.","\u092A\u0943\u0925\u094D\u0935\u0940 \u0932\u0917\u092D\u0917 \u0939\u0930 24 \u0918\u0902\u091F\u0947 \u092E\u0947\u0902 \u090F\u0915 \u092C\u093E\u0930 \u0918\u0942\u092E\u0924\u0940 \u0939\u0948\u0964 \u0938\u0942\u0930\u091C \u0915\u0940 \u0913\u0930 \u0935\u093E\u0932\u093E \u0906\u0927\u093E \u092D\u093E\u0917 \u0926\u093F\u0928, \u0926\u0942\u0938\u0930\u093E \u0906\u0927\u093E \u0930\u093E\u0924\u0964")},{q:s("About how long does one spin of the Earth take?","\u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u093E \u090F\u0915 \u091A\u0915\u094D\u0915\u0930 \u0932\u0917\u092D\u0917 \u0915\u093F\u0924\u0928\u0947 \u0938\u092E\u092F \u092E\u0947\u0902 \u092A\u0942\u0930\u093E \u0939\u094B\u0924\u093E \u0939\u0948?"),options:[s("12 hours","12 \u0918\u0902\u091F\u0947"),s("24 hours","24 \u0918\u0902\u091F\u0947"),s("One month","\u090F\u0915 \u092E\u0939\u0940\u0928\u093E")],answer:1,hint:s("From one sunrise to the next is one day.","\u090F\u0915 \u0938\u0942\u0930\u094D\u092F\u094B\u0926\u092F \u0938\u0947 \u0926\u0942\u0938\u0930\u0947 \u0938\u0942\u0930\u094D\u092F\u094B\u0926\u092F \u0924\u0915 \u090F\u0915 \u0926\u093F\u0928 \u0939\u094B\u0924\u093E \u0939\u0948\u0964"),why:s("One spin takes about 24 hours \u2014 one day. The Earth also goes round the Sun, but that takes a year.","\u090F\u0915 \u091A\u0915\u094D\u0915\u0930 \u092E\u0947\u0902 \u0932\u0917\u092D\u0917 24 \u0918\u0902\u091F\u0947 \u2014 \u090F\u0915 \u0926\u093F\u0928 \u0932\u0917\u0924\u093E \u0939\u0948\u0964 \u092A\u0943\u0925\u094D\u0935\u0940 \u0938\u0942\u0930\u091C \u0915\u093E \u091A\u0915\u094D\u0915\u0930 \u092D\u0940 \u0932\u0917\u093E\u0924\u0940 \u0939\u0948, \u092A\u0930 \u0909\u0938\u092E\u0947\u0902 \u090F\u0915 \u0935\u0930\u094D\u0937 \u0932\u0917\u0924\u093E \u0939\u0948\u0964")},{q:s("When it is noon in India, what is the side of the Earth facing away from the Sun doing?","\u091C\u092C \u092D\u093E\u0930\u0924 \u092E\u0947\u0902 \u0926\u094B\u092A\u0939\u0930 \u0939\u0948, \u0924\u092C \u0938\u0942\u0930\u091C \u0938\u0947 \u0926\u0942\u0930 \u0935\u093E\u0932\u093E \u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u093E \u092D\u093E\u0917 \u0915\u094D\u092F\u093E \u0915\u0930 \u0930\u0939\u093E \u0939\u094B\u0924\u093E \u0939\u0948?"),options:[s("Having night","\u0930\u093E\u0924 \u0915\u093E \u0938\u092E\u092F"),s("Having noon too","\u0935\u0939\u093E\u0901 \u092D\u0940 \u0926\u094B\u092A\u0939\u0930"),s("Standing still","\u0938\u094D\u0925\u093F\u0930 \u0916\u0921\u093C\u093E")],answer:0,hint:s("Only one half can face the Sun at a time.","\u090F\u0915 \u0938\u092E\u092F \u092E\u0947\u0902 \u0915\u0947\u0935\u0932 \u090F\u0915 \u0906\u0927\u093E \u092D\u093E\u0917 \u0938\u0942\u0930\u091C \u0915\u0940 \u0913\u0930 \u0939\u094B \u0938\u0915\u0924\u093E \u0939\u0948\u0964"),why:s("At any moment half the Earth is lit and half is dark. India's noon is midnight on the opposite side.","\u0915\u093F\u0938\u0940 \u092D\u0940 \u0938\u092E\u092F \u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u093E \u0906\u0927\u093E \u092D\u093E\u0917 \u0909\u091C\u0932\u093E \u0914\u0930 \u0906\u0927\u093E \u0905\u0902\u0927\u0947\u0930\u093E \u0930\u0939\u0924\u093E \u0939\u0948\u0964 \u092D\u093E\u0930\u0924 \u092E\u0947\u0902 \u0926\u094B\u092A\u0939\u0930 \u0924\u094B \u0935\u093F\u092A\u0930\u0940\u0924 \u0926\u093F\u0936\u093E \u092E\u0947\u0902 \u0906\u0927\u0940 \u0930\u093E\u0924 \u0939\u0948\u0964")}]},{id:"labs.plant",strand:"s",grade:4,scene:"plant",skill:"s.plants",icon:"\u{1F331}",title:s("Inside a plant","\u092A\u094C\u0927\u0947 \u0915\u0947 \u092D\u0940\u0924\u0930"),blurb:s("Turn a potted plant and find the parts that make food, carry water and hold it up.","\u0917\u092E\u0932\u0947 \u0915\u093E \u092A\u094C\u0927\u093E \u0918\u0941\u092E\u093E\u0913 \u0914\u0930 \u0935\u0947 \u092D\u093E\u0917 \u0922\u0942\u0901\u0922\u094B \u091C\u094B \u092D\u094B\u091C\u0928 \u092C\u0928\u093E\u0924\u0947 \u0939\u0948\u0902, \u092A\u093E\u0928\u0940 \u092A\u0939\u0941\u0901\u091A\u093E\u0924\u0947 \u0939\u0948\u0902 \u0914\u0930 \u092A\u094C\u0927\u0947 \u0915\u094B \u0938\u0901\u092D\u093E\u0932\u0924\u0947 \u0939\u0948\u0902\u0964"),notice:s("Use the part buttons to light up a leaf, the stem, the flower or the roots.","\u092D\u093E\u0917 \u0915\u0947 \u092C\u091F\u0928 \u0938\u0947 \u092A\u0924\u094D\u0924\u0940, \u0924\u0928\u093E, \u092B\u0942\u0932 \u092F\u093E \u091C\u0921\u093C \u0915\u094B \u091A\u092E\u0915\u093E\u0913\u0964"),alt:s("A potted plant with a green stem, three leaves, a pink flower and brown roots inside the pot.","\u0917\u092E\u0932\u0947 \u092E\u0947\u0902 \u0932\u0917\u093E \u092A\u094C\u0927\u093E: \u0939\u0930\u093E \u0924\u0928\u093E, \u0924\u0940\u0928 \u092A\u0924\u094D\u0924\u093F\u092F\u093E\u0901, \u0917\u0941\u0932\u093E\u092C\u0940 \u092B\u0942\u0932 \u0914\u0930 \u0917\u092E\u0932\u0947 \u0915\u0947 \u092D\u0940\u0924\u0930 \u092D\u0942\u0930\u0940 \u091C\u0921\u093C\u0947\u0902\u0964"),control:s("Light up a part","\u0915\u093F\u0938\u0940 \u092D\u093E\u0917 \u0915\u094B \u091A\u092E\u0915\u093E\u0913"),steps:[{q:s("Which part makes food using sunlight?","\u0915\u094C\u0928-\u0938\u093E \u092D\u093E\u0917 \u0927\u0942\u092A \u0938\u0947 \u092D\u094B\u091C\u0928 \u092C\u0928\u093E\u0924\u093E \u0939\u0948?"),options:[s("Root","\u091C\u0921\u093C"),s("Leaf","\u092A\u0924\u094D\u0924\u0940"),s("Flower","\u092B\u0942\u0932")],answer:1,hint:s("It is flat and green, and it faces the Sun.","\u092F\u0939 \u091A\u092A\u091F\u093E \u0914\u0930 \u0939\u0930\u093E \u0939\u094B\u0924\u093E \u0939\u0948, \u0914\u0930 \u0938\u0942\u0930\u091C \u0915\u0940 \u0913\u0930 \u0930\u0939\u0924\u093E \u0939\u0948\u0964"),why:s("Leaves make food from sunlight, water and air. This is photosynthesis, and it needs the green pigment chlorophyll.","\u092A\u0924\u094D\u0924\u093F\u092F\u093E\u0901 \u0927\u0942\u092A, \u092A\u093E\u0928\u0940 \u0914\u0930 \u0939\u0935\u093E \u0938\u0947 \u092D\u094B\u091C\u0928 \u092C\u0928\u093E\u0924\u0940 \u0939\u0948\u0902\u0964 \u0907\u0938\
