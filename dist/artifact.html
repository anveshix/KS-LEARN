93E \u0918\u0928 \u0939\u0948\u0964")},{q:a("Which shape has two flat circular faces and one curved surface?","\u0915\u093F\u0938 \u0906\u0915\u093E\u0930 \u0915\u0947 \u0926\u094B \u0938\u092A\u093E\u091F \u0935\u0943\u0924\u094D\u0924\u093E\u0915\u093E\u0930 \u092B\u0932\u0915 \u0914\u0930 \u090F\u0915 \u0918\u0941\u092E\u093E\u0935\u0926\u093E\u0930 \u0938\u0924\u0939 \u0939\u094B\u0924\u0940 \u0939\u0948?"),options:[a("Cone","\u0936\u0902\u0915\u0941"),a("Sphere","\u0917\u094B\u0932\u093E"),a("Cylinder","\u092C\u0947\u0932\u0928")],answer:2,hint:a("A tin of sweets and a water pipe have this shape.","\u092E\u093F\u0920\u093E\u0908 \u0915\u093E \u0921\u093F\u092C\u094D\u092C\u093E \u0914\u0930 \u092A\u093E\u0928\u0940 \u0915\u093E \u092A\u093E\u0907\u092A \u0907\u0938\u0940 \u0906\u0915\u093E\u0930 \u0915\u0947 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902\u0964"),why:a("A cylinder has a circle at each end and a curved surface between them \u2014 like a tin or a pipe.","\u092C\u0947\u0932\u0928 \u0915\u0947 \u0926\u094B\u0928\u094B\u0902 \u0938\u093F\u0930\u094B\u0902 \u092A\u0930 \u0935\u0943\u0924\u094D\u0924 \u0914\u0930 \u092C\u0940\u091A \u092E\u0947\u0902 \u0918\u0941\u092E\u093E\u0935\u0926\u093E\u0930 \u0938\u0924\u0939 \u0939\u094B\u0924\u0940 \u0939\u0948 \u2014 \u091C\u0948\u0938\u0947 \u0921\u093F\u092C\u094D\u092C\u093E \u092F\u093E \u092A\u093E\u0907\u092A\u0964")},{q:a("How many corners (vertices) does a cone have?","\u0936\u0902\u0915\u0941 \u0915\u0947 \u0915\u093F\u0924\u0928\u0947 \u0915\u094B\u0928\u0947 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902?"),options:[a("0","0"),a("1","1"),a("2","2")],answer:1,hint:a("See the pointed top, and the round base that has no corner.","\u0928\u0941\u0915\u0940\u0932\u093E \u090A\u092A\u0930 \u0926\u0947\u0916\u094B, \u0914\u0930 \u0917\u094B\u0932 \u0924\u0932 \u091C\u093F\u0938\u0915\u093E \u0915\u094B\u0908 \u0915\u094B\u0928\u093E \u0928\u0939\u0940\u0902\u0964"),why:a("A cone has one vertex at its tip. Its base is a circle, so it adds no corners.","\u0936\u0902\u0915\u0941 \u0915\u093E \u090F\u0915 \u0915\u094B\u0928\u093E \u0909\u0938\u0915\u0940 \u0928\u094B\u0915 \u092A\u0930 \u0939\u094B\u0924\u093E \u0939\u0948\u0964 \u0906\u0927\u093E\u0930 \u0935\u0943\u0924\u094D\u0924 \u0939\u0948, \u0907\u0938\u0932\u093F\u090F \u0935\u0939\u093E\u0901 \u0915\u094B\u0908 \u0915\u094B\u0928\u093E \u0928\u0939\u0940\u0902\u0964")}]},{id:"labs.water",strand:"s",grade:4,scene:"water",skill:"s.water_air",icon:"\u{1F4A7}",title:a("Water goes round","\u092A\u093E\u0928\u0940 \u0915\u093E \u091A\u0915\u094D\u0915\u0930"),blurb:a("Warm the pond, watch the water rise, gather as clouds and return as rain.","\u0924\u093E\u0932\u093E\u092C \u0915\u094B \u0917\u0930\u092E \u0915\u0930\u094B, \u092A\u093E\u0928\u0940 \u0915\u094B \u090A\u092A\u0930 \u0909\u0920\u0924\u0947, \u092C\u093E\u0926\u0932 \u092C\u0928\u0924\u0947 \u0914\u0930 \u092C\u093E\u0930\u093F\u0936 \u092C\u0928\u0915\u0930 \u0932\u094C\u091F\u0924\u0947 \u0926\u0947\u0916\u094B\u0964"),notice:a("Move the warmth slider slowly. Watch the pond, the sky and the rain together.","\u0917\u0930\u094D\u092E\u0940 \u0915\u093E \u0938\u094D\u0932\u093E\u0907\u0921\u0930 \u0927\u0940\u0930\u0947-\u0927\u0940\u0930\u0947 \u091A\u0932\u093E\u0913\u0964 \u0924\u093E\u0932\u093E\u092C, \u0906\u0938\u092E\u093E\u0928 \u0914\u0930 \u092C\u093E\u0930\u093F\u0936 \u0915\u094B \u0938\u093E\u0925-\u0938\u093E\u0925 \u0926\u0947\u0916\u094B\u0964"),alt:a("A small landscape with a pond, two hills, a bright Sun and clouds. Rain falls when the warmth is raised.","\u090F\u0915 \u091B\u094B\u091F\u093E \u0926\u0943\u0936\u094D\u092F: \u0924\u093E\u0932\u093E\u092C, \u0926\u094B \u092A\u0939\u093E\u0921\u093C\u093F\u092F\u093E\u0901, \u091A\u092E\u0915\u0924\u093E \u0938\u0942\u0930\u091C \u0914\u0930 \u092C\u093E\u0926\u0932\u0964 \u0917\u0930\u094D\u092E\u0940 \u092C\u0922\u093C\u093E\u0928\u0947 \u092A\u0930 \u092C\u093E\u0930\u093F\u0936 \u0939\u094B\u0924\u0940 \u0939\u0948\u0964"),control:a("Warmth from the Sun","\u0938\u0942\u0930\u091C \u0915\u0940 \u0917\u0930\u094D\u092E\u0940"),steps:[{q:a("What makes water rise from the pond into the air?","\u0924\u093E\u0932\u093E\u092C \u0938\u0947 \u092A\u093E\u0928\u0940 \u0939\u0935\u093E \u092E\u0947\u0902 \u090A\u092A\u0930 \u0915\u094D\u092F\u094B\u0902 \u0909\u0920\u0924\u093E \u0939\u0948?"),options:[a("The Sun's heat","\u0938\u0942\u0930\u091C \u0915\u0940 \u0917\u0930\u094D\u092E\u0940"),a("The Moon's light","\u091A\u093E\u0901\u0926 \u0915\u0940 \u0930\u094B\u0936\u0928\u0940"),a("The wind alone","\u0915\u0947\u0935\u0932 \u0939\u0935\u093E")],answer:0,hint:a("Raise the warmth slider and watch the pale droplets rise.","\u0917\u0930\u094D\u092E\u0940 \u092C\u0922\u093C\u093E\u0913 \u0914\u0930 \u0939\u0932\u094D\u0915\u0940 \u092C\u0942\u0901\u0926\u094B\u0902 \u0915\u094B \u090A\u092A\u0930 \u091C\u093E\u0924\u0947 \u0926\u0947\u0916\u094B\u0964"),why:a("Heat from the Sun turns water into vapour. This is evaporation, and the vapour is invisible.","\u0938\u0942\u0930\u091C \u0915\u0940 \u0917\u0930\u094D\u092E\u0940 \u092A\u093E\u0928\u0940 \u0915\u094B \u0935\u093E\u0937\u094D\u092A \u092E\u0947\u0902 \u092C\u0926\u0932\u0924\u0940 \u0939\u0948\u0964 \u0907\u0938\u0947 \u0935\u093E\u0937\u094D\u092A\u0940\u0915\u0930\u0923 \u0915\u0939\u0924\u0947 \u0939\u0948\u0902; \u0935\u093E\u0937\u094D\u092A \u0926\u093F\u0916\u0924\u0940 \u0928\u0939\u0940\u0902\u0964")},{q:a("What are clouds made of?","\u092C\u093E\u0926\u0932 \u0915\u093F\u0938\u0938\u0947 \u092C\u0928\u0947 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902?"),options:[a("Tiny water droplets and ice","\u091B\u094B\u091F\u0940-\u091B\u094B\u091F\u0940 \u092A\u093E\u0928\u0940 \u0915\u0940 \u092C\u0942\u0901\u0926\u0947\u0902 \u0914\u0930 \u092C\u0930\u094D\u092B"),a("Cotton","\u0930\u0941\u0908"),a("Smoke","\u0927\u0941\u0906\u0901")],answer:0,hint:a("When vapour cools high up, it turns back into tiny droplets.","\u090A\u092A\u0930 \u0920\u0902\u0921\u093E \u0939\u094B\u0915\u0930 \u0935\u093E\u0937\u094D\u092A \u092B\u093F\u0930 \u091B\u094B\u091F\u0940 \u092C\u0942\u0901\u0926\u094B\u0902 \u092E\u0947\u0902 \u092C\u0926\u0932 \u091C\u093E\u0924\u0940 \u0939\u0948\u0964"),why:a("Cooled vapour condenses into tiny droplets or ice crystals. Millions together look white \u2014 a cloud.","\u0920\u0902\u0921\u0940 \u0935\u093E\u0937\u094D\u092A \u091B\u094B\u091F\u0940 \u092C\u0942\u0901\u0926\u094B\u0902 \u092F\u093E \u092C\u0930\u094D\u092B \u0915\u0947 \u0915\u0923\u094B\u0902 \u092E\u0947\u0902 \u092C\u0926\u0932 \u091C\u093E\u0924\u0940 \u0939\u0948\u0964 \u0932\u093E\u0916\u094B\u0902 \u092E\u093F\u0932\u0915\u0930 \u0938\u092B\u093C\u0947\u0926 \u092C\u093E\u0926\u0932 \u092C\u0928\u093E\u0924\u0947 \u0939\u0948\u0902\u0964")},{q:a("Rain, river, sea, clouds, rain again. What is this going round called?","\u092C\u093E\u0930\u093F\u0936, \u0928\u0926\u0940, \u0938\u092E\u0941\u0926\u094D\u0930, \u092C\u093E\u0926\u0932, \u092B\u093F\u0930 \u092C\u093E\u0930\u093F\u0936\u0964 \u0907\u0938 \u091A\u0915\u094D\u0915\u0930 \u0915\u094B \u0915\u094D\u092F\u093E \u0915\u0939\u0924\u0947 \u0939\u0948\u0902?"),options:[a("The water cycle","\u091C\u0932 \u091A\u0915\u094D\u0930"),a("The food chain","\u0916\u093E\u0926\u094D\u092F \u0936\u0943\u0902\u0916\u0932\u093E"),a("Day and night","\u0926\u093F\u0928 \u0914\u0930 \u0930\u093E\u0924")],answer:0,hint:a("The same water keeps moving between land, air and sea.","\u0935\u0939\u0940 \u092A\u093E\u0928\u0940 \u091C\u093C\u092E\u0940\u0928, \u0939\u0935\u093E \u0914\u0930 \u0938\u092E\u0941\u0926\u094D\u0930 \u0915\u0947 \u092C\u0940\u091A \u0918\u0942\u092E\u0924\u093E \u0930\u0939\u0924\u093E \u0939\u0948\u0964"),why:a("This endless movement is the water cycle. The water on Earth today is the same water the rivers have always carried.","\u092F\u0939 \u0905\u0902\u0924\u0939\u0940\u0928 \u091A\u0915\u094D\u0915\u0930 \u091C\u0932 \u091A\u0915\u094D\u0930 \u0939\u0948\u0964 \u0906\u091C \u0915\u093E \u092A\u093E\u0928\u0940 \u0935\u0939\u0940 \u0939\u0948 \u091C\u094B \u0928\u0926\u093F\u092F\u093E\u0901 \u0938\u0926\u093E \u0938\u0947 \u092C\u0939\u093E\u0924\u0940 \u0906\u0908 \u0939\u0948\u0902\u0964")}]},{id:"labs.earth",strand:"s",grade:5,scene:"earth",skill:"s.space",icon:"\u{1F30D}",title:a("Day and night","\u0926\u093F\u0928 \u0914\u0930 \u0930\u093E\u0924"),blurb:a("Turn the Earth beside the Sun. See why one side is lit while the other is dark.","\u0938\u0942\u0930\u091C \u0915\u0947 \u092A\u093E\u0938 \u092A\u0943\u0925\u094D\u0935\u0940 \u0918\u0941\u092E\u093E\u0913\u0964 \u0926\u0947\u0916\u094B \u0915\u093F \u090F\u0915 \u0924\u0930\u092B\u093C \u0909\u091C\u093E\u0932\u093E \u0914\u0930 \u0926\u0942\u0938\u0930\u0940 \u0924\u0930\u092B\u093C \u0905\u0902\u0927\u0947\u0930\u093E \u0915\u094D\u092F\u094B\u0902 \u0939\u0948\u0964"),notice:a("Move the time slider through 24 hours. Find India, then find the dark side.","\u0938\u092E\u092F \u0938\u094D\u0932\u093E\u0907\u0921\u0930 \u0915\u094B 24 \u0918\u0902\u091F\u0947 \u0924\u0915 \u091A\u0932\u093E\u0913\u0964 \u092D\u093E\u0930\u0924 \u0915\u094B \u0922\u0942\u0901\u0922\u094B, \u092B\u093F\u0930 \u0905\u0902\u0927\u0947\u0930\u0940 \u0924\u0930\u092B\u093C \u0926\u0947\u0916\u094B\u0964"),alt:a("A blue Earth with green land turning beside a bright Sun. The side facing away from the Sun is dark.","\u091A\u092E\u0915\u0924\u0947 \u0938\u0942\u0930\u091C \u0915\u0947 \u092A\u093E\u0938 \u0918\u0942\u092E\u0924\u0940 \u0928\u0940\u0932\u0940 \u092A\u0943\u0925\u094D\u0935\u0940, \u091C\u093F\u0938 \u092A\u0930 \u0939\u0930\u0940 \u091C\u093C\u092E\u0940\u0928 \u0939\u0948\u0964 \u0938\u0942\u0930\u091C \u0938\u0947 \u0926\u0942\u0930 \u0935\u093E\u0932\u093E \u092D\u093E\u0917 \u0905\u0902\u0927\u0947\u0930\u093E \u0930\u0939\u0924\u093E \u0939\u0948\u0964"),control:a("Time of day","\u0926\u093F\u0928 \u0915\u093E \u0938\u092E\u092F"),steps:[{q:a("Why do we have day and night?","\u0926\u093F\u0928 \u0914\u0930 \u0930\u093E\u0924 \u0915\u094D\u092F\u094B\u0902 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902?"),options:[a("The Earth spins on its axis","\u092A\u0943\u0925\u094D\u0935\u0940 \u0905\u092A\u0928\u0940 \u0927\u0941\u0930\u0940 \u092A\u0930 \u0918\u0942\u092E\u0924\u0940 \u0939\u0948"),a("The Sun goes round the Earth","\u0938\u0942\u0930\u091C \u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u0947 \u091A\u093E\u0930\u094B\u0902 \u0913\u0930 \u0918\u0942\u092E\u0924\u093E \u0939\u0948"),a("Clouds cover the Sun","\u092C\u093E\u0926\u0932 \u0938\u0942\u0930\u091C \u0915\u094B \u0922\u0915 \u0932\u0947\u0924\u0947 \u0939\u0948\u0902")],answer:0,hint:a("Watch the Earth turn: the lit half changes, and so does the dark half.","\u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u094B \u0918\u0942\u092E\u0924\u0947 \u0926\u0947\u0916\u094B: \u0909\u091C\u0932\u0940 \u0906\u0927\u0940 \u0914\u0930 \u0905\u0902\u0927\u0947\u0930\u0940 \u0906\u0927\u0940 \u092C\u0926\u0932\u0924\u0940 \u0930\u0939\u0924\u0940 \u0939\u0948\u0964"),why:a("The Earth spins once about every 24 hours. The half facing the Sun has day; the other half has night.","\u092A\u0943\u0925\u094D\u0935\u0940 \u0932\u0917\u092D\u0917 \u0939\u0930 24 \u0918\u0902\u091F\u0947 \u092E\u0947\u0902 \u090F\u0915 \u092C\u093E\u0930 \u0918\u0942\u092E\u0924\u0940 \u0939\u0948\u0964 \u0938\u0942\u0930\u091C \u0915\u0940 \u0913\u0930 \u0935\u093E\u0932\u093E \u0906\u0927\u093E \u092D\u093E\u0917 \u0926\u093F\u0928, \u0926\u0942\u0938\u0930\u093E \u0906\u0927\u093E \u0930\u093E\u0924\u0964")},{q:a("About how long does one spin of the Earth take?","\u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u093E \u090F\u0915 \u091A\u0915\u094D\u0915\u0930 \u0932\u0917\u092D\u0917 \u0915\u093F\u0924\u0928\u0947 \u0938\u092E\u092F \u092E\u0947\u0902 \u092A\u0942\u0930\u093E \u0939\u094B\u0924\u093E \u0939\u0948?"),options:[a("12 hours","12 \u0918\u0902\u091F\u0947"),a("24 hours","24 \u0918\u0902\u091F\u0947"),a("One month","\u090F\u0915 \u092E\u0939\u0940\u0928\u093E")],answer:1,hint:a("From one sunrise to the next is one day.","\u090F\u0915 \u0938\u0942\u0930\u094D\u092F\u094B\u0926\u092F \u0938\u0947 \u0926\u0942\u0938\u0930\u0947 \u0938\u0942\u0930\u094D\u092F\u094B\u0926\u092F \u0924\u0915 \u090F\u0915 \u0926\u093F\u0928 \u0939\u094B\u0924\u093E \u0939\u0948\u0964"),why:a("One spin takes about 24 hours \u2014 one day. The Earth also goes round the Sun, but that takes a year.","\u090F\u0915 \u091A\u0915\u094D\u0915\u0930 \u092E\u0947\u0902 \u0932\u0917\u092D\u0917 24 \u0918\u0902\u091F\u0947 \u2014 \u090F\u0915 \u0926\u093F\u0928 \u0932\u0917\u0924\u093E \u0939\u0948\u0964 \u092A\u0943\u0925\u094D\u0935\u0940 \u0938\u0942\u0930\u091C \u0915\u093E \u091A\u0915\u094D\u0915\u0930 \u092D\u0940 \u0932\u0917\u093E\u0924\u0940 \u0939\u0948, \u092A\u0930 \u0909\u0938\u092E\u0947\u0902 \u090F\u0915 \u0935\u0930\u094D\u0937 \u0932\u0917\u0924\u093E \u0939\u0948\u0964")},{q:a("When it is noon in India, what is the side of the Earth facing away from the Sun doing?","\u091C\u092C \u092D\u093E\u0930\u0924 \u092E\u0947\u0902 \u0926\u094B\u092A\u0939\u0930 \u0939\u0948, \u0924\u092C \u0938\u0942\u0930\u091C \u0938\u0947 \u0926\u0942\u0930 \u0935\u093E\u0932\u093E \u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u093E \u092D\u093E\u0917 \u0915\u094D\u092F\u093E \u0915\u0930 \u0930\u0939\u093E \u0939\u094B\u0924\u093E \u0939\u0948?"),options:[a("Having night","\u0930\u093E\u0924 \u0915\u093E \u0938\u092E\u092F"),a("Having noon too","\u0935\u0939\u093E\u0901 \u092D\u0940 \u0926\u094B\u092A\u0939\u0930"),a("Standing still","\u0938\u094D\u0925\u093F\u0930 \u0916\u0921\u093C\u093E")],answer:0,hint:a("Only one half can face the Sun at a time.","\u090F\u0915 \u0938\u092E\u092F \u092E\u0947\u0902 \u0915\u0947\u0935\u0932 \u090F\u0915 \u0906\u0927\u093E \u092D\u093E\u0917 \u0938\u0942\u0930\u091C \u0915\u0940 \u0913\u0930 \u0939\u094B \u0938\u0915\u0924\u093E \u0939\u0948\u0964"),why:a("At any moment half the Earth is lit and half is dark. India's noon is midnight on the opposite side.","\u0915\u093F\u0938\u0940 \u092D\u0940 \u0938\u092E\u092F \u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u093E \u0906\u0927\u093E \u092D\u093E\u0917 \u0909\u091C\u0932\u093E \u0914\u0930 \u0906\u0927\u093E \u0905\u0902\u0927\u0947\u0930\u093E \u0930\u0939\u0924\u093E \u0939\u0948\u0964 \u092D\u093E\u0930\u0924 \u092E\u0947\u0902 \u0926\u094B\u092A\u0939\u0930 \u0924\u094B \u0935\u093F\u092A\u0930\u0940\u0924 \u0926\u093F\u0936\u093E \u092E\u0947\u0902 \u0906\u0927\u0940 \u0930\u093E\u0924 \u0939\u0948\u0964")}]},{id:"labs.plant",strand:"s",grade:4,scene:"plant",skill:"s.plants",icon:"\u{1F331}",title:a("Inside a plant","\u092A\u094C\u0927\u0947 \u0915\u0947 \u092D\u0940\u0924\u0930"),blurb:a("Turn a potted plant and find the parts that make food, carry water and hold it up.","\u0917\u092E\u0932\u0947 \u0915\u093E \u092A\u094C\u0927\u093E \u0918\u0941\u092E\u093E\u0913 \u0914\u0930 \u0935\u0947 \u092D\u093E\u0917 \u0922\u0942\u0901\u0922\u094B \u091C\u094B \u092D\u094B\u091C\u0928 \u092C\u0928\u093E\u0924\u0947 \u0939\u0948\u0902, \u092A\u093E\u0928\u0940 \u092A\u0939\u0941\u0901\u091A\u093E\u0924\u0947 \u0939\u0948\u0902 \u0914\u0930 \u092A\u094C\u0927\u0947 \u0915\u094B \u0938\u0901\u092D\u093E\u0932\u0924\u0947 \u0939\u0948\u0902\u0964"),notice:a("Use the part buttons to light up a leaf, the stem, the flower or the roots.","\u092D\u093E\u0917 \u0915\u0947 \u092C\u091F\u0928 \u0938\u0947 \u092A\u0924\u094D\u0924\u0940, \u0924\u0928\u093E, \u092B\u0942\u0932 \u092F\u093E \u091C\u0921\u093C \u0915\u094B \u091A\u092E\u0915\u093E\u0913\u0964"),alt:a("A potted plant with a green stem, three leaves, a pink flower and brown roots inside the pot.","\u0917\u092E\u0932\u0947 \u092E\u0947\u0902 \u0932\u0917\u093E \u092A\u094C\u0927\u093E: \u0939\u0930\u093E \u0924\u0928\u093E, \u0924\u0940\u0928 \u092A\u0924\u094D\u0924\u093F\u092F\u093E\u0901, \u09 il, away from the light.","\u092F\u0939 \u092E\u093F\u091F\u094D\u091F\u0940 \u092E\u0947\u0902 \u0928\u0940\u091A\u0947 \u0915\u0940 \u0913\u0930 \u092C\u0922\u093C\u0924\u093E \u0939\u0948, \u0930\u094B\u0936\u0928\u0940 \u0938\u0947 \u0926\u0942\u0930\u0964"),why:a("Roots hold the plant in the soil and absorb water and minerals through tiny root hairs.","\u091C\u0921\u093C\u0947\u0902 \u092A\u094C\u0927\u0947 \u0915\u094B \u092E\u093F\u091F\u094D\u091F\u0940 \u092E\u0947\u0902 \u0925\u093E\u092E\u0947 \u0930\u0916\u0924\u0940 \u0939\u0948\u0902 \u0914\u0930 \u091B\u094B\u091F\u0947-\u091B\u094B\u091F\u0947 \u0930\u094B\u092E\u094B\u0902 \u0938\u0947 \u092A\u093E\u0928\u0940 \u0935 \u0916\u0928\u093F\u091C \u0938\u094B\u0916\u0924\u0940 \u0939\u0948\u0902\u0964")},{q:a("Which part carries water from the roots up to the leaves?","\u0915\u094C\u0928-\u0938\u093E \u092D\u093E\u0917 \u091C\u0921\u093C\u094B\u0902 \u0938\u0947 \u092A\u093E\u0928\u0940 \u090A\u092A\u0930 \u092A\u0924\u094D\u0924\u093F\u092F\u094B\u0902 \u0924\u0915 \u092A\u0939\u0941\u0901\u091A\u093E\u0924\u093E \u0939\u0948?"),options:[a("Stem","\u0924\u0928\u093E"),a("Flower","\u092B\u0942\u0932"),a("Leaf","\u092A\u0924\u094D\u0924\u0940")],answer:0,hint:a("It is the tall pipe between the roots and the leaves.","\u092F\u0939 \u091C\u0921\u093C\u094B\u0902 \u0914\u0930 \u092A\u0924\u094D\u0924\u093F\u092F\u094B\u0902 \u0915\u0947 \u092C\u0940\u091A \u0915\u0940 \u0932\u0902\u092C\u0940 \u0928\u0932\u0940 \u0939\u0948\u0964"),why:a("The stem carries water and minerals upward and holds the leaves up to the light.","\u0924\u0928\u093E \u092A\u093E\u0928\u0940 \u0914\u0930 \u0916\u0928\u093F\u091C \u090A\u092A\u0930 \u092A\u0939\u0941\u0901\u091A\u093E\u0924\u093E \u0939\u0948 \u0914\u0930 \u092A\u0924\u094D\u0924\u093F\u092F\u094B\u0902 \u0915\u094B \u0930\u094B\u0936\u0928\u0940 \u092E\u0947\u0902 \u0925\u093E\u092E\u0947 \u0930\u0916\u0924\u093E \u0939\u0948\u0964")}]}];var js=/^labs\.[a-z0-9_]{1,30}$/ 47 \u092A\u093E\u0938 \u090F\u0915 \u091B\u094B\u091F\u093E \u092C\u091F\u0941\u0906 \u092A\u0921\u093C\u093E \u0939\u0948\u0964 \u0909\u0938\u092E\u0947\u0902 \u20B9500 \u0914\u0930 \u0905\u0938\u094D\u092A\u0924\u093E\u0932 \u092E\u0947\u0902 \u0915\u093E\u092E \u0915\u0930\u0928\u0947 \u0935\u093E\u0932\u0940 \u0926\u0940\u0926\u0940 \u0915\u0940 \u092B\u093C\u094B\u091F\u094B \u0935\u093E\u0932\u093E \u092C\u0938 \u092A\u093E\u0938 \u0939\u0948\u0964"),choices:[{label:a("Pick it up and give it to the bus conductor.","\u0909\u0938\u0947 \u0909\u0920\u093E\u0915\u0930 \u092C\u0938 \u0915\u0902\u0921\u0915\u094D\u091F\u0930 \u0915\u094B \u0926\u094B\u0964"),next:"conductor"},{label:a("Take it home and ask Amma what to do.","\u0918\u0930 \u0932\u0947 \u091C\u093E\u0915\u0930 \u0905\u092E\u094D\u092E\u093E \u0938\u0947 \u092A\u0942\u091B\u094B \u0915\u093F \u0915\u094D\u092F\u093E \u0915\u0930\u0947\u0902\u0964"),next:"amma"},{label:a("Keep it. You could buy the stickers you wanted.","\u0930\u0916 \u0932\u094B\u0964 \u091C\u094B \u0938\u094D\u091F\u093F\u0915\u0930 \u091A\u093E\u0939\u093F\u090F \u0925\u0947, \u0935\u0947 \u0916\u0930\u0940\u0926 \u0938\u0915\u0924\u0947 \u0939\u094B\u0964"),next:"kept"}]},conductor:{text:a("The conductor recognises the photo. Ten minutes later the didi comes running back, out of breath. Her month's bus money is in that purse.","\u0915\u0902\u0921\u0915\u094D\u091F\u0930 \u092B\u093C\u094B\u091F\u094B \u092A\u0939\u091A\u093E\u0928 \u0932\u0947\u0924\u093E \u0939\u0948\u0964 \u0926\u0938 \u092E\u093F\u0928\u091F \u092C\u093E\u0926 \u0935\u0939 \u0926\u0940\u0926\u0940 \u0938\u093E\u0901\u0938 \u092B\u0942\u0932\u0924\u0940 \u0939\u0941\u0908 \u0926\u094C\u0921\u093C\u0924\u0940 \u0906\u0924\u0940 \u0939\u0948\u0964 \u0909\u0938 \u092C\u091F\u0941\u090F \u092E\u0947\u0902 \u0909\u0938\u0915\u0947 \u092E\u0939\u0940\u0928\u0947 \u0915\u0947 \u092C\u0938 \u0915\u0947 \u092A\u0948\u0938\u0947 \u0939\u0948\u0902\u0964"),choices:[{label:a("Hand it over, and do not wait to be thanked.","\u0909\u0938\u0947 \u0926\u0947 \u0926\u094B, \u0914\u0930 \u0927\u0928\u094D\u092F\u0935\u093E\u0926 \u0915\u0940 \u092A\u094D\u0930\u0924\u0940\u0915\u094D\u0937\u093E \u092E\u0924 \u0915\u0930\u094B\u0964"),next:"returned"},{label:a("Ask her for \u20B950 as a reward.","\u0909\u0938\u0938\u0947 \u0907\u0928\u093E\u092E \u092E\u0947\u0902 \u20B950 \u092E\u093E\u0901\u0917\u094B\u0964"),next:"reward"}]},amma:{text:a("Amma listens carefully. \u201CIt is not ours,\u201D she says. \u201CBut it is yours to return.\u201D","\u0905\u092E\u094D\u092E\u093E \u0927\u094D\u092F\u093E\u0928 \u0938\u0947 \u0938\u0941\u0928\u0924\u0940 \u0939\u0948\u0902\u0964 \u201C\u092F\u0939 \u0939\u092E\u093E\u0930\u093E \u0928\u0939\u0940\u0902 \u0939\u0948,\u201D \u0935\u0947 \u0915\u0939\u0924\u0940 \u0939\u0948\u0902\u0964 \u201C\u092A\u0930 \u0932\u094C\u091F\u093E\u0928\u093E \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u093E \u0915\u093E\u092E \u0939\u0948\u0964\u201D"),choices:[{label:a("Walk back to the stop with Amma.","\u0905\u092E\u094D\u092E\u093E \u0915\u0947 \u0938\u093E\u0925 \u0938\u094D\u091F\u0949\u092A \u0924\u0915 \u0935\u093E\u092A\u0938 \u091A\u0932\u094B\u0964"),next:"conductor"},{label:a("Leave it in the cupboard. Someone will ask.","\u0909\u0938\u0947 \u0905\u0932\u092E\u093E\u0930\u0940 \u092E\u0947\u0902 \u0930\u0916 \u0926\u094B\u0964 \u0915\u094B\u0908 \u092A\u0942\u091B\u0947\u0917\u093E \u0924\u094B \u0926\u0947 \u0926\u0947\u0902\u0917\u0947\u0964"),next:"cupboard"}]},kept:{text:a("You buy the stickers. At home the purse sits in your bag. You keep thinking about the photo on the pass \u2014 a didi with a tired smile.","\u0924\u0941\u092E \u0938\u094D\u091F\u093F\u0915\u0930 \u0916\u0930\u0940\u0926 \u0932\u0947\u0924\u0947 \u0939\u094B\u0964 \u0918\u0930 \u092A\u0930 \u092C\u091F\u0941\u0906 \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0947 \u092C\u0938\u094D\u0924\u0947 \u092E\u0947\u0902 \u0930\u0939\u0924\u093E \u0939\u0948\u0964 \u092A\u093E\u0938 \u0915\u0940 \u092B\u093C\u094B\u091F\u094B \u092F\u093E\u0926 \u0906\u0924\u0940 \u0930\u0939\u0924\u0940 \u0939\u0948 \u2014 \u0925\u0915\u0940 \u092E\u0941\u0938\u094D\u0915\u093E\u0928 \u0935\u093E\u0932\u0940 \u0926\u0940\u0926\u0940\u0964"),choices:[{label:a("Tell Amma, and go back to the stop together.","\u0905\u092E\u094D\u092E\u093E \u0915\u094B \u092C\u0924\u093E\u0913, \u0914\u0930 \u0938\u093E\u0925 \u092E\u0947\u0902 \u0938\u094D\u091F\u0949\u092A \u0932\u094C\u091F\u094B\u0964"),next:"conductor"},{label:a("Hide the purse under the bed.","\u092C\u091F\u0941\u0906 \u092C\u093F\u0938\u094D\u0924\u0930 \u0915\u0947 \u0928\u0940\u091A\u0947 \u091B\u093F\u092A\u093E \u0926\u094B\u0964"),next:"hidden"}]},returned:{end:!0,text:a("The didi holds your hand for a second. \u201CI would have missed my duty,\u201D she says. The conductor gives you a nod. Nothing is bought, and nothing is missing.","\u0926\u0940\u0926\u0940 \u090F\u0915 \u092A\u0932 \u0915\u0947 \u0932\u093F\u090F \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u093E \u0939\u093E\u0925 \u0925\u093E\u092E\u0924\u0940 \u0939\u0948\u0902\u0964 \u201C\u092E\u0947\u0930\u0940 \u0921\u094D\u092F\u0942\u091F\u0940 \u091B\u0942\u091F \u091C\u093E\u0924\u0940,\u201D \u0935\u0947 \u0915\u0939\u0924\u0940 \u0939\u0948\u0902\u0964 \u0915\u0902\u0921\u0915\u094D\u091F\u0930 \u0938\u093F\u0930 \u0939\u093F\u0932\u093E\u0924\u093E \u0939\u0948\u0964 \u0915\u0941\u091B \u0916\u0930\u0940\u0926\u093E \u0928\u0939\u0940\u0902 \u0917\u092F\u093E, \u0914\u0930 \u0915\u0941\u091B \u0916\u094B\u092F\u093E \u092D\u0940 \u0928\u0939\u0940\u0902\u0964"),lesson:a("Honesty is not a transaction. Returning something is not doing a favour to its owner; it is keeping your own hands clean.","\u0908\u092E\u093E\u0928\u0926\u093E\u0930\u0940 \u0938\u094C\u0926\u093E \u0928\u0939\u0940\u0902 \u0939\u0948\u0964 \u091A\u0940\u091C\u093C \u0932\u094C\u091F\u093E\u0928\u093E \u0909\u0938\u0915\u0947 \u092E\u093E\u0932\u093F\u0915 \u092A\u0930 \u090F\u0939\u0938\u093E\u0928 \u0928\u0939\u0940\u0902, \u0905\u092A\u0928\u0947 \u0939\u093E\u0925 \u0938\u093E\u092B\u093C \u0930\u0916\u0928\u093E \u0939\u0948\u0964"),reflection:{q:a("What would you do if nobody had seen you at all?","\u0905\u0917\u0930 \u0924\u0941\u092E\u094D\u0939\u0947\u0902 \u0915\u093F\u0938\u0940 \u0928\u0947 \u0926\u0947\u0916\u093E \u0939\u0940 \u0928 \u0939\u094B\u0924\u093E \u0924\u094B \u0915\u094D\u092F\u093E \u0915\u0930\u0924\u0947?"),options:[a("Return it anyway \u2014 being unseen does not change what is right.","\u092B\u093F\u0930 \u092D\u0940 \u0932\u094C\u091F\u093E\u0924\u093E \u2014 \u0928 \u0926\u093F\u0916\u0928\u0947 \u0938\u0947 \u0938\u0939\u0940-\u0917\u0932\u0924 \u0928\u0939\u0940\u0902 \u092C\u0926\u0932\u0924\u093E\u0964"),a("I would have to think harder. That is honest too.","\u092E\u0941\u091D\u0947 \u0914\u0930 \u0938\u094B\u091A\u0928\u093E \u092A\u0921\u093C\u0924\u093E\u0964 \u092F\u0939 \u092D\u0940 \u0908\u092E\u093E\u0928\u0926\u093E\u0930\u0940 \u0939\u0948\u0964"),a("I am not sure yet.","\u092E\u0941\u091D\u0947 \u0905\u092D\u0940 \u092A\u0924\u093E \u0928\u0939\u0940\u0902\u0964")]}},reward:{end:!0,text:a("She gives you \u20B950. Her hands shake a little as she counts it. You have the money, and a strange empty feeling.","\u0935\u0947 \u0924\u0941\u092E\u094D\u0939\u0947\u0902 \u20B950 \u0926\u0947\u0924\u0940 \u0939\u0948\u0902\u0964 \u0917\u093F\u0928\u0924\u0947 \u0938\u092E\u092F \u0909\u0928\u0915\u0947 \u0939\u093E\u0925 \u0925\u094B\u0921\u093C\u0947 \u0915\u093E\u0901\u092A\u0924\u0947 \u0939\u0948\u0902\u0964 \u092A\u0948\u0938\u0947 \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0947 \u092A\u093E\u0938 \u0939\u0948\u0902, \u0914\u0930 \u090F\u0915 \u0905\u091C\u0940\u092C \u0916\u093E\u0932\u0940\u092A\u0928 \u092D\u0940\u0964"),lesson:a("Helping is not a bargain. Even a small reward asked at the wrong moment can turn a kindness into a trade.","\u092E\u0926\u0926 \u0938\u094C\u0926\u093E \u0928\u0939\u0940\u0902 \u0939\u0948\u0964 \u0917\u0932\u0924 \u0938\u092E\u092F \u092A\u0930 \u092E\u093E\u0901\u0917\u093E \u091B\u094B\u091F\u093E \u0907\u0928\u093E\u092E \u092D\u0940 \u0926\u092F\u093E \u0915\u094B \u0932\u0947\u0928-\u0926\u0947\u0928 \u092C\u0928\u093E \u0926\u0947\u0924\u093E \u0939\u0948\u0964"),reflection:{q:a("When help is needed, what does the other person need most from you?","\u091C\u092C \u0915\u093F\u0938\u0940 \u0915\u094B \u092E\u0926\u0926 \u091A\u093E\u0939\u093F\u090F, \u0924\u092C \u0909\u0938\u0947 \u0924\u0941\u092E\u0938\u0947 \u0938\u092C\u0938\u0947 \u091C\u093C\u094D\u092F\u093E\u0926\u093E \u0915\u094D\u092F\u093E \u091A\u093E\u0939\u093F\u090F?"),options:[a("To be helped, not charged.","\u092E\u0926\u0926, \u0907\u0928\u093E\u092E \u0928\u0939\u0940\u0902\u0964"),a("To be asked what they need.","\u092F\u0939 \u092A\u0942\u091B\u093E \u091C\u093E\u090F \u0915\u093F \u0909\u0928\u094D\u0939\u0947\u0902 \u0915\u094D\u092F\u093E \u091A\u093E\u0939\u093F\u090F\u0964"),a("A little of both is fine.","\u0925\u094B\u0921\u093C\u093E \u0926\u094B\u0928\u094B\u0902 \u0920\u0940\u0915 \u0939\u0948\u0964")]}},cupboard:{end:!0,text:a("The purse waits in the cupboard. Every time the door opens, you look away. The \u20B9500 is still there, but it no longer feels like money.","\u092C\u091F\u0941\u0906 \u0905\u0932\u092E\u093E\u0930\u0940 \u092E\u0947\u0902 \u092A\u094D\u0930\u0924\u0940\u0915\u094D\u0937\u093E \u0915\u0930\u0924\u093E \u0939\u0948\u0964 \u091C\u092C \u092D\u0940 \u0926\u0930\u0935\u093E\u091C\u093C\u093E \u0916\u0941\u0932\u0924\u093E \u0939\u0948, \u0924\u0941\u092E \u0928\u091C\u093C\u0930 \u091A\u0941\u0930\u093E \u0932\u0947\u0924\u0947 \u0939\u094B\u0964 \u20B9500 \u0935\u0939\u0940\u0902 \u0939\u0948\u0902, \u092A\u0930 \u0905\u092C \u092A\u0948\u0938\u0947 \u091C\u0948\u0938\u0947 \u0928\u0939\u0940\u0902 \u0932\u0917\u0924\u0947\u0964"),lesson:a("A thing kept is not a thing owned. The worry takes more room than the money.","\u0930\u0916\u0940 \u0939\u0941\u0908 \u091A\u0940\u091C\u093C \u0905\u092A\u0928\u0940 \u0928\u0939\u0940\u0902 \u0939\u094B\u0924\u0940\u0964 \u091A\u093F\u0902\u0924\u093E \u092A\u0948\u0938\u094B\u0902 \u0938\u0947 \u091C\u093C\u094D\u092F\u093E\u0926\u093E \u091C\u0917\u0939 \u0932\u0947 \u0932\u0947\u0924\u0940 \u0939\u0948\u0964"),reflection:{q:a("What makes a secret heavy?","\u0915\u093F\u0938\u0940 \u0930\u0939\u0938\u094D\u092F \u0915\u094B \u092D\u093E\u0930\u0940 \u0915\u094D\u092F\u093E \u092C\u0928\u093E\u0924\u093E \u0939\u0948?"),options:[a("Knowing it could be fixed and not fixing it.","\u092F\u0939 \u091C\u093E\u0928\u0928\u093E \u0915\u093F \u0907\u0938\u0947 \u0920\u0940\u0915 \u0915\u093F\u092F\u093E \u091C\u093E \u0938\u0915\u0924\u093E \u0939\u0948 \u0914\u0930 \u0928 \u0915\u0930\u0928\u093E\u0964"),a("Being afraid of what someone will say.","\u0915\u093F\u0938\u0940 \u0915\u0940 \u092C\u093E\u0924 \u0915\u093E \u0921\u0930\u0964"),a("Both, together.","\u0926\u094B\u0928\u094B\u0902, \u0938\u093E\u0925 \u092E\u0947\u0902\u0964")]}},hidden:{end:!0,text:a("A week later Amma finds the purse while cleaning. She does not shout. She asks one question: \u201CWas it heavy to carry?\u201D You cannot answer.","\u090F\u0915 \u0939\u092B\u093C\u094D\u0924\u0947 \u092C\u093E\u0926 \u0938\u092B\u093C\u093E\u0908 \u0915\u0930\u0924\u0947 \u0939\u0941\u090F \u0905\u092E\u094D\u092E\u093E \u0915\u094B \u092C\u091F\u0941\u0906 \u092E\u093F\u0932\u0924\u093E \u0939\u0948\u0964 \u0935\u0947 \u091A\u093F\u0932\u094D\u0932\u093E\u0924\u0940 \u0928\u0939\u0940\u0902\u0964 \u090F\u0915 \u0938\u0935\u093E\u0932 \u092A\u0942\u091B\u0924\u0940 \u0939\u0948\u0902: \u201C\u0909\u0920\u093E\u0928\u0947 \u092E\u0947\u0902 \u092D\u093E\u0930\u0940 \u0925\u093E?\u201D \u0924\u0941\u092E \u0909\u0924\u094D\u0924\u0930 \u0928\u0939\u0940\u0902 \u0926\u0947 \u092A\u093E\u0924\u0947\u0964"),lesson:a("Hiding a mistake does not remove it. The first honest sentence is the hardest, and the one that helps most.","\u0917\u0932\u0924\u0940 \u091B\u093F\u092A\u093E\u0928\u0947 \u0938\u0947 \u0935\u0939 \u091C\u093E\u0924\u0940 \u0928\u0939\u0940\u0902\u0964 \u092A\u0939\u0932\u093E \u0938\u091A\u094D\u091A\u093E \u0935\u093E\u0915\u094D\u092F \u0938\u092C\u0938\u0947 \u0915\u0920\u093F\u0928 \u0939\u094B\u0924\u093E \u0939\u0948, \u0914\u0930 \u0938\u092C\u0938\u0947 \u091C\u093C\u094D\u092F\u093E\u0926\u093E \u092E\u0926\u0926 \u0915\u0930\u0924\u093E \u0939\u0948\u0964"),reflection:{q:a("What is the first true sentence you could say?","\u092A\u0939\u0932\u093E \u0938\u091A\u094D\u091A\u093E \u0935\u093E\u0915\u094D\u092F \u0915\u094D\u092F\u093E \u0939\u094B \u0938\u0915\u0924\u093E \u0939\u0948?"),options:[a("\u201CI found it and I did not return it.\u201D","\u201C\u092E\u0941\u091D\u0947 \u092E\u093F\u0932\u093E \u0925\u093E \u0914\u0930 \u092E\u0948\u0902\u0928\u0947 \u0932\u094C\u091F\u093E\u092F\u093E \u0928\u0939\u0940\u0902\u0964\u201D"),a("\u201CI was scared to tell you.\u201D","\u201C\u092E\u0941\u091D\u0947 \u092C\u0924\u093E\u0928\u0947 \u0915\u093E \u0921\u0930 \u0925\u093E\u0964\u201D"),a("\u201CCan we return it now?\u201D","\u201C\u0915\u094D\u092F\u093E \u0939\u092E \u0905\u092C \u0932\u094C\u091F\u093E \u0938\u0915\u0924\u0947 \u0939\u0948\u0902?\u201D")]}}}},{id:"story.paratha",icon:"\u{1F95E}",grade:4,strand:"h",title:a("Half a paratha","\u0906\u0927\u093E \u092A\u0930\u093E\u0920\u093E"),blurb:a("A new girl sits alone with no tiffin. You have two parathas and a growling stomach.","\u090F\u0915 \u0928\u0908 \u0932\u0921\u093C\u0915\u0940 \u0905\u0915\u0947\u0932\u0940 \u092C\u0948\u0920\u0940 \u0939\u0948, \u0909\u0938\u0915\u0947 \u092A\u093E\u0938 \u091F\u093F\u092B\u093C\u093F\u0928 \u0928\u0939\u0940\u0902\u0964 \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0947 \u092A\u093E\u0938 \u0926\u094B \u092A\u0930\u093E\u0920\u0947 \u0939\u0948\u0902 \u0914\u0930 \u092A\u0947\u091F \u092E\u0947\u0902 \u092D\u0942\u0916\u0964"),place:a("The lunch break, under the neem tree","\u0928\u0940\u092E \u0915\u0947 \u092A\u0947\u0921\u093C \u0915\u0947 \u0928\u0940\u091A\u0947 \u0932\u0902\u091A \u092C\u094D\u0930\u0947\u0915"),start:"start",nodes:{start:{text:a("A new girl, Meera, sits alone. Her tiffin box is at home. You have two aloo parathas wrapped in paper.","\u0928\u0908 \u0932\u0921\u093C\u0915\u0940 \u092E\u0940\u0930\u093E \u0905\u0915\u0947\u0932\u0940 \u092C\u0948\u0920\u0940 \u0939\u0948\u0964 \u0909\u0938\u0915\u093E \u091F\u093F\u092B\u093C\u093F\u0928 \u0918\u0930 \u0930\u0939 \u0917\u092F\u093E\u0964 \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0947 \u092A\u093E\u0938 \u0915\u093E\u0917\u091C\u093C \u092E\u0947\u0902 \u0932\u093F\u092A\u091F\u0947 \u0926\u094B \u0906\u0932\u0942 \u092A\u0930\u093E\u0920\u0947 \u0939\u0948\u0902\u0964"),choices:[{label:a("Give her one paratha.","\u0909\u0938\u0947 \u090F\u0915 \u092A\u0930\u093E\u0920\u093E \u0926\u094B\u0964"),next:"share"},{label:a("Eat both and look the other way.","\u0926\u094B\u0928\u094B\u0902 \u0916\u093E\u0913 \u0914\u0930 \u0926\u0942\u0938\u0930\u0940 \u0913\u0930 \u0926\u0947\u0916\u094B\u0964"),next:"eat"},{label:a("Ask two friends to share their tiffin too.","\u0926\u094B \u0926\u094B\u0938\u094D\u0924\u094B\u0902 \u0938\u0947 \u092D\u0940 \u091F\u093F\u092B\u093C\u093F\u0928 \u092C\u093E\u0901\u091F\u0928\u0947 \u0915\u094B \u0915\u0939\u094B\u0964"),next:"ask"}]},share:{text:a("Meera says, \u201CNo, no, I am not hungry.\u201D Her eyes say something else. Your paratha is warm in your hand.","\u092E\u0940\u0930\u093E \u0915\u0939\u0924\u0940 \u0939\u0948, \u201C\u0928\u0939\u0940\u0902, \u0928\u0939\u0940\u0902, \u092E\u0941\u091D\u0947 \u092D\u0942\u0916 \u0928\u0939\u0940\u0902\u0964\u201D \u0909\u0938\u0915\u0940 \u0906\u0901\u0916\u0947\u0902 \u0915\u0941\u091B \u0914\u0930 \u0915\u0939\u0924\u0940 \u0939\u0948\u0902\u0964 \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u093E \u092A\u0930\u093E\u0920\u093E \u0939\u093E\u0925 \u092E\u0947\u0902 \u0917\u0930\u092E \u0939\u0948\u0964"),choices:[{label:a("Leave half on her lid and start eating yours.","\u0909\u0938\u0915\u0947 \u0922\u0915\u094D\u0915\u0928 \u092A\u0930 \u0906\u0927\u093E \u0930\u0916 \u0926\u094B \u0914\u0930 \u0905\u092A\u0928\u093E \u0916\u093E\u0928\u0947 \u0932\u0917\u094B\u0964"),next:"warm"},{label:a("Take it back. She said no.","\u0935\u093E\u092A\u0938 \u0932\u0947 \u0932\u094B\u0964 \u0909\u0938\u0928\u0947 \u092E\u0928\u093E \u0915\u093F\u092F\u093E\u0964"),next:"awkward"}]},eat:{text:a("You finish both. Meera drinks water from the tap and looks at the ground. Your stomach is full; the break feels long.","\u0924\u0941\u092E \u0926\u094B\u0928\u094B\u0902 \u0916\u0924\u094D\u092E \u0915\u0930 \u0932\u0947\u0924\u0947 \u0939\u094B\u0964 \u092E\u0940\u0930\u093E \u0928\u0932 \u0938\u0947 \u092A\u093E\u0928\u0940 \u092A\u0940\u0924\u0940 \u0939\u0948 \u0914\u0930 \u091C\u093C\u092E\u0940\u0928 \u0926\u0947\u0916\u0924\u0940 \u0939\u0948\u0964 \u092A\u0947\u091F \u092D\u0930 \u0917\u092F\u093E; \u092C\u094D\u0930\u0947\u0915 \u0932\u0902\u092C\u093E \u0932\u0917\u0924\u093E \u0939\u0948\u0964"),choices:[{label:a("Offer your water bottle and sit with her.","\u0905\u092A\u0928\u0940 \u092A\u093E\u0928\u0940 \u0915\u0940 \u092C\u094B\u0924\u0932 \u0926\u094B \u0914\u0930 \u0909\u0938\u0915\u0947 \u092A\u093E\u0938 \u092C\u0948\u0920\u094B\u0964"),next:"small"},{label:a("Pretend not to notice.","\u0905\u0928\u0926\u0947\u0916\u093E \u0915\u0930 \u0926\u094B\u0964"),next:"regret"}]},ask:{text:a("Two friends bring their tiffins. Now there are four things for five people \u2014 and everyone is waiting to see what you do.","\u0926\u094B \u0926\u094B\u0938\u094D\u0924 \u0905\u092A\u0928\u0947 \u091F\u093F\u092B\u093C\u093F\u0928 \u0932\u0947 \u0906\u0924\u0947 \u0939\u0948\u0902\u0964 \u0905\u092C \u092A\u093E\u0901\u091A \u0932\u094B\u0917\u094B\u0902 \u0915\u0947 \u0932\u093F\u090F \u091A\u093E\u0930 \u091A\u0940\u091C\u093C\u0947\u0902 \u0939\u0948\u0902 \u2014 \u0914\u0930 \u0938\u092C \u0926\u0947\u0916 \u0930\u0939\u0947 \u0939\u0948\u0902 \u0915\u093F \u0924\u0941\u092E \u0915\u094D\u092F\u093E \u0915\u0930\u0924\u0947 \u0939\u094B\u0964"),choices:[{label:a("Split everything into five equal parts.","\u0938\u092C \u0915\u0941\u091B \u092A\u093E\u0901\u091A \u092C\u0930\u093E\u092C\u0930 \u0939\u093F\u0938\u094D\u0938\u094B\u0902 \u092E\u0947\u0902 \u092C\u093E\u0901\u091F\u094B\u0964"),next:"feast"},{label:a("Give your whole share to Meera.","\u0905\u092A\u0928\u093E \u092A\u0942\u0930\u093E \u0939\u093F\u0938\u094D\u0938\u093E \u092E\u0940\u0930\u093E \u0915\u094B \u0926\u0947 \u0926\u094B\u0964"),next:"generous"}]},warm:{end:!0,text:a("Meera eats slowly, then smiles for the first time that day. In the afternoon she lends you her sketch pen. Nobody made a speech.","\u092E\u0940\u0930\u093E \u0927\u0940\u0930\u0947-\u0927\u0940\u0930\u0947 \u0916\u093E\u0924\u0940 \u0939\u0948, \u092B\u093F\u0930 \u0909\u0938 \u0926\u093F\u0928 \u092A\u0939\u0932\u0940 \u092C\u093E\u0930 \u092E\u0941\u0938\u094D\u0915\u0941\u0930\u093E\u0924\u0940 \u0939\u0948\u0964 \u0926\u094B\u092A\u0939\u0930 \u092E\u0947\u0902 \u0935\u0939 \u0924\u0941\u092E\u094D\u0939\u0947\u0902 \u0905\u092A\u0928\u093E \u0938\u094D\u0915\u0947\u091A \u092A\u0947\u0928 \u0926\u0947\u0924\u0940 \u0939\u0948\u0964 \u0915\u093F\u0938\u0940 \u0928\u0947 \u092D\u093E\u0937\u0923 \u0928\u0939\u0940\u0902 \u0926\u093F\u092F\u093E\u0964"),lesson:a("Sharing works best when it leaves the other person their dignity. \u201CLeave it and start eating\u201D asks for nothing in return.","\u092C\u093E\u0901\u091F\u0928\u093E \u0924\u092C \u0938\u092C\u0938\u0947 \u0905\u091A\u094D\u091B\u093E \u0939\u094B\u0924\u093E \u0939\u0948 \u091C\u092C \u0926\u0942\u0938\u0930\u0947 \u0915\u0940 \u0907\u091C\u093C\u094D\u091C\u093C\u0924 \u092C\u0928\u0940 \u0930\u0939\u0947\u0964 \u201C\u0930\u0916\u0915\u0930 \u0916\u093E\u0928\u0947 \u0932\u0917\u094B\u201D \u092E\u0947\u0902 \u0915\u0941\u091B \u0935\u093E\u092A\u0938 \u0928\u0939\u0940\u0902 \u092E\u093E\u0901\u0917\u093E \u091C\u093E\u0924\u093E\u0964"),reflection:{q:a("How can you share without making someone feel small?","\u0915\u093F\u0938\u0940 \u0915\u094B \u091B\u094B\u091F\u093E \u092E\u0939\u0938\u0942\u0938 \u0915\u0930\u093E\u090F \u092C\u093F\u0928\u093E \u0915\u0948\u0938\u0947 \u092C\u093E\u0901\u091F\u0947\u0902?"),options:[a("Give quietly, and do not watch them eat.","\u091A\u0941\u092A\u091A\u093E\u092A \u0926\u094B, \u0914\u0930 \u0909\u0928\u094D\u0939\u0947\u0902 \u0916\u093E\u0924\u0947 \u092E\u0924 \u0926\u0947\u0916\u094B\u0964"),a("Share your own, not someone else's.","\u0905\u092A\u0928\u093E \u092C\u093E\u0901\u091F\u094B, \u0915\u093F\u0938\u0940 \u0914\u0930 \u0915\u093E \u0928\u0939\u0940\u0902\u0964"),a("Ask first, and accept a no.","\u092A\u0939\u0932\u0947 \u092A\u0942\u091B\u094B, \u0914\u0930 \u0928\u093E \u0938\u094D\u0935\u0940\u0915\u093E\u0930\u094B\u0964")]}},awkward:{end:!0,text:a("You put the paratha back. Meera says nothing. Later you hear her tell the teacher she forgot her tiffin. The words \u201Cshe said no\u201D stay with you.","\u0924\u0941\u092E \u092A\u0930\u093E\u0920\u093E \u0935\u093E\u092A\u0938 \u0930\u0916 \u0932\u0947\u0924\u0947 \u0939\u094B\u0964 \u092E\u0940\u0930\u093E \u0915\u0941\u091B \u0928\u0939\u0940\u0902 \u0915\u0939\u0924\u0940\u0964 \u092C\u093E\u0926 \u092E\u0947\u0902 \u0938\u0941\u0928\u0924\u0947 \u0939\u094B \u0915\u093F \u0909\u0938\u0928\u0947 \u0936\u093F\u0915\u094D\u0937\u093F\u0915\u093E \u0938\u0947 \u0915\u0939\u093E \u0915\u093F \u091F\u093F\u092B\u093C\u093F\u0928 \u092D\u0942\u0932 \u0917\u0908 \u0925\u0940\u0964 \u201C\u0909\u0938\u0928\u0947 \u092E\u0928\u093E \u0915\u093F\u092F\u093E\u201D \u0936\u092C\u094D\u0926 \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0947 \u0938\u093E\u0925 \u0930\u0939\u0924\u0947 \u0939\u0948\u0902\u0964"),lesson:a("\u201CNo\u201D is sometimes politeness, not truth. Kindness listens to the whole person, not only the words.","\u201C\u0928\u093E\u201D \u0915\u092D\u0940-\u0915\u092D\u0940 \u0936\u093F\u0937\u094D\u091F\u093E\u091A\u093E\u0930 \u0939\u094B\u0924\u093E \u0939\u0948, \u0938\u091A \u0928\u0939\u0940\u0902\u0964 \u0926\u092F\u093E \u092A\u0942\u0930\u0947 \u0907\u0902\u0938\u093E\u0928 \u0915\u094B \u0938\u0941\u0928\u0924\u0940 \u0939\u0948, \u0915\u0947\u0935\u0932 \u0936\u092C\u094D\u0926\u094B\u0902 \u0915\u094B \u0928\u0939\u0940\u0902\u0964"),reflection:{q:a("When is a \u201Cno\u201D worth gently checking?","\u0915\u092C \u201C\u0928\u093E\u201D \u0915\u094B \u092A\u094D\u092F\u093E\u0930 \u0938\u0947 \u091C\u093E\u0901\u091A\u0928\u093E \u091A\u093E\u0939\u093F\u090F?"),options:[a("When you can offer without pressure.","\u091C\u092C \u092C\u093F\u0928\u093E \u0926\u092C\u093E\u0935 \u0915\u0947 \u0926\u0947 \u0938\u0915\u094B\u0964"),a("When the person seems to need it.","\u091C\u092C \u0935\u094D\u092F\u0915\u094D\u0924\u093F \u0915\u094B \u091C\u093C\u0930\u0942\u0930\u0924 \u0932\u0917\u0947\u0964"),a("It is hard to know. Asking kindly helps.","\u092A\u0924\u093E \u0932\u0917\u093E\u0928\u093E \u0915\u0920\u093F\u0928 \u0939\u0948\u0964 \u092A\u094D\u092F\u093E\u0930 \u0938\u0947 \u092A\u0942\u091B\u0928\u093E \u092E\u0926\u0926 \u0915\u0930\u0924\u093E \u0939\u0948\u0964")]}},small:{end:!0,text:a("Meera drinks the water. You sit together without talking. It is not a feast, but the break is no longer lonely.","\u092E\u0940\u0930\u093E \u092A\u093E\u0928\u0940 \u092A\u0940\u0924\u0940 \u0939\u0948\u0964 \u0924\u0941\u092E \u092C\u093F\u0928\u093E \u092C\u094B\u0932\u0947 \u0938\u093E\u0925 \u092C\u0948\u0920\u0924\u0947 \u0939\u094B\u0964 \u092F\u0939 \u0926\u093E\u0935\u0924 \u0928\u0939\u0940\u0902 \u0939\u0948, \u092A\u0930 \u092C\u094D\u0930\u0947\u0915 \u0905\u092C \u0905\u0915\u0947\u0932\u093E \u0928\u0939\u0940\u0902 \u0939\u0948\u0964"),lesson:a("A small repair still counts. You cannot undo the empty tiffin, but you can stop someone from sitting alone.","\u091B\u094B\u091F\u0940 \u092D\u0930\u092A\u093E\u0908 \u092D\u0940 \u0917\u093F\u0928\u0924\u0940 \u0939\u0948\u0964 \u0916\u093E\u0932\u0940 \u091F\u093F\u092B\u093C\u093F\u0928 \u0935\u093E\u092A\u0938 \u0928\u0939\u0940\u0902 \u0906\u0924\u093E, \u092A\u0930 \u0915\u093F\u0938\u0940 \u0915\u094B \u0905\u0915\u0947\u0932\u093E \u092C\u0948\u0920\u0928\u0947 \u0938\u0947 \u0930\u094B\u0915\u093E \u091C\u093E \u0938\u0915\u0924\u093E \u0939\u0948\u0964"),reflection:{q:a("What can you offer when you have already eaten?","\u091C\u092C \u0924\u0941\u092E \u0916\u093E \u091A\u0941\u0915\u0947 \u0939\u094B, \u0924\u092C \u0915\u094D\u092F\u093E \u0926\u0947 \u0938\u0915\u0924\u0947 \u0939\u094B?"),options:[a("Company.","\u0938\u093E\u0925\u0964"),a("Water, or a place to sit.","\u092A\u093E\u0928\u0940, \u092F\u093E \u092C\u0948\u0920\u0928\u0947 \u0915\u0940 \u091C\u0917\u0939\u0964"),a("A promise to bring extra tomorrow.","\u0915\u0932 \u091C\u093C\u094D\u092F\u093E\u0926\u093E \u0932\u093E\u0928\u0947 \u0915\u093E \u0935\u093E\u0926\u093E\u0964")]}},regret:{end:!0,text:a("The bell rings. Meera puts her empty tiffin box back in her bag. You had two parathas and a choice, and the choice is still sitting there.","\u0918\u0902\u091F\u0940 \u092C\u091C\u0924\u0940 \u0939\u0948\u0964 \u092E\u0940\u0930\u093E \u0905\u092A\u0928\u093E \u0916\u093E\u0932\u0940 \u091F\u093F\u092B\u093C\u093F\u0928 \u092C\u0938\u094D\u0924\u0947 \u092E\u0947\u0902 \u0930\u0916\u0924\u0940 \u0939\u0948\u0964 \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0947 \u092A\u093E\u0938 \u0926\u094B \u092A\u0930\u093E\u0920\u0947 \u0914\u0930 \u090F\u0915 \u091A\u0941\u0928\u093E\u0935 \u0925\u093E, \u0914\u0930 \u091A\u0941\u0928\u093E\u0935 \u0935\u0939\u0940\u0902 \u092A\u0921\u093C\u093E \u0939\u0948\u0964"),lesson:a("Noticing comes before kindness. The uncomfortable feeling is useful \u2014 it shows you what you want to do next time.","\u0926\u0947\u0916\u0928\u093E \u0926\u092F\u093E \u0938\u0947 \u092A\u0939\u0932\u0947 \u0906\u0924\u093E \u0939\u0948\u0964 \u0905\u0938\u0939\u091C \u092D\u093E\u0935\u0928\u093E \u0915\u093E\u092E \u0915\u0940 \u0939\u0948 \u2014 \u0935\u0939 \u092C\u0924\u093E\u0924\u0940 \u0939\u0948 \u0915\u093F \u0905\u0917\u0932\u0940 \u092C\u093E\u0930 \u0915\u094D\u092F\u093E \u0915\u0930\u0928\u093E \u0939\u0948\u0964"),reflection:{q:a("What will you do at the next lunch break?","\u0905\u0917\u0932\u0947 \u0932\u0902\u091A \u092C\u094D\u0930\u0947\u0915 \u092E\u0947\u0902 \u0915\u094D\u092F\u093E \u0915\u0930\u094B\u0917\u0947?"),options:[a("Bring an extra paratha without being asked.","\u092C\u093F\u0928\u093E \u0915\u0939\u0947 \u090F\u0915 \u0905\u0924\u093F\u0930\u093F\u0915\u094D\u0924 \u092A\u0930\u093E\u0920\u093E \u0932\u093E\u0913\u0964"),a("Sit with the person who is alone.","\u0905\u0915\u0947\u0932\u0947 \u092C\u0948\u0920\u0947 \u0935\u094D\u092F\u0915\u094D\u0924\u093F \u0915\u0947 \u092A\u093E\u0938 \u092C\u0948\u0920\u094B\u0964"),a("Ask a friend to share the job.","\u0915\u093F\u0938\u0940 \u0926\u094B\u0938\u094D\u0924 \u0938\u0947 \u092E\u0926\u0926 \u092E\u093E\u0901\u0917\u094B\u0964")]}},feast:{end:!0,text:a("Four tiffins become five plates. Some get a little less, but everyone eats. Meera laughs at a joke for the first time.","\u091A\u093E\u0930 \u091F\u093F\u092B\u093C\u093F\u0928 \u092A\u093E\u0901\u091A \u0925\u093E\u0932\u093F\u092F\u093E\u0901 \u092C\u0928 \u091C\u093E\u0924\u0947 \u0939\u0948\u0902\u0964 \u0915\u093F\u0938\u0940 \u0915\u094B \u0925\u094B\u0921\u093C\u093E \u0915\u092E \u092E\u093F\u0932\u0924\u093E \u0939\u0948, \u092A\u0930 \u0938\u092C \u0916\u093E\u0924\u0947 \u0939\u0948\u0902\u0964 \u092E\u0940\u0930\u093E \u092A\u0939\u0932\u0940 \u092C\u093E\u0930 \u0915\u093F\u0938\u0940 \u092E\u091C\u093C\u093E\u0915 \u092A\u0930 \u0939\u0901\u0938\u0924\u0940 \u0939\u0948\u0964"),lesson:a("Fair sharing is not always equal sharing. It is everyone getting enough, and enough people helping.","\u0928\u093F\u0937\u094D\u092A\u0915\u094D\u0937 \u092C\u093E\u0901\u091F\u0928\u093E \u0939\u092E\u0947\u0936\u093E \u092C\u0930\u093E\u092C\u0930 \u092C\u093E\u0901\u091F\u0928\u093E \u0928\u0939\u0940\u0902 \u0939\u0948\u0964 \u0935\u0939 \u0939\u0948 \u0938\u092C\u0915\u094B \u092A\u0930\u094D\u092F\u093E\u092A\u094D\u0924 \u092E\u093F\u0932\u0928\u093E, \u0914\u0930 \u092A\u0930\u094D\u092F\u093E\u092A\u094D\u0924 \u0932\u094B\u0917\u094B\u0902 \u0915\u093E \u092E\u0926\u0926 \u0915\u0930\u0928\u093E\u0964"),reflection:{q:a("What makes a share fair?","\u092C\u093E\u0901\u091F\u0928\u093E \u0928\u093F\u0937\u094D\u092A\u0915\u094D\u0937 \u0915\u092C \u0939\u094B\u0924\u093E \u0939\u0948?"),options:[a("Everyone gets some.","\u0938\u092C\u0915\u094B \u0915\u0941\u091B \u092E\u093F\u0932\u0947\u0964"),a("The person who needs more gets more.","\u091C\u093F\u0938\u0947 \u091C\u093C\u094D\u092F\u093E\u0926\u093E \u091A\u093E\u0939\u093F\u090F \u0909\u0938\u0947 \u091C\u093C\u094D\u092F\u093E\u0926\u093E \u092E\u093F\u0932\u0947\u0964"),a("Everyone helps make it happen.","\u0938\u092C \u092E\u093F\u0932\u0915\u0930 \u092C\u093E\u0901\u091F\u0947\u0902\u0964")]}},generous:{end:!0,text:a("You give your whole share away. By evening you are very hungry. Meera notices and saves you half a roti from her own bag.","\u0924\u0941\u092E \u0905\u092A\u0928\u093E \u092A\u0942\u0930\u093E \u0939\u093F\u0938\u094D\u0938\u093E \u0926\u0947 \u0926\u0947\u0924\u0947 \u0939\u094B\u0964 \u0936\u093E\u092E \u0924\u0915 \u092C\u0939\u0941\u0924 \u092D\u0942\u0916 \u0932\u0917\u0924\u0940 \u0939\u0948\u0964 \u092E\u0940\u0930\u093E \u0926\u0947\u0916\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0905\u092A\u0928\u0947 \u092C\u0938\u094D\u0924\u0947 \u0938\u0947 \u0906\u0927\u0940 \u0930\u094B\u091F\u0940 \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0947 \u0932\u093F\u090F \u092C\u091A\u093E \u0932\u0947\u0924\u0940 \u0939\u0948\u0964"),lesson:a("Giving everything is generous, but a kindness that leaves you empty cannot last. Sharing usually means half, not all.","\u0938\u092C \u0915\u0941\u091B \u0926\u0947\u0928\u093E \u0909\u0926\u093E\u0930 \u0939\u0948, \u092A\u0930 \u0916\u0941\u0926 \u0915\u094B \u0916\u093E\u0932\u0940 \u0915\u0930 \u0926\u0947\u0928\u0947 \u0935\u093E\u0932\u0940 \u0926\u092F\u093E \u091F\u093F\u0915\u0924\u0940 \u0928\u0939\u0940\u0902\u0964 \u092C\u093E\u0901\u091F\u0928\u0947 \u0915\u093E \u0905\u0930\u094D\u0925 \u0906\u092E\u0924\u094C\u0930 \u092A\u0930 \u0906\u0927\u093E \u0939\u094B\u0924\u093E \u0939\u0948, \u0938\u092C \u0928\u0939\u0940\u0902\u0964"),reflection:{q:a("How much is enough to give?","\u0915\u093F\u0924\u0928\u093E \u0926\u0947\u0928\u093E \u092A\u0930\u094D\u092F\u093E\u092A\u094D\u0924 \u0939\u0948?"),options:[a("Half, so both of you can keep going.","\u0906\u0927\u093E, \u0924\u093E\u0915\u093F \u0926\u094B\u0928\u094B\u0902 \u091A\u0932 \u0938\u0915\u0947\u0902\u0964"),a("As much as the other person truly needs.","\u091C\u093F\u0924\u0928\u093E \u0926\u0942\u0938\u0930\u0947 \u0915\u094B \u0938\u091A\u092E\u0941\u091A \u091A\u093E\u0939\u093F\u090F\u0964"),a("It depends on the day.","\u0926\u093F\u0928 \u092A\u0930 \u0928\u093F\u0930\u094D\u092D\u0930 \u0939\u0948\u0964")]}}}},{id:"story.cricket",icon:"\u{1F3CF}",grade:5,strand:"s",title:a("The second-chance bat","\u0926\u0942\u0938\u0930\u093E \u092E\u094C\u0915\u093E"),blurb:a("You are given out. Your friend says the umpire is wrong and asks you to bat again.","\u0924\u0941\u092E\u094D\u0939\u0947\u0902 \u0906\u0909\u091F \u0926\u093F\u092F\u093E \u091C\u093E\u0924\u093E \u0939\u0948\u0964 \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u093E \u0926\u094B\u0938\u094D\u0924 \u0915\u0939\u0924\u093E \u0939\u0948 \u0905\u0902\u092A\u093E\u092F\u0930 \u0917\u0932\u0924 \u0939\u0948 \u0914\u0930 \u0926\u094B\u092C\u093E\u0930\u093E \u092C\u0932\u094D\u0932\u0947\u092C\u093E\u091C\u093C\u0940 \u0915\u094B \u0915\u0939\u0924\u093E \u0939\u0948\u0964"),place:a("The gully match, last over","\u0917\u0932\u0940 \u0915\u093E \u092E\u0948\u091A, \u0906\u0916\u093C\u093F\u0930\u0940 \u0913\u0935\u0930"),start:"start",nodes:{start:{text:a("The ball hits your pad. The umpire raises a finger: out LBW. Your team needs 12 runs. Your friend pulls your arm. \u201CThat was not out. Bat again.\u201D","\u0917\u0947\u0902\u0926 \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0947 \u092A\u0948\u0921 \u092A\u0930 \u0932\u0917\u0924\u0940 \u0939\u0948\u0964 \u0905\u0902\u092A\u093E\u092F\u0930 \u0909\u0901\u0917\u0932\u0940 \u0909\u0920\u093E\u0924\u093E \u0939\u0948: LBW \u0906\u0909\u091F\u0964 \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0940 \u091F\u0940\u092E \u0915\u094B 12 \u0930\u0928 \u091A\u093E\u0939\u093F\u090F\u0964 \u0926\u094B\u0938\u094D\u0924 \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u093E \u0939\u093E\u0925 \u0916\u0940\u0902\u091A\u0924\u093E \u0939\u0948\u0964 \u201C\u0935\u0939 \u0906\u0909\u091F \u0928\u0939\u0940\u0902 \u0925\u093E\u0964 \u0926\u094B\u092C\u093E\u0930\u093E \u092C\u0932\u094D\u0932\u0947\u092C\u093E\u091C\u093C\u0940 \u0915\u0930\u094B\u0964\u201D"),choices:[{label:a("Walk off. The umpire's decision stands.","\u091A\u0932\u0947 \u091C\u093E\u0913\u0964 \u0905\u0902\u092A\u093E\u092F\u0930 \u0915\u093E \u092B\u093C\u0948\u0938\u0932\u093E \u092E\u093E\u0928\u094D\u092F \u0939\u0948\u0964"),next:"walk"},{label:a("Bat again. Your team needs you.","\u0926\u094B\u092C\u093E\u0930\u093E \u092C\u0932\u094D\u0932\u0947\u092C\u093E\u091C\u093C\u0940 \u0915\u0930\u094B\u0964 \u091F\u0940\u092E \u0915\u094B \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0940 \u091C\u093C\u0930\u0942\u0930\u0924 \u0939\u0948\u0964"),next:"bat"},{label:a("Ask the umpire to decide again, calmly.","\u0905\u0902\u092A\u093E\u092F\u0930 \u0938\u0947 \u0936\u093E\u0902\u0924\u093F \u0938\u0947 \u0926\u094B\u092C\u093E\u0930\u093E \u092B\u093C\u0948\u0938\u0932\u093E \u092A\u0942\u091B\u094B\u0964"),next:"ask"}]},walk:{text:a("Your team loses by four runs. On the way home the umpire walks beside you and says quietly, \u201CYou were out. I am glad you walked.\u201D","\u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0940 \u091F\u0940\u092E \u091A\u093E\u0930 \u0930\u0928 \u0938\u0947 \u0939\u093E\u0930 \u091C\u093E\u0924\u0940 \u0939\u0948\u0964 \u0918\u0930 \u0932\u094C\u091F\u0924\u0947 \u0938\u092E\u092F \u0905\u0902\u092A\u093E\u092F\u0930 \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0947 \u092A\u093E\u0938 \u091A\u0932\u0924\u093E \u0939\u0948 \u0914\u0930 \u0927\u0940\u0930\u0947 \u0915\u0939\u0924\u093E \u0939\u0948, \u201C\u0924\u0941\u092E \u0906\u0909\u091F \u0925\u0947\u0964 \u0905\u091A\u094D\u091B\u093E \u0915\u093F\u092F\u093E \u091C\u094B \u091A\u0932\u0947 \u0917\u090F\u0964\u201D"),choices:[{label:a("Thank him for saying it.","\u092F\u0939 \u0915\u0939\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0909\u0938\u0947 \u0927\u0928\u094D\u092F\u0935\u093E\u0926 \u0926\u094B\u0964"),next:"respect"},{label:a("Say nothing, but keep walking with him.","\u0915\u0941\u091B \u092E\u0924 \u0915\u0939\u094B, \u092A\u0930 \u0938\u093E\u0925 \u091A\u0932\u0924\u0947 \u0930\u0939\u094B\u0964"),next:"quiet"}]},bat:{text:a("You bat again and hit 20 runs. Your team wins. The other team says nothing, but their faces are tight. The win feels loud and hollow at the same time.","\u0924\u0941\u092E \u0926\u094B\u092C\u093E\u0930\u093E \u092C\u0932\u094D\u0932\u0947\u092C\u093E\u091C\u093C\u0940 \u0915\u0930\u0924\u0947 \u0939\u094B \u0914\u0930 20 \u0930\u0928 \u092C\u0928\u093E\u0924\u0947 \u0939\u094B\u0964 \u091F\u0940\u092E \u091C\u0940\u0924 \u091C\u093E\u0924\u0940 \u0939\u0948\u0964 \u0926\u0942\u0938\u0930\u0940 \u091F\u0940\u092E \u0915\u0941\u091B \u0928\u0939\u0940\u0902 \u0915\u0939\u0924\u0940, \u092A\u0930 \u0909\u0928\u0915\u0947 \u091A\u0947\u0939\u0930\u0947 \u0924\u0928\u0947 \u0939\u0948\u0902\u0964 \u091C\u0940\u0924 \u091C\u093C\u094B\u0930\u0926\u093E\u0930 \u0914\u0930 \u0916\u094B\u0916\u0932\u0940, \u0926\u094B\u0928\u094B\u0902 \u0932\u0917\u0924\u0940 \u0939\u0948\u0964"),choices:[{label:a("Tell the truth after the match.","\u092E\u0948\u091A \u0915\u0947 \u092C\u093E\u0926 \u0938\u091A \u092C\u0924\u093E\u0913\u0964"),next:"repair"},{label:a("Celebrate. A win is a win.","\u091C\u0936\u094D\u0928 \u092E\u0928\u093E\u0913\u0964 \u091C\u0940\u0924 \u091C\u0940\u0924 \u0939\u0948\u0964"),next:"hollow"}]},ask:{text:a("You lower your bat and ask the umpire, \u201CSir, could you check again? I want to accept whatever you decide.\u201D The gully goes quiet.","\u0924\u0941\u092E \u092C\u0932\u094D\u0932\u093E \u0928\u0940\u091A\u0947 \u0915\u0930\u0915\u0947 \u0905\u0902\u092A\u093E\u092F\u0930 \u0938\u0947 \u092A\u0942\u091B\u0924\u0947 \u0939\u094B, \u201C\u0938\u0930, \u091C\u093C\u0930\u093E \u0926\u094B\u092C\u093E\u0930\u093E \u0926\u0947\u0916\u0947\u0902\u0917\u0947? \u091C\u094B \u092B\u093C\u0948\u0938\u0932\u093E \u0915\u0930\u0947\u0902, \u092E\u0948\u0902 \u092E\u093E\u0928\u0942\u0901\u0917\u093E\u0964\u201D \u0917\u0932\u0940 \u0936\u093E\u0902\u0924 \u0939\u094B \u091C\u093E\u0924\u0940 \u0939\u0948\u0964"),choices:[{label:a("Accept the replay decision, whatever it is.","\u0926\u094B\u092C\u093E\u0930\u093E \u092B\u093C\u0948\u0938\u0932\u0947 \u0915\u094B \u092E\u093E\u0928\u094B, \u091C\u094B \u092D\u0940 \u0939\u094B\u0964"),next:"fair"},{label:a("Argue that it was clearly not out.","\u092C\u0939\u0938 \u0915\u0930\u094B \u0915\u093F \u092F\u0939 \u0938\u093E\u092B\u093C \u0906\u0909\u091F \u0928\u0939\u0940\u0902 \u0925\u093E\u0964"),next:"noisy"}]},respect:{end:!0,text:a("The umpire smiles. The next week he asks you to umpire the younger kids' match. You raise your finger once, and you sleep well.","\u0905\u0902\u092A\u093E\u092F\u0930 \u092E\u0941\u0938\u094D\u0915\u0941\u0930\u093E\u0924\u093E \u0939\u0948\u0964 \u0905\u0917\u0932\u0947 \u0939\u092B\u093C\u094D\u0924\u0947 \u0935\u0939 \u0924\u0941\u092E\u094D\u0939\u0947\u0902 \u091B\u094B\u091F\u0947 \u092C\u091A\u094D\u091A\u094B\u0902 \u0915\u0947 \u092E\u0948\u091A \u092E\u0947\u0902 \u0905\u0902\u092A\u093E\u092F\u0930 \u092C\u0928\u0928\u0947 \u0915\u094B \u0915\u0939\u0924\u093E \u0939\u0948\u0964 \u090F\u0915 \u092C\u093E\u0930 \u0909\u0901\u0917\u0932\u0940 \u0909\u0920\u093E\u0924\u0947 \u0939\u094B, \u0914\u0930 \u091A\u0948\u0928 \u0938\u0947 \u0938\u094B\u0924\u0947 \u0939\u094B\u0964"),lesson:a("Respect for the game is shown when the decision goes against you. That is when it is worth something.","\u0916\u0947\u0932 \u0915\u093E \u0938\u092E\u094D\u092E\u093E\u0928 \u0924\u092C \u0926\u093F\u0916\u0924\u093E \u0939\u0948 \u091C\u092C \u092B\u093C\u0948\u0938\u0932\u093E \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0947 \u0916\u093C\u093F\u0932\u093E\u092B\u093C \u091C\u093E\u090F\u0964 \u0924\u092D\u0940 \u0909\u0938\u0915\u0940 \u0915\u0940\u092E\u0924 \u0939\u094B\u0924\u0940 \u0939\u0948\u0964"),reflection:{q:a("What makes a game worth playing?","\u0916\u0947\u0932 \u0916\u0947\u0932\u0928\u0947 \u0932\u093E\u092F\u0915 \u0915\u094D\u092F\u093E \u092C\u0928\u093E\u0924\u093E \u0939\u0948?"),options:[a("Rules that apply to everyone, including me.","\u0928\u093F\u092F\u092E \u0938\u092C \u092A\u0930 \u0932\u093E\u0917\u0942 \u0939\u094B\u0902, \u092E\u0941\u091D \u092A\u0930 \u092D\u0940\u0964"),a("Playing with people I like.","\u0905\u092A\u0928\u0947 \u092A\u0938\u0902\u0926 \u0915\u0947 \u0932\u094B\u0917\u094B\u0902 \u0915\u0947 \u0938\u093E\u0925 \u0916\u0947\u0932\u0928\u093E\u0964"),a("A chance to be fair, even when I lose.","\u0939\u093E\u0930\u0928\u0947 \u092A\u0930 \u092D\u0940 \u0928\u093F\u0937\u094D\u092A\u0915\u094D\u0937 \u0930\u0939\u0928\u0947 \u0915\u093E \u092E\u094C\u0915\u093E\u0964")]}},quiet:{end:!0,text:a("You walk in silence. At the corner he says, \u201CNext time you can umpire.\u201D You nod. The loss is still a loss, but something else is steady.","\u0924\u0941\u092E \u091A\u0941\u092A\u091A\u093E\u092A \u091A\u0932\u0924\u0947 \u0939\u094B\u0964 \u092E\u094B\u0921\u093C \u092A\u0930 \u0935\u0939 \u0915\u0939\u0924\u093E \u0939\u0948, \u201C\u0905\u0917\u0932\u0940 \u092C\u093E\u0930 \u0924\u0941\u092E \u0905\u0902\u092A\u093E\u092F\u0930 \u092C\u0928 \u0938\u0915\u0924\u0947 \u0939\u094B\u0964\u201D \u0924\u0941\u092E \u0938\u093F\u0930 \u0939\u093F\u0932\u093E\u0924\u0947 \u0939\u094B\u0964 \u0939\u093E\u0930 \u0939\u093E\u0930 \u0939\u0948, \u092A\u0930 \u0915\u0941\u091B \u0914\u0930 \u0938\u094D\u0925\u093F\u0930 \u0939\u0948\u0964"),lesson:a("Integrity does not always need a speech. Sometimes it is just the quiet walk home after losing fairly.","\u0908\u092E\u093E\u0928\u0926\u093E\u0930\u0940 \u0915\u094B \u0939\u092E\u0947\u0936\u093E \u092D\u093E\u0937\u0923 \u0928\u0939\u0940\u0902 \u091A\u093E\u0939\u093F\u090F\u0964 \u0915\u092D\u0940-\u0915\u092D\u0940 \u0935\u0939 \u0928\u093F\u0937\u094D\u092A\u0915\u094D\u0937 \u0939\u093E\u0930 \u0915\u0947 \u092C\u093E\u0926 \u091A\u0941\u092A\u091A\u093E\u092A \u0918\u0930 \u0932\u094C\u091F\u0928\u093E \u0939\u0948\u0964"),reflection:{q:a("What can you keep when you lose?","\u0939\u093E\u0930\u0928\u0947 \u092A\u0930 \u0915\u094D\u092F\u093E \u092C\u091A\u093E \u0930\u0939 \u0938\u0915\u0924\u093E \u0939\u0948?"),options:[a("My honesty.","\u092E\u0947\u0930\u0940 \u0908\u092E\u093E\u0928\u0926\u093E\u0930\u0940\u0964"),a("My team's respect.","\u091F\u0940\u092E \u0915\u093E \u0938\u092E\u094D\u092E\u093E\u0928\u0964"),a("A lesson for next time.","\u0905\u0917\u0932\u0940 \u092C\u093E\u0930 \u0915\u0947 \u0932\u093F\u090F \u0938\u092C\u0915\u0964")]}},repair:{end:!0,text:a("You tell the other team the truth. They are angry, then quiet. The match is replayed next Sunday, and this time you lose by two runs \u2014 and shake hands.","\u0924\u0941\u092E \u0926\u0942\u0938\u0930\u0940 \u091F\u0940\u092E \u0915\u094B \u0938\u091A \u092C\u0924\u093E\u0924\u0947 \u0939\u094B\u0964 \u0935\u0947 \u092A\u0939\u0932\u0947 \u0928\u093E\u0930\u093E\u091C\u093C \u0939\u094B\u0924\u0947 \u0939\u0948\u0902, \u092B\u093F\u0930 \u0936\u093E\u0902\u0924\u0964 \u0905\u0917\u0932\u0947 \u0930\u0935\u093F\u0935\u093E\u0930 \u092E\u0948\u091A \u0926\u094B\u092C\u093E\u0930\u093E \u0939\u094B\u0924\u093E \u0939\u0948, \u0914\u0930 \u0907\u0938 \u092C\u093E\u0930 \u0924\u0941\u092E \u0926\u094B \u0930\u0928 \u0938\u0947 \u0939\u093E\u0930\u0924\u0947 \u0939\u094B \u2014 \u0914\u0930 \u0939\u093E\u0925 \u092E\u093F\u0932\u093E\u0924\u0947 \u0939\u094B\u0964"),lesson:a("A win you cannot defend to yourself is not a win. Repairing is harder than celebrating, and worth more.","\u091C\u094B \u091C\u0940\u0924 \u0916\u0941\u0926 \u0915\u094B \u0928\u0939\u0940\u0902 \u092C\u0924\u093E \u0938\u0915\u094B, \u0935\u0939 \u091C\u0940\u0924 \u0928\u0939\u0940\u0902\u0964 \u0938\u0941\u0927\u093E\u0930 \u0915\u0930\u0928\u093E \u091C\u0936\u094D\u0928 \u0938\u0947 \u0915\u0920\u093F\u0928 \u0939\u0948, \u0914\u0930 \u0909\u0938\u0938\u0947 \u091C\u093C\u094D\u092F\u093E\u0926\u093E \u0915\u0940\u092E\u0924\u0940\u0964"),reflection:{q:a("How do you repair a win that felt wrong?","\u0917\u0932\u0924 \u0932\u0917\u0940 \u091C\u0940\u0924 \u0915\u094B \u0915\u0948\u0938\u0947 \u0938\u0941\u0927\u093E\u0930\u0947\u0902?"),options:[a("Say the truth, even if it costs the trophy.","\u0938\u091A \u0915\u0939\u094B, \u091A\u093E\u0939\u0947 \u091F\u094D\u0930\u0949\u092B\u093C\u0940 \u091A\u0932\u0940 \u091C\u093E\u090F\u0964"),a("Ask the other team what would make it fair.","\u0926\u0942\u0938\u0930\u0940 \u091F\u0940\u092E \u0938\u0947 \u092A\u0942\u091B\u094B \u0915\u093F \u0915\u094D\u092F\u093E \u0928\u093F\u0937\u094D\u092A\u0915\u094D\u0937 \u0939\u094B\u0917\u093E\u0964"),a("Change the rule so it cannot happen again.","\u0928\u093F\u092F\u092E \u092C\u0926\u0932\u094B \u0924\u093E\u0915\u093F \u0910\u0938\u093E \u092B\u093F\u0930 \u0928 \u0939\u094B\u0964")]}},hollow:{end:!0,text:a("You celebrate. Someone from the other team says, \u201CAsk him how many bats he got.\u201D The joke follows you to the next match.","\u0924\u0941\u092E \u091C\u0936\u094D\u0928 \u092E\u0928\u093E\u0924\u0947 \u0939\u094B\u0964 \u0926\u0942\u0938\u0930\u0940 \u091F\u0940\u092E \u0938\u0947 \u0915\u094B\u0908 \u0915\u0939\u0924\u093E \u0939\u0948, \u201C\u092A\u0942\u091B\u094B \u0907\u0938\u0947, \u0915\u093F\u0924\u0928\u0940 \u092C\u093E\u0930 \u092C\u0932\u094D\u0932\u093E \u092E\u093F\u0932\u093E\u0964\u201D \u0935\u0939 \u092E\u091C\u093C\u093E\u0915 \u0905\u0917\u0932\u0947 \u092E\u0948\u091A \u0924\u0915 \u0938\u093E\u0925 \u091A\u0932\u0924\u093E \u0939\u0948\u0964"),lesson:a("A win that needs a lie to stand up will keep needing one. The scoreboard forgets; the players do not.","\u091C\u094B \u091C\u0940\u0924 \u091D\u0942\u0920 \u0915\u0947 \u0938\u0939\u093E\u0930\u0947 \u0916\u0921\u093C\u0940 \u0939\u094B, \u0909\u0938\u0947 \u092C\u093E\u0930-\u092C\u093E\u0930 \u091D\u0942\u0920 \u091A\u093E\u0939\u093F\u090F\u0964 \u0938\u094D\u0915\u094B\u0930\u092C\u094B\u0930\u094D\u0921 \u092D\u0942\u0932 \u091C\u093E\u0924\u093E \u0939\u0948; \u0916\u093F\u0932\u093E\u0921\u093C\u0940 \u0928\u0939\u0940\u0902\u0964"),reflection:{q:a("What would make the next win feel clean?","\u0905\u0917\u0932\u0940 \u091C\u0940\u0924 \u0915\u094B \u0938\u093E\u092B\u093C \u0915\u094D\u092F\u093E \u092C\u0928\u093E\u090F\u0917\u093E?"),options:[a("Playing by the same rules as everyone.","\u0938\u092C\u0915\u0947 \u091C\u0948\u0938\u0947 \u0928\u093F\u092F\u092E\u094B\u0902 \u0938\u0947 \u0916\u0947\u0932\u0928\u093E\u0964"),a("Admitting this one was not fair.","\u092E\u093E\u0928\u0928\u093E \u0915\u093F \u092F\u0939 \u091C\u0940\u0924 \u0928\u093F\u0937\u094D\u092A\u0915\u094D\u0937 \u0928\u0939\u0940\u0902 \u0925\u0940\u0964"),a("Asking my team what they think.","\u0905\u092A\u0928\u0940 \u091F\u0940\u092E \u0938\u0947 \u092A\u0942\u091B\u0928\u093E \u0915\u093F \u0935\u0947 \u0915\u094D\u092F\u093E \u0938\u094B\u091A\u0924\u0947 \u0939\u0948\u0902\u0964")]}},fair:{end:!0,text:a("The umpire thinks for a long moment. \u201CNot out,\u201D he says at last. You bat, and you are bowled for 3. Nobody can say the match was not fair.","\u0905\u0902\u092A\u093E\u092F\u0930 \u0926\u0947\u0930 \u0924\u0915 \u0938\u094B\u091A\u0924\u093E \u0939\u0948\u0964 \u201C\u0906\u0909\u091F \u0928\u0939\u0940\u0902,\u201D \u0935\u0939 \u0906\u0916\u093C\u093F\u0930 \u092E\u0947\u0902 \u0915\u0939\u0924\u093E \u0939\u0948\u0964 \u0924\u0941\u092E \u092C\u0932\u094D\u0932\u0947\u092C\u093E\u091C\u093C\u0940 \u0915\u0930\u0924\u0947 \u0939\u094B \u0914\u0930 3 \u0930\u0928 \u092A\u0930 \u092C\u094B\u0932\u094D\u0921 \u0939\u094B \u091C\u093E\u0924\u0947 \u0939\u094B\u0964 \u0915\u094B\u0908 \u0928\u0939\u0940\u0902 \u0915\u0939 \u0938\u0915\u0924\u093E \u0915\u093F \u092E\u0948\u091A \u0928\u093F\u0937\u094D\u092A\u0915\u094D\u0937 \u0928\u0939\u0940\u0902 \u0925\u093E\u0964"),lesson:a("Asking for a fair look is not the same as demanding a favour. Accepting the answer is the part that makes it fair.","\u0928\u093F\u0937\u094D\u092A\u0915\u094D\u0937 \u091C\u093E\u0901\u091A \u092E\u093E\u0901\u0917\u0928\u093E \u090F\u0939\u0938\u093E\u0928 \u092E\u093E\u0901\u0917\u0928\u093E \u0928\u0939\u0940\u0902 \u0939\u0948\u0964 \u0909\u0924\u094D\u0924\u0930 \u092E\u093E\u0928 \u0932\u0947\u0928\u093E \u0939\u0940 \u0909\u0938\u0947 \u0928\u093F\u0937\u094D\u092A\u0915\u094D\u0937 \u092C\u0928\u093E\u0924\u093E \u0939\u0948\u0964"),reflection:{q:a("What makes a second look fair?","\u0926\u094B\u092C\u093E\u0930\u093E \u0926\u0947\u0916\u0928\u093E \u0928\u093F\u0937\u094D\u092A\u0915\u094D\u0937 \u0915\u092C \u0939\u094B\u0924\u093E \u0939\u0948?"),options:[a("Both teams can ask for it.","\u0926\u094B\u0928\u094B\u0902 \u091F\u0940\u092E\u0947\u0902 \u092E\u093E\u0901\u0917 \u0938\u0915\u0947\u0902\u0964"),a("The decision is accepted afterwards.","\u092B\u093C\u0948\u0938\u0932\u093E \u092C\u093E\u0926 \u092E\u0947\u0902 \u092E\u093E\u0928\u093E \u091C\u093E\u090F\u0964"),a("The person asking is not the only one who benefits.","\u092E\u093E\u0901\u0917\u0928\u0947 \u0935\u093E\u0932\u0947 \u0915\u094B \u0939\u0940 \u092B\u093C\u093E\u092F\u0926\u093E \u0928 \u0939\u094B\u0964")]}},noisy:{end:!0,text:a("The argument grows. The umpire walks away. The match is abandoned, and the next one has no umpire at all. Everyone loses something.","\u092C\u0939\u0938 \u092C\u0922\u093C \u091C\u093E\u0924\u0940 \u0939\u0948\u0964 \u0905\u0902\u092A\u093E\u092F\u0930 \u091A\u0932\u093E \u091C\u093E\u0924\u093E \u0939\u0948\u0964 \u092E\u0948\u091A \u091B\u0942\u091F \u091C\u093E\u0924\u093E \u0939\u0948, \u0914\u0930 \u0905\u0917\u0932\u0947 \u092E\u0948\u091A \u092E\u0947\u0902 \u0915\u094B\u0908 \u0905\u0902\u092A\u093E\u092F\u0930 \u0939\u0940 \u0928\u0939\u0940\u0902\u0964 \u0938\u092C \u0915\u0941\u091B \u0915\u0941\u091B \u0916\u094B \u0926\u0947\u0924\u0947 \u0939\u0948\u0902\u0964"),lesson:a("Being right loudly can still break the game. A question opens a door; an argument closes the field.","\u091C\u093C\u094B\u0930 \u0938\u0947 \u0938\u0939\u0940 \u0939\u094B\u0928\u093E \u092D\u0940 \u0916\u0947\u0932 \u0924\u094B\u0921\u093C \u0938\u0915\u0924\u093E \u0939\u0948\u0964 \u0938\u0935\u093E\u0932 \u0926\u0930\u0935\u093E\u091C\u093C\u093E \u0916\u094B\u0932\u0924\u093E \u0939\u0948; \u092C\u0939\u0938 \u092E\u0948\u0926\u093E\u0928 \u092C\u0902\u0926 \u0915\u0930 \u0926\u0947\u0924\u0940 \u0939\u0948\u0964"),reflection:{q:a("How do you disagree without breaking the game?","\u0916\u0947\u0932 \u0924\u094B\u0921\u093C\u0947 \u092C\u093F\u0928\u093E \u0905\u0938\u0939\u092E\u0924\u093F \u0915\u0948\u0938\u0947 \u091C\u0924\u093E\u090F\u0901?"),options:[a("Ask once, calmly, and accept the answer.","\u090F\u0915 \u092C\u093E\u0930 \u0936\u093E\u0902\u0924\u093F \u0938\u0947 \u092A\u0942\u091B\u094B, \u0914\u0930 \u0909\u0924\u094D\u0924\u0930 \u092E\u093E\u0928\u094B\u0964"),a("Talk after the match, not during it.","\u092E\u0948\u091A \u0915\u0947 \u092C\u093E\u0926 \u092C\u093E\u0924 \u0915\u0930\u094B, \u092C\u0940\u091A \u092E\u0947\u0902 \u0928\u0939\u0940\u0902\u0964"),a("Let a neutral person decide.","\u0915\u093F\u0938\u0940 \u0928\u093F\u0937\u094D\u092A\u0915\u094D\u0937 \u0935\u094D\u092F\u0915\u094D\u0924\u093F \u0938\u0947 \u092B\u093C\u0948\u0938\u0932\u093E \u0915\u0930\u093E\u0913\u0964")]}}}},{id:"story.message",icon:"\u{1F4F1}",grade:5,strand:"c",title:a("The message that travelled","\u091C\u094B \u0938\u0902\u0926\u0947\u0936 \u091A\u0932 \u092A\u0921\u093C\u093E"),blurb:a("A mean photo of a classmate is in the group chat. Your friend asks you to forward it.","\u0915\u094D\u0932\u093E\u0938\u092E\u0947\u091F \u0915\u0940 \u090F\u0915 \u092C\u0941\u0930\u0940 \u092B\u093C\u094B\u091F\u094B \u0917\u094D\u0930\u0941\u092A \u091A\u0948\u091F \u092E\u0947\u0902 \u0939\u0948\u0964 \u0926\u094B\u0938\u094D\u0924 \u0924\u0941\u092E\u0938\u0947 \u0909\u0938\u0947 \u0906\u0917\u0947 \u092D\u0947\u091C\u0928\u0947 \u0915\u094B \u0915\u0939\u0924\u093E \u0939\u0948\u0964"),place:a("After school, on a borrowed phone","\u0938\u094D\u0915\u0942\u0932 \u0915\u0947 \u092C\u093E\u0926, \u0909\u0927\u093E\u0930 \u0915\u0947 \u092B\u093C\u094B\u0928 \u092A\u0930"),start:"start",nodes:{start:{text:a("The group chat has a photo of Riya from your class, with a caption that makes people laugh at her. Your friend Kabir forwards it to you: \u201CSend it to the other group too.\u201D","\u0917\u094D\u0930\u0941\u092A \u091A\u0948\u091F \u092E\u0947\u0902 \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0940 \u0915\u094D\u0932\u093E\u0938 \u0915\u0940 \u0930\u093F\u092F\u093E \u0915\u0940 \u092B\u093C\u094B\u091F\u094B \u0939\u0948, \u0914\u0930 \u0910\u0938\u093E \u0915\u0948\u092A\u094D\u0936\u0928 \u091C\u093F\u0938 \u092A\u0930 \u0932\u094B\u0917 \u0909\u0938\u0915\u093E \u092E\u091C\u093C\u093E\u0915 \u0909\u0921\u093C\u093E\u0924\u0947 \u0939\u0948\u0902\u0964 \u0926\u094B\u0938\u094D\u0924 \u0915\u092C\u0940\u0930 \u0909\u0938\u0947 \u0924\u0941\u092E\u094D\u0939\u0947\u0902 \u092D\u0947\u091C\u0924\u093E \u0939\u0948: \u201C\u0926\u0942\u0938\u0930\u0947 \u0917\u094D\u0930\u0941\u092A \u092E\u0947\u0902 \u092D\u0940 \u092D\u0947\u091C \u0926\u094B\u0964\u201D"),choices:[{label:a("Delete it and tell Kabir to stop.","\u0909\u0938\u0947 \u0921\u093F\u0932\u0940\u091F \u0915\u0930\u094B \u0914\u0930 \u0915\u092C\u0940\u0930 \u0938\u0947 \u0930\u0941\u0915\u0928\u0947 \u0915\u094B \u0915\u0939\u094B\u0964"),next:"delete"},{label:a("Forward it to one more friend. Just one.","\u090F\u0915 \u0914\u0930 \u0926\u094B\u0938\u094D\u0924 \u0915\u094B \u092D\u0947\u091C \u0926\u094B\u0964 \u092C\u0938 \u090F\u0915 \u0915\u094B\u0964"),next:"forward"},{label:a("Ask Riya how she feels about it.","\u0930\u093F\u092F\u093E \u0938\u0947 \u092A\u0942\u091B\u094B \u0915\u093F \u0909\u0938\u0947 \u0915\u0948\u0938\u093E \u0932\u0917 \u0930\u0939\u093E \u0939\u0948\u0964"),next:"ask"}]},delete:{text:a("Kabir laughs. \u201CIt is just a joke. Everyone is sending it.\u201D Your thumb hovers over the delete button.","\u0915\u092C\u0940\u0930 \u0939\u0901\u0938\u0924\u093E \u0939\u0948\u0964 \u201C\u092E\u091C\u093C\u093E\u0915 \u0939\u0948\u0964 \u0938\u092C \u092D\u0947\u091C \u0930\u0939\u0947 \u0939\u0948\u0902\u0964\u201D \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u093E \u0905\u0902\u0917\u0942\u0920\u093E \u0921\u093F\u0932\u0940\u091F \u092C\u091F\u0928 \u092A\u0930 \u0930\u0941\u0915\u0924\u093E \u0939\u0948\u0964"),choices:[{label:a("Say, \u201CNot everyone. Not me.\u201D and delete it.","\u0915\u0939\u094B, \u201C\u0938\u092C \u0928\u0939\u0940\u0902\u0964 \u092E\u0948\u0902 \u0928\u0939\u0940\u0902\u0964\u201D \u0914\u0930 \u0921\u093F\u0932\u0940\u091F \u0915\u0930 \u0926\u094B\u0964"),next:"firm"},{label:a("Leave the group quietly.","\u091A\u0941\u092A\u091A\u093E\u092A \u0917\u094D\u0930\u0941\u092A \u091B\u094B\u0921\u093C \u0926\u094B\u0964"),next:"leave"}]},forward:{text:a("You send it on. By evening it has reached Riya. She messages you one word: \u201CWhy?\u201D","\u0924\u0941\u092E \u0909\u0938\u0947 \u0906\u0917\u0947 \u092D\u0947\u091C \u0926\u0947\u0924\u0947 \u0939\u094B\u0964 \u0936\u093E\u092E \u0924\u0915 \u0935\u0939 \u0930\u093F\u092F\u093E \u0924\u0915 \u092A\u0939\u0941\u0901\u091A \u091C\u093E\u0924\u0940 \u0939\u0948\u0964 \u0935\u0939 \u0924\u0941\u092E\u094D\u0939\u0947\u0902 \u090F\u0915 \u0936\u092C\u094D\u0926 \u0932\u093F\u0916\u0924\u0940 \u0939\u0948: \u201C\u0915\u094D\u092F\u094B\u0902?\u201D"),choices:[{label:a("Apologise, and ask what she wants you to do.","\u092E\u093E\u092B\u093C\u0940 \u092E\u093E\u0901\u0917\u094B, \u0914\u0930 \u092A\u0942\u091B\u094B \u0935\u0939 \u0915\u094D\u092F\u093E \u091A\u093E\u0939\u0924\u0940 \u0939\u0948\u0964"),next:"repair"},{label:a("Say it was not you \u2014 Kabir sent it first.","\u0915\u0939\u094B \u0915\u093F \u092E\u0948\u0902\u0928\u0947 \u0928\u0939\u0940\u0902 \u092D\u0947\u091C\u093E \u2014 \u092A\u0939\u0932\u0947 \u0915\u092C\u0940\u0930 \u0928\u0947 \u092D\u0947\u091C\u093E \u0925\u093E\u0964"),next:"blame"}]},ask:{text:a("Riya is quiet for a while. \u201CIt feels like everyone is looking at me,\u201D she says. \u201CI did not say yes to that photo.\u201D","\u0930\u093F\u092F\u093E \u0925\u094B\u0921\u093C\u0940 \u0926\u0947\u0930 \u091A\u0941\u092A \u0930\u0939\u0924\u0940 \u0939\u0948\u0964 \u201C\u0932\u0917\u0924\u093E \u0939\u0948 \u0938\u092C \u092E\u0941\u091D\u0947 \u0926\u0947\u0916 \u0930\u0939\u0947 \u0939\u0948\u0902,\u201D \u0935\u0939 \u0915\u0939\u0924\u0940 \u0939\u0948\u0964 \u201C\u092E\u0948\u0902\u0928\u0947 \u0909\u0938 \u092B\u093C\u094B\u091F\u094B \u0915\u0947 \u0932\u093F\u090F \u0939\u093E\u0901 \u0928\u0939\u0940\u0902 \u0915\u0939\u093E \u0925\u093E\u0964\u201D"),choices:[{label:a("Help her ask a teacher to get it removed.","\u0909\u0938\u0915\u0940 \u092E\u0926\u0926 \u0915\u0930\u094B \u0915\u093F \u0936\u093F\u0915\u094D\u0937\u0915 \u0938\u0947 \u0907\u0938\u0947 \u0939\u091F\u0935\u093E\u090F\u0964"),next:"courage"},{label:a("Tell her to ignore it. It will blow over.","\u0915\u0939\u094B \u0915\u093F \u0905\u0928\u0926\u0947\u0916\u093E \u0915\u0930\u0947\u0964 \u092E\u093E\u092E\u0932\u093E \u0936\u093E\u0902\u0924 \u0939\u094B \u091C\u093E\u090F\u0917\u093E\u0964"),next:"quiet"}]},firm:{end:!0,text:a("Kabir is annoyed, then shrugs. Two other friends also delete it. The photo stops spreading at your class. Riya never learns how close it came.","\u0915\u092C\u0940\u0930 \u0928\u093E\u0930\u093E\u091C\u093C \u0939\u094B\u0924\u093E \u0939\u0948, \u092B\u093F\u0930 \u0915\u0902\u0927\u0947 \u0909\u091A\u0915\u093E\u0924\u093E \u0939\u0948\u0964 \u0926\u094B \u0914\u0930 \u0926\u094B\u0938\u094D\u0924 \u092D\u0940 \u0909\u0938\u0947 \u0921\u093F\u0932\u0940\u091F \u0915\u0930 \u0926\u0947\u0924\u0947 \u0939\u0948\u0902\u0964 \u092B\u093C\u094B\u091F\u094B \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0940 \u0915\u094D\u0932\u093E\u0938 \u092A\u0930 \u0930\u0941\u0915 \u091C\u093E\u0924\u0940 \u0939\u0948\u0964 \u0930\u093F\u092F\u093E \u0915\u094B \u0915\u092D\u0940 \u092A\u0924\u093E \u0928\u0939\u0940\u0902 \u091A\u0932\u0924\u093E \u0915\u093F \u0915\u093F\u0924\u0928\u093E \u0915\u0930\u0940\u092C \u0906\u0908 \u0925\u0940\u0964"),lesson:a("Stopping a message is quiet work. You do not need to be seen being kind for it to count.","\u0938\u0902\u0926\u0947\u0936 \u0930\u094B\u0915\u0928\u093E \u091A\u0941\u092A\u091A\u093E\u092A \u0915\u093E\u092E \u0939\u0948\u0964 \u0926\u092F\u093E \u0915\u0947 \u0932\u093F\u090F \u0926\u0947\u0916\u093E \u091C\u093E\u0928\u093E \u091C\u093C\u0930\u0942\u0930\u0940 \u0928\u0939\u0940\u0902\u0964"),reflection:{q:a("What can one person do in a group chat?","\u0917\u094D\u0930\u0941\u092A \u091A\u0948\u091F \u092E\u0947\u0902 \u090F\u0915 \u0935\u094D\u092F\u0915\u094D\u0924\u093F \u0915\u094D\u092F\u093E \u0915\u0930 \u0938\u0915\u0924\u093E \u0939\u0948?"),options:[a("Refuse to forward, and say why.","\u0906\u0917\u0947 \u092D\u0947\u091C\u0928\u0947 \u0938\u0947 \u092E\u0928\u093E \u0915\u0930\u094B, \u0914\u0930 \u0915\u093E\u0930\u0923 \u092C\u0924\u093E\u0913\u0964"),a("Ask others to stop too.","\u0926\u0942\u0938\u0930\u094B\u0902 \u0938\u0947 \u092D\u0940 \u0930\u0941\u0915\u0928\u0947 \u0915\u094B \u0915\u0939\u094B\u0964"),a("Support the person in private.","\u0935\u094D\u092F\u0915\u094D\u0924\u093F \u0915\u094B \u0905\u0932\u0917 \u0938\u0947 \u0938\u0939\u093E\u0930\u093E \u0926\u094B\u0964")]}},leave:{end:!0,text:a("You leave the group. The photo keeps travelling without you. Riya sees it two days later. Silence kept your hands clean, but not hers.","\u0924\u0941\u092E \u0917\u094D\u0930\u0941\u092A \u091B\u094B\u0921\u093C \u0926\u0947\u0924\u0947 \u0939\u094B\u0964 \u092B\u093C\u094B\u091F\u094B \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0947 \u092C\u093F\u0928\u093E \u092D\u0940 \u091A\u0932\u0924\u0940 \u0930\u0939\u0924\u0940 \u0939\u0948\u0964 \u0930\u093F\u092F\u093E \u0909\u0938\u0947 \u0926\u094B \u0926\u093F\u0928 \u092C\u093E\u0926 \u0926\u0947\u0916\u0924\u0940 \u0939\u0948\u0964 \u091A\u0941\u092A\u094D\u092A\u0940 \u0928\u0947 \u0924\u0941\u092E\u094D\u0939\u093E\u0930\u0947 \u0939\u093E\u0925 \u0938\u093E\u092B\u093C \u0930\u0916\u0947, \u0909\u0938\u0915\u0947 \u0928\u0939\u0940\u0902\u0964"),lesson:a("Walking away protects you, not the person being hurt. Sometimes staying and saying one sentence is braver.","\u0926\u0942\u0930 \u091A\u0932\u0947 \u091C\u093E\u0928\u093E \u0924\u0941\u092E\u094D\u0939\u0947\u0902 \u092C\u091A\u093E\u0924\u093E \u0939\u0948, \u091C\u093F\u0938\u0947 \u091A\u094B\u091F \u092A\u0939\u0941\u0901\u091A \u0930\u0939\u0940 \u0939\u0948 \u0909\u0938\u0947 \u0928\u0939\u0940\u0902\u0964 \u0915\u092D\u0940-\u0915\u092D\u0940 \u0930\u0941\u0915\u0915\u0930 \u090F\u0915 \u0935\u093E\u0915\u094D\u092F \u0915\u0939\u0928\u093E \u091C\u093C\u094D\u092F\u093E\u0926\u093E \u092C\u0939\u093E\u0926\u0941\u0930\u0940 \u0939\u0948\u0964"),reflection:{q:a("When is leaving the right choice, and when is it escape?","\u0915\u092C \u091B\u094B\u0921\u093C\u0928\u093E \u0938\u0939\u0940 \u0939\u0948, \u0914\u0930 \u0915\u092C \u092D\u093E\u0917\u0928\u093E?"),options:[a("Leave if staying would make it worse.","\u0905\u0917\u0930 \u0930\u0941\u0915\u0928\u0947 \u0938\u0947 \u092C\u093E\u0924 \u092C\u093F\u0917\u0921\u093C\u0947 \u0924\u094B \u091B\u094B\u0921\u093C\u094B\u0964"),a("Stay long enough to say \u201Cnot me\u201D.","\u0907\u0924\u0928\u093E \u0930\u0941\u0915\u094B \u0915\u093F \u201C\u092E\u0948\u0902 \u0928\u0939\u0940\u0902\u201D \u0915\u0939 \u0938\u0915\u094B\u0964"),a("Leave, then check on the person privately.","\u091B\u094B\u0921\u093C\u094B, \u092B\u093F\u0930 \u0905\u0932\u0917 \u0938\u0947 \u0935\u094D\u092F\u0915\u094D\u0924\u093F \u0915\u093E \u0939\u093E\u0932 \u092A\u0942\u091B\u094B\u0964")]}},repair:{end:!0,text:a("Riya thinks. \u201CTell the group it was wrong. And do not send anything about me again.\u201D You do. It is uncomfortable, and it helps.","\u0930\u093F\u092F\u093E \u0938\u094B\u091A\u0924\u0940 \u0939\u0948\u0964 \u201C\u0917\u094D\u0930\u0941\u092A \u0915\u094B \u092C\u0924\u093E\u0913 \u0915\u093F \u092F\u0939 \u0917\u0932\u0924 \u0925\u093E\u0964 \u0914\u0930 \u092E\u0947\u0930\u0947 \u092C\u093E\u0930\u0947 \u092E\u0947\u0902 \u0915\u0941\u091B \u092E\u0924 \u092D\u0947\u091C\u0928\u093E\u0964\u201D \u0924\u0941\u092E \u092C\u0924\u093E\u0924\u0947 \u0939\u094B\u0964 \u0905\u0938\u0939\u091C \u0932\u0917\u0924\u093E \u0939\u0948, \u0914\u0930 \u092E\u0926\u0926 \u0915\u0930\u0924\u093E \u0939\u0948\u0964"),lesson:a("An apology is not a feeling; it is an action. Asking the person what they need turns regret into repair.","\u092E\u093E\u092
