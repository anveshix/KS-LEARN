<title>KS-LEARN</title>

<style>/* Layout: bento grid on home, glass cards, floating bottom dock. Pure CSS: no external assets, CSP-safe. */

  --m: #2b55e6; --e: #7b45d6; --h: #d9730b; --s: #148a5a; --l: #0e8798; --c: #c2387a; --g: #9a6b00; --t: #b4492b;
  --display: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", "Nirmala UI", "Kohinoor Devanagari", sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", "Nirmala UI", "Kohinoor Devanagari", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --r: 20px; --glass: rgb(255 255 255 / .72); --glass-line: rgb(255 255 255 / .85); --shadow: 0 8px 28px rgb(28 45 90 / .10), 0 1px 2px rgb(28 45 90 / .06);
  --orb1: rgb(43 85 230 / .22); --orb2: rgb(123 69 214 / .18); --orb3: rgb(20 138 90 / .14);
  --grad: linear-gradient(135deg, #2b55e6, #6a43d8);
  /* Brand accents: the seed and its sprout. Text uses the darker green to stay legible. */
  --sprout: #31b981; --sprout-ink: #0a5c40; --seed: #efb463;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f131a; --surface: #171d28; --ink: #e8ecf3; --muted: #9aa4b8; --line: #2a3446;
  --accent: #7e9cff; --accent-ink: #0b1020; --good: #5fd395; --good-bg: #13301f; --bad: #ff8b74; --bad-bg: #3a1a14; --warn-bg: #3a2f10;
  --m: #7e9cff; --e: #b590ff; --h: #ffab4f; --s: #4fd39b; --l: #4fd0e0; --c: #ff7fb8; --g: #e7b84a; --t: #ff9a7a; color-scheme: dark;
  --glass: rgb(23 29 40 / .66); --glass-line: rgb(255 255 255 / .09); --shadow: 0 10px 30px rgb(0 0 0 / .35);
  --orb1: rgb(126 156 255 / .20); --orb2: rgb(181 144 255 / .16); --orb3: rgb(79 211 155 / .12); --grad: linear-gradient(135deg, #7e9cff, #b590ff);
  --sprout: #4fd39b; --sprout-ink: #7ce7b7; --seed: #efb463; } }
:root[data-theme="dark"] {
  --bg: #0f131a; --surface: #171d28; --ink: #e8ecf3; --muted: #9aa4b8; --line: #2a3446;
  --accent: #7e9cff; --accent-ink: #0b1020; --good: #5fd395; --good-bg: #13301f; --bad: #ff8b74; --bad-bg: #3a1a14; --warn-bg: #3a2f10;
  --m: #7e9cff; --e: #b590ff; --h: #ffab4f; --s: #4fd39b; --l: #4fd0e0; --c: #ff7fb8; --g: #e7b84a; --t: #ff9a7a; color-scheme: dark;
  --glass: rgb(23 29 40 / .66); --glass-line: rgb(255 255 255 / .09); --shadow: 0 10px 30px rgb(0 0 0 / .35);
  --orb1: rgb(126 156 255 / .20); --orb2: rgb(181 144 255 / .16); --orb3: rgb(79 211 155 / .12); --grad: linear-gradient(135deg, #7e9cff, #b590ff);
  --sprout: #4fd39b; --sprout-ink: #7ce7b7; --seed: #efb463; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { position: relative; background: var(--bg); color: var(--ink); font: 17px/1.55 var(--body); padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.s-m { --sc: var(--m); } .s-e { --sc: var(--e); } .s-h { --sc: var(--h); } .s-s { --sc: var(--s); } .s-l { --sc: var(--l); } .s-c { --sc: var(--c); } .s-g { --sc: var(--g); } .s-t { --sc: var(--t); }
h1, h2 { font-family: var(--display); line-height: 1.2; text-wrap: balance; margin: 0 0 .4em; }

a { color: var(--accent); }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 12px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.wrap.narrow { max-width: 640px; }
.card { background: var(--glass); -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); border: 1px solid var(--glass-line); box-shadow: var(--shadow); border-radius: var(--r); padding: 18px; min-width: 0; }
.card.inset { background: var(--bg); box-shadow: none; }
.eyebrow { font-size: .78rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.muted { color: var(--muted); } .small { font-size: .88rem; }
.hello { font-size: 1.9rem; margin: 6px 0 0; }
.warn { background: var(--warn-bg); padding: 10px 14px; border-radius: 10px; }
.btn { font: 600 1rem/1.2 var(--body); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px 18px; min-height: 48px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn { transition: transform .15s, box-shadow .15s, border-color .15s; }
.btn:active:not(:disabled) { transform: scale(.97); }
.btn.primary { background: var(--grad); border-color: transparent; color: var(--accent-ink); box-shadow: 0 6px 18px rgb(43 85 230 / .30); }
.btn.big { width: 100%; font-size: 1.15rem; min-height: 56px; margin-top: 8px; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 40px; padding: 8px 12px; font-size: .9rem; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.top { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 760px; margin: 0 auto; }
/* The mark, the wordmark and the tagline: one block, used on the welcome screen. */
.welcome { display: flex; gap: 16px; align-items: center; padding: 6px 2px 20px; }
.mark { display: block; flex: none; width: 46px; height: 46px; background: no-repeat center / contain; }
.mark-lg { width: 76px; height: 76px; }
.welcome-text { min-width: 0; }
.wordmark { display: block; font-family: var(--display); font-weight: 800; font-size: 1.6rem; line-height: 1.05; letter-spacing: -.01em; }
.wordmark i { font-style: normal; color: var(--sprout-ink); }
.tagline { margin: 3px 0 0; font-weight: 600; color: var(--muted); }
.welcome-note { margin: 8px 0 0; max-width: 44ch; white-space: pre-line; }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.brand b { display: block; font-family: var(--display); font-size: 1.15rem; line-height: 1.1; }
.brand small { color: var(--muted); }
.logo { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: var(--grad); box-shadow: 0 4px 12px rgb(43 85 230 / .3); color: var(--accent-ink); font: 800 1rem var(--display); flex: none; }
.stats { display: flex; gap: 14px; }
.stat { text-align: center; } .stat b { display: block; font: 700 1.25rem/1 var(--display); font-variant-numeric: tabular-nums; } .stat small { color: var(--muted); font-size: .72rem; }
.mission { border: 1.5px solid var(--accent); }
.mission h2 { font-size: 1.8rem; margin: 0; font-variant-numeric: tabular-nums; }
.mission.complete { border-color: var(--good); background: var(--good-bg); }
.offscreen p { font-size: 1.05rem; }
.strands { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.strand { text-align: left; border: 1.5px solid var(--line); border-left: 6px solid var(--sc); background: var(--glass); color: var(--ink); border-radius: 12px; padding: 12px; cursor: pointer; display: grid; gap: 6px; font: inherit; min-width: 0; }
.strand:hover { border-color: var(--sc); }
.sname { font: 700 1.05rem var(--display); }
.strand small { color: var(--muted); font-size: .8rem; }
.bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sc, var(--accent)); border-radius: 99px; transition: width .4s; }
.bar.thin { height: 6px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.row > div { min-width: 0; flex: 1 1 220px; }
.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 24px)); display: flex; gap: 4px; background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%); border: 1px solid var(--glass-line); box-shadow: var(--shadow); border-radius: 22px; padding: 6px; z-index: 5; }
.tab { flex: 1; display: grid; justify-items: center; align-content: center; gap: 2px; line-height: 1.25; text-align: center; text-decoration: none; color: var(--muted); font-weight: 600; padding: 10px 6px 9px; border-radius: 16px; font-size: .8rem; transition: background .2s, color .2s; }
.tab > span:last-child { line-height: 1.3; }
.tab .ico { font-size: 1.25rem; }
.tab.on { background: var(--grad); color: var(--accent-ink); }
.qhead { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; }
.q { border-top: 5px solid var(--sc); }
.prompt { font-size: 1.25rem; font-weight: 600; white-space: pre-line; margin: 8px 0 14px; }
.options { display: grid; gap: 10px; }
.options.inline { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; font: 500 1.08rem/1.35 var(--body); color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 54px; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--sc); }
.opt .key { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--bg); font: 700 .95rem var(--display); color: var(--sc); }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt:disabled { cursor: default; }
.answer-row { display: flex; gap: 10px; flex-wrap: wrap; }
.answer, input, select, textarea { font: 500 1.1rem var(--body); color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 52px; min-width: 0; }
.answer { flex: 1 1 180px; font-size: 1.3rem; }
.answer.right { border-color: var(--good); } .answer.wrong { border-color: var(--bad); }
.feedback { margin-top: 14px; border-radius: 12px; padding: 0; }
.feedback:empty { display: none; }
.feedback.good, .feedback.bad, .feedback.note { padding: 12px 14px; }
.feedback.good { background: var(--good-bg); } .feedback.bad { background: var(--bad-bg); } .feedback.note { background: var(--warn-bg); }
.verdict { font: 700 1.25rem var(--display); }
.good .verdict { color: var(--good); } .bad .verdict { color: var(--bad); }
.remedy { border-left: 4px solid var(--sc); padding-left: 10px; }
.badge-line { font-weight: 700; color: var(--good); }
.explore { display: inline-block; margin-top: 6px; font-weight: 600; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; margin-top: 14px; align-items: center; }
.actions .btn.big { margin-top: 0; }
.wrap-row { justify-content: flex-start; }
.code { font: 1rem/1.5 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; overflow-x: auto; white-space: pre; }
.passage { background: var(--bg); border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; }
.passage summary { font-weight: 700; cursor: pointer; }
.grid { width: 100%; max-width: 230px; display: block; margin: 0 auto 12px; }
.grid .cell { fill: var(--bg); stroke: var(--line); }
.grid .lbl { fill: var(--muted); font: 600 12px var(--body); }
.grid .bot { fill: var(--sc); }
.lesson { border-top: 5px solid var(--sc); }
.lesson .tip { font-size: 1.12rem; }
.example { background: var(--bg); border-radius: 12px; padding: 12px 14px; margin-top: 10px; }
.big-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin: 6px 0 10px; }
.big-stats div { background: var(--bg); border-radius: 12px; padding: 10px; }
.big-stats b { display: block; font: 700 1.6rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.big-stats small { color: var(--muted); }
.review-list li { padding: 8px 10px; border-radius: 10px; margin: 8px 0; }
.review-list li.ok { background: var(--good-bg); } .review-list li.no { background: var(--bad-bg); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
.chip { flex: none; font: 600 .95rem var(--body); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 99px; padding: 8px 14px; cursor: pointer; }
.chip.on { background: var(--sc); border-color: var(--sc); color: var(--accent-ink); }
.skills { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.sk-btn { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; text-align: left; font: inherit; color: var(--ink); background: transparent; border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; }
.sk-btn .bar { grid-column: 1 / -1; }
.sk.next .sk-btn { border-color: var(--accent); }
.sk.locked .sk-btn { opacity: .6; }
.sk-title { min-width: 0; }
.pill { font-size: .75rem; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: var(--bg); color: var(--muted); white-space: nowrap; }
.pill.mastered { background: var(--good-bg); color: var(--good); }
.pill.dueNow { background: var(--warn-bg); color: var(--ink); }
.pill.learning { color: var(--accent); }
.sheet { position: fixed; inset: 0; background: rgb(0 0 0 / .45); display: grid; align-items: end; justify-items: center; z-index: 20; padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet-body { width: 100%; max-width: 560px; max-height: 85vh; overflow: auto; }
.form { display: grid; gap: 6px; }
.form label { font-weight: 600; margin-top: 8px; }
.form .check { display: flex; gap: 8px; align-items: center; font-weight: 500; margin: 4px 12px 4px 0; }
.form .check input { min-height: auto; width: 20px; height: 20px; }
fieldset { border: 1px solid var(--line); border-radius: 12px; display: flex; flex-wrap: wrap; padding: 8px 12px; margin: 8px 0; }
legend { font-weight: 600; padding: 0 6px; }
.narrow-card { max-width: 380px; width: 100%; margin: 20px auto; }
.err { color: var(--bad); }
.errs li { color: var(--bad); }
.road { display: grid; gap: 8px; margin: 8px 0; }
.road-row { display: grid; grid-template-columns: 70px 70px 1fr 48px; gap: 10px; align-items: center; font-size: .9rem; font-variant-numeric: tabular-nums; padding: 4px 6px; border-radius: 8px; }
.road-row.current { background: var(--bg); font-weight: 700; }
.road-n { text-align: right; }
.asks li { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.asks li span { min-width: 0; flex: 1 1 220px; }
.done ul { margin-bottom: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 30; max-width: calc(100% - 32px); }
details summary { cursor: pointer; font-weight: 600; }
@media (max-width: 420px) { .road-row { grid-template-columns: 58px 58px 1fr 40px; gap: 6px; } .prompt { font-size: 1.15rem; } h1 { font-size: 1.45rem; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
.boot { padding: 24px; }

/* ---------- Phase 1: ambient background, bento home, motion ---------- */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(520px 420px at 8% -5%, var(--orb1), transparent 70%), radial-gradient(480px 420px at 100% 10%, var(--orb2), transparent 70%), radial-gradient(520px 460px at 50% 110%, var(--orb3), transparent 70%); }
.wrap { max-width: 920px; } .wrap.narrow { max-width: 640px; }
.top { max-width: 920px; }
.avatar { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: var(--grad); color: var(--accent-ink); font: 800 1.1rem var(--display); flex: none; box-shadow: 0 4px 12px rgb(43 85 230 / .3); }
.pills { display: flex; gap: 8px; }
.pill-stat { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 99px; background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--shadow); font: 700 1rem/1 var(--display); font-variant-numeric: tabular-nums; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.pill-stat .ico { font-size: 1.05rem; }
.bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.bento > * { min-width: 0; animation: rise .5s both cubic-bezier(.2, .8, .2, 1); }
.bento > :nth-child(2) { animation-delay: .06s; } .bento > :nth-child(3) { animation-delay: .12s; } .bento > :nth-child(4) { animation-delay: .18s; } .bento > :nth-child(5) { animation-delay: .24s; } .bento > :nth-child(6) { animation-delay: .3s; }
.b-hero { grid-column: span 4; } .b-wide { grid-column: span 4; } .b-half { grid-column: span 2; }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
.hero { position: relative; overflow: hidden; border: 1.5px solid var(--accent); padding: 22px; }
.hero::after { content: ""; position: absolute; right: -50px; top: -50px; width: 180px; height: 180px; border-radius: 50%; background: var(--grad); opacity: .16; pointer-events: none; }
.hero.complete { border-color: var(--good); background: var(--good-bg); } .hero.complete::after { background: var(--good); }
.hero h2 { font-size: 2.1rem; margin: 0; font-variant-numeric: tabular-nums; }
.tile { display: grid; align-content: space-between; gap: 6px; min-height: 120px; }
.tile .big-n { font: 800 2.4rem/1 var(--display); font-variant-numeric: tabular-nums; }
.tile .big-ico { font-size: 1.8rem; line-height: 1; }
.tile .flame { display: inline-block; transform-origin: 50% 90%; animation: flicker 2.4s ease-in-out infinite; }
@keyframes flicker { 0%, 100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.12) rotate(3deg); } }
.strands { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.strand { border-left-width: 1.5px; border-top: 5px solid var(--sc); position: relative; transition: transform .2s, box-shadow .2s, border-color .2s; box-shadow: var(--shadow); }
.strand:hover { transform: translateY(-3px); } .strand:active { transform: scale(.97); }
.strand .sico { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; font-size: 1.35rem; background: color-mix(in srgb, var(--sc) 16%, transparent); }
.pulse { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 6px 18px rgb(43 85 230 / .30), 0 0 0 0 rgb(43 85 230 / .45); } 50% { box-shadow: 0 6px 18px rgb(43 85 230 / .30), 0 0 0 12px rgb(43 85 230 / 0); } }
.view-in { animation: rise .35s both; }
@media (max-width: 640px) { .b-half { grid-column: span 2; } .hero h2 { font-size: 1.8rem; } .pill-stat { padding: 6px 10px; } }
@supports not (backdrop-filter: blur(1px)) { .card, .tabs, .pill-stat { background: var(--surface); } }

/* ---------- Phase 2: rewards ---------- */
.level-tile .lv-row { display: flex; gap: 16px; align-items: center; }
.lv-ico { display: grid; place-items: center; flex: none; width: 64px; height: 64px; border-radius: 20px; font-size: 2rem; background: var(--grad); box-shadow: 0 6px 18px rgb(43 85 230 / .3); }
.lv-main { flex: 1; min-width: 0; display: grid; gap: 6px; } .lv-main h2 { margin: 0; font-size: 1.4rem; }
.lv-main .bar i { background: var(--grad); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; }
.badge { display: grid; justify-items: center; gap: 4px; text-align: center; padding: 10px 4px; border-radius: 16px; background: var(--bg); filter: grayscale(1); opacity: .55; }
.badge.on { filter: none; opacity: 1; background: color-mix(in srgb, var(--g) 14%, var(--surface)); animation: pop .5s both; }
.badge .b-ico { font-size: 1.7rem; line-height: 1; } .badge small { font-size: .72rem; line-height: 1.2; color: var(--muted); }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.12); } 100% { transform: none; } }
.rw-box { display: grid; gap: 4px; padding: 10px 14px; margin: 6px 0 10px; border-radius: 16px; background: var(--warn-bg); animation: pop .5s both; }
.rw-line { margin: 4px 0; font-weight: 600; } .rw-line.gold { font-size: 1.15rem; } .rw-ico { display: inline-block; font-size: 1.3rem; vertical-align: -2px; }
.levelup { text-align: center; padding: 8px 0; } .levelup h2 { margin: 4px 0; font-size: 1.8rem; }
.lu-ico { font-size: 3.6rem; line-height: 1; animation: pop .7s both; }
.celebrate { text-align: left; } .celebrate .btn { margin-top: 12px; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 40; }
.confetti i { position: absolute; top: -14px; left: var(--x); width: 9px; height: 14px; border-radius: 2px; opacity: 0; animation: fall var(--d) var(--w) ease-in forwards; }
@keyframes fall { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: .9; transform: translate(var(--dx), 105vh) rotate(var(--r)); } }

/* ---------- Phase 3: gentle feedback, guidance loop, interactive widgets ---------- */
.opt.miss, .answer.miss { border-color: var(--warn-line, #e0a43a); background: var(--warn-bg); }
.feedback.try { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border-left: 5px solid var(--accent); animation: rise .3s both; }
.feedback.try .verdict { color: var(--accent); }
.hint { background: var(--warn-bg); border-radius: 12px; padding: 10px 12px; }
.star-pop { display: inline-block; font-weight: 800; color: var(--g); animation: pop .5s both; }
.card.guide { border-top-style: dashed; }
.answer-row.stack { display: grid; gap: 12px; }
.w-order, .w-match { display: grid; gap: 12px; }
.ord-line { list-style: none; margin: 0; padding: 10px; min-height: 64px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border: 2px dashed var(--line); border-radius: 14px; background: var(--bg); counter-reset: o; }
.ord-line li { margin: 0; counter-increment: o; position: relative; }
.ord-line li::before { content: counter(o); position: absolute; top: -8px; left: -4px; z-index: 1; width: 18px; height: 18px; border-radius: 50%; background: var(--sc, var(--accent)); color: var(--accent-ink); font: 700 .7rem/18px var(--display); text-align: center; }
.ord-bank { display: flex; flex-wrap: wrap; gap: 8px; }
.tile-btn { font: 600 1rem/1.25 var(--body); color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 46px; cursor: pointer; text-align: left; transition: transform .12s, border-color .12s; }
.tile-btn:hover:not(:disabled) { border-color: var(--sc, var(--accent)); transform: translateY(-1px); }
.tile-btn:disabled { opacity: .55; cursor: default; }
.tile-btn.picked { border-color: var(--sc, var(--accent)); opacity: 1; }
.m-col { display: grid; gap: 8px; align-content: start; } .w-match { grid-template-columns: 1fr 1fr; }
.tile-btn.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.tile-btn.paired { opacity: 1; color: #fff; border-color: transparent; }
.tile-btn.p0 { background: #2b55e6; } .tile-btn.p1 { background: #7b45d6; } .tile-btn.p2 { background: #148a5a; } .tile-btn.p3 { background: #c2387a; } .tile-btn.p4 { background: #b4492b; }

/* ---------- Super Grade shell: one system of tokens, glass surfaces, calm motion ---------- */
:root {
  --s1: 6px; --s2: 10px; --s3: 14px; --s4: 18px; --s5: 26px;
  --r-sm: 12px; --r-md: 18px; --r-lg: 24px; --r-xl: 30px;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --hair: 1px solid var(--line);
}
body { -webkit-tap-highlight-color: transparent; }
/* 320 px phones: Devanagari labels need the extra line height, not a smaller tap target. */
@media (max-width: 360px) { .tab { font-size: .75rem; padding: 9px 4px 8px; letter-spacing: -.01em; } .tab .ico { font-size: 1.15rem; } }
@media (prefers-reduced-transparency: reduce) { .card, .tabs, .pill-stat { backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--surface); } }
.program-chip { flex: none; align-self: center; padding: 5px 9px; border-radius: 99px; background: color-mix(in srgb, var(--sprout) 18%, transparent); color: var(--sprout-ink); border: 1px solid color-mix(in srgb, var(--sprout) 45%, transparent); font: 800 .62rem/1 var(--display); letter-spacing: .09em; text-transform: uppercase; white-space: nowrap; }
@media (max-width: 430px) { .program-chip { display: none; } }
.block { display: block; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 9px; border-radius: 99px; font: 700 .72rem/1.2 var(--display); white-space: nowrap; }
.chip-req { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
.chip-opt { background: color-mix(in srgb, var(--muted) 14%, transparent); color: var(--muted); }
.chip-ok { background: var(--good-bg); color: var(--good); }
.chip-warn { background: var(--warn-bg); color: var(--ink); }
.consent-chip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 0 4px; }
.lead { font-size: 1.05rem; color: var(--muted); max-width: 62ch; }

/* Bento that stays readable: four columns on a laptop, two on a phone, one on a very small phone. */
@media (max-width: 720px) {
  .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .bento .b-hero, .bento .b-wide { grid-column: span 2; }
  .bento .b-half { grid-column: span 1; }
  .bento .tile { min-height: 104px; }
  .bento .tile .big-n { font-size: 2rem; }
}
@media (max-width: 360px) {
  .bento { grid-template-columns: minmax(0, 1fr); }
  .bento .b-hero, .bento .b-wide, .bento .b-half { grid-column: span 1; }
}

/* ---------- Consent onboarding: one decision per screen ---------- */
.onboarding { max-width: 700px; padding-top: 18px; }
.onb-brand { display: flex; align-items: center; gap: 10px; padding: 2px 2px 10px; }
.brand-lockup { display: inline-flex; align-items: center; gap: 10px; }
.onb-stage { display: grid; }
.onb-card { padding: 22px; animation: rise .4s var(--ease) both; }
.onb-card h1 { font-size: clamp(1.4rem, 4.4vw, 1.75rem); margin-bottom: .35em; }
.onb-card h2 { font-size: 1.12rem; margin: 18px 0 8px; }
.onb-card h3 { font-size: .98rem; margin: 0 0 3px; }
.onb-card .lead { margin: 0 0 14px; }
.stepper { display: flex; gap: 4px; list-style: none; padding: 0; margin: 0 0 16px; overflow-x: auto; scrollbar-width: none; }
.stepper::-webkit-scrollbar { display: none; }
.stepper li { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 10px; color: var(--muted); font-size: .74rem; font-weight: 600; white-space: nowrap; }
.stepper li.on { background: color-mix(in srgb, var(--accent) 12%, transparent); color: var(--accent); }
.stepper li.done { color: var(--good); }
.st-n { display: grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: 50%; background: var(--bg); border: 1.5px solid currentColor; font: 700 .7rem/1 var(--display); }
.stepper li.on .st-n { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.stepper li.done .st-n { background: var(--good-bg); }
.st-l { overflow: hidden; text-overflow: ellipsis; }
.notice-block { padding: 11px 13px; border-radius: var(--r-sm); background: var(--bg); margin: 8px 0; }
.notice-block p { margin: 0; font-size: .92rem; color: var(--ink); }
.notice-block h3 { color: var(--ink); }
.policy-details { margin: 12px 0 4px; border-top: 1px solid var(--line); padding-top: 10px; }
.policy-details p { font-size: .9rem; }
.check-row { display: flex; gap: 10px; align-items: flex-start; margin: 12px 0; font-weight: 600; cursor: pointer; }
.check-row input { flex: none; width: 22px; height: 22px; min-height: 0; margin-top: 2px; accent-color: var(--accent); }
.check-row.off { opacity: .65; cursor: default; }
.purposes { display: grid; gap: 8px; }
.purpose { border: 1.5px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; background: var(--surface); }
.purpose.essential { background: color-mix(in srgb, var(--accent) 4%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 26%, var(--line)); }
.purpose-head { display: flex; align-items: center; gap: 9px; font-weight: 700; cursor: pointer; }
.purpose-head input { flex: none; width: 21px; height: 21px; min-height: 0; accent-color: var(--accent); }
.purpose-title { flex: 1 1 auto; min-width: 0; font-size: .97rem; }
.purpose-what { margin: 3px 0 0 30px; font-size: .84rem; color: var(--muted); }
.token-box { text-align: center; padding: 14px; border-radius: var(--r-md); background: var(--bg); border: 1.5px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); margin: 6px 0 14px; }
.token { display: block; font: 800 clamp(1.25rem, 5.2vw, 1.7rem)/1.3 var(--mono); letter-spacing: .08em; color: var(--ink); word-break: break-word; user-select: all; margin: 4px 0 6px; }
.verify-pane { margin-bottom: 8px; }
.verify-pane[hidden] { display: none; }
.notice-line { background: var(--warn-bg); color: var(--ink); border-left: 4px solid var(--sprout); padding: 9px 12px; border-radius: 10px; font-size: .92rem; margin: 10px 0 0; }
.notice-line:empty { display: none; }
.actions.split { justify-content: space-between; }
.actions.split .btn.big { width: auto; flex: 1 1 auto; }
.receipt-code { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-radius: var(--r-md); background: color-mix(in srgb, var(--sprout) 14%, transparent); border: 1px solid color-mix(in srgb, var(--sprout) 40%, transparent); margin: 10px 0 12px; font-size: .9rem; }
.receipt-code output { font: 800 1.2rem/1 var(--mono); letter-spacing: .1em; color: var(--sprout-ink); }
.kv-list { display: grid; gap: 2px; margin: 8px 0; }
.kv { display: flex; justify-content: space-between; gap: 14px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: .88rem; }
.kv:last-child { border-bottom: 0; }
.kv span { color: var(--muted); flex: none; }
.kv b { text-align: right; font-weight: 600; overflow-wrap: anywhere; }
.receipt-purposes { margin-top: 10px; }
.receipt-purposes ul { font-size: .9rem; }
.danger-zone { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
.danger-zone summary { color: var(--bad); }
.consent-card h2 { font-size: 1.2rem; margin: 0; }
.consent-card .actions { justify-content: flex-start; }

/* Greeting row and page headings: one h1 per screen, without stealing space. */
.hello-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.hello-row .hello { margin: 0; }
.page-h { font-size: 1.5rem; margin: 2px 0 0; }

/* ---------- Guardian account: registration, sign in, recovery ---------- */
.field { display: grid; gap: 4px; margin-top: 10px; }
.field > label { font-weight: 600; }
.pw-row { display: flex; gap: 8px; align-items: stretch; }
.pw-row input { flex: 1 1 auto; }
.pw-show { min-height: 52px; }
.pw-meter { display: grid; gap: 4px; margin: 6px 0 2px; }
.pw-bars { display: flex; gap: 4px; }
.pw-bars i { height: 6px; flex: 1 1 0; border-radius: 99px; background: var(--line); transition: background .2s; }
.pw-bars.score-1 i.on { background: var(--bad); }
.pw-bars.score-2 i.on { background: #d9a13a; }
.pw-bars.score-3 i.on { background: var(--good); }
.pw-bars.score-4 i.on { background: var(--good); }
.pw-label { margin: 0; }
.account-card h2 { margin: 0; font-size: 1.15rem; }
.account-card .kv { font-size: .86rem; }
.account-note { margin: 14px 2px 0; max-width: 46ch; }
.account-sheet .token { margin: 12px 0; }
.shake { animation: shake .4s var(--ease); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .shake { animation: none; } }

/* ---------- Curiosity Labs (Phase 4) ---------- */
.labs-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.lab-card { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.lab-card.done { border-top: 4px solid var(--good); }
.lab-ico { width: 54px; height: 54px; display: grid; place-items: center; font-size: 1.9rem; background: var(--bg); border-radius: 16px; }
.lab-body h2 { font-size: 1.12rem; margin: .1em 0 .15em; }
.lab-card .btn { white-space: nowrap; }
.lab-tile .big-ico { font-size: 1.6rem; }
.lab-tile .btn { margin-top: 8px; }
.lab-stage { position: relative; border-radius: var(--r); overflow: hidden; border: 1px solid var(--glass-line); box-shadow: var(--shadow); background: linear-gradient(180deg, #dce8ff 0%, #eef6ff 55%, #f7fbff 100%); }
.lab-canvas { display: block; width: 100%; height: auto; touch-action: none; cursor: grab; }
.lab-canvas:active { cursor: grabbing; }
.lab-canvas:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; }
.lab-badge { position: absolute; top: 10px; left: 10px; padding: 4px 9px; border-radius: 12px; font-size: 1.35rem; background: rgb(255 255 255 / .62); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); pointer-events: none; }
.lab-stage.no3d { background: linear-gradient(180deg, #f4f7ff, #eef2fa); }
.lab-stage.no3d .lab-canvas { display: none; }
.lab-fallback { margin: 0; padding: 12px 14px; border-radius: 12px; background: var(--warn-bg); }
.lab-notice { background: var(--bg); border-left: 4px solid var(--accent); padding: 10px 12px; border-radius: 0 10px 10px 0; }
.lab-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.lab-controls .btn[aria-pressed="true"] { box-shadow: 0 4px 14px rgb(43 85 230 / .25); }
.lab-range { display: flex; align-items: center; gap: 14px; width: 100%; }
.lab-range input[type="range"] { flex: 1; min-height: 36px; accent-color: var(--accent); }
.lab-out { min-width: 68px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.lab-nudge { margin: 10px 0 0; }
.lab-steps .options { margin-top: 10px; }
.lab-steps .actions { margin-top: 12px; }
@media (max-width: 640px) {
  .labs-grid { grid-template-columns: 1fr; }
  .lab-card { grid-template-columns: auto minmax(0, 1fr); }
  .lab-card .btn { grid-column: 1 / -1; width: 100%; }
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .lab-stage { background: linear-gradient(180deg, #16233d 0%, #101a2c 60%, #0e1626 100%); }
  :root:not([data-theme="light"]) .lab-badge { background: rgb(15 22 35 / .66); }
  :root:not([data-theme="light"]) .lab-stage.no3d { background: linear-gradient(180deg, #141c2a, #101722); }
}
:root[data-theme="dark"] .lab-stage { background: linear-gradient(180deg, #16233d 0%, #101a2c 60%, #0e1626 100%); }
:root[data-theme="dark"] .lab-badge { background: rgb(15 22 35 / .66); }

/* ---------- Grow: Panchakosha, quests and stories (Phase 5) ---------- */
.grow-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.grow-card { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; }
.grow-card .btn { grid-column: 1 / -1; justify-self: start; }
.grow-ico { width: 52px; height: 52px; display: grid; place-items: center; font-size: 1.7rem; border-radius: 16px; background: var(--bg); border: 1px solid var(--glass-line); }
.grow-body h2 { font-size: 1.12rem; margin: .1em 0 .2em; }
.grow-body p { margin: .2em 0; }
.grow-note p { max-width: 62ch; }

/* The live rhythm bar */
.wb-clock-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.wb-left { font: 800 1.12rem var(--display); font-variant-numeric: tabular-nums; }
.wb-bar { position: relative; height: 12px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 10px 0 6px; }
.wb-bar i { display: block; height: 100%; border-radius: 99px; background: var(--grad); transition: width .6s var(--ease); }
.wb-bar.due i { background: linear-gradient(90deg, var(--h), var(--bad)); }
.wb-bar-n { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.wb-counts { display: flex; gap: 18px; color: var(--muted); font-size: .86rem; margin-bottom: 4px; }
.wb-counts b { color: var(--ink); font-family: var(--display); }
.wb-due-line { font-weight: 700; color: var(--h); }
.wb-timer-note { margin-top: 8px; }

/* The five-petal wheel */
.wb-wheel { position: relative; width: min(100%, 340px); aspect-ratio: 1; margin: 20px auto 8px; border-radius: 50%;
  border: 1px solid var(--glass-line); box-shadow: inset 0 0 50px color-mix(in srgb, var(--accent) 8%, transparent);
  background:
    radial-gradient(circle, var(--surface) 0 19%, transparent 19.6%),
    repeating-radial-gradient(circle, transparent 0 18.6%, var(--glass-line) 18.6% 19.2%, transparent 19.2% 38%, var(--glass-line) 38% 38.6%, transparent 38.6% 57%, var(--glass-line) 57% 57.6%, transparent 57.6% 76%, var(--glass-line) 76% 76.6%),
    conic-gradient(from -90deg,
      color-mix(in srgb, var(--s) 14%, transparent) 0 20%,
      color-mix(in srgb, var(--l) 14%, transparent) 20% 40%,
      color-mix(in srgb, var(--e) 14%, transparent) 40% 60%,
      color-mix(in srgb, var(--g) 14%, transparent) 60% 80%,
      color-mix(in srgb, var(--h) 14%, transparent) 80% 100%); }
.wb-hub { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; align-content: center; gap: 0; background: var(--surface); border: 2px solid var(--glass-line); box-shadow: var(--shadow); z-index: 1; }
.wb-hub span { font-size: 1.4rem; }
.wb-hub small { font: 700 .66rem var(--display); color: var(--muted); }
.wb-node { position: absolute; transform: translate(-50%, -50%); width: 86px; min-height: 78px; padding: 6px 4px; display: grid; place-items: center; align-content: center; gap: 2px; border-radius: 22px; background: var(--surface); border: 2px solid color-mix(in srgb, var(--kosha) 42%, var(--line)); box-shadow: var(--shadow); cursor: pointer; color: var(--ink); font: 700 .74rem var(--display); transition: transform .18s, box-shadow .18s, border-color .18s; }
.wb-node:hover { transform: translate(-50%, -50%) scale(1.05); }
.wb-node.on { border-color: var(--kosha); box-shadow: 0 0 0 4px color-mix(in srgb, var(--kosha) 22%, transparent), var(--shadow); }
.wb-node-ico { font-size: 1.55rem; line-height: 1; }
.wb-node-n { line-height: 1.1; text-align: center; color: var(--muted); }
.wb-node.on .wb-node-n { color: var(--ink); }
.wb-node-dot { position: absolute; top: -7px; right: -7px; min-width: 21px; height: 21px; padding: 0 5px; border-radius: 99px; background: var(--kosha); color: #fff; font: 700 .68rem/21px var(--display); text-align: center; }
.wb-visits { text-align: center; }

/* One layer's pause */
.wb-panel-head { display: flex; align-items: center; gap: 12px; }
.wb-panel-ico { width: 52px; height: 52px; display: grid; place-items: center; font-size: 1.7rem; border-radius: 16px; background: color-mix(in srgb, var(--kosha) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--kosha) 34%, var(--line)); flex: none; }
.wb-panel h2 { margin-bottom: .1em; }
.wb-prompt { background: var(--bg); border-left: 4px solid var(--kosha, var(--accent)); padding: 10px 14px; border-radius: 0 12px 12px 0; font-weight: 600; }
.wb-steps { display: grid; gap: 8px; margin-top: 12px; }
.wb-step { display: flex; align-items: center; gap: 10px; text-align: left; padding: 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
.wb-step.on { border-color: var(--good); background: var(--good-bg); }
.wb-step-n { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--bg); font: 700 .85rem var(--display); }
.wb-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.wb-chip { border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 99px; padding: 9px 14px; min-height: 44px; font: 600 .95rem var(--body); cursor: pointer; }
.wb-chip.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); }
.wb-reply { min-height: 1.6em; margin-top: 10px; font-weight: 600; }
.wb-options { display: grid; gap: 8px; margin-top: 10px; }
.wb-option { text-align: left; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px; font: inherit; cursor: pointer; }
.wb-option.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.wb-breath-note { margin-bottom: 4px; }
.wb-parent-stats { display: flex; gap: 24px; flex-wrap: wrap; margin: 12px 0; }
.wb-parent-stats b { display: block; font: 800 1.5rem var(--display); font-variant-numeric: tabular-nums; }
.wb-parent-stats small { color: var(--muted); }
.wb-limit { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin: 10px 0; }

/* Break overlay */
.wb-sheet { align-items: center; }
.wb-break-card { width: 100%; max-width: 520px; max-height: 88vh; overflow: auto; text-align: center; }
.wb-prompt-orb { width: 88px; height: 88px; margin: 10px auto; border-radius: 50%; border: 2px solid color-mix(in srgb, var(--m) 32%, transparent); display: grid; place-items: center; animation: wb-breathe 6s ease-in-out infinite; }
.wb-prompt-orb i { width: 54px; height: 54px; border-radius: 50%; background: color-mix(in srgb, var(--m) 28%, transparent); }
.wb-orb-stage { display: grid; place-items: center; min-height: 232px; }
.wb-orb { width: 148px; height: 148px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 34% 28%, color-mix(in srgb, var(--m) 30%, #fff), color-mix(in srgb, var(--m) 62%, #fff)); box-shadow: 0 0 0 14px color-mix(in srgb, var(--m) 9%, transparent), 0 12px 40px color-mix(in srgb, var(--m) 26%, transparent); transition: transform .1s linear, box-shadow .3s; will-change: transform; }
.wb-orb.out { box-shadow: 0 0 0 22px color-mix(in srgb, var(--m) 6%, transparent), 0 12px 40px color-mix(in srgb, var(--m) 20%, transparent); }
.wb-orb-n { font: 800 2.1rem var(--display); color: #fff; text-shadow: 0 1px 8px rgb(0 0 0 / .25); }
.wb-orb.still { transition: none; }
.wb-orb-caption { margin-top: 16px; }
.wb-phase { font: 700 1.1rem var(--display); }
.wb-dots { display: flex; gap: 8px; justify-content: center; margin: 14px 0 4px; }
.wb-dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.wb-dots i.on { background: var(--accent); }
.wb-done-ico { font-size: 2.6rem; }
@keyframes wb-breathe { 0%, 100% { transform: scale(.74); } 45%, 55% { transform: scale(1); } }

/* Quests */
.quest-offers { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.quest-offer { display: grid; gap: 6px; border-top: 4px solid var(--e); }
.quest-offer h2, .quest-offer h3 { font-size: 1.05rem; margin: 0; }
.quest-offer p { margin: 0; }
.quest-offer .btn { align-self: end; margin-top: 6px; }
.quest-offer.compact { padding: 12px; border-top-width: 3px; }
.quest-offer-top { display: flex; justify-content: space-between; align-items: center; }
.quest-ico { font-size: 1.7rem; }
.quest-stars { font: 700 .85rem var(--display); color: var(--muted); }
.quest-chosen-grid { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.quest-chosen-body { flex: 1 1 240px; min-width: 0; }
.quest-chosen.done { border-color: var(--good); }
.quest-chosen.full { border-top: 4px solid var(--good); }
.quest-ring { --p: 0; position: relative; flex: none; width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; background-color: var(--line); background-image: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--line) 0); }
.quest-ring.full { background-image: conic-gradient(var(--good) 100%, var(--good) 0); }
.quest-ring-in { width: 94px; height: 94px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; align-content: center; text-align: center; padding: 6px; }
.quest-ring-in b { font: 800 1.15rem var(--display); font-variant-numeric: tabular-nums; }
.quest-ring-in small { color: var(--muted); font-size: .66rem; line-height: 1.15; }
.quest-prog-line { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; margin: 8px 0; }
.quest-done-line { color: var(--good); font-weight: 700; }
.quest-tile .big-n { font-size: 2rem; }
.quest-tile .big-ico { font-size: 1.6rem; }

/* Stories */
.stories-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.story-card { display: grid; gap: 6px; align-content: start; }
.story-card.done { border-top: 4px solid var(--good); }
.story-card h2 { font-size: 1.1rem; margin: .1em 0; }
.story-card .btn { justify-self: start; margin-top: 8px; }
.story-card-top { display: flex; justify-content: space-between; align-items: center; }
.story-ico { font-size: 1.9rem; }
.story-meta { display: flex; gap: 14px; color: var(--muted); font-size: .8rem; }
.story-title-row { display: flex; gap: 12px; align-items: center; }
.story-head-ico { font-size: 2rem; flex: none; }
.story-trail { display: flex; gap: 6px; margin-top: 8px; }
.story-trail i { width: 22px; height: 6px; border-radius: 99px; background: var(--line); }
.story-trail i.on { background: var(--accent); }
.story-trail i.now { background: color-mix(in srgb, var(--accent) 42%, var(--line)); }
.story-scene { display: grid; }
.story-node, .story-end { background: var(--glass); border: 1px solid var(--glass-line); border-radius: var(--r); box-shadow: var(--shadow); padding: 18px; }
.story-node.in, .story-end.in { animation: story-in .34s ease both; }
@keyframes story-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
.story-text { font-size: 1.08rem; line-height: 1.65; }
.story-ask { font-size: 1rem; margin: 18px 0 8px; color: var(--muted); }
.story-choices { display: grid; gap: 10px; }
.story-choice { display: flex; gap: 12px; align-items: center; text-align: left; font: inherit; padding: 14px; border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); cursor: pointer; transition: transform .15s, border-color .15s, background .15s; }
.story-choice:hover { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); transform: translateX(3px); }
.story-choice-n { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--bg); color: var(--muted); font: 700 .9rem var(--display); }
.story-lesson { background: var(--bg); border-left: 4px solid var(--g); border-radius: 0 14px 14px 0; padding: 14px; margin: 16px 0; }
.story-reflect-box { border-top: 1px dashed var(--line); padding-top: 14px; }
.story-q { font-weight: 700; font-size: 1.02rem; }
.story-options { display: grid; gap: 8px; margin-top: 10px; }
.story-option { text-align: left; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 12px; padding: 12px; font: inherit; cursor: pointer; }
.story-option:hover { border-color: var(--accent); }
.story-reflect-actions .btn { margin-top: 10px; }
.story-thanks { color: var(--good); font-weight: 700; margin-top: 10px; }
.story-close { text-align: center; margin-top: 18px; background: var(--bg); border-radius: 14px; padding: 16px; }
.story-close-ico { font-size: 2.2rem; }
.story-close .actions { justify-content: center; }
.story-stars { font-weight: 700; }
.story-quiet { text-align: center; }

@media (max-width: 640px) {
  .stories-grid { grid-template-columns: 1fr; }
  .wb-wheel { width: min(100%, 300px); }
  .wb-node { width: 74px; min-height: 70px; border-radius: 18px; font-size: .68rem; }
  .wb-node-ico { font-size: 1.35rem; }
  .wb-hub { width: 64px; height: 64px; }
  .wb-hub span { font-size: 1.2rem; }
  .quest-chosen-grid { justify-content: center; }
  .quest-ring { width: 108px; height: 108px; }
  .quest-ring-in { width: 84px; height: 84px; }
}
@media (prefers-reduced-motion: reduce) {
  .wb-prompt-orb, .wb-node, .story-choice { animation: none !important; }
  .story-node.in, .story-end.in { animation: none; }
}

92D\u094B\u091C\u0928 \u092C\u0928\u093E\u0924\u093E \u0939\u0948?",["Leaf","\u092A\u0924\u094D\u0924\u0940"],[["Root","\u091C\u0921\u093C"],["Stem","\u0924\u0928\u093E"],["Seed","\u092C\u0940\u091C"]],["Green leaves make food using sunlight, water and air. This is photosynthesis.","\u0939\u0930\u0940 \u092A\u0924\u094D\u0924\u093F\u092F\u093E\u0901 \u0938\u0942\u0930\u094D\u092F \u0915\u0947 \u092A\u094D\u0930\u0915\u093E\u0936, \u092A\u093E\u0928\u0940 \u0914\u0930 \u0939\u0935\u093E \u0938\u0947 \u092D\u094B\u091C\u0928 \u092C\u0928\u093E\u0924\u0940 \u0939\u0948\u0902\u0964 \u0907\u0938\u0947 \u092A\u094D\u0930\u0915\u093E\u0936 \u0938\u0902\u0936\u094D\u0932\u0947\u0937\u0923 \u0915\u0939\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Which gas do leaves take in to make food?","\u092D\u094B\u091C\u0928 \u092C\u0928\u093E\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u092A\u0924\u094D\u0924\u093F\u092F\u093E\u0901 \u0915\u094C\u0928-\u0938\u0940 \u0917\u0948\u0938 \u0932\u0947\u0924\u0940 \u0939\u0948\u0902?",["Carbon dioxide","\u0915\u093E\u0930\u094D\u092C\u0928 \u0921\u093E\u0907\u0911\u0915\u094D\u0938\u093E\u0907\u0921"],[["Oxygen","\u0911\u0915\u094D\u0938\u0940\u091C\u0928"],["Nitrogen","\u0928\u093E\u0907\u091F\u094D\u0930\u094B\u091C\u0928"],["Hydrogen","\u0939\u093E\u0907\u0921\u094D\u0930\u094B\u091C\u0928"]],["Leaves take in carbon dioxide and give out oxygen while making food.","\u092D\u094B\u091C\u0928 \u092C\u0928\u093E\u0924\u0947 \u0938\u092E\u092F \u092A\u0924\u094D\u0924\u093F\u092F\u093E\u0901 \u0915\u093E\u0930\u094D\u092C\u0928 \u0921\u093E\u0907\u0911\u0915\u094D\u0938\u093E\u0907\u0921 \u0932\u0947\u0924\u0940 \u0939\u0948\u0902 \u0914\u0930 \u0911\u0915\u094D\u0938\u0940\u091C\u0928 \u091B\u094B\u0921\u093C\u0924\u0940 \u0939\u0948\u0902\u0964"]],["What gives leaves their green colour?","\u092A\u0924\u094D\u0924\u093F\u092F\u094B\u0902 \u0915\u094B \u0939\u0930\u093E \u0930\u0902\u0917 \u0915\u093F\u0938\u0938\u0947 \u092E\u093F\u0932\u0924\u093E \u0939\u0948?",["Chlorophyll","\u0915\u094D\u0932\u094B\u0930\u094B\u092B\u093F\u0932"],[["Water","\u092A\u093E\u0928\u0940"],["Soil","\u092E\u093F\u091F\u094D\u091F\u0940"],["Starch","\u092E\u0902\u0921 (\u0938\u094D\u091F\u093E\u0930\u094D\u091A)"]],["Chlorophyll is the green substance that traps sunlight.","\u0915\u094D\u0932\u094B\u0930\u094B\u092B\u093F\u0932 \u0935\u0939 \u0939\u0930\u093E \u092A\u0926\u093E\u0930\u094D\u0925 \u0939\u0948 \u091C\u094B \u0938\u0942\u0930\u094D\u092F \u0915\u093E \u092A\u094D\u0930\u0915\u093E\u0936 \u0917\u094D\u0930\u0939\u0923 \u0915\u0930\u0924\u093E \u0939\u0948\u0964"]],["Which part carries water from the roots to the leaves?","\u0915\u094C\u0928-\u0938\u093E \u092D\u093E\u0917 \u092A\u093E\u0928\u0940 \u0915\u094B \u091C\u0921\u093C\u094B\u0902 \u0938\u0947 \u092A\u0924\u094D\u0924\u093F\u092F\u094B\u0902 \u0924\u0915 \u0932\u0947 \u091C\u093E\u0924\u093E \u0939\u0948?",["Stem","\u0924\u0928\u093E"],[["Flower","\u092B\u0942\u0932"],["Fruit","\u092B\u0932"],["Seed","\u092C\u0940\u091C"]],["The stem carries water up and food down.","\u0924\u0928\u093E \u092A\u093E\u0928\u0940 \u0915\u094B \u090A\u092A\u0930 \u0914\u0930 \u092D\u094B\u091C\u0928 \u0915\u094B \u0928\u0940\u091A\u0947 \u092A\u0939\u0941\u0901\u091A\u093E\u0924\u093E \u0939\u0948\u0964"]],["Which part of a plant grows into a new plant?","\u092A\u094C\u0927\u0947 \u0915\u093E \u0915\u094C\u0928-\u0938\u093E \u092D\u093E\u0917 \u0909\u0917\u0915\u0930 \u0928\u092F\u093E \u092A\u094C\u0927\u093E \u092C\u0928\u0924\u093E \u0939\u0948?",["Seed","\u092C\u0940\u091C"],[["Leaf","\u092A\u0924\u094D\u0924\u0940"],["Bark","\u091B\u093E\u0932"],["Thorn","\u0915\u093E\u0901\u091F\u093E"]],["A seed has a baby plant inside it, with stored food.","\u092C\u0940\u091C \u0915\u0947 \u0905\u0902\u0926\u0930 \u090F\u0915 \u0928\u0928\u094D\u0939\u093E \u092A\u094C\u0927\u093E \u0914\u0930 \u0938\u0902\u091A\u093F\u0924 \u092D\u094B\u091C\u0928 \u0939\u094B\u0924\u093E \u0939\u0948\u0964"]],["Which of these is a carrot?","\u0917\u093E\u091C\u0930 \u092A\u094C\u0927\u0947 \u0915\u093E \u0915\u094C\u0928-\u0938\u093E \u092D\u093E\u0917 \u0939\u0948?",["A root","\u091C\u0921\u093C"],[["A stem","\u0924\u0928\u093E"],["A fruit","\u092B\u0932"],["A leaf","\u092A\u0924\u094D\u0924\u0940"]],["A carrot is a root that stores food.","\u0917\u093E\u091C\u0930 \u090F\u0915 \u091C\u0921\u093C \u0939\u0948 \u091C\u093F\u0938\u092E\u0947\u0902 \u092D\u094B\u091C\u0928 \u0938\u0902\u091A\u093F\u0924 \u0930\u0939\u0924\u093E \u0939\u0948\u0964"]],["A potato is which part of the plant?","\u0906\u0932\u0942 \u092A\u094C\u0927\u0947 \u0915\u093E \u0915\u094C\u0928-\u0938\u093E \u092D\u093E\u0917 \u0939\u0948?",["An underground stem","\u092D\u0942\u092E\u093F\u0917\u0924 \u0924\u0928\u093E"],[["A root","\u091C\u0921\u093C"],["A fruit","\u092B\u0932"],["A seed","\u092C\u0940\u091C"]],['A potato is a stem: it has "eyes" (buds) from which new shoots grow.','\u0906\u0932\u0942 \u090F\u0915 \u0924\u0928\u093E \u0939\u0948: \u0907\u0938\u0915\u0940 "\u0906\u0901\u0916\u094B\u0902" (\u0915\u0932\u093F\u092F\u094B\u0902) \u0938\u0947 \u0928\u090F \u0905\u0902\u0915\u0941\u0930 \u0928\u093F\u0915\u0932\u0924\u0947 \u0939\u0948\u0902\u0964']]]),te("s.animals",4,a("Animals: food and homes","\u091C\u0902\u0924\u0941: \u092D\u094B\u091C\u0928 \u0914\u0930 \u0906\u0935\u093E\u0938"),[],a("Herbivores eat plants, carnivores eat animals, omnivores eat both.","\u0936\u093E\u0915\u093E\u0939\u093E\u0930\u0940 \u092A\u094C\u0927\u0947 \u0916\u093E\u0924\u0947 \u0939\u0948\u0902, \u092E\u093E\u0902\u0938\u093E\u0939\u093E\u0930\u0940 \u091C\u0902\u0924\u0941 \u0916\u093E\u0924\u0947 \u0939\u0948\u0902, \u0938\u0930\u094D\u0935\u093E\u0939\u093E\u0930\u0940 \u0926\u094B\u0928\u094B\u0902 \u0916\u093E\u0924\u0947 \u0939\u0948\u0902\u0964"),[["An animal that eats only plants is called a:","\u0915\u0947\u0935\u0932 \u092A\u094C\u0927\u0947 \u0916\u093E\u0928\u0947 \u0935\u093E\u0932\u0947 \u091C\u0902\u0924\u0941 \u0915\u094B \u0915\u094D\u092F\u093E \u0915\u0939\u0924\u0947 \u0939\u0948\u0902?",["Herbivore","\u0936\u093E\u0915\u093E\u0939\u093E\u0930\u0940"],[["Carnivore","\u092E\u093E\u0902\u0938\u093E\u0939\u093E\u0930\u0940"],["Omnivore","\u0938\u0930\u094D\u0935\u093E\u0939\u093E\u0930\u0940"],["Scavenger","\u0905\u092A\u092E\u093E\u0930\u094D\u091C\u0915"]],["Cows, goats and deer are herbivores.","\u0917\u093E\u092F, \u092C\u0915\u0930\u0940 \u0914\u0930 \u0939\u093F\u0930\u0923 \u0936\u093E\u0915\u093E\u0939\u093E\u0930\u0940 \u0939\u0948\u0902\u0964"]],["Which of these is a carnivore?","\u0907\u0928\u092E\u0947\u0902 \u0938\u0947 \u0915\u094C\u0928 \u092E\u093E\u0902\u0938\u093E\u0939\u093E\u0930\u0940 \u0939\u0948?",["Tiger","\u092C\u093E\u0918"],[["Cow","\u0917\u093E\u092F"],["Rabbit","\u0916\u0930\u0917\u094B\u0936"],["Elephant","\u0939\u093E\u0925\u0940"]],["A tiger hunts and eats other animals.","\u092C\u093E\u0918 \u0926\u0942\u0938\u0930\u0947 \u091C\u0902\u0924\u0941\u0913\u0902 \u0915\u093E \u0936\u093F\u0915\u093E\u0930 \u0915\u0930\u0915\u0947 \u0916\u093E\u0924\u093E \u0939\u0948\u0964"]],["Which animal is an omnivore?","\u0915\u094C\u0928-\u0938\u093E \u091C\u0902\u0924\u0941 \u0938\u0930\u094D\u0935\u093E\u0939\u093E\u0930\u0940 \u0939\u0948?",["Bear","\u092D\u093E\u0932\u0942"],[["Deer","\u0939\u093F\u0930\u0923"],["Lion","\u0936\u0947\u0930"],["Horse","\u0918\u094B\u0921\u093C\u093E"]],["A bear eats fruits, honey and fish, so it eats both plants and animals.","\u092D\u093E\u0932\u0942 \u092B\u0932, \u0936\u0939\u0926 \u0914\u0930 \u092E\u091B\u0932\u0940 \u0916\u093E\u0924\u093E \u0939\u0948, \u092F\u093E\u0928\u0940 \u092A\u094C\u0927\u0947 \u0914\u0930 \u091C\u0902\u0924\u0941 \u0926\u094B\u0928\u094B\u0902\u0964"]],["How does a fish breathe?","\u092E\u091B\u0932\u0940 \u0915\u0948\u0938\u0947 \u0938\u093E\u0901\u0938 \u0932\u0947\u0924\u0940 \u0939\u0948?",["Through gills","\u0917\u0932\u092B\u0921\u093C\u094B\u0902 \u0938\u0947"],[["Through lungs","\u092B\u0947\u092B\u0921\u093C\u094B\u0902 \u0938\u0947"],["Through its skin only","\u0915\u0947\u0935\u0932 \u0924\u094D\u0935\u091A\u093E \u0938\u0947"],["Through its fins","\u092A\u0902\u0916\u094B\u0902 (\u092B\u093F\u0928) \u0938\u0947"]],["Gills take oxygen from the water.","\u0917\u0932\u092B\u0921\u093C\u0947 \u092A\u093E\u0928\u0940 \u0938\u0947 \u0911\u0915\u094D\u0938\u0940\u091C\u0928 \u0932\u0947\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Which animal can live both on land and in water?","\u0915\u094C\u0928-\u0938\u093E \u091C\u0902\u0924\u0941 \u091C\u0932 \u0914\u0930 \u0925\u0932 \u0926\u094B\u0928\u094B\u0902 \u092A\u0930 \u0930\u0939 \u0938\u0915\u0924\u093E \u0939\u0948?",["Frog","\u092E\u0947\u0902\u0922\u0915"],[["Cat","\u092C\u093F\u0932\u094D\u0932\u0940"],["Sparrow","\u0917\u094C\u0930\u0948\u092F\u093E"],["Goat","\u092C\u0915\u0930\u0940"]],["Frogs are amphibians: they live both on land and in water.","\u092E\u0947\u0902\u0922\u0915 \u0909\u092D\u092F\u091A\u0930 \u0939\u0948: \u0935\u0939 \u091C\u0932 \u0914\u0930 \u0925\u0932 \u0926\u094B\u0928\u094B\u0902 \u092A\u0930 \u0930\u0939\u0924\u093E \u0939\u0948\u0964"]],["Why does a camel have a hump?","\u090A\u0901\u091F \u0915\u0947 \u0915\u0942\u092C\u0921\u093C \u0939\u094B\u0924\u093E \u0939\u0948 \u0915\u094D\u092F\u094B\u0902\u0915\u093F:",["It stores fat for use when food is scarce","\u0909\u0938\u092E\u0947\u0902 \u0935\u0938\u093E \u091C\u092E\u093E \u0930\u0939\u0924\u0940 \u0939\u0948 \u091C\u094B \u092D\u094B\u091C\u0928 \u0915\u092E \u0939\u094B\u0928\u0947 \u092A\u0930 \u0915\u093E\u092E \u0906\u0924\u0940 \u0939\u0948"],[["It stores water","\u0909\u0938\u092E\u0947\u0902 \u092A\u093E\u0928\u0940 \u092D\u0930\u093E \u0930\u0939\u0924\u093E \u0939\u0948"],["It helps it run fast","\u0909\u0938\u0938\u0947 \u0935\u0939 \u0924\u0947\u091C\u093C \u0926\u094C\u0921\u093C\u0924\u093E \u0939\u0948"],["It keeps it cool at night","\u0909\u0938\u0938\u0947 \u0935\u0939 \u0930\u093E\u0924 \u092E\u0947\u0902 \u0920\u0902\u0921\u093E \u0930\u0939\u0924\u093E \u0939\u0948"]],["The hump stores fat, which gives energy in the desert.","\u0915\u0942\u092C\u0921\u093C \u092E\u0947\u0902 \u0935\u0938\u093E \u091C\u092E\u093E \u0930\u0939\u0924\u0940 \u0939\u0948 \u091C\u094B \u0930\u0947\u0917\u093F\u0938\u094D\u0924\u093E\u0928 \u092E\u0947\u0902 \u090A\u0930\u094D\u091C\u093E \u0926\u0947\u0924\u0940 \u0939\u0948\u0964"]],["Which of these birds cannot fly?","\u0907\u0928\u092E\u0947\u0902 \u0938\u0947 \u0915\u094C\u0928-\u0938\u093E \u092A\u0915\u094D\u0937\u0940 \u0909\u0921\u093C \u0928\u0939\u0940\u0902 \u0938\u0915\u0924\u093E?",["Ostrich","\u0936\u0941\u0924\u0941\u0930\u092E\u0941\u0930\u094D\u0917"],[["Parrot","\u0924\u094B\u0924\u093E"],["Pigeon","\u0915\u092C\u0942\u0924\u0930"],["Eagle","\u0917\u0930\u0941\u0921\u093C (\u092C\u093E\u091C\u093C)"]],["The ostrich is too heavy to fly, but it runs very fast.","\u0936\u0941\u0924\u0941\u0930\u092E\u0941\u0930\u094D\u0917 \u0909\u0921\u093C\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u092C\u0939\u0941\u0924 \u092D\u093E\u0930\u0940 \u0939\u0948, \u092A\u0930 \u0935\u0939 \u092C\u0939\u0941\u0924 \u0924\u0947\u091C\u093C \u0926\u094C\u0921\u093C\u0924\u093E \u0939\u0948\u0964"]],["Which animal is a mammal?","\u0915\u094C\u0928-\u0938\u093E \u091C\u0902\u0924\u0941 \u0938\u094D\u0924\u0928\u0927\u093E\u0930\u0940 \u0939\u0948?",["Whale","\u0935\u094D\u0939\u0947\u0932"],[["Shark","\u0936\u093E\u0930\u094D\u0915"],["Crocodile","\u092E\u0917\u0930\u092E\u091A\u094D\u091B"],["Snake","\u0938\u093E\u0901\u092A"]],["A whale breathes air with lungs and feeds its young on milk.","\u0935\u094D\u0939\u0947\u0932 \u092B\u0947\u092B\u0921\u093C\u094B\u0902 \u0938\u0947 \u0939\u0935\u093E \u0932\u0947\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0905\u092A\u0928\u0947 \u092C\u091A\u094D\u091A\u094B\u0902 \u0915\u094B \u0926\u0942\u0927 \u092A\u093F\u0932\u093E\u0924\u0940 \u0939\u0948\u0964"]]]),te("s.body",4,a("Our body","\u0939\u092E\u093E\u0930\u093E \u0936\u0930\u0940\u0930"),[],a("Each organ has a job: the heart pumps, the lungs breathe, the brain controls.","\u0939\u0930 \u0905\u0902\u0917 \u0915\u093E \u090F\u0915 \u0915\u093E\u092E \u0939\u0948: \u0939\u0943\u0926\u092F \u0930\u0915\u094D\u0924 \u092A\u0902\u092A \u0915\u0930\u0924\u093E \u0939\u0948, \u092B\u0947\u092B\u0921\u093C\u0947 \u0938\u093E\u0901\u0938 \u0932\u0947\u0924\u0947 \u0939\u0948\u0902, \u092E\u0938\u094D\u0924\u093F\u0937\u094D\u0915 \u0928\u093F\u092F\u0902\u0924\u094D\u0930\u0923 \u0915\u0930\u0924\u093E \u0939\u0948\u0964"),[["Which organ pumps blood around the body?","\u0915\u094C\u0928-\u0938\u093E \u0905\u0902\u0917 \u092A\u0942\u0930\u0947 \u0936\u0930\u0940\u0930 \u092E\u0947\u0902 \u0930\u0915\u094D\u0924 \u092A\u0902\u092A \u0915\u0930\u0924\u093E \u0939\u0948?",["Heart","\u0939\u0943\u0926\u092F"],[["Lungs","\u092B\u0947\u092B\u0921\u093C\u0947"],["Stomach","\u0906\u092E\u093E\u0936\u092F"],["Kidney","\u0917\u0941\u0930\u094D\u0926\u093E"]],["The heart is a muscle that pumps blood without stopping.","\u0939\u0943\u0926\u092F \u090F\u0915 \u092A\u0947\u0936\u0940 \u0939\u0948 \u091C\u094B \u092C\u093F\u0928\u093E \u0930\u0941\u0915\u0947 \u0930\u0915\u094D\u0924 \u092A\u0902\u092A \u0915\u0930\u0924\u093E \u0939\u0948\u0964"]],["Which organs help us breathe?","\u0915\u094C\u0928-\u0938\u0947 \u0905\u0902\u0917 \u0938\u093E\u0901\u0938 \u0932\u0947\u0928\u0947 \u092E\u0947\u0902 \u092E\u0926\u0926 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902?",["Lungs","\u092B\u0947\u092B\u0921\u093C\u0947"],[["Kidneys","\u0917\u0941\u0930\u094D\u0926\u0947"],["Liver","\u092F\u0915\u0943\u0924"],["Intestines","\u0906\u0901\u0924\u0947\u0902"]],["The lungs take in oxygen and give out carbon dioxide.","\u092B\u0947\u092B\u0921\u093C\u0947 \u0911\u0915\u094D\u0938\u0940\u091C\u0928 \u0932\u0947\u0924\u0947 \u0939\u0948\u0902 \u0914\u0930 \u0915\u093E\u0930\u094D\u092C\u0928 \u0921\u093E\u0907\u0911\u0915\u094D\u0938\u093E\u0907\u0921 \u092C\u093E\u0939\u0930 \u0928\u093F\u0915\u093E\u0932\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Which organ controls the whole body?","\u0915\u094C\u0928-\u0938\u093E \u0905\u0902\u0917 \u092A\u0942\u0930\u0947 \u0936\u0930\u0940\u0930 \u0915\u094B \u0928\u093F\u092F\u0902\u0924\u094D\u0930\u093F\u0924 \u0915\u0930\u0924\u093E \u0939\u0948?",["Brain","\u092E\u0938\u094D\u0924\u093F\u0937\u094D\u0915"],[["Heart","\u0939\u0943\u0926\u092F"],["Stomach","\u0906\u092E\u093E\u0936\u092F"],["Lungs","\u092B\u0947\u092B\u0921\u093C\u0947"]],["The brain receives messages through nerves and sends instructions back.","\u092E\u0938\u094D\u0924\u093F\u0937\u094D\u0915 \u0928\u0938\u094B\u0902 \u0938\u0947 \u0938\u0902\u0926\u0947\u0936 \u092A\u093E\u0924\u093E \u0939\u0948 \u0914\u0930 \u0928\u093F\u0930\u094D\u0926\u0947\u0936 \u0935\u093E\u092A\u0938 \u092D\u0947\u091C\u0924\u093E \u0939\u0948\u0964"]],["How many bones does an adult human body have?","\u090F\u0915 \u0935\u092F\u0938\u094D\u0915 \u092E\u0928\u0941\u0937\u094D\u092F \u0915\u0947 \u0936\u0930\u0940\u0930 \u092E\u0947\u0902 \u0915\u093F\u0924\u0928\u0940 \u0939\u0921\u094D\u0921\u093F\u092F\u093E\u0901 \u0939\u094B\u0924\u0940 \u0939\u0948\u0902?",["206","206"],[["106","106"],["306","306"],["26","26"]],["An adult has 206 bones; a newborn baby has more, which join as it grows.","\u0935\u092F\u0938\u094D\u0915 \u092E\u0947\u0902 206 \u0939\u0921\u094D\u0921\u093F\u092F\u093E\u0901 \u0939\u094B\u0924\u0940 \u0939\u0948\u0902; \u0928\u0935\u091C\u093E\u0924 \u092E\u0947\u0902 \u0905\u0927\u093F\u0915 \u0939\u094B\u0924\u0940 \u0939\u0948\u0902 \u091C\u094B \u092C\u0922\u093C\u0928\u0947 \u092A\u0930 \u091C\u0941\u0921\u093C \u091C\u093E\u0924\u0940 \u0939\u0948\u0902\u0964"]],["Which organ cleans the blood and makes urine?","\u0915\u094C\u0928-\u0938\u093E \u0905\u0902\u0917 \u0930\u0915\u094D\u0924 \u0915\u094B \u0938\u093E\u092B\u093C \u0915\u0930\u0915\u0947 \u092E\u0942\u0924\u094D\u0930 \u092C\u0928\u093E\u0924\u093E \u0939\u0948?",["Kidney","\u0917\u0941\u0930\u094D\u0926\u093E"],[["Heart","\u0939\u0943\u0926\u092F"],["Lungs","\u092B\u0947\u092B\u0921\u093C\u0947"],["Brain","\u092E\u0938\u094D\u0924\u093F\u0937\u094D\u0915"]],["The two kidneys filter waste out of the blood.","\u0926\u094B\u0928\u094B\u0902 \u0917\u0941\u0930\u094D\u0926\u0947 \u0930\u0915\u094D\u0924 \u0938\u0947 \u0905\u092A\u0936\u093F\u0937\u094D\u091F \u091B\u093E\u0928\u0915\u0930 \u0928\u093F\u0915\u093E\u0932\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Where does digestion of food begin?","\u092D\u094B\u091C\u0928 \u0915\u093E \u092A\u093E\u091A\u0928 \u0915\u0939\u093E\u0901 \u0938\u0947 \u0936\u0941\u0930\u0942 \u0939\u094B\u0924\u093E \u0939\u0948?",["In the mouth","\u092E\u0941\u0901\u0939 \u092E\u0947\u0902"],[["In the stomach","\u0906\u092E\u093E\u0936\u092F \u092E\u0947\u0902"],["In the heart","\u0939\u0943\u0926\u092F \u092E\u0947\u0902"],["In the lungs","\u092B\u0947\u092B\u0921\u093C\u094B\u0902 \u092E\u0947\u0902"]],["Chewing and saliva start breaking food down in the mouth.","\u091A\u092C\u093E\u0928\u0947 \u0914\u0930 \u0932\u093E\u0930 \u0938\u0947 \u092E\u0941\u0901\u0939 \u092E\u0947\u0902 \u0939\u0940 \u092D\u094B\u091C\u0928 \u091F\u0942\u091F\u0928\u093E \u0936\u0941\u0930\u0942 \u0939\u094B \u091C\u093E\u0924\u093E \u0939\u0948\u0964"]],["Which is the largest organ of the human body?","\u092E\u093E\u0928\u0935 \u0936\u0930\u0940\u0930 \u0915\u093E \u0938\u092C\u0938\u0947 \u092C\u0921\u093C\u093E \u0905\u0902\u0917 \u0915\u094C\u0928-\u0938\u093E \u0939\u0948?",["Skin","\u0924\u094D\u0935\u091A\u093E"],[["Heart","\u0939\u0943\u0926\u092F"],["Brain","\u092E\u0938\u094D\u0924\u093F\u0937\u094D\u0915"],["Liver","\u092F\u0915\u0943\u0924"]],["The skin covers the whole body and protects it.","\u0924\u094D\u0935\u091A\u093E \u092A\u0942\u0930\u0947 \u0936\u0930\u0940\u0930 \u0915\u094B \u0922\u0915\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0909\u0938\u0915\u0940 \u0930\u0915\u094D\u0937\u093E \u0915\u0930\u0924\u0940 \u0939\u0948\u0964"]]]),te("s.food",5,a("Food and nutrients","\u092D\u094B\u091C\u0928 \u0914\u0930 \u092A\u094B\u0937\u0915 \u0924\u0924\u094D\u0935"),["s.body"],a("Carbohydrates and fats give energy, proteins build the body, vitamins and minerals protect it.","\u0915\u093E\u0930\u094D\u092C\u094B\u0939\u093E\u0907\u0921\u094D\u0930\u0947\u091F \u0914\u0930 \u0935\u0938\u093E \u090A\u0930\u094D\u091C\u093E \u0926\u0947\u0924\u0947 \u0939\u0948\u0902, \u092A\u094D\u0930\u094B\u091F\u0940\u0928 \u0936\u0930\u0940\u0930 \u092C\u0928\u093E\u0924\u0947 \u0939\u0948\u0902, \u0935\u093F\u091F\u093E\u092E\u093F\u0928 \u0914\u0930 \u0916\u0928\u093F\u091C \u0930\u0915\u094D\u0937\u093E \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964"),[["Which nutrient helps the body grow and repair itself?","\u0915\u094C\u0928-\u0938\u093E \u092A\u094B\u0937\u0915 \u0924\u0924\u094D\u0935 \u0936\u0930\u0940\u0930 \u0915\u0940 \u0935\u0943\u0926\u094D\u0927\u093F \u0914\u0930 \u092E\u0930\u092E\u094D\u092E\u0924 \u092E\u0947\u0902 \u092E\u0926\u0926 \u0915\u0930\u0924\u093E \u0939\u0948?",["Protein","\u092A\u094D\u0930\u094B\u091F\u0940\u0928"],[["Fat","\u0935\u0938\u093E"],["Water","\u092A\u093E\u0928\u0940"],["Fibre","\u0930\u0947\u0936\u093E"]],["Proteins are body-building foods: pulses, milk, eggs, fish.","\u092A\u094D\u0930\u094B\u091F\u0940\u0928 \u0936\u0930\u0940\u0930-\u0928\u093F\u0930\u094D\u092E\u093E\u0923 \u0915\u0930\u0928\u0947 \u0935\u093E\u0932\u0947 \u092D\u094B\u091C\u0928 \u0939\u0948\u0902: \u0926\u093E\u0932\u0947\u0902, \u0926\u0942\u0927, \u0905\u0902\u0921\u0947, \u092E\u091B\u0932\u0940\u0964"]],["Rice and wheat are rich in:","\u091A\u093E\u0935\u0932 \u0914\u0930 \u0917\u0947\u0939\u0942\u0901 \u092E\u0947\u0902 \u0915\u093F\u0938\u0915\u0940 \u092E\u093E\u0924\u094D\u0930\u093E \u0905\u0927\u093F\u0915 \u0939\u094B\u0924\u0940 \u0939\u0948?",["Carbohydrates","\u0915\u093E\u0930\u094D\u092C\u094B\u0939\u093E\u0907\u0921\u094D\u0930\u0947\u091F"],[["Proteins","\u092A\u094D\u0930\u094B\u091F\u0940\u0928"],["Vitamins","\u0935\u093F\u091F\u093E\u092E\u093F\u0928"],["Minerals","\u0916\u0928\u093F\u091C"]],["Cereals are rich in carbohydrates, which give energy.","\u0905\u0928\u093E\u091C \u092E\u0947\u0902 \u0915\u093E\u0930\u094D\u092C\u094B\u0939\u093E\u0907\u0921\u094D\u0930\u0947\u091F \u0905\u0927\u093F\u0915 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902, \u091C\u094B \u090A\u0930\u094D\u091C\u093E \u0926\u0947\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Lack of vitamin C causes which disease?","\u0935\u093F\u091F\u093E\u092E\u093F\u0928 C \u0915\u0940 \u0915\u092E\u0940 \u0938\u0947 \u0915\u094C\u0928-\u0938\u093E \u0930\u094B\u0917 \u0939\u094B\u0924\u093E \u0939\u0948?",["Scurvy","\u0938\u094D\u0915\u0930\u094D\u0935\u0940"],[["Rickets","\u0930\u093F\u0915\u0947\u091F\u094D\u0938"],["Night blindness","\u0930\u0924\u094C\u0902\u0927\u0940"],["Goitre","\u0918\u0947\u0902\u0918\u093E"]],["Scurvy causes bleeding gums. Citrus fruits like amla and lemon prevent it.","\u0938\u094D\u0915\u0930\u094D\u0935\u0940 \u092E\u0947\u0902 \u092E\u0938\u0942\u0921\u093C\u094B\u0902 \u0938\u0947 \u0916\u0942\u0928 \u0906\u0924\u093E \u0939\u0948\u0964 \u0906\u0901\u0935\u0932\u093E \u0914\u0930 \u0928\u0940\u0902\u092C\u0942 \u091C\u0948\u0938\u0947 \u0916\u091F\u094D\u091F\u0947 \u092B\u0932 \u0907\u0938\u0947 \u0930\u094B\u0915\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Lack of vitamin D causes which disease?","\u0935\u093F\u091F\u093E\u092E\u093F\u0928 D \u0915\u0940 \u0915\u092E\u0940 \u0938\u0947 \u0915\u094C\u0928-\u0938\u093E \u0930\u094B\u0917 \u0939\u094B\u0924\u093E \u0939\u0948?",["Rickets","\u0930\u093F\u0915\u0947\u091F\u094D\u0938"],[["Scurvy","\u0938\u094D\u0915\u0930\u094D\u0935\u0940"],["Anaemia","\u0930\u0915\u094D\u0924\u093E\u0932\u094D\u092A\u0924\u093E"],["Goitre","\u0918\u0947\u0902\u0918\u093E"]],["Rickets makes bones soft. Sunlight helps the body make vitamin D.","\u0930\u093F\u0915\u0947\u091F\u094D\u0938 \u092E\u0947\u0902 \u0939\u0921\u094D\u0921\u093F\u092F\u093E\u0901 \u0915\u092E\u091C\u093C\u094B\u0930 \u0939\u094B \u091C\u093E\u0924\u0940 \u0939\u0948\u0902\u0964 \u0927\u0942\u092A \u0938\u0947 \u0936\u0930\u0940\u0930 \u0935\u093F\u091F\u093E\u092E\u093F\u0928 D \u092C\u0928\u093E\u0924\u093E \u0939\u0948\u0964"]],["Lack of iodine causes:","\u0906\u092F\u094B\u0921\u0940\u0928 \u0915\u0940 \u0915\u092E\u0940 \u0938\u0947 \u0915\u094D\u092F\u093E \u0939\u094B\u0924\u093E \u0939\u0948?",["Goitre","\u0918\u0947\u0902\u0918\u093E"],[["Scurvy","\u0938\u094D\u0915\u0930\u094D\u0935\u0940"],["Rickets","\u0930\u093F\u0915\u0947\u091F\u094D\u0938"],["Night blindness","\u0930\u0924\u094C\u0902\u0927\u0940"]],["Goitre is a swelling of the thyroid gland in the neck. Iodised salt prevents it.","\u0918\u0947\u0902\u0918\u093E \u0917\u0932\u0947 \u0915\u0940 \u0925\u093E\u092F\u0930\u0949\u0907\u0921 \u0917\u094D\u0930\u0902\u0925\u093F \u0915\u0940 \u0938\u0942\u091C\u0928 \u0939\u0948\u0964 \u0906\u092F\u094B\u0921\u0940\u0928 \u092F\u0941\u0915\u094D\u0924 \u0928\u092E\u0915 \u0907\u0938\u0947 \u0930\u094B\u0915\u0924\u093E \u0939\u0948\u0964"]],["Lack of iron in food can cause:","\u092D\u094B\u091C\u0928 \u092E\u0947\u0902 \u0932\u094B\u0939\u0947 (\u0906\u092F\u0930\u0928) \u0915\u0940 \u0915\u092E\u0940 \u0938\u0947 \u0915\u094D\u092F\u093E \u0939\u094B \u0938\u0915\u0924\u093E \u0939\u0948?",["Anaemia","\u0930\u0915\u094D\u0924\u093E\u0932\u094D\u092A\u0924\u093E (\u090F\u0928\u0940\u092E\u093F\u092F\u093E)"],[["Goitre","\u0918\u0947\u0902\u0918\u093E"],["Rickets","\u0930\u093F\u0915\u0947\u091F\u094D\u0938"],["Scurvy","\u0938\u094D\u0915\u0930\u094D\u0935\u0940"]],["Iron is needed to make blood. Green leafy vegetables and jaggery contain iron.","\u0930\u0915\u094D\u0924 \u092C\u0928\u093E\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0932\u094B\u0939\u093E \u091A\u093E\u0939\u093F\u090F\u0964 \u0939\u0 940 \u0915\u0940 \u092C\u0942\u0901\u0926\u0947\u0902 \u0915\u093F\u0938 \u092A\u094D\u0930\u0915\u094D\u0930\u093F\u092F\u093E \u0938\u0947 \u092C\u0928\u0924\u0940 \u0939\u0948\u0902?",["Condensation","\u0938\u0902\u0918\u0928\u0928"],[["Evaporation","\u0935\u093E\u0937\u094D\u092A\u0940\u0915\u0930\u0923"],["Leaking through the glass","\u0917\u093F\u0932\u093E\u0938 \u0938\u0947 \u0930\u093F\u0938\u0915\u0930"],["Melting","\u092A\u093F\u0918\u0932\u0915\u0930"]],["Water vapour in the air cools on the cold glass and turns into drops.","\u0939\u0935\u093E \u0915\u0940 \u091C\u0932\u0935\u093E\u0937\u094D\u092A \u0920\u0902\u0921\u0947 \u0917\u093F\u0932\u093E\u0938 \u092A\u0930 \u0920\u0902\u0921\u0940 \u0939\u094B\u0915\u0930 \u092C\u0942\u0901\u0926\u094B\u0902 \u092E\u0947\u0902 \u092C\u0926\u0932 \u091C\u093E\u0924\u0940 \u0939\u0948\u0964"]],["Which gas makes up most of the air?","\u0935\u093E\u092F\u0941 \u092E\u0947\u0902 \u0938\u092C\u0938\u0947 \u0905\u0927\u093F\u0915 \u092E\u093E\u0924\u094D\u0930\u093E \u0915\u093F\u0938 \u0917\u0948\u0938 \u0915\u0940 \u0939\u0948?",["Nitrogen","\u0928\u093E\u0907\u091F\u094D\u0930\u094B\u091C\u0928"],[["Oxygen","\u0911\u0915\u094D\u0938\u0940\u091C\u0928"],["Carbon dioxide","\u0915\u093E\u0930\u094D\u092C\u0928 \u0921\u093E\u0907\u0911\u0915\u094D\u0938\u093E\u0907\u0921"],["Hydrogen","\u0939\u093E\u0907\u0921\u094D\u0930\u094B\u091C\u0928"]],["Air is about 78% nitrogen and 21% oxygen.","\u0935\u093E\u092F\u0941 \u092E\u0947\u0902 \u0932\u0917\u092D\u0917 78% \u0928\u093E\u0907\u091F\u094D\u0930\u094B\u091C\u0928 \u0914\u0930 21% \u0911\u0915\u094D\u0938\u0940\u091C\u0928 \u0939\u0948\u0964"]],["Which gas do we need to breathe in?","\u0938\u093E\u0901\u0938 \u0932\u0947\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0939\u092E\u0947\u0902 \u0915\u094C\u0928-\u0938\u0940 \u0917\u0948\u0938 \u091A\u093E\u0939\u093F\u090F?",["Oxygen","\u0911\u0915\u094D\u0938\u0940\u091C\u0928"],[["Nitrogen","\u0928\u093E\u0907\u091F\u094
