928 \u092C\u0928\u093E\u0924\u093E \u0939\u0948?",["Leaf","\u092A\u0924\u094D\u0924\u0940"],[["Root","\u091C\u0921\u093C"],["Stem","\u0924\u0928\u093E"],["Seed","\u092C\u0940\u091C"]],["Green leaves make food using sunlight, water and air. This is photosynthesis.","\u0939\u0930\u0940 \u092A\u0924\u094D\u0924\u093F\u092F\u093E\u0901 \u0938\u0942\u0930\u094D\u092F \u0915\u0947 \u092A\u094D\u0930\u0915\u093E\u0936, \u092A\u093E\u0928\u0940 \u0914\u0930 \u0939\u0935\u093E \u0938\u0947 \u092D\u094B\u091C\u0928 \u092C\u0928\u093E\u0924\u0940 \u0939\u0948\u0902\u0964 \u0907\u0938\u0947 \u092A\u094D\u0930\u0915\u093E\u0936 \u0938\u0902\u0936\u094D\u0932\u0947\u0937\u0923 \u0915\u0939\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Which gas do leaves take in to make food?","\u092D\u094B\u091C\u0928 \u092C\u0928\u093E\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u092A\u0924\u094D\u0924\u093F\u092F\u093E\u0901 \u0915\u094C\u0928-\u0938\u0940 \u0917\u0948\u0938 \u0932\u0947\u0924\u0940 \u0939\u0948\u0902?",["Carbon dioxide","\u0915\u093E\u0930\u094D\u092C\u0928 \u0921\u093E\u0907\u0911\u0915\u094D\u0938\u093E\u0907\u0921"],[["Oxygen","\u0911\u0915\u094D\u0938\u0940\u091C\u0928"],["Nitrogen","\u0928\u093E\u0907\u091F\u094D\u0930\u094B\u091C\u0928"],["Hydrogen","\u0939\u093E\u0907\u0921\u094D\u0930\u094B\u091C\u0928"]],["Leaves take in carbon dioxide and give out oxygen while making food.","\u092D\u094B\u091C\u0928 \u092C\u0928\u093E\u0924\u0947 \u0938\u092E\u092F \u092A\u0924\u094D\u0924\u093F\u092F\u093E\u0901 \u0915\u093E\u0930\u094D\u092C\u0928 \u0921\u093E\u0907\u0911\u0915\u094D\u0938\u093E\u0907\u0921 \u0932\u0947\u0924\u0940 \u0939\u0948\u0902 \u0914\u0930 \u0911\u0915\u094D\u0938\u0940\u091C\u0928 \u091B\u094B\u0921\u093C\u0924\u0940 \u0939\u0948\u0902\u0964"]],["What gives leaves their green colour?","\u092A\u0924\u094D\u0924\u093F\u092F\u094B\u0902 \u0915\u094B \u0939\u0930\u093E \u0930\u0902\u0917 \u0915\u093F\u0938\u0938\u0947 \u092E\u093F\u0932\u0924\u093E \u0939\u0948?",["Chlorophyll","\u0915\u094D\u0932\u094B\u0930\u094B\u092B\u093F\u0932"],[["Water","\u092A\u093E\u0928\u0940"],["Soil","\u092E\u093F\u091F\u094D\u091F\u0940"],["Starch","\u092E\u0902\u0921 (\u0938\u094D\u091F\u093E\u0930\u094D\u091A)"]],["Chlorophyll is the green substance that traps sunlight.","\u0915\u094D\u0932\u094B\u0930\u094B\u092B\u093F\u0932 \u0935\u0939 \u0939\u0930\u093E \u092A\u0926\u093E\u0930\u094D\u0925 \u0939\u0948 \u091C\u094B \u0938\u0942\u0930\u094D\u092F \u0915\u093E \u092A\u094D\u0930\u0915\u093E\u0936 \u0917\u094D\u0930\u0939\u0923 \u0915\u0930\u0924\u093E \u0939\u0948\u0964"]],["Which part carries water from the roots to the leaves?","\u0915\u094C\u0928-\u0938\u093E \u092D\u093E\u0917 \u092A\u093E\u0928\u0940 \u0915\u094B \u091C\u0921\u093C\u094B\u0902 \u0938\u0947 \u092A\u0924\u094D\u0924\u093F\u092F\u094B\u0902 \u0924\u0915 \u0932\u0947 \u091C\u093E\u0924\u093E \u0939\u0948?",["Stem","\u0924\u0928\u093E"],[["Flower","\u092B\u0942\u0932"],["Fruit","\u092B\u0932"],["Seed","\u092C\u0940\u091C"]],["The stem carries water up and food down.","\u0924\u0928\u093E \u092A\u093E\u0928\u0940 \u0915\u094B \u090A\u092A\u0930 \u0914\u0930 \u092D\u094B\u091C\u0928 \u0915\u094B \u0928\u0940\u091A\u0947 \u092A\u0939\u0941\u0901\u091A\u093E\u0924\u093E \u0939\u0948\u0964"]],["Which part of a plant grows into a new plant?","\u092A\u094C\u0927\u0947 \u0915\u093E \u0915\u094C\u0928-\u0938\u093E \u092D\u093E\u0917 \u0909\u0917\u0915\u0930 \u0928\u092F\u093E \u092A\u094C\u0927\u093E \u092C\u0928\u0924\u093E \u0939\u0948?",["Seed","\u092C\u0940\u091C"],[["Leaf","\u092A\u0924\u094D\u0924\u0940"],["Bark","\u091B\u093E\u0932"],["Thorn","\u0915\u093E\u0901\u091F\u093E"]],["A seed has a baby plant inside it, with stored food.","\u092C\u0940\u091C \u0915\u0947 \u0905\u0902\u0926\u0930 \u090F\u0915 \u0928\u0928\u094D\u0939\u093E \u092A\u094C\u0927\u093E \u0914\u0930 \u0938\u0902\u091A\u093F\u0924 \u092D\u094B\u091C\u0928 \u0939\u094B\u0924\u093E \u0939\u0948\u0964"]],["Which of these is a carrot?","\u0917\u093E\u091C\u0930 \u092A\u094C\u0927\u0947 \u0915\u093E \u0915\u094C\u0928-\u0938\u093E \u092D\u093E\u0917 \u0939\u0948?",["A root","\u091C\u0921\u093C"],[["A stem","\u0924\u0928\u093E"],["A fruit","\u092B\u0932"],["A leaf","\u092A\u0924\u094D\u0924\u0940"]],["A carrot is a root that stores food.","\u0917\u093E\u091C\u0930 \u090F\u0915 \u091C\u0921\u093C \u0939\u0948 \u091C\u093F\u0938\u092E\u0947\u0902 \u092D\u094B\u091C\u0928 \u0938\u0902\u091A\u093F\u0924 \u0930\u0939\u0924\u093E \u0939\u0948\u0964"]],["A potato is which part of the plant?","\u0906\u0932\u0942 \u092A\u094C\u0927\u0947 \u0915\u093E \u0915\u094C\u0928-\u0938\u093E \u092D\u093E\u0917 \u0939\u0948?",["An underground stem","\u092D\u0942\u092E\u093F\u0917\u0924 \u0924\u0928\u093E"],[["A root","\u091C\u0921\u093C"],["A fruit","\u092B\u0932"],["A seed","\u092C\u0940\u091C"]],['A potato is a stem: it has "eyes" (buds) from which new shoots grow.','\u0906\u0932\u0942 \u090F\u0915 \u0924\u0928\u093E \u0939\u0948: \u0907\u0938\u0915\u0940 "\u0906\u0901\u0916\u094B\u0902" (\u0915\u0932\u093F\u092F\u094B\u0902) \u0938\u0947 \u0928\u090F \u0905\u0902\u0915\u0941\u0930 \u0928\u093F\u0915\u0932\u0924\u0947 \u0939\u0948\u0902\u0964']]]),q("s.animals",4,s("Animals: food and homes","\u091C\u0902\u0924\u0941: \u092D\u094B\u091C\u0928 \u0914\u0930 \u0906\u0935\u093E\u0938"),[],s("Herbivores eat plants, carnivores eat animals, omnivores eat both.","\u0936\u093E\u0915\u093E\u0939\u093E\u0930\u0940 \u092A\u094C\u0927\u0947 \u0916\u093E\u0924\u0947 \u0939\u0948\u0902, \u092E\u093E\u0902\u0938\u093E\u0939\u093E\u0930\u0940 \u091C\u0902\u0924\u0941 \u0916\u093E\u0924\u0947 \u0939\u0948\u0902, \u0938\u0930\u094D\u0935\u093E\u0939\u093E\u0930\u0940 \u0926\u094B\u0928\u094B\u0902 \u0916\u093E\u0924\u0947 \u0939\u0948\u0902\u0964"),[["An animal that eats only plants is called a:","\u0915\u0947\u0935\u0932 \u092A\u094C\u0927\u0947 \u0916\u093E\u0928\u0947 \u0935\u093E\u0932\u0947 \u091C\u0902\u0924\u0941 \u0915\u094B \u0915\u094D\u092F\u093E \u0915\u0939\u0924\u0947 \u0939\u0948\u0902?",["Herbivore","\u0936\u093E\u0915\u093E\u0939\u093E\u0930\u0940"],[["Carnivore","\u092E\u093E\u0902\u0938\u093E\u0939\u093E\u0930\u0940"],["Omnivore","\u0938\u0930\u094D\u0935\u093E\u0939\u093E\u0930\u0940"],["Scavenger","\u0905\u092A\u092E\u093E\u0930\u094D\u091C\u0915"]],["Cows, goats and deer are herbivores.","\u0917\u093E\u092F, \u092C\u0915\u0930\u0940 \u0914\u0930 \u0939\u093F\u0930\u0923 \u0936\u093E\u0915\u093E\u0939\u093E\u0930\u0940 \u0939\u0948\u0902\u0964"]],["Which of these is a carnivore?","\u0907\u0928\u092E\u0947\u0902 \u0938\u0947 \u0915\u094C\u0928 \u092E\u093E\u0902\u0938\u093E\u0939\u093E\u0930\u0940 \u0939\u0948?",["Tiger","\u092C\u093E\u0918"],[["Cow","\u0917\u093E\u092F"],["Rabbit","\u0916\u0930\u0917\u094B\u0936"],["Elephant","\u0939\u093E\u0925\u0940"]],["A tiger hunts and eats other animals.","\u092C\u093E\u0918 \u0926\u0942\u0938\u0930\u0947 \u091C\u0902\u0924\u0941\u0913\u0902 \u0915\u093E \u0936\u093F\u0915\u093E\u0930 \u0915\u0930\u0915\u0947 \u0916\u093E\u0924\u093E \u0939\u0948\u0964"]],["Which animal is an omnivore?","\u0915\u094C\u0928-\u0938\u093E \u091C\u0902\u0924\u0941 \u0938\u0930\u094D\u0935\u093E\u0939\u093E\u0930\u0940 \u0939\u0948?",["Bear","\u092D\u093E\u0932\u0942"],[["Deer","\u0939\u093F\u0930\u0923"],["Lion","\u0936\u0947\u0930"],["Horse","\u0918\u094B\u0921\u093C\u093E"]],["A bear eats fruits, honey and fish, so it eats both plants and animals.","\u092D\u093E\u0932\u0942 \u092B\u0932, \u0936\u0939\u0926 \u0914\u0930 \u092E\u091B\u0932\u0940 \u0916\u093E\u0924\u093E \u0939\u0948, \u092F\u093E\u0928\u0940 \u092A\u094C\u0927\u0947 \u0914\u0930 \u091C\u0902\u0924\u0941 \u0926\u094B\u0928\u094B\u0902\u0964"]],["How does a fish breathe?","\u092E\u091B\u0932\u0940 \u0915\u0948\u0938\u0947 \u0938\u093E\u0901\u0938 \u0932\u0947\u0924\u0940 \u0939\u0948?",["Through gills","\u0917\u0932\u092B\u0921\u093C\u094B\u0902 \u0938\u0947"],[["Through lungs","\u092B\u0947\u092B\u0921\u093C\u094B\u0902 \u0938\u0947"],["Through its skin only","\u0915\u0947\u0935\u0932 \u0924\u094D\u0935\u091A\u093E \u0938\u0947"],["Through its fins","\u092A\u0902\u0916\u094B\u0902 (\u092B\u093F\u0928) \u0938\u0947"]],["Gills take oxygen from the water.","\u0917\u0932\u092B\u0921\u093C\u0947 \u092A\u093E\u0928\u0940 \u0938\u0947 \u0911\u0915\u094D\u0938\u0940\u091C\u0928 \u0932\u0947\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Which animal can live both on land and in water?","\u0915\u094C\u0928-\u0938\u093E \u091C\u0902\u0924\u0941 \u091C\u0932 \u0914\u0930 \u0925\u0932 \u0926\u094B\u0928\u094B\u0902 \u092A\u0930 \u0930\u0939 \u0938\u0915\u0924\u093E \u0939\u0948?",["Frog","\u092E\u0947\u0902\u0922\u0915"],[["Cat","\u092C\u093F\u0932\u094D\u0932\u0940"],["Sparrow","\u0917\u094C\u0930\u0948\u092F\u093E"],["Goat","\u092C\u0915\u0930\u0940"]],["Frogs are amphibians: they live both on land and in water.","\u092E\u0947\u0902\u0922\u0915 \u0909\u092D\u092F\u091A\u0930 \u0939\u0948: \u0935\u0939 \u091C\u0932 \u0914\u0930 \u0925\u0932 \u0926\u094B\u0928\u094B\u0902 \u092A\u0930 \u0930\u0939\u0924\u093E \u0939\u0948\u0964"]],["Why does a camel have a hump?","\u090A\u0901\u091F \u0915\u0947 \u0915\u0942\u092C\u0921\u093C \u0939\u094B\u0924\u093E \u0939\u0948 \u0915\u094D\u092F\u094B\u0902\u0915\u093F:",["It stores fat for use when food is scarce","\u0909\u0938\u092E\u0947\u0902 \u0935\u0938\u093E \u091C\u092E\u093E \u0930\u0939\u0924\u0940 \u0939\u0948 \u091C\u094B \u092D\u094B\u091C\u0928 \u0915\u092E \u0939\u094B\u0928\u0947 \u092A\u0930 \u0915\u093E\u092E \u0906\u0924\u0940 \u0939\u0948"],[["It stores water","\u0909\u0938\u092E\u0947\u0902 \u092A\u093E\u0928\u0940 \u092D\u0930\u093E \u0930\u0939\u0924\u093E \u0939\u0948"],["It helps it run fast","\u0909\u0938\u0938\u0947 \u0935\u0939 \u0924\u0947\u091C\u093C \u0926\u094C\u0921\u093C\u0924\u093E \u0939\u0948"],["It keeps it cool at night","\u0909\u0938\u0938\u0947 \u0935\u0939 \u0930\u093E\u0924 \u092E\u0947\u0902 \u0920\u0902\u0921\u093E \u0930\u0939\u0924\u093E \u0939\u0948"]],["The hump stores fat, which gives energy in the desert.","\u0915\u0942\u092C\u0921\u093C \u092E\u0947\u0902 \u0935\u0938\u093E \u091C\u092E\u093E \u0930\u0939\u0924\u0940 \u0939\u0948 \u091C\u094B \u0930\u0947\u0917\u093F\u0938\u094D\u0924\u093E\u0928 \u092E\u0947\u0902 \u090A\u0930\u094D\u091C\u093E \u0926\u0947\u0924\u0940 \u0939\u0948\u0964"]],["Which of these birds cannot fly?","\u0907\u0928\u092E\u0947\u0902 \u0938\u0947 \u0915\u094C\u0928-\u0938\u093E \u092A\u0915\u094D\u0937\u0940 \u0909\u0921\u093C \u0928\u0939\u0940\u0902 \u0938\u0915\u0924\u093E?",["Ostrich","\u0936\u0941\u0924\u0941\u0930\u092E\u0941\u0930\u094D\u0917"],[["Parrot","\u0924\u094B\u0924\u093E"],["Pigeon","\u0915\u092C\u0942\u0924\u0930"],["Eagle","\u0917\u0930\u0941\u0921\u093C (\u092C\u093E\u091C\u093C)"]],["The ostrich is too heavy to fly, but it runs very fast.","\u0936\u0941\u0924\u0941\u0930\u092E\u0941\u0930\u094D\u0917 \u0909\u0921\u093C\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u092C\u0939\u0941\u0924 \u092D\u093E\u0930\u0940 \u0939\u0948, \u092A\u0930 \u0935\u0939 \u092C\u0939\u0941\u0924 \u0924\u0947\u091C\u093C \u0926\u094C\u0921\u093C\u0924\u093E \u0939\u0948\u0964"]],["Which animal is a mammal?","\u0915\u094C\u0928-\u0938\u093E \u091C\u0902\u0924\u0941 \u0938\u094D\u0924\u0928\u0927\u093E\u0930\u0940 \u0939\u0948?",["Whale","\u0935\u094D\u0939\u0947\u0932"],[["Shark","\u0936\u093E\u0930\u094D\u0915"],["Crocodile","\u092E\u0917\u0930\u092E\u091A\u094D\u091B"],["Snake","\u0938\u093E\u0901\u092A"]],["A whale breathes air with lungs and feeds its young on milk.","\u0935\u094D\u0939\u0947\u0932 \u092B\u0947\u092B\u0921\u093C\u094B\u0902 \u0938\u0947 \u0939\u0935\u093E \u0932\u0947\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0905\u092A\u0928\u0947 \u092C\u091A\u094D\u091A\u094B\u0902 \u0915\u094B \u0926\u0942\u0927 \u092A\u093F\u0932\u093E\u0924\u0940 \u0939\u0948\u0964"]]]),q("s.body",4,s("Our body","\u0939\u092E\u093E\u0930\u093E \u0936\u0930\u0940\u0930"),[],s("Each organ has a job: the heart pumps, the lungs breathe, the brain controls.","\u0939\u0930 \u0905\u0902\u0917 \u0915\u093E \u090F\u0915 \u0915\u093E\u092E \u0939\u0948: \u0939\u0943\u0926\u092F \u0930\u0915\u094D\u0924 \u092A\u0902\u092A \u0915\u0930\u0924\u093E \u0939\u0948, \u092B\u0947\u092B\u0921\u093C\u0947 \u0938\u093E\u0901\u0938 \u0932\u0947\u0924\u0947 \u0939\u0948\u0902, \u092E\u0938\u094D\u0924\u093F\u0937\u094D\u0915 \u0928\u093F\u092F\u0902\u0924\u094D\u0930\u0923 \u0915\u0930\u0924\u093E \u0939\u0948\u0964"),[["Which organ pumps blood around the body?","\u0915\u094C\u0928-\u0938\u093E \u0905\u0902\u0917 \u092A\u0942\u0930\u0947 \u0936\u0930\u0940\u0930 \u092E\u0947\u0902 \u0930\u0915\u094D\u0924 \u092A\u0902\u092A \u0915\u0930\u0924\u093E \u0939\u0948?",["Heart","\u0939\u0943\u0926\u092F"],[["Lungs","\u092B\u0947\u092B\u0921\u093C\u0947"],["Stomach","\u0906\u092E\u093E\u0936\u092F"],["Kidney","\u0917\u0941\u0930\u094D\u0926\u093E"]],["The heart is a muscle that pumps blood without stopping.","\u0939\u0943\u0926\u092F \u090F\u0915 \u092A\u0947\u0936\u0940 \u0939\u0948 \u091C\u094B \u092C\u093F\u0928\u093E \u0930\u0941\u0915\u0947 \u0930\u0915\u094D\u0924 \u092A\u0902\u092A \u0915\u0930\u0924\u093E \u0939\u0948\u0964"]],["Which organs help us breathe?","\u0915\u094C\u0928-\u0938\u0947 \u0905\u0902\u0917 \u0938\u093E\u0901\u0938 \u0932\u0947\u0928\u0947 \u092E\u0947\u0902 \u092E\u0926\u0926 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902?",["Lungs","\u092B\u0947\u092B\u0921\u093C\u0947"],[["Kidneys","\u0917\u0941\u0930\u094D\u0926\u0947"],["Liver","\u092F\u0915\u0943\u0924"],["Intestines","\u0906\u0901\u0924\u0947\u0902"]],["The lungs take in oxygen and give out carbon dioxide.","\u092B\u0947\u092B\u0921\u093C\u0947 \u0911\u0915\u094D\u0938\u0940\u091C\u0928 \u0932\u0947\u0924\u0947 \u0939\u0948\u0902 \u0914\u0930 \u0915\u093E\u0930\u094D\u092C\u0928 \u0921\u093E\u0907\u0911\u0915\u094D\u0938\u093E\u0907\u0921 \u092C\u093E\u0939\u0930 \u0928\u093F\u0915\u093E\u0932\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Which organ controls the whole body?","\u0915\u094C\u0928-\u0938\u093E \u0905\u0902\u0917 \u092A\u0942\u0930\u0947 \u0936\u0930\u0940\u0930 \u0915\u094B \u0928\u093F\u092F\u0902\u0924\u094D\u0930\u093F\u0924 \u0915\u0930\u0924\u093E \u0939\u0948?",["Brain","\u092E\u0938\u094D\u0924\u093F\u0937\u094D\u0915"],[["Heart","\u0939\u0943\u0926\u092F"],["Stomach","\u0906\u092E\u093E\u0936\u092F"],["Lungs","\u092B\u0947\u092B\u0921\u093C\u0947"]],["The brain receives messages through nerves and sends instructions back.","\u092E\u0938\u094D\u0924\u093F\u0937\u094D\u0915 \u0928\u0938\u094B\u0902 \u0938\u0947 \u0938\u0902\u0926\u0947\u0936 \u092A\u093E\u0924\u093E \u0939\u0948 \u0914\u0930 \u0928\u093F\u0930\u094D\u0926\u0947\u0936 \u0935\u093E\u092A\u0938 \u092D\u0947\u091C\u0924\u093E \u0939\u0948\u0964"]],["How many bones does an adult human body have?","\u090F\u0915 \u0935\u092F\u0938\u094D\u0915 \u092E\u0928\u0941\u0937\u094D\u092F \u0915\u0947 \u0936\u0930\u0940\u0930 \u092E\u0947\u0902 \u0915\u093F\u0924\u0928\u0940 \u0939\u0921\u094D\u0921\u093F\u092F\u093E\u0901 \u0939\u094B\u0924\u0940 \u0939\u0948\u0902?",["206","206"],[["106","106"],["306","306"],["26","26"]],["An adult has 206 bones; a newborn baby has more, which join as it grows.","\u0935\u092F\u0938\u094D\u0915 \u092E\u0947\u0902 206 \u0939\u0921\u094D\u0921\u093F\u092F\u093E\u0901 \u0939\u094B\u0924\u0940 \u0939\u0948\u0902; \u0928\u0935\u091C\u093E\u0924 \u092E\u0947\u0902 \u0905\u0927\u093F\u0915 \u0939\u094B\u0924\u0940 \u0939\u0948\u0902 \u091C\u094B \u092C\u0922\u093C\u0928\u0947 \u092A\u0930 \u091C\u0941\u0921\u093C \u091C\u093E\u0924\u0940 \u0939\u0948\u0902\u0964"]],["Which organ cleans the blood and makes urine?","\u0915\u094C\u0928-\u0938\u093E \u0905\u0902\u0917 \u0930\u0915\u094D\u0924 \u0915\u094B \u0938\u093E\u092B\u093C \u0915\u0930\u0915\u0947 \u092E\u0942\u0924\u094D\u0930 \u092C\u0928\u093E\u0924\u093E \u0939\u0948?",["Kidney","\u0917\u0941\u0930\u094D\u0926\u093E"],[["Heart","\u0939\u0943\u0926\u092F"],["Lungs","\u092B\u0947\u092B\u0921\u093C\u0947"],["Brain","\u092E\u0938\u094D\u0924\u093F\u0937\u094D\u0915"]],["The two kidneys filter waste out of the blood.","\u0926\u094B\u0928\u094B\u0902 \u0917\u0941\u0930\u094D\u0926\u0947 \u0930\u0915\u094D\u0924 \u0938\u0947 \u0905\u092A\u0936\u093F\u0937\u094D\u091F \u091B\u093E\u0928\u0915\u0930 \u0928\u093F\u0915\u093E\u0932\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Where does digestion of food begin?","\u092D\u094B\u091C\u0928 \u0915\u093E \u092A\u093E\u091A\u0928 \u0915\u0939\u093E\u0901 \u0938\u0947 \u0936\u0941\u0930\u0942 \u0939\u094B\u0924\u093E \u0939\u0948?",["In the mouth","\u092E\u0941\u0901\u0939 \u092E\u0947\u0902"],[["In the stomach","\u0906\u092E\u093E\u0936\u092F \u092E\u0947\u0902"],["In the heart","\u0939\u0943\u0926\u092F \u092E\u0947\u0902"],["In the lungs","\u092B\u0947\u092B\u0921\u093C\u094B\u0902 \u092E\u0947\u0902"]],["Chewing and saliva start breaking food down in the mouth.","\u091A\u092C\u093E\u0928\u0947 \u0914\u0930 \u0932\u093E\u0930 \u0938\u0947 \u092E\u0941\u0901\u0939 \u092E\u0947\u0902 \u0939\u0940 \u092D\u094B\u091C\u0928 \u091F\u0942\u091F\u0928\u093E \u0936\u0941\u0930\u0942 \u0939\u094B \u091C\u093E\u0924\u093E \u0939\u0948\u0964"]],["Which is the largest organ of the human body?","\u092E\u093E\u0928\u0935 \u0936\u0930\u0940\u0930 \u0915\u093E \u0938\u092C\u0938\u0947 \u092C\u0921\u093C\u093E \u0905\u0902\u0917 \u0915\u094C\u0928-\u0938\u093E \u0939\u0948?",["Skin","\u0924\u094D\u0935\u091A\u093E"],[["Heart","\u0939\u0943\u0926\u092F"],["Brain","\u092E\u0938\u094D\u0924\u093F\u0937\u094D\u0915"],["Liver","\u092F\u0915\u0943\u0924"]],["The skin covers the whole body and protects it.","\u0924\u094D\u0935\u091A\u093E \u092A\u0942\u0930\u0947 \u0936\u0930\u0940\u0930 \u0915\u094B \u0922\u0915\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0909\u0938\u0915\u0940 \u0930\u0915\u094D\u0937\u093E \u0915\u0930\u0924\u0940 \u0939\u0948\u0964"]]]),q("s.food",5,s("Food and nutrients","\u092D\u094B\u091C\u0928 \u0914\u0930 \u092A\u094B\u0937\u0915 \u0924\u0924\u094D\u0935"),["s.body"],s("Carbohydrates and fats give energy, proteins build the body, vitamins and minerals protect it.","\u0915\u093E\u0930\u094D\u092C\u094B\u0939\u093E\u0907\u0921\u094D\u0930\u0947\u091F \u0914\u0930 \u0935\u0938\u093E \u090A\u0930\u094D\u091C\u093E \u0926\u0947\u0924\u0947 \u0939\u0948\u0902, \u092A\u094D\u0930\u094B\u091F\u0940\u0928 \u0936\u0930\u0940\u0930 \u092C\u0928\u093E\u0924\u0947 \u0939\u0948\u0902, \u0935\u093F\u091F\u093E\u092E\u093F\u0928 \u0914\u0930 \u0916\u0928\u093F\u091C \u0930\u0915\u094D\u0937\u093E \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964"),[["Which nutrient helps the body grow and repair itself?","\u0915\u094C\u0928-\u0938\u093E \u092A\u094B\u0937\u0915 \u0924\u0924\u094D\u0935 \u0936\u0930\u0940\u0930 \u0915\u0940 \u0935\u0943\u0926\u094D\u0927\u093F \u0914\u0930 \u092E\u0930\u092E\u094D\u092E\u0924 \u092E\u0947\u0902 \u092E\u0926\u0926 \u0915\u0930\u0924\u093E \u0939\u0948?",["Protein","\u092A\u094D\u0930\u094B\u091F\u0940\u0928"],[["Fat","\u0935\u0938\u093E"],["Water","\u092A\u093E\u0928\u0940"],["Fibre","\u0930\u0947\u0936\u093E"]],["Proteins are body-building foods: pulses, milk, eggs, fish.","\u092A\u094D\u0930\u094B\u091F\u0940\u0928 \u0936\u0930\u0940\u0930-\u0928\u093F\u0930\u094D\u092E\u093E\u0923 \u0915\u0930\u0928\u0947 \u0935\u093E\u0932\u0947 \u092D\u094B\u091C\u0928 \u0939\u0948\u0902: \u0926\u093E\u0932\u0947\u0902, \u0926\u0942\u0927, \u0905\u0902\u0921\u0947, \u092E\u091B\u0932\u0940\u0964"]],["Rice and wheat are rich in:","\u091A\u093E\u0935\u0932 \u0914\u0930 \u0917\u0947\u0939\u0942\u0901 \u092E\u0947\u0902 \u0915\u093F\u0938\u0915\u0940 \u092E\u093E\u0924\u094D\u0930\u093E \u0905\u0927\u093F\u0915 \u0939\u094B\u0924\u0940 \u0939\u0948?",["Carbohydrates","\u0915\u093E\u0930\u094D\u092C\u094B\u0939\u093E\u0907\u0921\u094D\u0930\u0947\u091F"],[["Proteins","\u092A\u094D\u0930\u094B\u091F\u0940\u0928"],["Vitamins","\u0935\u093F\u091F\u093E\u092E\u093F\u0928"],["Minerals","\u0916\u0928\u093F\u091C"]],["Cereals are rich in carbohydrates, which give energy.","\u0905\u0928\u093E\u091C \u092E\u0947\u0902 \u0915\u093E\u0930\u094D\u092C\u094B\u0939\u093E\u0907\u0921\u094D\u0930\u0947\u091F \u0905\u0927\u093F\u0915 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902, \u091C\u094B \u090A\u0930\u094D\u091C\u093E \u0926\u0947\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Lack of vitamin C causes which disease?","\u0935\u093F\u091F\u093E\u092E\u093F\u0928 C \u0915\u0940 \u0915\u092E\u0940 \u0938\u0947 \u0915\u094C\u0928-\u0938\u093E \u0930\u094B\u0917 \u0939\u094B\u0924\u093E \u0939\u0948?",["Scurvy","\u0938\u094D\u0915\u0930\u094D\u0935\u0940"],[["Rickets","\u0930\u093F\u0915\u0947\u091F\u094D\u0938"],["Night blindness","\u0930\u0924\u094C\u0902\u0927\u0940"],["Goitre","\u0918\u0947\u0902\u0918\u093E"]],["Scurvy causes bleeding gums. Citrus fruits like amla and lemon prevent it.","\u0938\u094D\u0915\u0930\u094D\u0935\u0940 \u092E\u0947\u0902 \u092E\u0938\u0942\u0921\u093C\u094B\u0902 \u0938\u0947 \u0916\u0942\u0928 \u0906\u0924\u093E \u0939\u0948\u0964 \u0906\u0901\u0935\u0932\u093E \u0914\u0930 \u0928\u0940\u0902\u092C\u0942 \u091C\u0948\u0938\u0947 \u0916\u091F\u094D\u091F\u0947 \u092B\u0932 \u0907\u0938\u0947 \u0930\u094B\u0915\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Lack of vitamin D causes which disease?","\u0935\u093F\u091F\u093E\u092E\u093F\u0928 D \u0915\u0940 \u0915\u092E\u0940 \u0938\u0947 \u0915\u094C\u0928-\u0938\u093E \u0930\u094B\u0917 \u0939\u094B\u0924\u093E \u0939\u0948?",["Rickets","\u0930\u093F\u0915\u0947\u091F\u094D\u0938"],[["Scurvy","\u0938\u094D\u0915\u0930\u094D\u0935\u0940"],["Anaemia","\u0930\u0915\u094D\u0924\u093E\u0932\u094D\u092A\u0924\u093E"],["Goitre","\u0918\u0947\u0902\u0918\u093E"]],["Rickets makes bones soft. Sunlight helps the body make vitamin D.","\u0930\u093F\u0915\u0947\u091F\u094D\u0938 \u092E\u0947\u0902 \u0939\u0921\u094D\u0921\u093F\u092F\u093E\u0901 \u0915\u092E\u091C\u093C\u094B\u0930 \u0939\u094B \u091C\u093E\u0924\u0940 \u0939\u0948\u0902\u0964 \u0927\u0942\u092A \u0938\u0947 \u0936\u0930\u0940\u0930 \u0935\u093F\u091F\u093E\u092E\u093F\u0928 D \u092C\u0928\u093E\u0924\u093E \u0939\u0948\u0964"]],["Lack of iodine causes:","\u0906\u092F\u094B\u0921\u0940\u0928 \u0915\u0940 \u0915\u092E\u0940 \u0938\u0947 \u0915\u094D\u092F\u093E \u0939\u094B\u0924\u093E \u0939\u0948?",["Goitre","\u0918\u0947\u0902\u0918\u093E"],[["Scurvy","\u0938\u094D\u0915\u0930\u094D\u0935\u0940"],["Rickets","\u0930\u093F\u0915\u0947\u091F\u094D\u0938"],["Night blindness","\u0930\u0924\u094C\u0902\u0927\u0940"]],["Goitre is a swelling of the thyroid gland in the neck. Iodised salt prevents it.","\u0918\u0947\u0902\u0918\u093E \u0917\u0932\u0947 \u0915\u0940 \u0925\u093E\u092F\u0930\u0949\u0907\u0921 \u0917\u094D\u0930\u0902\u0925\u093F \u0915\u0940 \u0938\u0942\u091C\u0928 \u0939\u0948\u0964 \u0906\u092F\u094B\u0921\u0940\u0928 \u092F\u0941\u0915\u094D\u0924 \u0928\u092E\u0915 \u0907\u0938\u0947 \u0930\u094B\u0915\u0924\u093E \u0939\u0948\u0964"]],["Lack of iron in food can cause:","\u092D\u094B\u091C\u0928 \u092E\u0947\u0902 \u0932\u094B\u0939\u0947 (\u0906\u092F\u0930\u0928) \u0915\u0940 \u0915\u092E\u0940 \u0938\u0947 \u0915\u094D\u092F\u093E \u0939\u094B \u0938\u0915\u0924\u093E \u0939\u0948?",["Anaemia","\u0930\u0915\u094D\u0924\u093E\u0932\u094D\u092A\u0924\u093E (\u090F\u0928\u0940\u092E\u093F\u092F\u093E)"],[["Goitre","\u0918\u0947\u0902\u0918\u093E"],["Rickets","\u0930\u093F\u0915\u0947\u091F\u094D\u0938"],["Scurvy","\u0938\u094D\u0915\u0930\u094D\u0935\u0940"]],["Iron is needed to make blood. Green leafy vegetables and jaggery contain iron.","\u0930\u0915\u094D\u0924 \u092C\u0928\u093E\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0932\u094B\u0939\u093E \u091A\u093E\u0939\u093F\u090F\u0964 \u0939\u0930\u0940 \u092A\u0924\u094D\u0924\u0947\u0926\u093E\u0930 \u0938\u092C\u094D\u091C\u093C\u093F\u092F\u094B\u0902 \u0914\u0930 \u0917\u0941\u0921\u093C \u092E\u0947\u0902 \u0932\u094B\u0939\u093E \u0939\u094B\u0924\u093E \u0939\u0948\u0964"]],["Lack of vitamin A can cause:","\u0935\u093F\u091F\u093E\u092E\u093F\u0928 A \u0915\u0940 \u0915\u092E\u0940 \u0938\u0947 \u0915\u094D\u092F\u093E \u0939\u094B \u0938\u0915\u0924\u093E \u0939\u0948?",["Night blindness","\u0930\u0924\u094C\u0902\u0927\u0940"],[["Scurvy","\u0938\u094D\u0915\u0930\u094D\u0935\u0940"],["Goitre","\u0918\u0947\u0902\u0918\u093E"],["Anaemia","\u0930\u0915\u094D\u0924\u093E\u0932\u094D\u092A\u0924\u093E"]],["Vitamin A keeps eyes healthy. Carrots, papaya and milk contain it.","\u0935\u093F\u091F\u093E\u092E\u093F\u0928 A \u0906\u0901\u0916\u094B\u0902 \u0915\u094B \u0938\u094D\u0935\u0938\u094D\u0925 \u0930\u0916\u0924\u093E \u0939\u0948\u0964 \u0917\u093E\u091C\u0930, \u092A\u092A\u0940\u0924\u093E \u0914\u0930 \u0926\u0942\u0927 \u092E\u0947\u0902 \u092F\u0939 \u0939\u094B\u0924\u093E \u0939\u0948\u0964"]],["Which test shows that a food contains starch?","\u0915\u093F\u0938 \u092A\u0930\u0940\u0915\u094D\u0937\u0923 \u0938\u0947 \u092A\u0924\u093E \u091A\u0932\u0924\u093E \u0939\u0948 \u0915\u093F \u092D\u094B\u091C\u0928 \u092E\u0947\u0902 \u092E\u0902\u0921 (\u0938\u094D\u091F\u093E\u0930\u094D\u091A) \u0939\u0948?",["Iodine turns it blue-black","\u0906\u092F\u094B\u0921\u0940\u0928 \u0921\u093E\u0932\u0928\u0947 \u092A\u0930 \u0928\u0940\u0932\u093E-\u0915\u093E\u0932\u093E \u0930\u0902\u0917"],[["Iodine turns it red","\u0906\u092F\u094B\u0921\u0940\u0928 \u0921\u093E\u0932\u0928\u0947 \u092A\u0930 \u0932\u093E\u0932 \u0930\u0902\u0917"],["It feels oily on paper","\u0915\u093E\u0917\u091C\u093C \u092A\u0930 \u091A\u093F\u0915\u0928\u093E \u0927\u092C\u094D\u092C\u093E"],["It turns violet with copper sulphate","\u0915\u0949\u092A\u0930 \u0938\u0932\u094D\u092B\u093C\u0947\u091F \u0938\u0947 \u092C\u0948\u0902\u0917\u0928\u0940 \u0930\u0902\u0917"]],["Starch turns blue-black with iodine solution.","\u0906\u092F\u094B\u0921\u0940\u0928 \u0918\u094B\u0932 \u0921\u093E\u0932\u0928\u0947 \u092A\u0930 \u092E\u0902\u0921 \u0928\u0940\u0932\u093E-\u0915\u093E\u0932\u093E \u0939\u094B \u091C\u093E\u0924\u093E \u0939\u0948\u0964"]]]),q("s.water_air",5,s("Water and air","\u091C\u0932 \u0914\u0930 \u0935\u093E\u092F\u0941"),["s.plants"],s("Water keeps moving between sea, sky and land: evaporation, condensation, rain.","\u091C\u0932 \u0938\u092E\u0941\u0926\u094D\u0930, \u0906\u0915\u093E\u0936 \u0914\u0930 \u0927\u0930\u0924\u0940 \u0915\u0947 \u092C\u0940\u091A \u0918\u0942\u092E\u0924\u093E \u0930\u0939\u0924\u093E \u0939\u0948: \u0935\u093E\u0937\u094D\u092A\u0940\u0915\u0930\u0923, \u0938\u0902\u0918\u0928\u0928, \u0935\u0930\u094D\u0937\u093E\u0964"),[["When water changes into water vapour because of heat, it is called:","\u0917\u0930\u094D\u092E\u0940 \u0938\u0947 \u091C\u0932 \u0915\u0947 \u091C\u0932\u0935\u093E\u0937\u094D\u092A \u092E\u0947\u0902 \u092C\u0926\u0932\u0928\u0947 \u0915\u094B \u0915\u094D\u092F\u093E \u0915\u0939\u0924\u0947 \u0939\u0948\u0902?",["Evaporation","\u0935\u093E\u0937\u094D\u092A\u0940\u0915\u0930\u0923"],[["Condensation","\u0938\u0902\u0918\u0928\u0928"],["Freezing","\u0939\u093F\u092E\u0940\u0915\u0930\u0923"],["Melting","\u092A\u093F\u0918\u0932\u0928\u093E"]],["The sun heats water in seas and rivers and it evaporates.","\u0938\u0942\u0930\u094D\u092F \u0938\u092E\u0941\u0926\u094D\u0930 \u0914\u0930 \u0928\u0926\u093F\u092F\u094B\u0902 \u0915\u0947 \u091C\u0932 \u0915\u094B \u0917\u0930\u094D\u092E \u0915\u0930\u0924\u093E \u0939\u0948 \u0914\u0930 \u0935\u0939 \u0935\u093E\u0937\u094D\u092A\u093F\u0924 \u0939\u094B \u091C\u093E\u0924\u093E \u0939\u0948\u0964"]],["Water drops on the outside of a cold glass form by:","\u0920\u0902\u0921\u0947 \u0917\u093F\u0932\u093E\u0938 \u0915\u0947 \u092C\u093E\u0939\u0930 \u092A\u093E\u0928\u0940 \u0915\u0940 \u092C\u0942\u0901\u0926\u0947\u0902 \u0915\u093F\u0938 \u092A\u094D\u0930\u0915\u094D\u0930\u093F\u092F\u093E \u0938\u0947 \u092C\u0928\u0924\u0940 \u0939\u0948\u0902?",["Condensation","\u0938\u0902\u0918\u0928\u0928"],[["Evaporation","\u0935\u093E\u0937\u094D\u092A\u0940\u0915\u0930\u0923"],["Leaking through the glass","\u0917\u093F\u0932\u093E\u0938 \u0938\u0947 \u0930\u093F\u0938\u0915\u0930"],["Melting","\u092A\u093F\u0918\u0932\u0915\u0930"]],["Water vapour in the air cools on the cold glass and turns into drops.","\u0939\u0935\u093E \u0915\u0940 \u091C\u0932\u0935\u093E\u0937\u094D\u092A \u0920\u0902\u0921\u0947 \u0917\u093F\u0932\u093E\u0938 \u092A\u0930 \u0920\u0902\u0921\u0940 \u0939\u094B\u0915\u0930 \u092C\u0942\u0901\u0926\u094B\u0902 \u092E\u0947\u0902 \u092C\u0926\u0932 \u091C\u093E\u0924\u0940 \u0939\u0948\u0964"]],["Which gas makes up most of the air?","\u0935\u093E\u092F\u0941 \u092E\u0947\u0902 \u0938\u092C\u0938\u0947 \u0905\u0927\u093F\u0915 \u092E\u093E\u0924\u094D\u0930\u093E \u0915\u093F\u0938 \u0917\u0948\u0938 \u0915\u0940 \u0939\u0948?",["Nitrogen","\u0928\u093E\u0907\u091F\u094D\u0930\u094B\u091C\u0928"],[["Oxygen","\u0911\u0915\u094D\u0938\u0940\u091C\u0928"],["Carbon dioxide","\u0915\u093E\u0930\u094D\u092C\u0928 \u0921\u093E\u0907\u0911\u0915\u094D\u0938\u093E\u0907\u0921"],["Hydrogen","\u0939\u093E\u0907\u0921\u094D\u0930\u094B\u091C\u0928"]],["Air is about 78% nitrogen and 21% oxygen.","\u0935\u093E\u092F\u0941 \u092E\u0947\u0902 \u0932\u0917\u092D\u0917 78% \u0928\u093E\u0907\u091F\u094D\u0930\u094B\u091C\u0928 \u0914\u0930 21% \u0911\u0915\u094D\u0938\u0940\u091C\u0928 \u0939\u0948\u0964"]],["Which gas do we need to breathe in?","\u0938\u093E\u0901\u0938 \u0932\u0947\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0939\u092E\u0947\u0902 \u0915\u094C\u0928-\u0938\u0940 \u0917\u0948\u0938 \u091A\u093E\u0939\u093F\u090F?",["Oxygen","\u0911\u0915\u094D\u0938\u0940\u091C\u0928"],[["Nitrogen","\u0928\u093E\u0907\u091F\u094D\u0930\u094B\u091C\u0928"],["Carbon dioxide","\u0915\u093E\u0930\u094D\u092C\u0928 \u0921\u093E\u0907\u0911\u0915\u094D\u0938\u093E\u0907\u0921"],["Helium","\u0939\u0940\u0932\u093F\u092F\u092E"]],["Our cells use oxygen to release energy from food.","\u0939\u092E\u093E\u0930\u0940 \u0915\u094B\u0936\u093F\u0915\u093E\u090F\u0901 \u092D\u094B\u091C\u0928 \u0938\u0947 \u090A\u0930\u094D\u091C\u093E \u0928\u093F\u0915\u093E\u0932\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0911\u0915\u094D\u0938\u0940\u091C\u0928 \u0915\u093E \u0909\u092A\u092F\u094B\u0917 \u0915\u0930\u0924\u0940 \u0939\u0948\u0902\u0964"]],["At what temperature does pure water boil at sea level?","\u0938\u092E\u0941\u0926\u094D\u0930 \u0924\u0932 \u092A\u0930 \u0936\u0941\u0926\u094D\u0927 \u091C\u0932 \u0915\u093F\u0938 \u0924\u093E\u092A \u092A\u0930 \u0909\u092C\u0932\u0924\u093E \u0939\u0948?",["100 \xB0C","100 \xB0C"],[["0 \xB0C","0 \xB0C"],["50 \xB0C","50 \xB0C"],["37 \xB0C","37 \xB0C"]],["Pure water boils at 100 \xB0C and freezes at 0 \xB0C at sea level.","\u0938\u092E\u0941\u0926\u094D\u0930 \u0924\u0932 \u092A\u0930 \u0936\u0941\u0926\u094D\u0927 \u091C\u0932 100 \xB0C \u092A\u0930 \u0909\u092C\u0932\u0924\u093E \u0939\u0948 \u0914\u0930 0 \xB0C \u092A\u0930 \u091C\u092E\u0924\u093E \u0939\u0948\u0964"]],["Collecting and storing rainwater for later use is called:","\u0935\u0930\u094D\u0937\u093E \u091C\u0932 \u0915\u094B \u0907\u0915\u091F\u094D\u0920\u093E \u0915\u0930\u0915\u0947 \u092C\u093E\u0926 \u0915\u0947 \u0932\u093F\u090F \u0930\u0916\u0928\u0947 \u0915\u094B \u0915\u094D\u092F\u093E \u0915\u0939\u0924\u0947 \u0939\u0948\u0902?",["Rainwater harvesting","\u0935\u0930\u094D\u0937\u093E \u091C\u0932 \u0938\u0902\u091A\u092F\u0928"],[["Irrigation","\u0938\u093F\u0902\u091A\u093E\u0908"],["Evaporation","\u0935\u093E\u0937\u094D\u092A\u0940\u0915\u0930\u0923"],["Flooding","\u092C\u093E\u0922\u093C"]],["Rainwater harvesting refills wells and groundwater.","\u0935\u0930\u094D\u0937\u093E \u091C\u0932 \u0938\u0902\u091A\u092F\u0928 \u0938\u0947 \u0915\u0941\u090F\u0901 \u0914\u0930 \u092D\u0942\u091C\u0932 \u092B\u093F\u0930 \u0938\u0947 \u092D\u0930\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Which method makes muddy water clear by letting the mud settle down?","\u0915\u093F\u0938 \u0935\u093F\u0927\u093F \u092E\u0947\u0902 \u092E\u093F\u091F\u094D\u091F\u0940 \u0928\u0940\u091A\u0947 \u092C\u0948\u0920 \u091C\u093E\u0928\u0947 \u0938\u0947 \u0917\u0902\u0926\u093E \u092A\u093E\u0928\u0940 \u0938\u093E\u092B\u093C \u0939\u094B\u0924\u093E \u0939\u0948?",["Sedimentation","\u0905\u0935\u0938\u093E\u0926\u0928"],[["Evaporation","\u0935\u093E\u0937\u094D\u092A\u0940\u0915\u0930\u0923"],["Boiling","\u0909\u092C\u093E\u0932\u0928\u093E"],["Freezing","\u091C\u092E\u093E\u0928\u093E"]],["In sedimentation heavy particles settle at the bottom; the clear water is then poured off (decantation).","\u0905\u0935\u0938\u093E\u0926\u0928 \u092E\u0947\u0902 \u092D\u093E\u0930\u0940 \u0915\u0923 \u0928\u0940\u091A\u0947 \u092C\u0948\u0920 \u091C\u093E\u0924\u0947 \u0939\u0948\u0902; \u092B\u093F\u0930 \u0938\u093E\u092B\u093C \u092A\u093E\u0928\u0940 \u090A\u092A\u0930 \u0938\u0947 \u0928\u093F\u0925\u093E\u0930 \u0932\u093F\u092F\u093E \u091C\u093E\u0924\u093E \u0939\u0948\u0964"]]]),q("s.matter",5,s("Materials and their states","\u092A\u0926\u093E\u0930\u094D\u0925 \u0914\u0930 \u0909\u0928\u0915\u0940 \u0905\u0935\u0938\u094D\u0925\u093E\u090F\u0901"),["s.water_air"],s("Solids keep their shape, liquids take the shape of the container, gases fill all the space.","\u0920\u094B\u0938 \u0915\u093E \u0906\u0915\u093E\u0930 \u0928\u093F\u0936\u094D\u091A\u093F\u0924 \u0939\u094B\u0924\u093E \u0939\u0948, \u0926\u094D\u0930\u0935 \u092C\u0930\u094D\u0924\u0928 \u0915\u093E \u0906\u0915\u093E\u0930 \u0932\u0947 \u0932\u0947\u0924\u093E \u0939\u0948, \u0917\u0948\u0938 \u092A\u0942\u0930\u0940 \u091C\u0917\u0939 \u092D\u0930 \u0926\u0947\u0924\u0940 \u0939\u0948\u0964"),[["Which of these is a liquid at room temperature?","\u0915\u092E\u0930\u0947 \u0915\u0947 \u0924\u093E\u092A \u092A\u0930 \u0907\u0928\u092E\u0947\u0902 \u0938\u0947 \u0915\u094C\u0928 \u0926\u094D\u0930\u0935 \u0939\u0948?",["Milk","\u0926\u0942\u0927"],[["Ice","\u092C\u0930\u094D\u092B\u093C"],["Stone","\u092A\u0924\u094D\u0925\u0930"],["Steam","\u092D\u093E\u092A"]],["Milk flows and takes the shape of its container.","\u0926\u0942\u0927 \u092C\u0939\u0924\u093E \u0939\u0948 \u0914\u0930 \u092C\u0930\u094D\u0924\u0928 \u0915\u093E \u0906\u0915\u093E\u0930 \u0932\u0947 \u0932\u0947\u0924\u093E \u0939\u0948\u0964"]],["Ice changing into water is called:","\u092C\u0930\u094D\u092B\u093C \u0915\u0947 \u092A\u093E\u0928\u0940 \u092E\u0947\u0902 \u092C\u0926\u0932\u0928\u0947 \u0915\u094B \u0915\u094D\u092F\u093E \u0915\u0939\u0924\u0947 \u0939\u0948\u0902?",["Melting","\u092A\u093F\u0918\u0932\u0928\u093E"],[["Freezing","\u091C\u092E\u0928\u093E"],["Boiling","\u0909\u092C\u0932\u0928\u093E"],["Condensation","\u0938\u0902\u0918\u0928\u0928"]],["Heat changes solid ice into liquid water.","\u090A\u0937\u094D\u092E\u093E \u0920\u094B\u0938 \u092C\u0930\u094D\u092B\u093C \u0915\u094B \u0926\u094D\u0930\u0935 \u092A\u093E\u0928\u0940 \u092E\u0947\u0902 \u092C\u0926\u0932 \u0926\u0947\u0924\u0940 \u0939\u0948\u0964"]],["Which material allows electricity to pass through it?","\u0915\u093F\u0938 \u092A\u0926\u093E\u0930\u094D\u0925 \u0938\u0947 \u0939\u094B\u0915\u0930 \u0935\u093F\u0926\u094D\u092F\u0941\u0924 \u092A\u094D\u0930\u0935\u093E\u0939\u093F\u0924 \u0939\u094B\u0924\u0940 \u0939\u0948?",["Copper","\u0924\u093E\u0901\u092C\u093E"],[["Rubber","\u0930\u092C\u0930"],["Plastic","\u092A\u094D\u0932\u093E\u0938\u094D\u091F\u093F\u0915"],["Dry wood","\u0938\u0942\u0916\u0940 \u0932\u0915\u0921\u093C\u0940"]],["Metals like copper are good conductors; rubber and plastic are insulators.","\u0924\u093E\u0901\u092C\u0947 \u091C\u0948\u0938\u0940 \u0927\u093E\u0924\u0941\u090F\u0901 \u0938\u0941\u091A\u093E\u0932\u0915 \u0939\u0948\u0902; \u0930\u092C\u0930 \u0914\u0930 \u092A\u094D\u0932\u093E\u0938\u094D\u091F\u093F\u0915 \u0915\u0941\u091A\u093E\u0932\u0915 \u0939\u0948\u0902\u0964"]],["Which of these dissolves in water?","\u0907\u0928\u092E\u0947\u0902 \u0938\u0947 \u0915\u094C\u0928 \u092A\u093E\u0928\u0940 \u092E\u0947\u0902 \u0918\u0941\u0932 \u091C\u093E\u0924\u093E \u0939\u0948?",["Sugar","\u091A\u0940\u0928\u0940"],[["Sand","\u0930\u0947\u0924"],["Oil","\u0924\u0947\u0932"],["Chalk powder","\u091A\u0949\u0915 \u0915\u093E \u091A\u0942\u0930\u094D\u0923"]],["Sugar is soluble in water; sand and chalk are not, and oil floats.","\u091A\u0940\u0928\u0940 \u092A\u093E\u0928\u0940 \u092E\u0947\u0902 \u0918\u0941\u0932\u0928\u0936\u0940\u0932 \u0939\u0948; \u0930\u0947\u0924 \u0914\u0930 \u091A\u0949\u0915 \u0928\u0939\u0940\u0902 \u0918\u0941\u0932\u0924\u0947, \u0914\u0930 \u0924\u0947\u0932 \u090A\u092A\u0930 \u0924\u0948\u0930\u0924\u093E \u0939\u0948\u0964"]],["Which change can be reversed?","\u0915\u094C\u0928-\u0938\u093E \u092A\u0930\u093F\u0935\u0930\u094D\u0924\u0928 \u0909\u0932\u091F\u093E \u091C\u093E \u0938\u0915\u0924\u093E \u0939\u0948?",["Melting of wax","\u092E\u094B\u092E \u0915\u093E \u092A\u093F\u0918\u0932\u0928\u093E"],[["Burning of paper","\u0915\u093E\u0917\u091C\u093C \u0915\u093E \u091C\u0932\u0928\u093E"],["Cooking of rice","\u091A\u093E\u0935\u0932 \u0915\u093E \u092A\u0915\u0928\u093E"],["Rusting of iron","\u0932\u094B\u0939\u0947 \u092E\u0947\u0902 \u091C\u0902\u0917 \u0932\u0917\u0928\u093E"]],["Melted wax becomes solid again on cooling. Burning, cooking and rusting cannot be undone.","\u092A\u093F\u0918\u0932\u093E \u092E\u094B\u092E \u0920\u0902\u0921\u093E \u0939\u094B\u0928\u0947 \u092A\u0930 \u092B\u093F\u0930 \u0920\u094B\u0938 \u0939\u094B \u091C\u093E\u0924\u093E \u0939\u0948\u0964 \u091C\u0932\u0928\u093E, \u092A\u0915\u0928\u093E \u0914\u0930 \u091C\u0902\u0917 \u0932\u0917\u0928\u093E \u0909\u0932\u091F\u0947 \u0928\u0939\u0940\u0902 \u091C\u093E \u0938\u0915\u0924\u0947\u0964"]],["Rusting of iron needs:","\u0932\u094B\u0939\u0947 \u092E\u0947\u0902 \u091C\u0902\u0917 \u0932\u0917\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0915\u094D\u092F\u093E \u0906\u0935\u0936\u094D\u092F\u0915 \u0939\u0948?",["Both air and water","\u0935\u093E\u092F\u0941 \u0914\u0930 \u091C\u0932 \u0926\u094B\u0928\u094B\u0902"],[["Only sunlight","\u0915\u0947\u0935\u0932 \u0938\u0942\u0930\u094D\u092F \u0915\u093E \u092A\u094D\u0930\u0915\u093E\u0936"],["Only heat","\u0915\u0947\u0935\u0932 \u090A\u0937\u094D\u092E\u093E"],["Only dry air","\u0915\u0947\u0935\u0932 \u0938\u0942\u0916\u0940 \u0935\u093E\u092F\u0941"]],["Iron rusts when oxygen and moisture are both present. Paint prevents it.","\u0932\u094B\u0939\u0947 \u092E\u0947\u0902 \u091C\u0902\u0917 \u0924\u092C \u0932\u0917\u0924\u093E \u0939\u0948 \u091C\u092C \u0911\u0915\u094D\u0938\u0940\u091C\u0928 \u0914\u0930 \u0928\u092E\u0940 \u0926\u094B\u0928\u094B\u0902 \u0939\u094B\u0902\u0964 \u092A\u0947\u0902\u091F \u0907\u0938\u0947 \u0930\u094B\u0915\u0924\u093E \u0939\u0948\u0964"]],["Which material is attracted by a magnet?","\u091A\u0941\u0902\u092C\u0915 \u0915\u093F\u0938 \u092A\u0926\u093E\u0930\u094D\u0925 \u0915\u094B \u0906\u0915\u0930\u094D\u0937\u093F\u0924 \u0915\u0930\u0924\u093E \u0939\u0948?",["Iron nail","\u0932\u094B\u0939\u0947 \u0915\u0940 \u0915\u0940\u0932"],[["Plastic spoon","\u092A\u094D\u0932\u093E\u0938\u094D\u091F\u093F\u0915 \u0915\u093E \u091A\u092E\u094D\u092E\u091A"],["Copper coin","\u0924\u093E\u0901\u092C\u0947 \u0915\u093E \u0938\u093F\u0915\u094D\u0915\u093E"],["Wooden pencil","\u0932\u0915\u0921\u093C\u0940 \u0915\u0940 \u092A\u0947\u0902\u0938\u093F\u0932"]],["Magnets attract iron, nickel and cobalt, but not copper, plastic or wood.","\u091A\u0941\u0902\u092C\u0915 \u0932\u094B\u0939\u093E, \u0928\u093F\u0915\u0932 \u0914\u0930 \u0915\u094B\u092C\u093E\u0932\u094D\u091F \u0915\u094B \u0906\u0915\u0930\u094D\u0937\u093F\u0924 \u0915\u0930\u0924\u093E \u0939\u0948, \u0924\u093E\u0901\u092C\u093E, \u092A\u094D\u0932\u093E\u0938\u094D\u091F\u093F\u0915 \u092F\u093E \u0932\u0915\u0921\u093C\u0940 \u0915\u094B \u0928\u0939\u0940\u0902\u0964"]]]),q("s.space",5,s("Earth, Sun and Moon","\u092A\u0943\u0925\u094D\u0935\u0940, \u0938\u0942\u0930\u094D\u092F \u0914\u0930 \u091A\u0902\u0926\u094D\u0930\u092E\u093E"),[],s("The Earth spins once a day (day and night) and goes round the Sun once a year.","\u092A\u0943\u0925\u094D\u0935\u0940 \u0926\u093F\u0928 \u092E\u0947\u0902 \u090F\u0915 \u092C\u093E\u0930 \u0918\u0942\u092E\u0924\u0940 \u0939\u0948 (\u0926\u093F\u0928 \u0914\u0930 \u0930\u093E\u0924) \u0914\u0930 \u0935\u0930\u094D\u0937 \u092E\u0947\u0902 \u090F\u0915 \u092C\u093E\u0930 \u0938\u0942\u0930\u094D\u092F \u0915\u0940 \u092A\u0930\u093F\u0915\u094D\u0930\u092E\u093E \u0915\u0930\u0924\u0940 \u0939\u0948\u0964"),[["Day and night happen because the Earth:","\u0926\u093F\u0928 \u0914\u0930 \u0930\u093E\u0924 \u0915\u093F\u0938 \u0915\u093E\u0930\u0923 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902?",["Spins on its axis","\u092A\u0943\u0925\u094D\u0935\u0940 \u0905\u092A\u0928\u0940 \u0927\u0941\u0930\u0940 \u092A\u0930 \u0918\u0942\u092E\u0924\u0940 \u0939\u0948"],[["Goes round the Sun","\u092A\u0943\u0925\u094D\u0935\u0940 \u0938\u0942\u0930\u094D\u092F \u0915\u0940 \u092A\u0930\u093F\u0915\u094D\u0930\u092E\u093E \u0915\u0930\u0924\u0940 \u0939\u0948"],["Goes round the Moon","\u092A\u0943\u0925\u094D\u0935\u0940 \u091A\u0902\u0926\u094D\u0930\u092E\u093E \u0915\u0940 \u092A\u0930\u093F\u0915\u094D\u0930\u092E\u093E \u0915\u0930\u0924\u0940 \u0939\u0948"],["Moves away from the Sun","\u092A\u0943\u0925\u094D\u0935\u0940 \u0938\u0942\u0930\u094D\u092F \u0938\u0947 \u0926\u0942\u0930 \u091C\u093E\u0924\u0940 \u0939\u0948"]],["The Earth turns once in about 24 hours; the side facing the Sun has day.","\u092A\u0943\u0925\u094D\u0935\u0940 \u0932\u0917\u092D\u0917 24 \u0918\u0902\u091F\u0947 \u092E\u0947\u0902 \u090F\u0915 \u092C\u093E\u0930 \u0918\u0942\u092E\u0924\u0940 \u0939\u0948; \u0938\u0942\u0930\u094D\u092F \u0915\u0940 \u0913\u0930 \u0935\u093E\u0932\u0947 \u092D\u093E\u0917 \u092E\u0947\u0902 \u0926\u093F\u0928 \u0939\u094B\u0924\u093E \u0939\u0948\u0964"]],["How long does the Earth take to go round the Sun once?","\u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u094B \u0938\u0942\u0930\u094D\u092F \u0915\u0940 \u090F\u0915 \u092A\u0930\u093F\u0915\u094D\u0930\u092E\u093E \u092E\u0947\u0902 \u0915\u093F\u0924\u0928\u093E \u0938\u092E\u092F \u0932\u0917\u0924\u093E \u0939\u0948?",["About 365 days","\u0932\u0917\u092D\u0917 365 \u0926\u093F\u0928"],[["About 24 hours","\u0932\u0917\u092D\u0917 24 \u0918\u0902\u091F\u0947"],["About 30 days","\u0932\u0917\u092D\u0917 30 \u0926\u093F\u0928"],["About 7 days","\u0932\u0917\u092D\u0917 7 \u0926\u093F\u0928"]],["One trip round the Sun is one year: about 365\xBC days.","\u0938\u0942\u0930\u094D\u092F \u0915\u0940 \u090F\u0915 \u092A\u0930\u093F\u0915\u094D\u0930\u092E\u093E \u090F\u0915 \u0935\u0930\u094D\u0937 \u0939\u0948: \u0932\u0917\u092D\u0917 365\xBC \u0926\u093F\u0928\u0964"]],["Which planet is closest to the Sun?","\u0938\u0942\u0930\u094D\u092F \u0915\u0947 \u0938\u092C\u0938\u0947 \u0928\u093F\u0915\u091F \u0915\u094C\u0928-\u0938\u093E \u0917\u094D\u0930\u0939 \u0939\u0948?",["Mercury","\u092C\u0941\u0927"],[["Venus","\u0936\u0941\u0915\u094D\u0930"],["Earth","\u092A\u0943\u0925\u094D\u0935\u0940"],["Mars","\u092E\u0902\u0917\u0932"]],["The order from the Sun begins: Mercury, Venus, Earth, Mars.","\u0938\u0942\u0930\u094D\u092F \u0938\u0947 \u0915\u094D\u0930\u092E: \u092C\u0941\u0927, \u0936\u0941\u0915\u094D\u0930, \u092A\u0943\u0925\u094D\u0935\u0940, \u092E\u0902\u0917\u0932\u0964"]],["Which is the largest planet in our solar system?","\u0939\u092E\u093E\u0930\u0947 \u0938\u094C\u0930\u092E\u0902\u0921\u0932 \u0915\u093E \u0938\u092C\u0938\u0947 \u092C\u0921\u093C\u093E \u0917\u094D\u0930\u0939 \u0915\u094C\u0928-\u0938\u093E \u0939\u0948?",["Jupiter","\u092C\u0943\u0939\u0938\u094D\u092A\u0924\u093F"],[["Saturn","\u0936\u0928\u093F"],["Earth","\u092A\u0943\u0925\u094D\u0935\u0940"],["Mars","\u092E\u0902\u0917\u0932"]],["Jupiter is so big that more than a thousand Earths could fit inside it.","\u092C\u0943\u0939\u0938\u094D\u092A\u0924\u093F \u0907\u0924\u0928\u093E \u092C\u0921\u093C\u093E \u0939\u0948 \u0915\u093F \u0909\u0938\u092E\u0947\u0902 \u090F\u0915 \u0939\u091C\u093C\u093E\u0930 \u0938\u0947 \u0905\u0927\u093F\u0915 \u092A\u0943\u0925\u094D\u0935\u093F\u092F\u093E\u0901 \u0938\u092E\u093E \u0938\u0915\u0924\u0940 \u0939\u0948\u0902\u0964"]],["Which planet is called the Red Planet?","\u0915\u093F\u0938 \u0917\u094D\u0930\u0939 \u0915\u094B \u0932\u093E\u0932 \u0917\u094D\u0930\u0939 \u0915\u0939\u0924\u0947 \u0939\u0948\u0902?",["Mars","\u092E\u0902\u0917\u0932"],[["Jupiter","\u092C\u0943\u0939\u0938\u094D\u092A\u0924\u093F"],["Venus","\u0936\u0941\u0915\u094D\u0930"],["Mercury","\u092C\u0941\u0927"]],["Iron oxide (rust) in its soil makes Mars look red.","\u092E\u0902\u0917\u0932 \u0915\u0940 \u092E\u093F\u091F\u094D\u091F\u0940 \u092E\u0947\u0902 \u0906\u092F\u0930\u0928 \u0911\u0915\u094D\u0938\u093E\u0907\u0921 (\u091C\u0902\u0917) \u0915\u0947 \u0915\u093E\u0930\u0923 \u0935\u0939 \u0932\u093E\u0932 \u0926\u093F\u0916\u0924\u093E \u0939\u0948\u0964"]],["The Moon shines because:","\u091A\u0902\u0926\u094D\u0930\u092E\u093E \u091A\u092E\u0915\u0924\u093E \u0939\u0948 \u0915\u094D\u092F\u094B\u0902\u0915\u093F:",["It reflects sunlight","\u0935\u0939 \u0938\u0942\u0930\u094D\u092F \u0915\u0947 \u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u094B \u092A\u0930\u093E\u0935\u0930\u094D\u0924\u093F\u0924 \u0915\u0930\u0924\u093E \u0939\u0948"],[["It makes its own light","\u0935\u0939 \u0905\u092A\u0928\u093E \u092A\u094D\u0930\u0915\u093E\u0936 \u0938\u094D\u0935\u092F\u0902 \u092C\u0928\u093E\u0924\u093E \u0939\u0948"],["It is very hot","\u0935\u0939 \u092C\u0939\u0941\u0924 \u0917\u0930\u094D\u092E \u0939\u0948"],["It reflects light from the Earth only","\u0935\u0939 \u0915\u0947\u0935\u0932 \u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u093E \u092A\u094D\u0930\u0915\u093E\u0936 \u092A\u0930\u093E\u0935\u0930\u094D\u0924\u093F\u0924 \u0915\u0930\u0924\u093E \u0939\u0948"]],["The Moon has no light of its own; it reflects light from the Sun.","\u091A\u0902\u0926\u094D\u0930\u092E\u093E \u0915\u093E \u0905\u092A\u0928\u093E \u092A\u094D\u0930\u0915\u093E\u0936 \u0928\u0939\u0940\u0902 \u0939\u0948; \u0935\u0939 \u0938\u0942\u0930\u094D\u092F \u0915\u093E \u092A\u094D\u0930\u0915\u093E\u0936 \u092A\u0930\u093E\u0935\u0930\u094D\u0924\u093F\u0924 \u0915\u0930\u0924\u093E \u0939\u0948\u0964"]],["Which is a star?","\u0907\u0928\u092E\u0947\u0902 \u0938\u0947 \u0924\u093E\u0930\u093E \u0915\u094C\u0928 \u0939\u0948?",["The Sun","\u0938\u0942\u0930\u094D\u092F"],[["The Moon","\u091A\u0902\u0926\u094D\u0930\u092E\u093E"],["Mars","\u092E\u0902\u0917\u0932"],["Venus","\u0936\u0941\u0915\u094D\u0930"]],["The Sun is the star nearest to the Earth. Planets and moons do not make their own light.","\u0938\u0942\u0930\u094D\u092F \u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u093E \u0938\u092C\u0938\u0947 \u0928\u093F\u0915\u091F \u0924\u093E\u0930\u093E \u0939\u0948\u0964 \u0917\u094D\u0930\u0939 \u0914\u0930 \u0909\u092A\u0917\u094D\u0930\u0939 \u0905\u092A\u0928\u093E \u092A\u094D\u0930\u0915\u093E\u0936 \u0928\u0939\u0940\u0902 \u092C\u0928\u093E\u0924\u0947\u0964"]]]),q("s.light",6,s("Light, shadows and sound","\u092A\u094D\u0930\u0915\u093E\u0936, \u091B\u093E\u092F\u093E \u0914\u0930 \u0927\u094D\u0935\u0928\u093F"),["s.space"],s("Light travels in straight lines; an opaque object blocks it and makes a shadow. Sound is made by vibration.","\u092A\u094D\u0930\u0915\u093E\u0936 \u0938\u0940\u0927\u0940 \u0930\u0947\u0916\u093E \u092E\u0947\u0902 \u091A\u0932\u0924\u093E \u0939\u0948; \u0905\u092A\u093E\u0930\u0926\u0930\u094D\u0936\u0940 \u0935\u0938\u094D\u0924\u0941 \u0909\u0938\u0947 \u0930\u094B\u0915\u0915\u0930 \u091B\u093E\u092F\u093E \u092C\u0928\u093E\u0924\u0940 \u0939\u0948\u0964 \u0927\u094D\u0935\u0928\u093F \u0915\u0902\u092A\u0928 \u0938\u0947 \u092C\u0928\u0924\u0940 \u0939\u0948\u0964"),[["A shadow forms when light is blocked by an object that is:","\u091B\u093E\u092F\u093E \u0924\u092C \u092C\u0928\u0924\u0940 \u0939\u0948 \u091C\u092C \u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u094B \u0915\u094B\u0908 \u0935\u0938\u094D\u0924\u0941 \u0930\u094B\u0915\u0924\u0940 \u0939\u0948 \u091C\u094B:",["Opaque","\u0905\u092A\u093E\u0930\u0926\u0930\u094D\u0936\u0940 \u0939\u094B"],[["Transparent","\u092A\u093E\u0930\u0926\u0930\u094D\u0936\u0940 \u0939\u094B"],["Shiny","\u091A\u092E\u0915\u0940\u0932\u0940 \u0939\u094B"],["Hot","\u0917\u0930\u094D\u092E \u0939\u094B"]],["Opaque objects do not let light pass, so a dark area forms behind them.","\u0905\u092A\u093E\u0930\u0926\u0930\u094D\u0936\u0940 \u0935\u0938\u094D\u0924\u0941\u090F\u0901 \u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u094B \u0928\u0939\u0940\u0902 \u091C\u093E\u0928\u0947 \u0926\u0947\u0924\u0940\u0902, \u0907\u0938\u0932\u093F\u090F \u0909\u0928\u0915\u0947 \u092A\u0940\u091B\u0947 \u0905\u0901\u0927\u0947\u0930\u093E \u0915\u094D\u0937\u0947\u0924\u094D\u0930 \u092C\u0928\u0924\u093E \u0939\u0948\u0964"]],["Light travels in:","\u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u093F\u0938 \u092A\u094D\u0930\u0915\u093E\u0930 \u091A\u0932\u0924\u093E \u0939\u0948?",["Straight lines","\u0938\u0940\u0927\u0940 \u0930\u0947\u0916\u093E \u092E\u0947\u0902"],[["Circles","\u0935\u0943\u0924\u094D\u0924 \u092E\u0947\u0902"],["Zig-zag lines","\u091F\u0947\u0922\u093C\u0940-\u092E\u0947\u0922\u093C\u0940 \u0930\u0947\u0916\u093E \u092E\u0947\u0902"],["Only downward","\u0915\u0947\u0935\u0932 \u0928\u0940\u091A\u0947 \u0915\u0940 \u0913\u0930"]],["This is why we cannot see round a corner.","\u0907\u0938\u0940 \u0915\u093E\u0 3E\u0928)"],[["Water","\u092A\u093E\u0928\u0940"],["Air","\u0935\u093E\u092F\u0941"],["Iron","\u0932\u094B\u0939\u093E"]],["Sound needs a medium; in space there is no air, so there is silence.","\u0927\u094D\u0935\u0928\u093F \u0915\u094B \u092E\u093E\u0927\u094D\u092F\u092E \u091A\u093E\u0939\u093F\u090F; \u0905\u0902\u0924\u0930\u093F\u0915\u094D\u0937 \u092E\u0947\u0902 \u0935\u093E\u092F\u0941 \u0928\u0939\u0940\u0902 \u0939\u0948, \u0907\u0938\u0932\u093F\u090F \u0935\u0939\u093E\u0901 \u0938\u0928\u094D\u0928\u093E\u091F\u093E \u0939\u0948\u0964"]],["Which travels faster?","\u0915\u094C\u0928 \u0905\u0927\u093F\u0915 \u0924\u0947\u091C\u093C \u091A\u0932\u0924\u093E \u0939\u0948?",["Light","\u092A\u094D\u0930\u0915\u093E\u0936"],[["Sound","\u0927\u094D\u0935\u0928\u093F"],["Both travel at the same speed","\u0926\u094B\u0928\u094B\u0902 \u0938\u092E\u093E\u0928 \u0917\u0924\u093F \u0938\u0947"],["Wind","\u0939\u0935\u093E"]],["We see lightning before we hear thunder because light is much faster than sound.","\u0939\u092E\u0947\u0902 \u092C\u093F\u091C\u0932\u0940 \u0915\u0940 \u091A\u092E\u0915 \u0917\u0930\u091C \u0938\u0947 \u092A\u0939\u0932\u0947 \u0926\u093F\u0916\u0924\u0940 \u0939\u0948 \u0915\u094D\u092F\u094B\u0902\u0915\u093F \u092A\u094D\u0930\u0915\u093E\u0936 \u0927\u094D\u0935\u0928\u093F \u0938\u0947 \u092C\u0939\u0941\u0924 \u0924\u0947\u091C\u093C \u0939\u0948\u0964"]],["An image in a plane mirror is:","\u0938\u092E\u0924\u0932 \u0926\u0930\u094D\u092A\u0923 \u092E\u0947\u0902 \u092A\u094D\u0930\u0924\u093F\u092C\u093F\u0902\u092C \u0915\u0948\u0938\u093E \u0939\u094B\u0924\u093E \u0939\u0948?",["Laterally inverted (left and right swap)","\u092A\u093E\u0930\u094D\u0936\u094D\u0935 \u0930\u0942\u092A \u0938\u0947 \u0909\u0932\u091F\u093E (\u092C\u093E\u092F\u093E\u0901-\u0926\u093E\u092F\u093E\u0901 \u092C\u0926\u0932 \u091C\u093E\u0924\u093E \u0939\u0948)"],[["Upside down","\u0909\u0932\u094D\u091F\u093E (\u0938\u093F\u0930 \u0928\u0940\u091A\u0947)"],["Smaller than the object","\u0935\u0938\u094D\u0924\u0941 \u0938\u0947 \u091B\u094B\u091F\u093E"],["Coloured differently","\u0905\u0932\u0917 \u0930\u0902\u0917 \u0915\u093E"]],["Raise your right hand: the image raises its left.","\u0905\u092A\u0928\u093E \u0926\u093E\u092F\u093E\u0901 \u0939\u093E\u0925 \u0909\u0920\u093E\u0907\u090F: \u092A\u094D\u0930\u0924\u093F\u092C\u093F\u0902\u092C \u092C\u093E\u092F\u093E\u0901 \u0939\u093E\u0925 \u0909\u0920\u093E\u0924\u093E \u0939\u0948\u0964"]]]),q("s.force",6,s("Force, motion and energy","\u092C\u0932, \u0917\u0924\u093F \u0914\u0930 \u090A\u0930\u094D\u091C\u093E"),["s.matter"],s("A force is a push or a pull. It can start, stop or change the direction of motion.","\u092C\u0932 \u090F\u0915 \u0927\u0915\u094D\u0915\u093E \u092F\u093E \u0916\u093F\u0902\u091A\u093E\u0935 \u0939\u0948\u0964 \u092F\u0939 \u0917\u0924\u093F \u0936\u0941\u0930\u0942 \u0915\u0930 \u0938\u0915\u0924\u093E \u0939\u0948, \u0930\u094B\u0915 \u0938\u0915\u0924\u093E \u0939\u0948 \u092F\u093E \u0909\u0938\u0915\u0940 \u0926\u093F\u0936\u093E \u092C\u0926\u0932 \u0938\u0915\u0924\u093E \u0939\u0948\u0964"),[["A push or a pull is called a:","\u0927\u0915\u094D\u0915\u093E \u092F\u093E \u0916\u093F\u0902\u091A\u093E\u0935 \u0915\u0939\u0932\u093E\u0924\u093E \u0939\u0948:",["Force","\u092C\u0932"],[["Speed","\u091A\u093E\u0932"],["Mass","\u0926\u094D\u0930\u0935\u094D\u092F\u092E\u093E\u0928"],["Energy","\u090A\u0930\u094D\u091C\u093E"]],["Every push or pull is a force.","\u0939\u0930 \u0927\u0915\u094D\u0915\u093E \u092F\u093E \u0916\u093F\u0902\u091A\u093E\u0935 \u090F\u0915 \u092C\u0932 \u0939\u0948\u0964"]],["Which force pulls things towards the Earth?","\u0915\u094C\u0928-\u0938\u093E \u092C\u0932 \u0935\u0938\u094D\u0924\u0941\u0913\u0902 \u0915\u094B \u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u0940 \u0913\u0930 \u0916\u0940\u0902\u091A\u0924\u093E \u0939\u0948?",["Gravity","\u0917\u0941\u0930\u0941\u0924\u094D\u0935\u093E\u0915\u0930  not run out; coal, petrol and gas do.","\u0938\u0942\u0930\u094D\u092F \u0915\u093E \u092A\u094D\u0930\u0915\u093E\u0936 \u0914\u0930 \u092A\u0935\u0928 \u0938\u092E\u093E\u092A\u094D\u0924 \u0928\u0939\u0940\u0902 \u0939\u094B\u0924\u0947; \u0915\u094B\u092F\u0932\u093E, \u092A\u0947\u091F\u094D\u0930\u094B\u0932 \u0914\u0930 \u0917\u0948\u0938 \u0939\u094B \u091C\u093E\u0924\u0947 \u0939\u0948\u0902\u0964"]],["A solar cell changes sunlight into:","\u0938\u094C\u0930 \u0938\u0947\u0932 \u0938\u0942\u0930\u094D\u092F \u0915\u0947 \u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u094B \u0915\u093F\u0938\u092E\u0947\u0902 \u092C\u0926\u0932\u0924\u093E \u0939\u0948?",["Electrical energy","\u0935\u093F\u0926\u094D\u092F\u0941\u0924 \u090A\u0930\u094D\u091C\u093E"],[["Sound energy","\u0927\u094D\u0935\u0928\u093F \u090A\u0930\u094D\u091C\u093E"],["Chemical energy only","\u0915\u0947\u0935\u0932 \u0930\u093E\u0938\u093E\u092F\u0928\u093F\u0915 \u090A\u0930\u094D\u091C\u093E"],["Magnetic energy","\u091A\u0941\u0902\u092C\u0915\u0940\u092F \u090A\u0930\u094D\u091C\u093E"]],["Solar panels on rooftops give electricity from sunlight.","\u091B\u0924 \u092A\u0930 \u0932\u0917\u0947 \u0938\u094C\u0930 \u092A\u0948\u0928\u0932 \u0927\u0942\u092A \u0938\u0947 \u092C\u093F\u091C\u0932\u0940 \u0926\u0947\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Which unit is used to measure force?","\u092C\u0932 \u0915\u093F\u0938 \u092E\u093E\u0924\u094D\u0930\u0915 \u092E\u0947\u0902 \u092E\u093E\u092A\u093E \u091C\u093E\u0924\u093E \u0939\u0948?",["Newton","\u0928\u094D\u092F\u0942\u091F\u0928"],[["Kilogram","\u0915\u093F\u0932\u094B\u0917\u094D\u0930\u093E\u092E"],["Metre","\u092E\u0940\u091F\u0930"],["Litre","\u0932\u0940\u091F\u0930"]],["Force is measured in newtons (N), named after Isaac Newton.","\u092C\u0932 \u0915\u094B \u0928\u094D\u092F\u0942\u091F\u0928 (N) \u092E\u0947\u0902 \u092E\u093E\u092A\u0924\u0947 \u0939\u0948\u0902, \u091C\u094B \u0906\u0907\u091C\u093C\u0915 \u0928\u094D\u092F\u 926\u0942\u0927 \u092E\u0947\u0902 \u092C\u0922\u093C\u0915\u0930 \u0909\u0938\u0947 \u0926\u0939\u0940 \u092E\u0947\u0902 \u091C\u092E\u093E \u0926\u0947\u0924\u093E \u0939\u0948\u0964"]],["Which mosquito spreads malaria?","\u0915\u094C\u0928-\u0938\u093E \u092E\u091A\u094D\u091B\u0930 \u092E\u0932\u0947\u0930\u093F\u092F\u093E \u092B\u0948\u0932\u093E\u0924\u093E \u0939\u0948?",["Female Anopheles","\u092E\u093E\u0926\u093E \u090F\u0928\u094B\u092B\u093C\u093F\u0932\u0940\u091C\u093C"],[["Male Anopheles","\u0928\u0930 \u090F\u0928\u094B\u092B\u093C\u093F\u0932\u0940\u091C\u093C"],["Housefly","\u0918\u0930\u0947\u0932\u0942 \u092E\u0915\u094D\u0916\u0940"],["Female Aedes only","\u0915\u0947\u0935\u0932 \u092E\u093E\u0926\u093E \u090F\u0921\u0940\u091C\u093C"]],["The female Anopheles mosquito carries the malaria parasite. Aedes spreads dengue.","\u092E\u093E\u0926\u093E \u090F\u0928\u094B\u092B\u093C\u093F\u0932\u0940\u091C\u093C \u092E\u091A\u094D\u091B\u0930 \u092E\u0932\u0947\u0930\u093F\u092F\u093E \u092A\u0930\u091C\u0940\u0935\u0940 \u092B\u0948\u0932\u093E\u0924\u093E \u0939\u0948\u0964 \u090F\u0921\u0940\u091C\u093C \u0921\u0947\u0902\u0917\u0942 \u092B\u0948\u0932\u093E\u0924\u093E \u0939\u0948\u0964"]]])],go=[q("g.india",4,s("Know India","\u092D\u093E\u0930\u0924 \u0915\u094B \u091C\u093E\u0928\u093F\u090F"),[],s("Learn facts with a map: find each place as you learn it.","\u0928\u0915\u094D\u0936\u0947 \u0915\u0947 \u0938\u093E\u0925 \u0924\u0925\u094D\u092F \u0938\u0940\u0916\u093F\u090F: \u0939\u0930 \u0938\u094D\u0925\u093E\u0928 \u0915\u094B \u0938\u0940\u0916\u0924\u0947 \u0938\u092E\u092F \u0928\u0915\u094D\u0936\u0947 \u092E\u0947\u0902 \u0916\u094B\u091C\u093F\u090F\u0964"),[["What is the capital of India?","\u092D\u093E\u0930\u0924 \u0915\u0940 \u0930\u093E\u091C\u0927\u093E\u0928\u0940 \u0915\u094D\u092F\u093E \u0939\u0948?",["New Delhi","\u0928\u0908 \u0926\u093F\u0932\u094D\u0932\u0940"],[["Mumbai","\u092E\u0941\u0902\u092C\u0908"],["Kolkata","\u0915\u094B\u0932\u0915\u093E\u0924\u093E"],["Chennai","\u091A\u0947\u0928\u094D\u0928\u0908"]],["New Delhi is the capital of India.","\u0928\u0908 \u0926\u093F\u0932\u094D\u0932\u0940 \u092D\u093E\u0930\u0924 \u0915\u0940 \u0930\u093E\u091C\u0927\u093E\u0928\u0940 \u0939\u0948\u0964"]],["What is the national animal of India?","\u092D\u093E\u0930\u0924 \u0915\u093E \u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0940\u092F \u092A\u0936\u0941 \u0915\u094C\u0928-\u0938\u093E \u0939\u0948?",["Tiger","\u092C\u093E\u0918"],[["Lion","\u0936\u0947\u0930"],["Elephant","\u0939\u093E\u0925\u0940"],["Peacock","\u092E\u094B\u0930"]],["The Bengal tiger is the national animal; the peacock is the national bird.","\u092C\u093E\u0918 \u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0940\u092F \u092A\u0936\u0941 \u0939\u0948; \u092E\u094B\u0930 \u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0940\u092F \u092A\u0915\u094D\u0937\u0940 \u0939\u0948\u0964"]],["What is the national bird of India?","\u092D\u093E\u0930\u0924 \u0915\u093E \u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0940\u092F \u092A\u0915\u094D\u0937\u0940 \u0915\u094C\u0928-\u0938\u093E \u0939\u0948?",["Peacock","\u092E\u094B\u0930"],[["Parrot","\u0924\u094B\u0924\u093E"],["Sparrow","\u0917\u094C\u0930\u0948\u092F\u093E"],["Eagle","\u0917\u0930\u0941\u0921\u093C (\u092C\u093E\u091C\u093C)"]],["The Indian peacock is the national bird.","\u092E\u094B\u0930 \u092D\u093E\u0930\u0924 \u0915\u093E \u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0940\u092F \u092A\u0915\u094D\u0937\u0940 \u0939\u0948\u0964"]],[`Who wrote India's national anthem, "Jana Gana Mana"?`,'\u092D\u093E\u0930\u0924 \u0915\u093E \u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0917\u093E\u0928 "\u091C\u0928 \u0917\u0923 \u092E\u0928" \u0915\u093F\u0938\u0928\u0947 \u0932\u093F\u0916\u093E?',["Rabindranath Tagore","\u0930\u0935\u0940\u0902\u0926\u094D\u0930\u0928\u093E\u0925 \u091F\u0948\u0917\u094B\u0930"],[["Bankim Chandra Chattopadhyay","\u092C\u0902\u0915\u093F\u092E \u091A\u0902\u0926\u094D\u0930 \u091A\u091F\u094D\u091F\u094B\u092A\u093E\u0927\u094D\u092F\u093E\u092F"],["Mahatma Gandhi","\u092E\u0939\u093E\u0924\u094D\u092E\u093E \u0917\u093E\u0902\u0927\u0940"],["Sarojini Naidu","\u0938\u0930\u094B\u091C\u093F\u0928\u0940 \u0928\u093E\u092F\u0921\u0942"]],['Tagore wrote it; Bankim Chandra wrote the national song "Vande Mataram".','\u0907\u0938\u0947 \u091F\u0948\u0917\u094B\u0930 \u0928\u0947 \u0932\u093F\u0916\u093E; \u092C\u0902\u0915\u093F\u092E \u091A\u0902\u0926\u094D\u0930 \u0928\u0947 \u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0917\u0940\u0924 "\u0935\u0902\u0926\u0947 \u092E\u093E\u0924\u0930\u092E\u094D" \u0932\u093F\u0916\u093E\u0964']],["On which date is Republic Day celebrated?","\u0917\u0923\u0924\u0902\u0924\u094D\u0930 \u0926\u093F\u0935\u0938 \u0915\u093F\u0938 \u0924\u093E\u0930\u0940\u0916 \u0915\u094B \u092E\u0928\u093E\u092F\u093E \u091C\u093E\u0924\u093E \u0939\u0948?",["26 January","26 \u091C\u0928\u0935\u0930\u0940"],[["15 August","15 \u0905\u0917\u0938\u094D\u0924"],["2 October","2 \u0905\u0915\u094D\u091F\u0942\u092C\u0930"],["14 November","14 \u0928\u0935\u0902\u092C\u0930"]],["The Constitution came into force on 26 January 1950.","\u0938\u0902\u0935\u093F\u0927\u093E\u0928 26 \u091C\u0928\u0935\u0930\u0940 1950 \u0915\u094B \u0932\u093E\u0917\u0942 \u0939\u0941\u0906\u0964"]],["Which is the longest river flowing in India?","\u092D\u093E\u0930\u0924 \u092E\u0947\u0902 \u092C\u0939\u0928\u0947 \u0935\u093E\u0932\u0940 \u0938\u092C\u0938\u0947 \u0932\u0902\u092C\u0940 \u0928\u0926\u0940 \u0915\u094C\u0928-\u0938\u0940 \u0939\u0948?",["Ganga","\u0917\u0902\u0917\u093E"],[["Yamuna","\u092F\u092E\u0941\u0928\u093E"],["Godavari","\u0917\u094B\u0926\u093E\u0935\u0930\u0940"],["Narmada","\u0928\u0930\u094D\u092E\u0926\u093E"]],["The Ganga is the longest river within India; the Godavari is the longest in the south.","\u0917\u0902\u0917\u093E \u092D\u093E\u0930\u0924 \u0915\u0947 \u092D\u0940\u0924\u0930 \u0938\u092C\u0938\u0947 \u0932\u0902\u092C\u0940 \u0928\u0926\u0940 \u0939\u0948; \u0917\u094B\u0926\u093E\u0935\u0930\u0940 \u0926\u0915\u094D\u0937\u093F\u0923 \u0915\u0940 \u0938\u092C\u0938\u0947 \u0932\u0902\u092C\u0940 \u0928\u0926\u0940 \u0939\u0948\u0964"]],["How many colours are there in the Indian national flag, not counting the Ashoka Chakra?","\u0905\u0936\u094B\u0915 \u091A\u0915\u094D\u0930 \u0915\u094B \u091B\u094B\u0921\u093C\u0915\u0930 \u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0940\u092F \u0927\u094D\u0935\u091C \u092E\u0947\u0902 \u0915\u093F\u0924\u0928\u0947 \u0930\u0902\u0917 \u0939\u0948\u0902?",["Three","\u0924\u0940\u0928"],[["Two","\u0926\u094B"],["Four","\u091A\u093E\u0930"],["Five","\u092A\u093E\u0901\u091A"]],["Saffron, white and green, with a navy blue Ashoka Chakra of 24 spokes.","\u0915\u0947\u0938\u0930\u093F\u092F\u093E, \u0938\u092B\u093C\u0947\u0926 \u0914\u0930 \u0939\u0930\u093E, \u0914\u0930 \u092C\u0940\u091A \u092E\u0947\u0902 24 \u0924\u0940\u0932\u093F\u092F\u094B\u0902 \u0935\u093E\u0932\u093E \u0928\u0940\u0932\u093E \u0905\u0936\u094B\u0915 \u091A\u0915\u094D\u0930\u0964"]],["Which is the highest mountain peak in India?","\u092D\u093E\u0930\u0924 \u0915\u0940 \u0938\u092C\u0938\u0947 \u090A\u0901\u091A\u0940 \u092A\u0930\u094D\u0935\u0924 \u091A\u094B\u091F\u0940 \u0915\u094C\u0928-\u0938\u0940 \u0939\u0948?",["Kangchenjunga","\u0915\u0902\u091A\u0928\u091C\u0902\u0917\u093E"],[["Mount Everest","\u092E\u093E\u0909\u0902\u091F \u090F\u0935\u0930\u0947\u0938\u094D\u091F"],["Nanda Devi","\u0928\u0902\u0926\u093E \u0926\u0947\u0935\u0940"],["Anamudi","\u0905\u0928\u093E\u092E\u0941\u0921\u0940"]],["Kangchenjunga is the highest peak located in India; Everest is in Nepal.","\u0915\u0902\u091A\u0928\u091C\u0902\u0917\u093E \u092D\u093E\u0930\u0924 \u092E\u0947\u0902 \u0938\u094D\u0925\u093F\u0924 \u0938\u092C\u0938\u0947 \u090A\u0901\u091A\u0940 \u091A\u094B\u091F\u0940 \u0939\u0948; \u090F\u0935\u0930\u0947\u0938\u094D\u091F \u0928\u0947\u092A\u093E\u0932 \u092E\u0947\u0902 \u0939\u0948\u0964"]]]),q("g.world",5,s("Our world","\u0939\u092E\u093E\u0930\u093E \u0935\u093F\u0936\u094D\u0935"),["g.india"],s("Connect each fact to a place on the globe.","\u0939\u0930 \u0924\u0925\u094D\u092F \u0915\u094B \u0917\u094D\u0932\u094B\u092C \u092A\u0930 \u0915\u093F\u0938\u0940 \u0938\u094D\u0925\u093E\u0928 \u0938\u0947 \u091C\u094B\u0921\u093C\u093F\u090F\u0964"),[["Which is the largest ocean?","\u0938\u092C\u0938\u0947 \u092C\u0921\u093C\u093E \u092E\u0939\u093E\u0938\u093E\u0917\u0930 \u0915\u094C\u0928-\u0938\u093E \u0939\u0948?",["Pacific Ocean","\u092A\u094D\u0930\u0936\u093E\u0902\u0924 \u092E\u0939\u093E\u0938\u093E\u0917\u0930"],[["Atlantic Ocean","\u0905\u091F\u0932\u093E\u0902\u091F\u093F\u0915 \u092E\u0939\u093E\u0938\u093E\u0917\u0930"],["Indian Ocean","\u0939\u093F\u0902\u0926 \u092E\u0939\u093E\u0938\u093E\u0917\u0930"],["Arctic Ocean","\u0906\u0930\u094D\u0915\u091F\u093F\u0915 \u092E\u0939\u093E\u0938\u093E\u0917\u0930"]],["The Pacific is the largest and deepest ocean.","\u092A\u094D\u0930\u0936\u093E\u0902\u0924 \u092E\u0939\u093E\u0938\u093E\u0917\u0930 \u0938\u092C\u0938\u0947 \u092C\u0921\u093C\u093E \u0914\u0930 \u0938\u092C\u0938\u0947 \u0917\u0939\u0930\u093E \u0939\u0948\u0964"]],["How many continents are there?","\u092E\u0939\u093E\u0926\u094D\u0935\u0940\u092A \u0915\u093F\u0924\u0928\u0947 \u0939\u0948\u0902?",["Seven","\u0938\u093E\u0924"],[["Five","\u092A\u093E\u0901\u091A"],["Six","\u091B\u0939"],["Nine","\u0928\u094C"]],["Asia, Africa, North America, South America, Antarctica, Europe and Australia.","\u090F\u0936\u093F\u092F\u093E, \u0905\u092B\u093C\u094D\u0930\u0940\u0915\u093E, \u0909\u0924\u094D\u0924\u0930\u0940 \u0905\u092E\u0947\u0930\u093F\u0915\u093E, \u0926\u0915\u094D\u0937\u093F\u0923\u0940 \u0905\u092E\u0947\u0930\u093F\u0915\u093E, \u0905\u0902\u091F\u093E\u0930\u094D\u0915\u091F\u093F\u0915\u093E, \u092F\u0942\u0930\u094B\u092A \u0914\u0930 \u0911\u0938\u094D\u091F\u094D\u0930\u0947\u0932\u093F\u092F\u093E\u0964"]],["Which is the largest continent?","\u0938\u092C\u0938\u0947 \u092C\u0921\u093C\u093E \u092E\u0939\u093E\u0926\u094D\u0935\u0940\u092A \u0915\u094C\u0928-\u0938\u093E \u0939\u0948?",["Asia","\u090F\u0936\u093F\u092F\u093E"],[["Africa","\u0905\u092B\u093C\u094D\u0930\u0940\u0915\u093E"],["Europe","\u092F\u0942\u0930\u094B\u092A"],["Australia","\u0911\u0938\u094D\u091F\u094D\u0930\u0947\u0932\u093F\u092F\u093E"]],["India is in Asia, the largest continent.","\u092D\u093E\u0930\u0924 \u090F\u0936\u093F\u092F\u093E \u092E\u0947\u0902 \u0939\u0948, \u091C\u094B \u0938\u092C\u0938\u0947 \u092C\u0921\u093C\u093E \u092E\u0939\u093E\u0926\u094D\u0935\u0940\u092A \u0939\u0948\u0964"]],["Which is the highest mountain in the world?","\u0935\u093F\u0936\u094D\u0935 \u0915\u093E \u0938\u092C\u0938\u0947 \u090A\u0901\u091A\u093E \u092A\u0930\u094D\u0935\u0924 \u0915\u094C\u0928-\u0938\u093E \u0939\u0948?",["Mount Everest","\u092E\u093E\u0909\u0902\u091F \u090F\u0935\u0930\u0947\u0938\u094D\u091F"],[["Kangchenjunga","\u0915\u0902\u091A\u0928\u091C\u0902\u0917\u093E"],["K2","K2"],["Kilimanjaro","\u0915\u093F\u0932\u093F\u092E\u0902\u091C\u093E\u0930\u094B"]],["Mount Everest, on the Nepal\u2013China border, is about 8,849 m high.","\u0928\u0947\u092A\u093E\u0932-\u091A\u0940\u0928 \u0938\u0940\u092E\u093E \u092A\u0930 \u0938\u094D\u0925\u093F\u0924 \u092E\u093E\u0909\u0902\u091F \u090F\u0935\u0930\u0947\u0938\u094D\u091F \u0932\u0917\u092D\u0917 8,849 \u092E\u0940\u091F\u0930 \u090A\u0901\u091A\u093E \u0939\u0948\u0964"]],["Which is the largest hot desert in the world?","\u0935\u093F\u0936\u094D\u0935 \u0915\u093E \u0938\u092C\u0938\u0947 \u092C\u0921\u093C\u093E \u0917\u0930\u094D\u092E \u092E\u0930\u0941\u0938\u094D\u0925\u0932 \u0915\u094C\u0928-\u0938\u093E \u0939\u0948?",["Sahara","\u0938\u0939\u093E\u0930\u093E"],[["Thar","\u0925\u093E\u0930"],["Gobi","\u0917\u094B\u092C\u0940"],["Kalahari","\u0915\u093E\u0932\u093E\u0939\u093E\u0930\u0940"]],["The Sahara covers much of North Africa. India has the Thar Desert.","\u0938\u0939\u093E\u0930\u093E \u0909\u0924\u094D\u0924\u0930\u0940 \u0905\u092B\u093C\u094D\u0930\u0940\u0915\u093E \u0915\u0947 \u092C\u0921\u093C\u0947 \u092D\u093E\u0917 \u092E\u0947\u0902 \u092B\u0948\u0932\u093E \u0939\u0948\u0964 \u092D\u093E\u0930\u0924 \u092E\u0947\u0902 \u0925\u093E\u0930 \u092E\u0930\u0941\u0938\u094D\u0925\u0932 \u0939\u0948\u0964"]],["Which imaginary line divides the Earth into northern and southern halves?","\u0915\u094C\u0928-\u0938\u0940 \u0915\u093E\u0932\u094D\u092A\u0928\u093F\u0915 \u0930\u0947\u0916\u093E \u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u094B \u0909\u0924\u094D\u0924\u0930\u0940 \u0914\u0930 \u0926\u0915\u094D\u0937\u093F\u0923\u0940 \u092D\u093E\u0917\u094B\u0902 \u092E\u0947\u0902 \u092C\u093E\u0901\u091F\u0924\u0940 \u0939\u0948?",["Equator","\u092D\u0942\u092E\u0927\u094D\u092F \u0930\u0947\u0916\u093E"],[["Prime Meridian","\u092A\u094D\u0930\u0927\u093E\u0928 \u092E\u0927\u094D\u092F\u093E\u0939\u094D\u0928 \u0930\u0947\u0916\u093E"],["Tropic of Cancer","\u0915\u0930\u094D\u0915 \u0930\u0947\u0916\u093E"],["Arctic Circle","\u0906\u0930\u094D\u0915\u091F\u093F\u0915 \u0935\u0943\u0924\u094D\u0924"]],["The equator is at 0\xB0 latitude. The Tropic of Cancer passes through India.","\u092D\u0942\u092E\u0927\u094D\u092F \u0930\u0947\u0916\u093E 0\xB0 \u0905\u0915\u094D\u0937\u093E\u0902\u0936 \u092A\u0930 \u0939\u0948\u0964 \u0915\u0930\u094D\u0915 \u0930\u0947\u0916\u093E \u092D\u093E\u0930\u0924 \u0938\u0947 \u0939\u094B\u0915\u0930 \u0917\u0941\u091C\u093C\u0930\u0924\u0940 \u0939\u0948\u0964"]]]),q("g.scientists",6,s("Great scientists and inventions","\u092E\u0939\u093E\u0928 \u0935\u0948\u091C\u094D\u091E\u093E\u0928\u093F\u0915 \u0914\u0930 \u0906\u0935\u093F\u0937\u094D\u0915\u093E\u0930"),["g.india"],s("Link each person to one discovery and one reason it mattered.","\u0939\u0930 \u0935\u094D\u092F\u0915\u094D\u0924\u093F \
