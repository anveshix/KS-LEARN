\u0930\u0902\u0917\u093E \u092B\u0939\u0930\u093E\u092F\u093E \u091C\u093E\u0924\u093E \u0939\u0948\u0964"]]]),_("t.rivers",5,s("Rivers of India","\u092D\u093E\u0930\u0924 \u0915\u0940 \u0928\u0926\u093F\u092F\u093E\u0901"),["t.capitals"],s("Rivers start in mountains or plateaus and flow to a sea. Learn where each one starts and which state or city it waters.","\u0928\u0926\u093F\u092F\u093E\u0901 \u092A\u0939\u093E\u0921\u093C\u094B\u0902 \u092F\u093E \u092A\u0920\u093E\u0930\u094B\u0902 \u0938\u0947 \u0928\u093F\u0915\u0932\u0915\u0930 \u0938\u092E\u0941\u0926\u094D\u0930 \u092E\u0947\u0902 \u092E\u093F\u0932\u0924\u0940 \u0939\u0948\u0902\u0964 \u092F\u093E\u0926 \u0915\u0930\u094B \u0915\u093F \u0915\u094C\u0928 \u0915\u0939\u093E\u0901 \u0938\u0947 \u0928\u093F\u0915\u0932\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0915\u093F\u0938 \u0930\u093E\u091C\u094D\u092F \u092F\u093E \u0936\u0939\u0930 \u0938\u0947 \u0917\u0941\u091C\u093C\u0930\u0924\u0940 \u0939\u0948\u0964"),[["The river Ganga starts from which glacier?","\u0917\u0902\u0917\u093E \u0928\u0926\u0940 \u0915\u093F\u0938 \u0939\u093F\u092E\u0928\u0926 \u0938\u0947 \u0928\u093F\u0915\u0932\u0924\u0940 \u0939\u0948?",["Gangotri","\u0917\u0902\u0917\u094B\u0924\u094D\u0930\u0940"],[["Siachen","\u0938\u093F\u092F\u093E\u091A\u093F\u0928"],["Zemu","\u091C\u093C\u0947\u092E\u0942"],["Pindari","\u092A\u093F\u0902\u0921\u093E\u0930\u0940"]],["The Ganga starts from the Gangotri glacier in Uttarakhand.","\u0917\u0902\u0917\u093E \u0909\u0924\u094D\u0924\u0930\u093E\u0916\u0902\u0921 \u0915\u0947 \u0917\u0902\u0917\u094B\u0924\u094D\u0930\u0940 \u0939\u093F\u092E\u0928\u0926 \u0938\u0947 \u0928\u093F\u0915\u0932\u0924\u0940 \u0939\u0948\u0964"]],["On which river does Varanasi stand?","\u0935\u093E\u0930\u093E\u0923\u0938\u0940 \u0915\u093F\u0938 \u0928\u0926\u0940 \u0915\u0947 \u0915\u093F\u0928\u093E\u0930\u0947 \u0939\u0948?",["Ganga","\u0917\u0902\u0917\u093E"],[["Yamuna","\u092F\u092E\u0941\u0928\u093E"],["Godavari","\u0917\u094B\u0926\u093E\u0935\u0930\u0940"],["Narmada","\u0928\u0930\u094D\u092E\u0926\u093E"]],["Varanasi is on the banks of the Ganga.","\u0935\u093E\u0930\u093E\u0923\u0938\u0940 \u0917\u0902\u0917\u093E \u0915\u0947 \u0915\u093F\u0928\u093E\u0930\u0947 \u092C\u0938\u093E \u0939\u0948\u0964"]],["The Taj Mahal is on the banks of which river?","\u0924\u093E\u091C\u092E\u0939\u0932 \u0915\u093F\u0938 \u0928\u0926\u0940 \u0915\u0947 \u0915\u093F\u0928\u093E\u0930\u0947 \u0939\u0948?",["Yamuna","\u092F\u092E\u0941\u0928\u093E"],[["Ganga","\u0917\u0902\u0917\u093E"],["Sabarmati","\u0938\u093E\u092C\u0930\u092E\u0924\u0940"],["Kaveri","\u0915\u093E\u0935\u0947\u0930\u0940"]],["The Yamuna flows past Delhi and Agra.","\u092F\u092E\u0941\u0928\u093E \u0926\u093F\u0932\u094D\u0932\u0940 \u0914\u0930 \u0906\u0917\u0930\u093E \u0938\u0947 \u0939\u094B\u0915\u0930 \u092C\u0939\u0924\u0940 \u0939\u0948\u0964"]],['Which is the longest river of peninsular India, called "Dakshin Ganga"?','\u092A\u094D\u0930\u093E\u092F\u0926\u094D\u0935\u0940\u092A\u0940\u092F \u092D\u093E\u0930\u0924 \u0915\u0940 \u0938\u092C\u0938\u0947 \u0932\u0902\u092C\u0940 \u0928\u0926\u0940, \u091C\u093F\u0938\u0947 "\u0926\u0915\u094D\u0937\u093F\u0923 \u0917\u0902\u0917\u093E" \u0915\u0939\u0924\u0947 \u0939\u0948\u0902, \u0915\u094C\u0928-\u0938\u0940 \u0939\u0948?',["Godavari","\u0917\u094B\u0926\u093E\u0935\u0930\u0940"],[["Krishna","\u0915\u0943\u0937\u094D\u0923\u093E"],["Kaveri","\u0915\u093E\u0935\u0947\u0930\u0940"],["Tapti","\u0924\u093E\u092A\u0940"]],["The Godavari is the longest river of peninsular India.","\u0917\u094B\u0926\u093E\u0935\u0930\u0940 \u092A\u094D\u0930\u093E\u092F\u0926\u094D\u0935\u0940\u092A\u0940\u092F \u092D\u093E\u0930\u0924 \u0915\u0940 \u0938\u092C\u0938\u0947 \u0932\u0902\u092C\u0940 \u0928\u0926\u0940 \u0939\u0948\u0964"]],["The river Brahmaputra flows through which Indian state?","\u092C\u094D\u0930\u0939\u094D\u092E\u092A\u0941\u0924\u094D\u0930 \u0928\u0926\u0940 \u0915\u093F\u0938 \u0930\u093E\u091C\u094D\u092F \u0938\u0947 \u0939\u094B\u0915\u0930 \u092C\u0939\u0924\u0940 \u0939\u0948?",["Assam","\u0905\u0938\u092E"],[["Punjab","\u092A\u0902\u091C\u093E\u092C"],["Kerala","\u0915\u0947\u0930\u0932"],["Rajasthan","\u0930\u093E\u091C\u0938\u094D\u0925\u093E\u0928"]],["The Brahmaputra flows through Assam.","\u092C\u094D\u0930\u0939\u094D\u092E\u092A\u0941\u0924\u094D\u0930 \u0905\u0938\u092E \u0938\u0947 \u0939\u094B\u0915\u0930 \u092C\u0939\u0924\u0940 \u0939\u0948\u0964"]],["Into which sea does the river Narmada flow?","\u0928\u0930\u094D\u092E\u0926\u093E \u0928\u0926\u0940 \u0915\u093F\u0938 \u0938\u093E\u0917\u0930 \u092E\u0947\u0902 \u092E\u093F\u0932\u0924\u0940 \u0939\u0948?",["Arabian Sea","\u0905\u0930\u092C \u0938\u093E\u0917\u0930"],[["Bay of Bengal","\u092C\u0902\u0917\u093E\u0932 \u0915\u0940 \u0916\u093E\u0921\u093C\u0940"],["Indian Ocean","\u0939\u093F\u0902\u0926 \u092E\u0939\u093E\u0938\u093E\u0917\u0930"],["Caspian Sea","\u0915\u0948\u0938\u094D\u092A\u093F\u092F\u0928 \u0938\u093E\u0917\u0930"]],["The Narmada flows west into the Arabian Sea.","\u0928\u0930\u094D\u092E\u0926\u093E \u092A\u0936\u094D\u091A\u093F\u092E \u0915\u0940 \u0913\u0930 \u092C\u0939\u0915\u0930 \u0905\u0930\u092C \u0938\u093E\u0917\u0930 \u092E\u0947\u0902 \u092E\u093F\u0932\u0924\u0940 \u0939\u0948\u0964"]],["The Hirakud Dam is built on which river?","\u0939\u0940\u0930\u093E\u0915\u0941\u0921 \u092C\u093E\u0901\u0927 \u0915\u093F\u0938 \u0928\u0926\u0940 \u092A\u0930 \u092C\u0928\u093E \u0939\u0948?",["Mahanadi","\u092E\u0939\u093E\u0928\u0926\u0940"],[["Ganga","\u0917\u0902\u0917\u093E"],["Kosi","\u0915\u094B\u0938\u0940"],["Sutlej","\u0938\u0924\u0932\u0941\u091C"]],["The Hirakud Dam, in Odisha, is on the Mahanadi.","\u0913\u0921\u093F\u0936\u093E \u0915\u093E \u0939\u0940\u0930\u093E\u0915\u0941\u0921 \u092C\u093E\u0901\u0927 \u092E\u0939\u093E\u0928\u0926\u0940 \u092A\u0930 \u092C\u0928\u093E \u0939\u0948\u0964"]],["The Kaveri river flows through Karnataka and which other state?","\u0915\u093E\u0935\u0947\u0930\u0940 \u0928\u0926\u0940 \u0915\u0930\u094D\u0928\u093E\u091F\u0915 \u0914\u0930 \u0915\u093F\u0938 \u0905\u0928\u094D\u092F \u0930\u093E\u091C\u094D\u092F \u0938\u0947 \u092C\u0939\u0924\u0940 \u0939\u0948?",["Tamil Nadu","\u0924\u092E\u093F\u0932\u0928\u093E\u0921\u0941"],[["Gujarat","\u0917\u0941\u091C\u0930\u093E\u0924"],["Bihar","\u092C\u093F\u0939\u093E\u0930"],["Haryana","\u0939\u0930\u093F\u092F\u093E\u0923\u093E"]],["The Kaveri flows through Karnataka and Tamil Nadu.","\u0915\u093E\u0935\u0947\u0930\u0940 \u0915\u0930\u094D\u0928\u093E\u091F\u0915 \u0914\u0930 \u0924\u092E\u093F\u0932\u0928\u093E\u0921\u0941 \u0938\u0947 \u092C\u0939\u0924\u0940 \u0939\u0948\u0964"]]]),_("t.landforms",5,s("Mountains, plains, deserts and islands","\u092A\u0930\u094D\u0935\u0924, \u092E\u0948\u0926\u093E\u0928, \u092E\u0930\u0941\u0938\u094D\u0925\u0932 \u0914\u0930 \u0926\u094D\u0935\u0940\u092A"),["t.capitals"],s("India has mountains in the north, plains in the middle, a plateau in the south, a desert in the west and islands in the seas.","\u092D\u093E\u0930\u0924 \u092E\u0947\u0902 \u0909\u0924\u094D\u0924\u0930 \u092E\u0947\u0902 \u092A\u0930\u094D\u0935\u0924, \u092C\u0940\u091A \u092E\u0947\u0902 \u092E\u0948\u0926\u093E\u0928, \u0926\u0915\u094D\u0937\u093F\u0923 \u092E\u0947\u0902 \u092A\u0920\u093E\u0930, \u092A\u0936\u094D\u091A\u093F\u092E \u092E\u0947\u0902 \u092E\u0930\u0941\u0938\u094D\u0925\u0932 \u0914\u0930 \u0938\u092E\u0941\u0926\u094D\u0930\u094B\u0902 \u092E\u0947\u0902 \u0926\u094D\u0935\u0940\u092A \u0939\u0948\u0902\u0964"),[["Which mountain range lies in the north of India?","\u092D\u093E\u0930\u0924 \u0915\u0947 \u0909\u0924\u094D\u0924\u0930 \u092E\u0947\u0902 \u0915\u094C\u0928-\u0938\u0940 \u092A\u0930\u094D\u0935\u0924\u092E\u093E\u0932\u093E \u0939\u0948?",["The Himalayas","\u0939\u093F\u092E\u093E\u0932\u092F"],[["The Western Ghats","\u092A\u0936\u094D\u091A\u093F\u092E\u0940 \u0918\u093E\u091F"],["The Aravalli","\u0905\u0930\u093E\u0935\u0932\u0940"],["The Vindhya","\u0935\u093F\u0902\u0927\u094D\u092F\u093E\u091A\u0932"]],["The Himalayas guard India in the north.","\u0939\u093F\u092E\u093E\u0932\u092F \u092D\u093E\u0930\u0924 \u0915\u0940 \u0909\u0924\u094D\u0924\u0930\u0940 \u0938\u0940\u092E\u093E \u092A\u0930 \u0939\u0948\u0964"]],["Which is the highest mountain peak in India?","\u092D\u093E\u0930\u0924 \u0915\u0940 \u0938\u092C\u0938\u0947 \u090A\u0901\u091A\u0940 \u092A\u0930\u094D\u0935\u0924 \u091A\u094B\u091F\u0940 \u0915\u094C\u0928-\u0938\u0940 \u0939\u0948?",["Kanchenjunga","\u0915\u0902\u091A\u0928\u091C\u0902\u0917\u093E"],[["Anamudi","\u0905\u0928\u093E\u092E\u0941\u0921\u0940"],["Mount Abu","\u092E\u093E\u0909\u0902\u091F \u0906\u092C\u0942"],["Dodabetta","\u0926\u094B\u0926\u093E\u092C\u0947\u091F\u094D\u091F\u093E"]],["Kanchenjunga, in Sikkim, is the highest peak in India.","\u0938\u093F\u0915\u094D\u0915\u093F\u092E \u0915\u0940 \u0915\u0902\u091A\u0928\u091C\u0902\u0917\u093E \u092D\u093E\u0930\u0924 \u0915\u0940 \u0938\u092C\u0938\u0947 \u090A\u0901\u091A\u0940 \u091A\u094B\u091F\u0940 \u0939\u0948\u0964"]],["In which state is the Thar Desert?","\u0925\u093E\u0930 \u092E\u0930\u0941\u0938\u094D\u0925\u0932 \u092E\u0941\u0916\u094D\u092F \u0930\u0942\u092A \u0938\u0947 \u0915\u093F\u0938 \u0930\u093E\u091C\u094D\u092F \u092E\u0947\u0902 \u0939\u0948?",["Rajasthan","\u0930\u093E\u091C\u0938\u094D\u0925\u093E\u0928"],[["Kerala","\u0915\u0947\u0930\u0932"],["Assam","\u0905\u0938\u092E"],["Odisha","\u0913\u0921\u093F\u0936\u093E"]],["The Thar, or Great Indian Desert, is mostly in Rajasthan.","\u0925\u093E\u0930, \u092F\u093E\u0928\u0940 \u092E\u0939\u093E\u0928 \u092D\u093E\u0930\u0924\u0940\u092F \u092E\u0930\u0941\u0938\u094D\u0925\u0932, \u091C\u093C\u094D\u092F\u093E\u0926\u093E\u0924\u0930 \u0930\u093E\u091C\u0938\u094D\u0925\u093E\u0928 \u092E\u0947\u0902 \u0939\u0948\u0964"]],["Which plateau covers much of southern India?","\u0926\u0915\u094D\u0937\u093F\u0923 \u092D\u093E\u0930\u0924 \u0915\u0947 \u092C\u0921\u093C\u0947 \u092D\u093E\u0917 \u092E\u0947\u0902 \u0915\u094C\u0928-\u0938\u093E \u092A\u0920\u093E\u0930 \u0939\u0948?",["The Deccan Plateau","\u0926\u0915\u094D\u0915\u0928 \u0915\u093E \u092A\u0920\u093E\u0930"],[["The Malwa Plateau","\u092E\u093E\u0932\u0935\u093E \u0915\u093E \u092A\u0920\u093E\u0930"],["The Tibetan Plateau","\u0924\u093F\u092C\u094D\u092C\u0924 \u0915\u093E \u092A\u0920\u093E\u0930"],["The Pamir Plateau","\u092A\u093E\u092E\u0940\u0930 \u0915\u093E \u092A\u0920\u093E\u0930"]],["The Deccan Plateau lies in the south of India.","\u0926\u0915\u094D\u0915\u0928 \u0915\u093E \u092A\u0920\u093E\u0930 \u092D\u093E\u0930\u0924 \u0915\u0947 \u0926\u0915\u094D\u0937\u093F\u0923 \u092E\u0947\u0902 \u0939\u0948\u0964"]],["The hill range along the west coast of India is called the:","\u092D\u093E\u0930\u0924 \u0915\u0947 \u092A\u0936\u094D\u091A\u093F\u092E\u0940 \u0924\u091F \u0915\u0947 \u0938\u093E\u0925-\u0938\u093E\u0925 \u092B\u0948\u0932\u0940 \u092A\u0939\u093E\u0921\u093C\u093F\u092F\u093E\u0901 \u0915\u094D\u092F\u093E \u0915\u0939\u0932\u093E\u0924\u0940 \u0939\u0948\u0902?",["Western Ghats","\u092A\u0936\u094D\u091A\u093F\u092E\u0940 \u0918\u093E\u091F"],[["Eastern Ghats","\u092A\u0942\u0930\u094D\u0935\u0940 \u0918\u093E\u091F"],["Satpura","\u0938\u0924\u092A\u0941\u0921\u093C\u093E"],["Shivalik","\u0936\u093F\u0935\u093E\u0932\u093F\u0915"]],["The Western Ghats run along the Arabian Sea coast.","\u092A\u0936\u094D\u091A\u093F\u092E\u0940 \u0918\u093E\u091F \u0905\u0930\u092C \u0938\u093E\u0917\u0930 \u0915\u0947 \u0924\u091F \u0915\u0947 \u0938\u093E\u0925 \u092B\u0948\u0932\u093E \u0939\u0948\u0964"]],["The Andaman and Nicobar Islands lie in which water body?","\u0905\u0902\u0921\u092E\u093E\u0928 \u0914\u0930 \u0928\u093F\u0915\u094B\u092C\u093E\u0930 \u0926\u094D\u0935\u0940\u092A \u0938\u092E\u0942\u0939 \u0915\u093F\u0938 \u091C\u0932\u0930\u093E\u0936\u093F \u092E\u0947\u0902 \u0939\u0948\u0902?",["Bay of Bengal","\u092C\u0902\u0917\u093E\u0932 \u0915\u0940 \u0916\u093E\u0921\u093C\u0940"],[["Arabian Sea","\u0905\u0930\u092C \u0938\u093E\u0917\u0930"],["Red Sea","\u0932\u093E\u0932 \u0938\u093E\u0917\u0930"],["Pacific Ocean","\u092A\u094D\u0930\u0936\u093E\u0902\u0924 \u092E\u0939\u093E\u0938\u093E\u0917\u0930"]],["They are in the Bay of Bengal, east of the mainland.","\u092F\u0947 \u092E\u0941\u0916\u094D\u092F \u092D\u0942\u092E\u093F \u0915\u0947 \u092A\u0942\u0930\u094D\u0935 \u092E\u0947\u0902 \u092C\u0902\u0917\u093E\u0932 \u0915\u0940 \u0916\u093E\u0921\u093C\u0940 \u092E\u0947\u0902 \u0939\u0948\u0902\u0964"]],["Why are the Northern Plains of India good for farming?","\u0909\u0924\u094D\u0924\u0930\u0940 \u092E\u0948\u0926\u093E\u0928 \u0916\u0947\u0924\u0940 \u0915\u0947 \u0932\u093F\u090F \u0905\u091A\u094D\u091B\u0947 \u0915\u094D\u092F\u094B\u0902 \u0939\u0948\u0902?",["Rivers bring fertile soil","\u0928\u0926\u093F\u092F\u093E\u0901 \u0909\u092A\u091C\u093E\u090A \u092E\u093F\u091F\u094D\u091F\u0940 \u0932\u093E\u0924\u0940 \u0939\u0948\u0902"],[["They are very cold","\u0935\u0947 \u092C\u0939\u0941\u0924 \u0920\u0902\u0921\u0947 \u0939\u0948\u0902"],["They are covered in snow","\u0935\u0947 \u092C\u0930\u094D\u092B\u093C \u0938\u0947 \u0922\u0915\u0947 \u0939\u0948\u0902"],["They have no water","\u0935\u0939\u093E\u0901 \u092A\u093E\u0928\u0940 \u0928\u0939\u0940\u0902 \u0939\u0948"]],["Ganga and its rivers deposit fertile silt on the plains.","\u0917\u0902\u0917\u093E \u0914\u0930 \u0909\u0938\u0915\u0940 \u0938\u0939\u093E\u092F\u0915 \u0928\u0926\u093F\u092F\u093E\u0901 \u092E\u0948\u0926\u093E\u0928\u094B\u0902 \u092E\u0947\u0902 \u0909\u092A\u091C\u093E\u090A \u0917\u093E\u0926 \u091C\u092E\u093E \u0915\u0930\u0924\u0940 \u0939\u0948\u0902\u0964"]]]),_("t.climate",6,s("Monsoon, seasons and crops","\u092E\u093E\u0928\u0938\u0942\u0928, \u090B\u0924\u0941\u090F\u0901 \u0914\u0930 \u092B\u093C\u0938\u0932\u0947\u0902"),["t.landforms"],s("Rain from the monsoon decides what farmers grow: kharif crops in the rains, rabi crops in winter.","\u092E\u093E\u0928\u0938\u0942\u0928 \u0915\u0940 \u0935\u0930\u094D\u0937\u093E \u0924\u092F \u0915\u0930\u0924\u0940 \u0939\u0948 \u0915\u093F \u0915\u093F\u0938\u093E\u0928 \u0915\u094D\u092F\u093E \u0909\u0917\u093E\u090F\u0901: \u0935\u0930\u094D\u0937\u093E \u092E\u0947\u0902 \u0916\u0930\u0940\u092B\u093C, \u0938\u0930\u094D\u0926\u0940 \u092E\u0947\u0902 \u0930\u092C\u0940\u0964"),[["In which months does the south-west monsoon bring rain to most of India?","\u0926\u0915\u094D\u0937\u093F\u0923-\u092A\u0936\u094D\u091A\u093F\u092E \u092E\u093E\u0928\u0938\u0942\u0928 \u0905\u0927\u093F\u0915\u093E\u0902\u0936 \u092D\u093E\u0930\u0924 \u092E\u0947\u0902 \u0915\u093F\u0928 \u092E\u0939\u0940\u0928\u094B\u0902 \u092E\u0947\u0902 \u0935\u0930\u094D\u0937\u093E \u0932\u093E\u0924\u093E \u0939\u0948?",["June to September","\u091C\u0942\u0928 \u0938\u0947 \u0938\u093F\u0924\u0902\u092C\u0930"],[["December to February","\u0926\u093F\u0938\u0902\u092C\u0930 \u0938\u0947 \u092B\u093C\u0930\u0935\u0930\u0940"],["March to May","\u092E\u093E\u0930\u094D\u091A \u0938\u0947 \u092E\u0908"],["October to November","\u0905\u0915\u094D\u091F\u0942\u092C\u0930 \u0938\u0947 \u0928\u0935\u0902\u092C\u0930"]],["The monsoon arrives in Kerala around the first week of June and withdraws by September.","\u092E\u093E\u0928\u0938\u0942\u0928 \u091C\u0942\u0928 \u0915\u0947 \u092A\u0939\u0932\u0947 \u0938\u092A\u094D\u0924\u093E\u0939 \u092E\u0947\u0902 \u0915\u0947\u0930\u0932 \u092A\u0939\u0941\u0901\u091A\u0924\u093E \u0939\u0948 \u0914\u0930 \u0938\u093F\u0924\u0902\u092C\u0930 \u0924\u0915 \u0932\u094C\u091F \u091C\u093E\u0924\u093E \u0939\u0948\u0964"]],["Which crop is a kharif crop, sown with the monsoon?","\u0915\u094C\u0928-\u0938\u0940 \u092B\u093C\u0938\u0932 \u0916\u0930\u0940\u092B\u093C \u0915\u0940 \u0939\u0948, \u091C\u094B \u092E\u093E\u0928\u0938\u0942\u0928 \u092E\u0947\u0902 \u092C\u094B\u0908 \u091C\u093E\u0924\u0940 \u0939\u0948?",["Rice","\u091A\u093E\u0935\u0932"],[["Wheat","\u0917\u0947\u0939\u0942\u0901"],["Mustard","\u0938\u0930\u0938\u094B\u0902"],["Gram","\u091A\u0928\u093E"]],["Rice needs a lot of water, so it is sown in the rains.","\u091A\u093E\u0935\u0932 \u0915\u094B \u092C\u0939\u0941\u0924 \u092A\u093E\u0928\u0940 \u091A\u093E\u0939\u093F\u090F, \u0907\u0938\u0932\u093F\u090F \u0935\u0939 \u0935\u0930\u094D\u0937\u093E \u092E\u0947\u0902 \u092C\u094B\u092F\u093E \u091C\u093E\u0924\u093E \u0939\u0948\u0964"]],["Which crop is a rabi crop, sown in winter?","\u0915\u094C\u0928-\u0938\u0940 \u092B\u093C\u0938\u0932 \u0930\u092C\u0940 \u0915\u0940 \u0939\u0948, \u091C\u094B \u0938\u0930\u094D\u0926\u0940 \u092E\u0947\u0902 \u092C\u094B\u0908 \u091C\u093E\u0924\u0940 \u0939\u0948?",["Wheat","\u0917\u0947\u0939\u0942\u0901"],[["Rice","\u091A\u093E\u0935\u0932"],["Jowar","\u091C\u094D\u0935\u093E\u0930"],["Maize","\u092E\u0915\u094D\u0915\u093E"]],["Wheat is sown in October-November and harvested in spring.","\u0917\u0947\u0939\u0942\u0901 \u0905\u0915\u094D\u091F\u0942\u092C\u0930-\u0928\u0935\u0902\u092C\u0930 \u092E\u0947\u0902 \u092C\u094B\u092F\u093E \u0914\u0930 \u0935\u0938\u0902\u0924 \u092E\u0947\u0902 \u0915\u093E\u091F\u093E \u091C\u093E\u0924\u093E \u0939\u0948\u0964"]],["Which place in Meghalaya is among the wettest on Earth?","\u092E\u0947\u0918\u093E\u0932\u092F \u0915\u093E \u0915\u094C\u0928-\u0938\u093E \u0938\u094D\u0925\u093E\u0928 \u0927\u0930\u0924\u0940 \u0915\u0947 \u0938\u092C\u0938\u0947 \u0905\u0927\u093F\u0915 \u0935\u0930\u094D\u0937\u093E \u0935\u093E\u0932\u0947 \u0938\u094D\u0925\u093E\u0928\u094B\u0902 \u092E\u0947\u0902 \u0939\u0948?",["Mawsynram","\u092E\u093E\u0935\u0938\u093F\u0928\u0930\u093E\u092E"],[["Jaisalmer","\u091C\u0948\u0938\u0932\u092E\u0947\u0930"],["Leh","\u0932\u0947\u0939"],["Bikaner","\u092C\u0940\u0915\u093E\u0928\u0947\u0930"]],["Mawsynram and Cherrapunji get extremely heavy rain.","\u092E\u093E\u0935\u0938\u093F\u0928\u0930\u093E\u092E \u0914\u0930 \u091A\u0947\u0930\u093E\u092A\u0942\u0901\u091C\u0940 \u092E\u0947\u0902 \u092C\u0939\u0941\u0924 \u092D\u093E\u0930\u0940 \u0935\u0930\u094D\u0937\u093E \u0939\u094B\u0924\u0940 \u0939\u0948\u0964"]],["Which Indian state gets very little rain because of the desert?","\u092E\u0930\u0941\u0938\u094D\u0925\u0932 \u0915\u0947 \u0915\u093E\u0930\u0923 \u0915\u093F\u0938 \u0930\u093E\u091C\u094D\u092F \u092E\u0947\u0902 \u092C\u0939\u0941\u0924 \u0915\u092E \u0935\u0930\u094D\u0937\u093E \u0939\u094B\u0924\u0940 \u0939\u0948?",["Rajasthan","\u0930\u093E\u091C\u0938\u094D\u0925\u093E\u0928"],[["Kerala","\u0915\u0947\u0930\u0932"],["Assam","\u0905\u0938\u092E"],["Goa","\u0917\u094B\u0935\u093E"]],["Western Rajasthan is dry and gets little rain.","\u092A\u0936\u094D\u091A\u093F\u092E\u0940 \u0930\u093E\u091C\u0938\u094D\u0925\u093E\u0928 \u0938\u0942\u0916\u093E \u0939\u0948 \u0914\u0930 \u0935\u0939\u093E\u0901 \u0915\u092E \u0935\u0930\u094D\u0937\u093E \u0939\u094B\u0924\u0940 \u0939\u0948\u0964"]],["Cotton grows best in which type of soil?","\u0915\u092A\u093E\u0938 \u0915\u093F\u0938 \u092A\u094D\u0930\u0915\u093E\u0930 \u0915\u0940 \u092E\u093F\u091F\u094D\u091F\u0940 \u092E\u0947\u0902 \u0938\u092C\u0938\u0947 \u0905\u091A\u094D\u091B\u0940 \u0909\u0917\u0924\u0940 \u0939\u0948?",["Black soil","\u0915\u093E\u0932\u0940 \u092E\u093F\u091F\u094D\u091F\u0940"],[["Desert sand","\u0930\u0947\u0924\u0940\u0932\u0940 \u092E\u093F\u091F\u094D\u091F\u0940"],["Snow","\u092C\u0930\u094D\u092B\u093C"],["Rocky soil","\u092A\u0925\u0930\u0940\u0932\u0940 \u092E\u093F\u091F\u094D\u091F\u0940"]],["Black soil holds moisture, which cotton needs.","\u0915\u093E\u0932\u0940 \u092E\u093F\u091F\u094D\u091F\u0940 \u0928\u092E\u0940 \u0930\u094B\u0915\u0924\u0940 \u0939\u0948, \u091C\u094B \u0915\u092A\u093E\u0938 \u0915\u094B \u091A\u093E\u0939\u093F\u090F\u0964"]],["Which of these is a cash crop of Assam and the Nilgiris?","\u0907\u0928\u092E\u0947\u0902 \u0938\u0947 \u0905\u0938\u092E \u0914\u0930 \u0928\u0940\u0932\u0917\u093F\u0930\u093F \u0915\u0940 \u0928\u0915\u0926\u0940 \u092B\u093C\u0938\u0932 \u0915\u094C\u0928-\u0938\u0940 \u0939\u0948?",["Tea","\u091A\u093E\u092F"],[["Wheat","\u0917\u0947\u0939\u0942\u0901"],["Bajra","\u092C\u093E\u091C\u0930\u093E"],["Gram","\u091A\u0928\u093E"]],["Tea grows well on rainy hill slopes.","\u091A\u093E\u092F \u0935\u0930\u094D\u0937\u093E \u0935\u093E\u0932\u0940 \u092A\u0939\u093E\u0921\u093C\u0940 \u0922\u0932\u093E\u0928\u094B\u0902 \u092A\u0930 \u0905\u091A\u094D\u091B\u0940 \u0909\u0917\u0924\u0940 \u0939\u0948\u0964"]]]),_("t.history1",6,s("Early India: Indus Valley to the Mughals","\u092A\u094D\u0930\u093E\u091A\u0940\u0928 \u092D\u093E\u0930\u0924: \u0938\u093F\u0902\u0927\u0941 \u0918\u093E\u091F\u0940 \u0938\u0947 \u092E\u0941\u0917\u093C\u0932\u094B\u0902 \u0924\u0915"),["t.monuments"],s("Link each person or place to the age it belongs to: Indus, Maurya, Gupta, then the Mughals.","\u0939\u0930 \u0935\u094D\u092F\u0915\u094D\u0924\u093F \u092F\u093E \u0938\u094D\u0925\u093E\u0928 \u0915\u094B \u0909\u0938\u0915\u0947 \u0915\u093E\u0932 \u0938\u0947 \u091C\u094B\u0921\u093C\u094B: \u0938\u093F\u0902\u0927\u0941, \u092E\u094C\u0930\u094D\u092F, \u0917\u0941\u092A\u094D\u0924, \u092B\u093F\u0930 \u092E\u0941\u0917\u093C\u0932\u0964"),[["Harappa and Mohenjo-daro belong to which civilisation?","\u0939\u0921\u093C\u092A\u094D\u092A\u093E \u0914\u0930 \u092E\u094B\u0939\u0928\u091C\u094B\u0926\u0921\u093C\u094B \u0915\u093F\u0938 \u0938\u092D\u094D\u092F\u0924\u093E \u0915\u0947 \u0939\u0948\u0902?",["Indus Valley Civilisation","\u0938\u093F\u0902\u0927\u0941 \u0918\u093E\u091F\u0940 \u0938\u092D\u094D\u092F\u0924\u093E"],[["Gupta Empire","\u0917\u0941\u092A\u094D\u0924 \u0938\u093E\u092E\u094D\u0930\u093E\u091C\u094D\u092F"],["Mughal Empire","\u092E\u0941\u0917\u093C\u0932 \u0938\u093E\u092E\u094D\u0930\u093E\u091C\u094D\u092F"],["Maurya Empire","\u092E\u094C\u0930\u094D\u092F \u0938\u093E\u092E\u094D\u0930\u093E\u091C\u094D\u092F"]],["These well-planned cities were part of the Indus Valley Civilisation.","\u092F\u0947 \u0938\u0941\u0928\u093F\u092F\u094B\u091C\u093F\u0924 \u0928\u0917\u0930 \u0938\u093F\u0902\u0927\u0941 \u0918\u093E\u091F\u0940 \u0938\u092D\u094D\u092F\u0924\u093E \u0915\u0947 \u0925\u0947\u0964"]],["Which Maurya emperor gave up war and followed Buddhism after the Kalinga war?","\u0915\u0932\u093F\u0902\u0917 \u092F\u0941\u0926\u094D\u0927 \u0915\u0947 \u092C\u093E\u0926 \u0915\u093F\u0938 \u092E\u094C\u0930\u094D\u092F \u0938\u092E\u094D\u0930\u093E\u091F \u0928\u0947 \u092F\u0941\u0926\u094D\u0927 \u091B\u094B\u0921\u093C\u0915\u0930 \u092C\u094C\u0926\u094D\u0927 \u0927\u0930\u094D\u092E \u0905\u092A\u0928\u093E\u092F\u093E?",["Ashoka","\u0905\u0936\u094B\u0915"],[["Akbar","\u0905\u0915\u092C\u0930"],["Chandragupta II","\u091A\u0902\u0926\u094D\u0930\u0917\u0941\u092A\u094D\u0924 \u0926\u094D\u0935\u093F\u0924\u0940\u092F"],["Shivaji","\u0936\u093F\u0935\u093E\u091C\u0940"]],["Ashoka spread peace and Buddhism after the Kalinga war.","\u0915\u0932\u093F\u0902\u0917 \u092F\u0941\u0926\u094D\u0927 \u0915\u0947 \u092C\u093E\u0926 \u0905\u0936\u094B\u0915 \u0928\u0947 \u0936\u093E\u0902\u0924\u093F \u0914\u0930 \u092C\u094C\u0926\u094D\u0927 \u0927\u0930\u094D\u092E \u0915\u093E \u092A\u094D\u0930\u0938\u093E\u0930 \u0915\u093F\u092F\u093E\u0964"]],["The lion capital of Ashoka at Sarnath is now India's:","\u0938\u093E\u0930\u0928\u093E\u0925 \u0915\u093E \u0905\u0936\u094B\u0915 \u0915\u093E \u0938\u093F\u0902\u0939-\u0938\u094D\u0924\u0902\u092D \u0936\u0940\u0930\u094D\u0937 \u0906\u091C \u092D\u093E\u0930\u0924 \u0915\u093E \u0915\u094D\u092F\u093E \u0939\u0948?",["National emblem","\u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0940\u092F \u091A\u093F\u0939\u094D\u0928"],[["National flag","\u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0940\u092F \u0927\u094D\u0935\u091C"],["National anthem","\u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0917\u093E\u0928"],["National bird","\u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0940\u092F \u092A\u0915\u094D\u0937\u0940"]],["It is the national emblem of India.","\u092F\u0939 \u092D\u093E\u0930\u0924 \u0915\u093E \u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0940\u092F \u091A\u093F\u0939\u094D\u0928 \u0939\u0948\u0964"]],["Which ancient city was the capital of the Maurya empire?","\u092E\u094C\u0930\u094D\u092F \u0938\u093E\u092E\u094D\u0930\u093E\u091C\u094D\u092F \u0915\u0940 \u0930\u093E\u091C\u0927\u093E\u0928\u0940 \u0915\u094C\u0928-\u0938\u093E \u092A\u094D\u0930\u093E\u091A\u0940\u0928 \u0928\u0917\u0930 \u0925\u093E?",["Pataliputra","\u092A\u093E\u091F\u0932\u093F\u092A\u0941\u0924\u094D\u0930"],[["Delhi","\u0926\u093F\u0932\u094D\u0932\u0940"],["Agra","\u0906\u0917\u0930\u093E"],["Madurai","\u092E\u0926\u0941\u0930\u0948"]],["Pataliputra is near present-day Patna.","\u092A\u093E\u091F\u0932\u093F\u092A\u0941\u0924\u094D\u0930 \u0906\u091C \u0915\u0947 \u092A\u091F\u0928\u093E \u0915\u0947 \u092A\u093E\u0938 \u0925\u093E\u0964"]],['The Gupta age is often called the "Golden Age" of India. Which mathematician-astronomer lived then?','\u0917\u0941\u092A\u094D\u0924 \u0915\u093E\u0932 \u0915\u094B \u092D\u093E\u0930\u0924 \u0915\u093E "\u0938\u094D\u0935\u0930\u094D\u0923 \u092F\u0941\u0917" \u0915\u0939\u093E \u091C\u093E\u0924\u093E \u0939\u0948\u0964 \u0909\u0938 \u0938\u092E\u092F \u0915\u094C\u0928 \u0917\u0923\u093F\u0924\u091C\u094D\u091E-\u0916\u0917\u094B\u0932\u0936\u093E\u0938\u094D\u0924\u094D\u0930\u0940 \u0939\u0941\u090F?',["Aryabhata","\u0906\u0930\u094D\u092F\u092D\u091F"],[["Newton","\u0928\u094D\u092F\u0942\u091F\u0928"],["Birbal","\u092C\u0940\u0930\u092C\u0932"],["Tansen","\u0924\u093E\u0928\u0938\u0947\u0928"]],["Aryabhata wrote about the number system, the value of pi and the Earth spinning on its axis.","\u0906\u0930\u094D\u092F\u092D\u091F \u0928\u0947 \u0938\u0902\u0916\u094D\u092F\u093E \u092A\u0926\u094D\u0927\u0924\u093F, \u092A\u093E\u0908 \u0915\u0947 \u092E\u093E\u0928 \u0914\u0930 \u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u0947 \u0905\u092A\u0928\u0940 \u0927\u0941\u0930\u0940 \u092A\u0930 \u0918\u0942\u092E\u0928\u0947 \u0915\u0947 \u092C\u093E\u0930\u0947 \u092E\u0947\u0902 \u0932\u093F\u0916\u093E\u0964"]],["Who was the first Mughal emperor of India?","\u092D\u093E\u0930\u0924 \u0915\u093E \u092A\u0939\u0932\u093E \u092E\u0941\u0917\u093C\u0932 \u0938\u092E\u094D\u0930\u093E\u091F \u0915\u094C\u0928 \u0925\u093E?",["Babur","\u092C\u093E\u092C\u0930"],[["Akbar","\u0905\u0915\u092C\u0930"],["Aurangzeb","\u0914\u0930\u0902\u0917\u091C\u093C\u0947\u092C"],["Humayun","\u0939\u0941\u092E\u093E\u092F\u0942\u0901"]],["Babur won the First Battle of Panipat in 1526.","\u092C\u093E\u092C\u0930 \u0928\u0947 1526 \u092E\u0947\u0902 \u092A\u093E\u0928\u0940\u092A\u0924 \u0915\u0940 \u092A\u0939\u0932\u0940 \u0932\u0921\u093C\u093E\u0908 \u091C\u0940\u0924\u0940\u0964"]],["Which Mughal emperor built Fatehpur Sikri?","\u092B\u093C\u0924\u0947\u0939\u092A\u0941\u0930 \u0938\u0940\u0915\u0930\u0940 \u0915\u093F\u0938 \u092E\u0941\u0917\u093C\u0932 \u0938\u092E\u094D\u0930\u093E\u091F \u0928\u0947 \u092C\u0928\u0935\u093E\u0908?",["Akbar","\u0905\u0915\u092C\u0930"],[["Babur","\u092C\u093E\u092C\u0930"],["Shah Jahan","\u0936\u093E\u0939\u091C\u0939\u093E\u0901"],["Jahangir","\u091C\u0939\u093E\u0901\u0917\u0940\u0930"]],["Akbar built Fatehpur Sikri near Agra.","\u0905\u0915\u092C\u0930 \u0928\u0947 \u0906\u0917\u0930\u093E \u0915\u0947 \u092A\u093E\u0938 \u092B\u093C\u0924\u0947\u0939\u092A\u0941\u0930 \u0938\u0940\u0915\u0930\u0940 \u092C\u0928\u0935\u093E\u0908\u0964"]],["Which Maratha ruler founded the Maratha kingdom and was crowned at Raigad in 1674?","\u0915\u093F\u0938 \u092E\u0930\u093E\u0920\u093E \u0936\u093E\u0938\u0915 \u0928\u0947 \u092E\u0930\u093E\u0920\u093E \u0930\u093E\u091C\u094D\u092F \u0915\u0940 \u0928\u0940\u0902\u0935 \u0930\u0916\u0940 \u0914\u0930 1674 \u092E\u0947\u0902 \u0930\u093E\u092F\u0917\u0922\u093C \u092E\u0947\u0902 \u0930\u093E\u091C\u094D\u092F\u093E\u092D\u093F\u0937\u0947\u0915 \u0915\u0930\u093E\u092F\u093E?",["Chhatrapati Shivaji","\u091B\u0924\u094D\u0930\u092A\u0924\u093F \u0936\u093F\u0935\u093E\u091C\u0940"],[["Rana Pratap","\u0930\u093E\u0923\u093E \u092A\u094D\u0930\u0924\u093E\u092A"],["Tipu Sultan","\u091F\u0940\u092A\u0942 \u0938\u0941\u0932\u094D\u0924\u093E\u0928"],["Ranjit Singh","\u0930\u0923\u091C\u0940\u0924 \u0938\u093F\u0902\u0939"]],["Shivaji was crowned Chhatrapati at Raigad in 1674.","\u0936\u093F\u0935\u093E\u091C\u0940 \u0915\u094B 1674 \u092E\u0947\u0902 \u0930\u093E\u092F\u0917\u0922\u093C \u092E\u0947\u0902 \u091B\u0924\u094D\u0930\u092A\u0924\u093F \u0915\u093E \u092A\u0926 \u092E\u093F\u0932\u093E\u0964"]]]),_("t.civics",6,s("Our Constitution and government","\u0939\u092E\u093E\u0930\u093E \u0938\u0902\u0935\u093F\u0927\u093E\u0928 \u0914\u0930 \u0938\u0930\u0915\u093E\u0930"),[],s("India is a democracy: people vote, Parliament makes laws, the President is the head of state and the Prime Minister leads the government.","\u092D\u093E\u0930\u0924 \u0932\u094B\u0915\u0924\u0902\u0924\u094D\u0930 \u0939\u0948: \u0932\u094B\u0917 \u092E\u0924\u0926\u093E\u0928 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902, \u0938\u0902\u0938\u0926 \u0915\u093C\u093E\u0928\u0942\u0928 \u092C\u0928\u093E\u0924\u0940 \u0939\u0948, \u0930\u093E\u0937\u094D\u091F\u094D\u0930\u092A\u0924\u093F \u0930\u093E\u091C\u094D\u092F \u0915\u0947 \u092A\u094D\u0930\u092E\u0941\u0916 \u0939\u0948\u0902 \u0914\u0930 \u092A\u094D\u0930\u0927\u093E\u0928\u092E\u0902\u0924\u094D\u0930\u0940 \u0938\u0930\u0915\u093E\u0930 \u0915\u093E \u0928\u0947\u0924\u0943\u0924\u094D\u0935 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964"),[["On which date did the Constitution of India come into effect?","\u092D\u093E\u0930\u0924 \u0915\u093E \u0938\u0902\u0935\u093F\u0927\u093E\u0928 \u0915\u093F\u0938 \u0924\u093F\u0925\u093F \u0915\u094B \u0932\u093E\u0917\u0942 \u0939\u0941\u0906?",["26 January 1950","26 \u091C\u0928\u0935\u0930\u0940 1950"],[["15 August 1947","15 \u0905\u0917\u0938\u094D\u0924 1947"],["2 October 1950","2 \u0905\u0915\u094D\u091F\u0942\u092C\u0930 1950"],["26 November 1949","26 \u0928\u0935\u0902\u092C\u0930 1949"]],["We celebrate this day as Republic Day.","\u0907\u0938 \u0926\u093F\u0928 \u0915\u094B \u0939\u092E \u0917\u0923\u0924\u0902\u0924\u094D\u0930 \u0926\u093F\u0935\u0938 \u0915\u0947 \u0930\u0942\u092A \u092E\u0947\u0902 \u092E\u0928\u093E\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Who was the Chairman of the Drafting Committee of the Constitution?","\u0938\u0902\u0935\u093F\u0927\u093E\u0928 \u0915\u0940 \u092A\u094D\u0930\u093E\u0930\u0942\u092A \u0938\u092E\u093F\u0924\u093F \u0915\u0947 \u0905\u0927\u094D\u092F\u0915\u094D\u0937 \u0915\u094C\u0928 \u0925\u0947?",["Dr B. R. Ambedkar","\u0921\u0949. \u092C\u0940. \u0906\u0930. \u0905\u0902\u092C\u0947\u0921\u0915\u0930"],[["Mahatma Gandhi","\u092E\u0939\u093E\u0924\u094D\u092E\u093E \u0917\u093E\u0902\u0927\u0940"],["Jawaharlal Nehru","\u091C\u0935\u093E\u0939\u0930\u0932\u093E\u0932 \u0928\u0947\u0939\u0930\u0942"],["Sardar Patel","\u0938\u0930\u0926\u093E\u0930 \u092A\u091F\u0947\u0932"]],["Dr Ambedkar led the committee that drafted the Constitution.","\u0921\u0949. \u0905\u0902\u092C\u0947\u0921\u0915\u0930 \u0928\u0947 \u0938\u0902\u0935\u093F\u0927\u093E\u0928 \u0915\u093E \u092A\u094D\u0930\u093E\u0930\u0942\u092A \u092C\u0928\u093E\u0928\u0947 \u0935\u093E\u0932\u0940 \u0938\u092E\u093F\u0924\u093F \u0915\u093E \u0928\u0947\u0924\u0943\u0924\u094D\u0935 \u0915\u093F\u092F\u093E\u0964"]],["Who is the head of the Indian state?","\u092D\u093E\u0930\u0924\u0940\u092F \u0930\u093E\u091C\u094D\u092F \u0915\u0947 \u092A\u094D\u0930\u092E\u0941\u0916 \u0915\u094C\u0928 \u0939\u0948\u0902?",["The President","\u0930\u093E\u0937\u094D\u091F\u094D\u0930\u092A\u0924\u093F"],[["The Prime Minister","\u092A\u094D\u0930\u0927\u093E\u0928\u092E\u0902\u0924\u094D\u0930\u0940"],["The Chief Minister","\u092E\u0941\u0916\u094D\u092F\u092E\u0902\u0924\u094D\u0930\u0940"],["The Chief Justice","\u092E\u0941\u0916\u094D\u092F \u0928\u094D\u092F\u093E\u092F\u093E\u0927\u0940\u0936"]],["The President is the head of state; the Prime Minister heads the government.","\u0930\u093E\u0937\u094D\u091F\u094D\u0930\u092A\u0924\u093F \u0930\u093E\u091C\u094D\u092F \u0915\u0947 \u092A\u094D\u0930\u092E\u0941\u0916 \u0939\u0948\u0902; \u092A\u094D\u0930\u0927\u093E\u0928\u092E\u0902\u0924\u094D\u0930\u0940 \u0938\u0930\u0915\u093E\u0930 \u0915\u0947 \u092A\u094D\u0930\u092E\u0941\u0916 \u0939\u0948\u0902\u0964"]],["Which two Houses make up the Parliament of India?","\u092D\u093E\u0930\u0924 \u0915\u0940 \u0938\u0902\u0938\u0926 \u0915\u093F\u0928 \u0926\u094B \u0938\u0926\u0928\u094B\u0902 \u0938\u0947 \u092E\u093F\u0932\u0915\u0930 \u092C\u0928\u0940 \u0939\u0948?",["Lok Sabha and Rajya Sabha","\u0932\u094B\u0915\u0938\u092D\u093E \u0914\u0930 \u0930\u093E\u091C\u094D\u092F\u0938\u092D\u093E"],[["Vidhan Sabha and Lok Sabha","\u0935\u093F\u0927\u093E\u0928\u0938\u092D\u093E \u0914\u0930 \u0932\u094B\u0915\u0938\u092D\u093E"],["Gram Sabha and Lok Sabha","\u0917\u094D\u0930\u093E\u092E \u0938\u092D\u093E \u0914\u0930 \u0932\u094B\u0915\u0938\u092D\u093E"],["Rajya Sabha and Vidhan Parishad","\u0930\u093E\u091C\u094D\u092F\u0938\u092D\u093E \u0914\u0930 \u0935\u093F\u0927\u093E\u0928 \u092A\u0930\u093F\u0937\u0926"]],["Parliament has the Lok Sabha and the Rajya Sabha.","\u0938\u0902\u0938\u0926 \u092E\u0947\u0902 \u0932\u094B\u0915\u0938\u092D\u093E \u0914\u0930 \u0930\u093E\u091C\u094D\u092F\u0938\u092D\u093E \u0939\u094B\u0924\u0940 \u0939\u0948\u0902\u0964"]],["At what age can an Indian citizen vote in elections?","\u092D\u093E\u0930\u0924 \u0915\u093E \u0928\u093E\u0917\u0930\u093F\u0915 \u0915\u093F\u0938 \u0906\u092F\u0941 \u092E\u0947\u0902 \u092E\u0924\u0926\u093E\u0928 \u0915\u0930 \u0938\u0915\u0924\u093E \u0939\u0948?",["18 years","18 \u0935\u0930\u094D\u0937"],[["16 years","16 \u0935\u0930\u094D\u0937"],["21 years","21 \u0935\u0930\u094D\u0937"],["25 years","25 \u0935\u0930\u094D\u0937"]],["Every citizen aged 18 or more can vote.","18 \u0935\u0930\u094D\u0937 \u092F\u093E \u0905\u0927\u093F\u0915 \u0915\u093E \u0939\u0930 \u0928\u093E\u0917\u0930\u093F\u0915 \u092E\u0924\u0926\u093E\u0928 \u0915\u0930 \u0938\u0915\u0924\u093E \u0939\u0948\u0964"]],["Which body conducts elections in India?","\u092D\u093E\u0930\u0924 \u092E\u0947\u0902 \u091A\u0941\u0928\u093E\u0935 \u0915\u094C\u0928-\u0938\u0940 \u0938\u0902\u0938\u094D\u0925\u093E \u0915\u0930\u093E\u0924\u0940 \u0939\u0948?",["The Election Commission","\u091A\u0941\u0928\u093E\u0935 \u0906\u092F\u094B\u0917"],[["The Supreme Court","\u0938\u0930\u094D\u0935\u094B\u091A\u094D\u091A \u0928\u094D\u092F\u093E\u092F\u093E\u0932\u092F"],["The Reserve Bank","\u0930\u093F\u091C\u093C\u0930\u094D\u0935 \u092C\u0948\u0902\u0915"],["The Planning Board","\u092F\u094B\u091C\u0928\u093E \u092C\u094B\u0930\u094D\u0921"]],["The Election Commission of India runs free and fair elections.","\u092D\u093E\u0930\u0924 \u0915\u093E \u091A\u0941\u0928\u093E\u0935 \u0906\u092F\u094B\u0917 \u0938\u094D\u0935\u0924\u0902\u0924\u094D\u0930 \u0914\u0930 \u0928\u093F\u0937\u094D\u092A\u0915\u094D\u0937 \u091A\u0941\u0928\u093E\u0935 \u0915\u0930\u093E\u0924\u093E \u0939\u0948\u0964"]],["Who is the head of a Gram Panchayat?","\u0917\u094D\u0930\u093E\u092E \u092A\u0902\u091A\u093E\u092F\u0924 \u0915\u093E \u092A\u094D\u0930\u092E\u0941\u0916 \u0915\u094C\u0928 \u0939\u094B\u0924\u093E \u0939\u0948?",["The Sarpanch","\u0938\u0930\u092A\u0902\u091A"],[["The Collector","\u0915\u0932\u0947\u0915\u094D\u091F\u0930"],["The Governor","\u0930\u093E\u091C\u094D\u092F\u092A\u093E\u0932"],["The Speaker","\u0905\u0927\u094D\u092F\u0915\u094D\u0937"]],["The Sarpanch is elected by the villagers.","\u0938\u0930\u092A\u0902\u091A \u0915\u094B \u0917\u093E\u0901\u0935 \u0915\u0947 \u0932\u094B\u0917 \u091A\u0941\u0928\u0924\u0947 \u0939\u0948\u0902\u0964"]],["How many spokes does the Ashoka Chakra on the national flag have?","\u0930\u093E\u0937\u094D\u091F\u094D\u0930\u0940\u092F \u0927\u094D\u0935\u091C \u0915\u0947 \u0905\u0936\u094B\u0915 \u091A\u0915\u094D\u0930 \u092E\u0947\u0902 \u0915\u093F\u0924\u0928\u0940 \u0924\u0940\u0932\u093F\u092F\u093E\u0901 \u0939\u094B\u0924\u0940 \u0939\u0948\u0902?",["24","24"],[["12","12"],["16","16"],["32","32"]],["The Ashoka Chakra in the middle of the tricolour has 24 spokes.","\u0924\u093F\u0930\u0902\u0917\u0947 \u0915\u0947 \u092C\u0940\u091A \u0915\u0947 \u0905\u0936\u094B\u0915 \u091A\u0915\u094D\u0930 \u092E\u0947\u0902 24 \u0924\u0940\u0932\u093F\u092F\u093E\u0901 \u0939\u094B\u0924\u0940 \u0939\u0948\u0902\u0964"]]]),_("t.freedom",7,s("The freedom struggle","\u0938\u094D\u0935\u0924\u0902\u0924\u094D\u0930\u0924\u093E \u0938\u0902\u0917\u094D\u0930\u093E\u092E"),["t.history1","t.civics"],s("Remember each event with its year and the leader who made it famous.","\u0939\u0930 \u0918\u091F\u0928\u093E \u0915\u094B \u0909\u0938\u0915\u0947 \u0935\u0930\u094D\u0937 \u0914\u0930 \u0909\u0938\u0947 \u092A\u094D\u0930\u0938\u093F\u0926\u094D\u0927 \u092C\u0928\u093E\u0928\u0947 \u0935\u093E\u0932\u0947 \u0928\u0947\u0924\u093E \u0915\u0947 \u0938\u093E\u0925 \u092F\u093E\u0926 \u0915\u0930\u094B\u0964"),[["In which year did India become independent?","\u092D\u093E\u0930\u0924 \u0915\u093F\u0938 \u0935\u0930\u094D\u0937 \u0938\u094D\u0935\u0924\u0902\u0924\u094D\u0930 \u0939\u0941\u0906?",["1947","1947"],[["1942","1942"],["1950","1950"],["1930","1930"]],["India became independent on 15 August 1947.","\u092D\u093E\u0930\u0924 15 \u0905\u0917\u0938\u094D\u0924 1947 \u0915\u094B \u0938\u094D\u0935\u0924\u0902\u0924\u094D\u0930 \u0939\u0941\u0906\u0964"]],["Who was the first Prime Minister of independent India?","\u0938\u094D\u0935\u0924\u0902\u0924\u094D\u0930 \u092D\u093E\u0930\u0924 \u0915\u0947 \u092A\u0939\u0932\u0947 \u092A\u094D\u0930\u0927\u093E\u0928\u092E\u0902\u0924\u094D\u0930\u0940 \u0915\u094C\u0928 \u0925\u0947?",["Jawaharlal Nehru","\u091C\u0935\u093E\u0939\u0930\u0932\u093E\u0932 \u0928\u0947\u0939\u0930\u0942"],[["Sardar Patel","\u0938\u0930\u0926\u093E\u0930 \u092A\u091F\u0947\u0932"],["Subhas Chandra Bose","\u0938\u0941\u092D\u093E\u0937 \u091A\u0902\u0926\u094D\u0930 \u092C\u094B\u0938"],["Lal Bahadur Shastri","\u0932\u093E\u0932 \u092C\u0939\u093E\u0926\u0941\u0930 \u0936\u093E\u0938\u094D\u0924\u094D\u0930\u0940"]],["Jawaharlal Nehru took office on 15 August 1947.","\u091C\u0935\u093E\u0939\u0930\u0932\u093E\u0932 \u0928\u0947\u0939\u0930\u0942 \u0928\u0947 15 \u0905\u0917\u0938\u094D\u0924 1947 \u0915\u094B \u092A\u0926 \u0938\u0901\u092D\u093E\u0932\u093E\u0964"]],["Who was the first President of India?","\u092D\u093E\u0930\u0924 \u0915\u0947 \u092A\u0939\u0932\u0947 \u0930\u093E\u0937\u094D\u091F\u094D\u0930\u092A\u0924\u093F \u0915\u094C\u0928 \u0925\u0947?",["Dr Rajendra Prasad","\u0921\u0949. \u0930\u093E\u091C\u0947\u0902\u0926\u094D\u0930 \u092A\u094D\u0930\u0938\u093E\u0926"],[["Dr S. Radhakrishnan","\u0921\u0949. \u090F\u0938. \u0930\u093E\u0927\u093E\u0915\u0943\u0937\u094D\u0923\u0928"],["Dr Zakir Husain","\u0921\u0949. \u091C\u093C\u093E\u0915\u093F\u0930 \u0939\u0941\u0938\u0948\u0928"],["Sardar Patel","\u0938\u0930\u0926\u093E\u0930 \u092A\u091F\u0947\u0932"]],["Dr Rajendra Prasad was the first President.","\u0921\u0949. \u0930\u093E\u091C\u0947\u0902\u0926\u094D\u0930 \u092A\u094D\u0930\u0938\u093E\u0926 \u092A\u0939\u0932\u0947 \u0930\u093E\u0937\u094D\u091F\u094D\u0930\u092A\u0924\u093F \u0925\u0947\u0964"]],["The Dandi March of 1930, led by Gandhiji, was against the tax on which item?","\u0917\u093E\u0902\u0927\u0940\u091C\u0940 \u0915\u0947 \u0928\u0947\u0924\u0943\u0924\u094D\u0935 \u092E\u0947\u0902 1930 \u0915\u0940 \u0926\u093E\u0902\u0921\u0940 \u092F\u093E\u0924\u094D\u0930\u093E \u0915\u093F\u0938 \u0935\u0938\u094D\u0924\u0941 \u092A\u0930 \u0915\u0930 \u0915\u0947 \u0935\u093F\u0930\u0941\u0926\u094D\u0927 \u0925\u0940?",["Salt","\u0928\u092E\u0915"],[["Sugar","\u091A\u0940\u0928\u0940"],["Cloth","\u0915\u092A\u0921\u093C\u093E"],["Tea","\u091A\u093E\u092F"]],["Gandhiji walked to Dandi, Gujarat, and made salt from sea water.","\u0917\u093E\u0902\u0927\u0940\u091C\u0940 \u0926\u093E\u0902\u0921\u0940 (\u0917\u0941\u091C\u0930\u093E\u0924) \u0924\u0915 \u092A\u0948\u0926\u0932 \u0917\u090F \u0914\u0930 \u0938\u092E\u0941\u0926\u094D\u0930 \u0915\u0947 \u092A\u093E\u0928\u0940 \u0938\u0947 \u0928\u092E\u0915 \u092C\u0928\u093E\u092F\u093E\u0964"]],['Which movement of 1942 had the slogan "Do or Die"?','1942 \u0915\u0947 \u0915\u093F\u0938 \u0906\u0902\u0926\u094B\u0932\u0928 \u0915\u093E \u0928\u093E\u0930\u093E "\u0915\u0930\u094B \u092F\u093E \u092E\u0930\u094B" \u0925\u093E?',["Quit India Movement","\u092D\u093E\u0930\u0924 \u091B\u094B\u0921\u093C\u094B \u0906\u0902\u0926\u094B\u0932\u0928"],[["Non-Cooperation Movement","\u0905\u0938\u0939\u092F\u094B\u0917 \u0906\u0902\u0926\u094B\u0932\u0928"],["Swadeshi Movement","\u0938\u094D\u0935\u0926\u0947\u0936\u0940 \u0906\u0902\u0926\u094B\u0932\u0928"],["Civil Disobedience Movement","\u0938\u0935\u093F\u0928\u092F \u0905\u0935\u091C\u094D\u091E\u093E \u0906\u0902\u0926\u094B\u0932\u0928"]],['Gandhiji gave the call "Do or Die" in the Quit India Movement.','\u0917\u093E\u0902\u0927\u0940\u091C\u0940 \u0928\u0947 \u092D\u093E\u0930\u0924 \u091B\u094B\u0921\u093C\u094B \u0906\u0902\u0926\u094B\u0932\u0928 \u092E\u0947\u0902 "\u0915\u0930\u094B \u092F\u093E \u092E\u0930\u094B" \u0915\u093E \u0906\u0939\u094D\u0935\u093E\u0928 \u0915\u093F\u092F\u093E\u0964']],['Who was known as the "Iron Man of India" for uniting the princely states?','\u0930\u093F\u092F\u093E\u0938\u0924\u094B\u0902 \u0915\u094B \u092E\u093F\u0932\u093E\u0928\u0947 \u0915\u0947 \u0915\u093E\u0930\u0923 "\u092D\u093E\u0930\u0924 \u0915\u093E \u0932\u094C\u0939 \u092A\u0941\u0930\u0941\u0937" \u0915\u093F\u0938\u0947 \u0915\u0939\u093E \u091C\u093E\u0924\u093E \u0939\u0948?',["Sardar Vallabhbhai Patel","\u0938\u0930\u0926\u093E\u0930 \u0935\u0932\u094D\u0932\u092D\u092D\u093E\u0908 \u092A\u091F\u0947\u0932"],[["Bhagat Singh","\u092D\u0917\u0924 \u0938\u093F\u0902\u0939"],["Lala Lajpat Rai","\u0932\u093E\u0932\u093E \u0932\u093E\u091C\u092A\u0924 \u0930\u093E\u092F"],["Bal Gangadhar Tilak","\u092C\u093E\u0932 \u0917\u0902\u0917\u093E\u0927\u0930 \u0924\u093F\u0932\u0915"]],["Sardar Patel united more than 500 princely states with India.","\u0938\u0930\u0926\u093E\u0930 \u092A\u091F\u0947\u0932 \u0928\u0947 500 \u0938\u0947 \u0905\u0927\u093F\u0915 \u0930\u093F\u092F\u093E\u0938\u0924\u094B\u0902 \u0915\u094B \u092D\u093E\u0930\u0924 \u092E\u0947\u0902 \u092E\u093F\u0932\u093E\u092F\u093E\u0964"]],['Who raised the Indian National Army and gave the slogan "Jai Hind"?','\u0906\u091C\u093C\u093E\u0926 \u0939\u093F\u0902\u0926 \u092B\u093C\u094C\u091C \u0915\u093F\u0938\u0928\u0947 \u092C\u0928\u093E\u0908 \u0914\u0930 "\u091C\u092F \u0939\u093F\u0902\u0926" \u0915\u093E \u0928\u093E\u0930\u093E \u0926\u093F\u092F\u093E?',["Netaji Subhas Chandra Bose","\u0928\u0947\u0924\u093E\u091C\u0940 \u0938\u0941\u092D\u093E\u0937 \u091A\u0902\u0926\u094D\u0930 \u092C\u094B\u0938"],[["Chandrashekhar Azad","\u091A\u0902\u0926\u094D\u0930\u0936\u0947\u0916\u0930 \u0906\u091C\u093C\u093E\u0926"],["Gopal Krishna Gokhale","\u0917\u094B\u092A\u093E\u0932 \u0915\u0943\u0937\u094D\u0923 \u0917\u094B\u0916\u0932\u0947"],["Dadabhai Naoroji","\u0926\u093E\u0926\u093E\u092D\u093E\u0908 \u0928\u094C\u0930\u094B\u091C\u0940"]],["Netaji Subhas Chandra Bose led the Azad Hind Fauj (INA).","\u0928\u0947\u0924\u093E\u091C\u0940 \u0938\u0941\u092D\u093E\u0937 \u091A\u0902\u0926\u094D\u0930 \u092C\u094B\u0938 \u0928\u0947 \u0906\u091C\u093C\u093E\u0926 \u0939\u093F\u0902\u0926 \u092B\u093C\u094C\u091C \u0915\u093E \u0928\u0947\u0924\u0943\u0924\u094D\u0935 \u0915\u093F\u092F\u093E\u0964"]],["Rani Lakshmibai fought the British in 1857 from which city?","\u0930\u093E\u0928\u0940 \u0932\u0915\u094D\u0937\u094D\u092E\u0940\u092C\u093E\u0908 \u0928\u0947 1857 \u092E\u0947\u0902 \u0915\u093F\u0938 \u0928\u0917\u0930 \u0938\u0947 \u0905\u0902\u0917\u094D\u0930\u0947\u091C\u093C\u094B\u0902 \u0938\u0947 \u0932\u0921\u093C\u093E\u0908 \u0932\u0921\u093C\u0940?",["Jhansi","\u091D\u093E\u0901\u0938\u0940"],[["Meerut","\u092E\u0947\u0930\u0920"],["Lucknow","\u0932\u0916\u0928\u090A"],["Kanpur","\u0915\u093E\u0928\u092A\u0941\u0930"]],["Rani Lakshmibai of Jhansi was a brave leader of the 1857 revolt.","\u091D\u093E\u0901\u0938\u0940 \u0915\u0940 \u0930\u093E\u0928\u0940 \u0932\u0915\u094D\u0937\u094D\u092E\u0940\u092C\u093E\u0908 1857 \u0915\u0947 \u0935\u093F\u0926\u094D\u0930\u094B\u0939 \u0915\u0940 \u0935\u0940\u0930 \u0928\u093E\u092F\u093F\u0915\u093E \u0925\u0940\u0902\u0964"]]]),_("t.rights",7,s("Rights and duties of citizens","\u0928\u093E\u0917\u0930\u093F\u0915\u094B\u0902 \u0915\u0947 \u0905\u0927\u093F\u0915\u093E\u0930 \u0914\u0930 \u0915\u0930\u094D\u0924\u0935\u094D\u092F"),["t.civics"],s("The Constitution gives every citizen six Fundamental Rights, and asks every citizen to follow Fundamental Duties.","\u0938\u0902\u0935\u093F\u0927\u093E\u0928 \u0939\u0930 \u0928\u093E\u0917\u0930\u093F\u0915 \u0915\u094B \u091B\u0939 \u092E\u094C\u0932\u093F\u0915 \u0905\u0927\u093F\u0915\u093E\u0930 \u0926\u0947\u0924\u093E \u0939\u0948 \u0914\u0930 \u092E\u094C\u0932\u093F\u0915 \u0915\u0930\u094D\u0924\u0935\u094D\u092F\u094B\u0902 \u0915\u0947 \u092A\u093E\u0932\u0928 \u0915\u0940 \u0905\u092A\u0947\u0915\u094D\u0937\u093E \u0915\u0930\u0924\u093E \u0939\u0948\u0964"),[["How many Fundamental Rights does the Indian Constitution give?","\u092D\u093E\u0930\u0924\u0940\u092F \u0938\u0902\u0935\u093F\u0927\u093E\u0928 \u0915\u093F\u0924\u0928\u0947 \u092E\u094C\u0932\u093F\u0915 \u0905\u0927\u093F\u0915\u093E\u0930 \u0926\u0947\u0924\u093E \u0939\u0948?",["6","6"],[["4","4"],["8","8"],["10","10"]],["There are six Fundamental Rights.","\u091B\u0939 \u092E\u094C\u0932\u093F\u0915 \u0905\u0927\u093F\u0915\u093E\u0930 \u0939\u0948\u0902\u0964"]],["Which right says all people are equal before the law?","\u0915\u094C\u0928-\u0938\u093E \u0905\u0927\u093F\u0915\u093E\u0930 \u0915\u0939\u0924\u093E \u0939\u0948 \u0915\u093F \u0915\u093C\u093E\u0928\u0942\u0928 \u0915\u0940 \u0928\u091C\u093C\u0930 \u092E\u0947\u0902 \u0938\u092C \u0938\u092E\u093E\u0928 \u0939\u0948\u0902?",["Right to Equality","\u0938\u092E\u093E\u0928\u0924\u093E \u0915\u093E \u0905\u0927\u093F\u0915\u093E\u0930"],[["Right to Freedom","\u0938\u094D\u0935\u0924\u0902\u0924\u094D\u0930\u0924\u093E \u0915\u093E \u0905\u0927\u093F\u0915\u093E\u0930"],["Right to Religion","\u0927\u0930\u094D\u092E \u0915\u093E \u0905\u0927\u093F\u0915\u093E\u0930"],["Right to Property","\u0938\u0902\u092A\u0924\u094D\u0924\u093F \u0915\u093E \u0905\u0927\u093F\u0915\u093E\u0930"]],["The Right to Equality means no one is treated unfairly because of caste, religion, sex or birthplace.","\u0938\u092E\u093E\u0928\u0924\u093E \u0915\u0947 \u0905\u0927\u093F\u0915\u093E\u0930 \u0915\u093E \u0905\u0930\u094D\u0925 \u0939\u0948 \u0915\u093F \u091C\u093E\u0924\u093F, \u0927\u0930\u094D\u092E, \u0932\u093F\u0902\u0917 \u092F\u093E \u091C\u0928\u094D\u092E\u0938\u094D\u0925\u093E\u0928 \u0915\u0947 \u0915\u093E\u0930\u0923 \u0915\u093F\u0938\u0940 \u0938\u0947 \u092D\u0947\u0926\u092D\u093E\u0935 \u0928\u0939\u0940\u0902 \u0939\u094B\u0917\u093E\u0964"]],["Under Article 21A, free and compulsory education is a right for children aged:","\u0905\u0928\u0941\u091A\u094D\u091B\u0947\u0926 21A \u0915\u0947 \u0905\u0902\u0924\u0930\u094D\u0917\u0924 \u0928\u093F\u0903\u0936\u0941\u0932\u094D\u0915 \u0914\u0930 \u0905\u0928\u093F\u0935\u093E\u0930\u094D\u092F \u0936\u093F\u0915\u094D\u0937\u093E \u0915\u093F\u0928 \u0906\u092F\u0941 \u0915\u0947 \u092C\u091A\u094D\u091A\u094B\u0902 \u0915\u093E \u0905\u0927\u093F\u0915\u093E\u0930 \u0939\u0948?",["6 to 14 years","6 \u0938\u0947 14 \u0935\u0930\u094D\u0937"],[["3 to 8 years","3 \u0938\u0947 8 \u0935\u0930\u094D\u0937"],["10 to 18 years","10 \u0938\u0947 18 \u0935\u0930\u094D\u0937"],["14 to 21 years","14 \u0938\u0947 21 \u0935\u0930\u094D\u0937"]],["The Right to Education covers children from 6 to 14 years.","\u0936\u093F\u0915\u094D\u0937\u093E \u0915\u093E \u0905\u0927\u093F\u0915\u093E\u0930 6 \u0938\u0947 14 \u0935\u0930\u094D\u0937 \u0915\u0947 \u092C\u091A\u094D\u091A\u094B\u0902 \u0915\u0947 \u0932\u093F\u090F \u0939\u0948\u0964"]],["Making a child work in a factory goes against which right?","\u092C\u091A\u094D\u091A\u0947 \u0938\u0947 \u0915\u093E\u0930\u0916\u093C\u093E\u0928\u0947 \u092E\u0947\u0902 \u0915\u093E\u092E \u0915\u0930\u093E\u0928\u093E \u0915\u093F\u0938 \u0905\u0927\u093F\u0915\u093E\u0930 \u0915\u0947 \u0935\u093F\u0930\u0941\u0926\u094D\u0927 \u0939\u0948?",["Right against Exploitation","\u0936\u094B\u0937\u0923 \u0915\u0947 \u0935\u093F\u0930\u0941\u0926\u094D\u0927 \u0905\u0927\u093F\u0915\u093E\u0930"],[["Right to Equality","\u0938\u092E\u093E\u0928\u0924\u093E \u0915\u093E \u0905\u0927\u093F\u0915\u093E\u0930"],["Right to Freedom of Religion","\u0927\u0930\u094D\u092E \u0915\u0940 \u0938\u094D\u0935\u0924\u0902\u0924\u094D\u0930\u0924\u093E \u0915\u093E \u0905\u0927\u093F\u0915\u093E\u0930"],["Cultural Rights","\u0938\u093E\u0902\u0938\u094D\u0915\u0943\u0924\u093F\u0915 \u0905\u0927\u093F\u0915\u093E\u0930"]],["Child labour is banned by the Right against Exploitation.","\u0936\u094B\u0937\u0923 \u0915\u0947 \u0935\u093F\u0930\u0941\u0926\u094D\u0927 \u0905\u0927\u093F\u0915\u093E\u0930 \u092C\u093E\u0932 \u092E\u091C\u093C\u0926\u0942\u0930\u0940 \u092A\u0930 \u0930\u094B\u0915 \u0932\u0917\u093E\u0924\u093E \u0939\ 093E\u0930\u094B\u0902 \u0915\u093E \u0905\u0927\u093F\u0915\u093E\u0930"],[["Right to Equality","\u0938\u092E\u093E\u0928\u0924\u093E \u0915\u093E \u0905\u0927\u093F\u0915\u093E\u0930"],["Right to Vote","\u092E\u0924\u0926\u093E\u0928 \u0915\u093E \u0905\u0927\u093F\u0915\u093E\u0930"],["Right to Property","\u0938\u0902\u092A\u0924\u094D\u0924\u093F \u0915\u093E \u0905\u0927\u093F\u0915\u093E\u0930"]],['Dr Ambedkar called this right the "heart and soul" of the Constitution.','\u0921\u0949. \u0905\u0902\u092C\u0947\u0921\u0915\u0930 \u0928\u0947 \u0907\u0938 \u0905\u0927\u093F\u0915\u093E\u0930 \u0915\u094B \u0938\u0902\u0935\u093F\u0927\u093E\u0928 \u0915\u0940 "\u0906\u0924\u094D\u092E\u093E \u0914\u0930 \u0939\u0943\u0926\u092F" \u0915\u0939\u093E\u0964']]]),_("t.money",7,s("Money, banks and the economy","\u0927\u0928, \u092C\u0948\u0902\u0915 \u0914\u0930 \u0905\u0930\u094D\u0925\u0935\u094D\u092F\u0935\u0938\u094D\u0925\u093E"),[],s("Money lets us trade easily. Banks keep savings safe and pay interest. A country's economy is how it earns, spends and shares money.","\u0927\u0928 \u0938\u0947 \u0932\u0947\u0928-\u0926\u0947\u0928 \u0906\u0938\u093E\u0928 \u0939\u094B\u0924\u093E \u0939\u0948\u0964 \u092C\u0948\u0902\u0915 \u092C\u091A\u0924 \u0938\u0941\u0930\u0915\u094D\u0937\u093F\u0924 \u0930\u0916\u0924\u0947 \u0939\u0948\u0902 \u0914\u0930 \u092C\u094D\u092F\u093E\u091C \u0926\u0947\u0924\u0947 \u0939\u0948\u0902\u0964 \u0905\u0930\u094D\u0925\u0935\u094D\u092F\u0935\u0938\u094D\u0925\u093E \u092F\u0939 \u0939\u0948 \u0915\u093F \u0926\u0947\u0936 \u0915\u0948\u0938\u0947 \u0915\u092E\u093E\u0924\u093E, \u0916\u0930\u094D\u091A \u0915\u0930\u0924\u093E \u0914\u0930 \u092C\u093E\u0901\u091F\u0924\u093E \u0939\u0948\u0964"),[["How many paise make one rupee?","\u090F\u0915 \u0930\u0941\u092A\u092F\u0947 \u092E\u0947\u0902 \u0915\u093F\u0924\u0928\u0947 \u092A\u0948\u0938\u0947 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902?",["100","100"],[["10","10"],["50","50"], 8\u093F\u0932 \u0905\u0917\u0932\u0947 \u0938\u094D\u0924\u0902\u092D \u092E\u0947\u0902 \u0932\u0947 \u091C\u093E\u0907\u090F\u0964"),borrow:s("Always take the bottom digit from the top digit. If the top digit is smaller, borrow from the next column.","\u0939\u092E\u0947\u0936\u093E \u090A\u092A\u0930 \u0915\u0947 \u0905\u0902\u0915 \u092E\u0947\u0902 \u0938\u0947 \u0928\u0940\u091A\u0947 \u0915\u093E \u0905\u0902\u0915 \u0918\u091F\u093E\u0907\u090F\u0964 \u090A\u092A\u0930 \u0915\u093E \u0905\u0902\u0915 \u091B\u094B\u091F\u093E \u0939\u094B \u0924\u094B \u0905\u0917\u0932\u0947 \u0938\u094D\u0924\u0902\u092D \u0938\u0947 \u0909\u0927\u093E\u0930 \u0932\u0940\u091C\u093F\u090F\u0964"),mul_place:s("The tens digit stands for tens: multiply by it and write the result one place to the left.","\u0926\u0939\u093E\u0908 \u0915\u093E \u0905\u0902\u0915 \u0926\u0939\u093E\u0907\u092F\u093E\u0901 \u092C\u0924\u093E\u0924\u093E \u0939\u0948: \u0909\u0938\u0938\u0947 \u0917\u0941\u0923\u093E \u0915\u0930\u0915\u0947 \u092A\u0930\u093F\u0923\u093E\u092E \u090F\u0915 \u0938\u094D\u0925\u093E\u0928 \u092C\u093E\u0908\u0902 \u0913\u0930 \u0932\u093F\u0916\u093F\u090F\u0964"),round_half:s("Look at the digit to the right: 5 or more rounds up, less than 5 rounds down.","\u0926\u093E\u0908\u0902 \u0913\u0930 \u0915\u093E \u0905\u0902\u0915 \u0926\u0947\u0916\u093F\u090F: 5 \u092F\u093E \u0905\u0927\u093F\u0915 \u0939\u094B \u0924\u094B \u090A\u092A\u0930, 5 \u0938\u0947 \u0915\u092E \u0939\u094B \u0924\u094B \u0928\u0940\u091A\u0947 \u092A\u0942\u0930\u094D\u0923\u093E\u0902\u0915\u093F\u0924 \u0915\u0940\u091C\u093F\u090F\u0964"),factor_multiple:s("A factor divides the number exactly. A multiple is what you get by multiplying the number.","\u0917\u0941\u0923\u0928\u0916\u0902\u0921 \u0938\u0902\u0916\u094D\u092F\u093E \u0915\u094B \u092A\u0942\u0930\u093E-\u092A\u0942\u0930\u093E \u0935\u093F\u092D\u093E\u091C\u093F\u0924 \u0915\u0930\u0924\u093E \u0939\u0948\u0964 \u0917\u0941\u0923\u091C \u0938\u0902\u0916\u094D\u092F\u093E \u0915\u094B \u0917\u0941\u0923\u093E \u0915\u0930\u0928\u0947 \u0938\u0947 \u092E\u093F\u0932\u0924\u093E \u0939\u0948\u0964"),odd_prime:s("Not every odd number is prime. Check whether 3, 5 or 7 divides it.","\u0939\u0930 \u0935\u093F\u0937\u092E \u0938\u0902\u0916\u094D\u092F\u093E \u0905\u092D\u093E\u091C\u094D\u092F \u0928\u0939\u0940\u0902 \u0939\u094B\u0924\u0940\u0964 \u091C\u093E\u0901\u091A\u093F\u090F \u0915\u093F \u0935\u0939 3, 5 \u092F\u093E 7 \u0938\u0947 \u0935\u093F\u092D\u093E\u091C\u093F\u0924 \u0939\u094B\u0924\u0940 \u0939\u0948 \u092F\u093E \u0928\u0939\u0940\u0902\u0964"),hcf_lcm:s("HCF is the biggest number that divides both. LCM is the smallest number both divide into.","HCF \u0935\u0939 \u0938\u092C\u0938\u0947 \u092C\u0921\u093C\u0940 \u0938\u0902\u0916\u094D\u092F\u093E \u0939\u0948 \u091C\u094B \u0926\u094B\u0928\u094B\u0902 \u0915\u094B \u0935\u093F\u092D\u093E\u091C\u093F\u0924 \u0915\u0930\u0947\u0964 LCM \u0935\u0939 \u0938\u092C\u0938\u0947 \u091B\u094B\u091F\u0940 \u0938\u0902\u0916\u094D\u092F\u093E \u0939\u0948 \u091C\u094B \u0926\u094B\u0928\u094B\u0902 \u0938\u0947 \u0935\u093F\u092D\u093E\u091C\u093F\u0924 \u0939\u094B\u0964"),hcf_not_highest:s("That is a common factor, but not the highest one.","\u092F\u0939 \u090F\u0915 \u0909\u092D\u092F\u0928\u093F\u0937\u094D\u0920 \u0917\u0941\u0923\u0928\u0916\u0902\u0921 \u0939\u0948, \u092A\u0930 \u0938\u092C\u0938\u0947 \u092C\u0921\u093C\u093E \u0928\u0939\u0940\u0902\u0964"),lcm_product:s("The product is a common multiple, but not always the smallest one.","\u0917\u0941\u0923\u0928\u092B\u0932 \u090F\u0915 \u0909\u092D\u092F\u0928\u093F\u0937\u094D\u0920 \u0917\u0941\u0923\u091C \u0939\u0948, \u092A\u0930 \u0939\u092E\u0947\u0936\u093E \u0938\u092C\u0938\u0947 \u091B\u094B\u091F\u093E \u0928\u0939\u0940\u0902\u0964"),frac_eq_add:s("To make an equal fraction, multiply top and bottom by the same number. Do not add.","\u0938\u092E\u0924\u0941\u0932\u094D\u092F \u092D\u093F\u0928\u094D\u0928 \u092C\u0928\u093E\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0905\u0902\u0936 \u0914\u0930 \u0939\u0930 \u0915\u094B \u090F\u0915 \u0939\u0940 \u0938\u0902\u0916\u094D\u092F\u093E \u0938\u0947 \u0917\u0941\u0923\u093E \u0915\u0940\u091C\u093F\u090F\u0964 \u091C\u094B\u0921\u093C\u093F\u090F \u0928\u0939\u0940\u0902\u0964"),frac_cmp:s("A bigger denominator means smaller parts. Compare with a common denominator or by cross-multiplying.","\u092C\u0921\u093C\u093E \u0939\u0930 \u092F\u093E\u0928\u0940 \u091B\u094B\u091F\u0947 \u092D\u093E\u0917\u0964 \u0938\u092E\u093E\u0928 \u0939\u0930 \u092C\u0928\u093E\u0915\u0930 \u092F\u093E \u0924\u093F\u0930\u094D\u092F\u0915 \u0917\u0941\u0923\u093E \u0915\u0930\u0915\u0947 \u0924\u0941\u0932\u0928\u093E \u0915\u0940\u091C\u093F\u090F\u0964"),frac_add_den:s("Never add the denominators. Make the denominators the same, then add only the numerators.","\u0939\u0930\u094B\u0902 \u0915\u094B \u0915\u092D\u0940 \u092E\u0924 \u091C\u094B\u0921\u093C\u093F\u090F\u0964 \u0939\u0930 \u0938\u092E\u093E\u0928 \u0915\u0940\u091C\u093F\u090F, \u092B\u093F\u0930 \u0915\u0947\u0935\u0932 \u0905\u0902\u0936 \u091C\u094B\u0921\u093C\u093F\u090F\u0964"),dec_longer:s("More digits does not mean a bigger decimal. Compare tenths first, then hundredths.","\u0905\u0927\u093F\u0915 \u0905\u0902\u0915 \u0939\u094B\u0928\u0947 \u0938\u0947 \u0926\u0936\u092E\u0932\u0935 \u092C\u0921\u093C\u093E \u0928\u0939\u0940\u0902 \u0939\u094B\u0924\u093E\u0964 \u092A\u0939\u0932\u0947 \u0926\u0936\u093E\u0902\u0936, \u092B\u093F\u0930 \u0936\u0924\u093E\u0902\u0936 \u0915\u0940 \u0924\u0941\u0932\u0928\u093E \u0915\u0940\u091C\u093F\u090F\u0964"),dec_pv:s("After the decimal point the places are tenths, then hundredths.","\u0926\u0936\u092E\u0932\u0935 \u092C\u093F\u0902\u0926\u0941 \u0915\u0947 \u092C\u093E\u0926 \u092A\u0939\u0932\u093E \u0938\u094D\u0925\u093E\u0928 \u0926\u0936\u093E\u0902\u0936 \u0914\u0930 \u0926\u0942\u0938\u0930\u093E \u0936\u0924\u093E\u0902\u0936 \u0939\u094B\u0924\u093E \u0939\u0948\u0964"),dec_align:s("Line up the decimal points before adding or subtracting.","\u091C\u094B\u0921\u093C\u0928\u0947 \u092F\u093E \u0918\u091F\u093E\u0928\u0947 \u0938\u0947 \u092A\u0939\u0932\u0947 \u0926\u0936\u092E\u0932\u0935 \u092C\u093F\u0902\u0926\u0941\u0913\u0902 \u0915\u094B \u090F\u0915 \u0938\u0940\u0927 \u092E\u0947\u0902 \u0930\u0916\u093F\u090F\u0964"),dec_shift:s("Multiplying by 10 moves the digits one place left; dividing by 10 moves them one place right.","10 \u0938\u0947 \u0917\u0941\u0923\u093E \u0915\u0930\u0928\u0947 \u092A\u0930 \u0905\u0902\u0915 \u090F\u0915 \u0938\u094D\u0925\u093E\u0928 \u092C\u093E\u0908\u0902 \u0913\u0930, \u0914\u0930 \u092D\u093E\u0917 \u0926\u0947\u0928\u0947 \u092A\u0930 \u090F\u0915 \u0938\u094D\u0925\u093E\u0928 \u0926\u093E\u0908\u0902 \u0913\u0930 \u0916\u093F\u0938\u0915\u0924\u0947 \u0939\u0948\u0902\u0964"),pct_100:s("Percent means out of 100: divide by 100, not by 10.","\u092A\u094D\u0930\u0924\u093F\u0936\u0924 \u0915\u093E \u0905\u0930\u094D\u0925 \u0939\u0948 100 \u092E\u0947\u0902 \u0938\u0947: 100 \u0938\u0947 \u092D\u093E\u0917 \u0926\u0940\u091C\u093F\u090F, 10 \u0938\u0947 \u0928\u0939\u0940\u0902\u0964"),area_perim:s("Perimeter is the distance around (add the sides). Area is the space inside (length \xD7 breadth).","\u092A\u0930\u093F\u092E\u093E\u092A \u091A\u093E\u0930\u094B\u0902 \u0913\u0930 \u0915\u0940 \u0926\u0942\u0930\u0940 \u0939\u0948 (\u092D\u0941\u091C\u093E\u090F\u0901 \u091C\u094B\u0921\u093C\u093F\u090F)\u0964 \u0915\u094D\u0937\u0947\u0924\u094D\u0930\u092B\u0932 \u0905\u0902\u0926\u0930 \u0915\u0940 \u091C\u0917\u0939 \u0939\u0948 (\u0932\u0902\u092C\u093E\u0908 \xD7 \u091A\u094C\u0921\u093C\u093E\u0908)\u0964"),perim_half:s("A rectangle has two lengths and two breadths: add all four sides.","\u0906\u092F\u0924 \u092E\u0947\u0902 \u0926\u094B \u0932\u0902\u092C\u093E\u0907\u092F\u093E\u0901 \u0914\u0930 \u0926\u094B \u091A\u094C\u0921\u093C\u093E\u0907\u092F\u093E\u0901 \u0939\u094B\u0924\u0940 \u0939\u0948\u0902: \u091A\u093E\u0930\u094B\u0902 \u092D\u0941\u091C\u093E\u090F\u0901 \u091C\u094B\u0921\u093C\u093F\u090F\u0964"),tri_half:s("A triangle is half of a rectangle: area = \xBD \xD7 base \xD7 height.","\u0924\u094D\u0930\u093F\u092D\u0941\u091C \u0906\u092F\u0924 \u0915\u093E \u0906\u0927\u093E \u0939\u094B\u0924\u093E \u0939\u0948: \u0915\u094D\u0937\u0947\u0924\u094D\u0930\u092B\u0932 = \xBD \xD7 \u0906\u0927\u093E\u0930 \xD7 \u090A\u0901\u091A\u093E\u0908\u0964"),time_base60:s("An hour has 60 minutes, not 100. Count up to the next hour, then on.","\u090F\u0915 \u0918\u0902\u091F\u0947 \u092E\u0947\u0902 60 \u092E\u093F\u0928\u091F \u0939\u094B\u0924\u0947 \u0939\u0948\u0902, 100 \u0928\u0939\u0940\u0902\u0964 \u092A\u0939\u0932\u0947 \u0905\u0917\u0932\u0947 \u0918\u0902\u091F\u0947 \u0924\u0915 \u0917\u093F\u0928\u093F\u090F, \u092B\u093F\u0930 \u0906\u0917\u0947\u0964"),avg_sum:s("After adding, divide by how many numbers there are.","\u091C\u094B\u0921\u093C\u0928\u0947 \u0915\u0947 \u092C\u093E\u0926 \u0938\u0902\u0916\u094D\u092F\u093E\u0913\u0902 \u0915\u0940 \u0917\u093F\u0928\u0924\u0940 \u0938\u0947 \u092D\u093E\u0917 \u0926\u0940\u091C\u093F\u090F\u0964"),int_sign:s("Think of a number line: adding a negative moves left, adding a positive moves right.","\u0938\u0902\u0916\u094D\u092F\u093E \u0930\u0947\u0916\u093E \u0938\u094B\u091A\u093F\u090F: \u090B\u0923\u093E\u0924\u094D\u092E\u0915 \u091C\u094B\u0921\u093C\u0928\u0947 \u092A\u0930 \u092C\u093E\u0908\u0902 \u0913\u0930, \u0927\u0928\u093E\u0924\u094D\u092E\u0915 \u091C\u094B\u0921\u093C\u0928\u0947 \u092A\u0930 \u0926\u093E\u0908\u0902 \u0913\u0930 \u091A\u0932\u093F\u090F\u0964"),int_sub_neg:s("Subtracting a negative is the same as adding its positive.","\u090B\u0923\u093E\u0924\u094D\u092E\u0915 \u0938\u0902\u0916\u094D\u092F\u093E \u0918\u091F\u093E\u0928\u093E, \u0909\u0938\u0915\u0940 \u0927\u0928\u093E\u0924\u094D\u092E\u0915 \u0938\u0902\u0916\u094D\u092F\u093E \u091C\u094B\u0921\u093C\u0928\u0947 \u0915\u0947 \u092C\u0930\u093E\u092C\u0930 \u0939\u0948\u0964"),int_sign_mul:s("Different signs give a negative answer; same signs give a positive answer.","\u0905\u0932\u0917 \u091A\u093F\u0939\u094D\u0928 \u0939\u094B\u0902 \u0924\u094B \u0909\u0924\u094D\u0924\u0930 \u090B\u0923\u093E\u0924\u094D\u092E\u0915, \u0938\u092E\u093E\u0928 \u091A\u093F\u0939\u094D\u0928 \u0939\u094B\u0902 \u0924\u094B \u0927\u0928\u093E\u0924\u094D\u092E\u0915\u0964"),ratio_order:s("Order matters in a ratio: keep the terms in the order they were given.","\u0905\u0928\u0941\u092A\u093E\u0924 \u092E\u0947\u0902 \u0915\u094D\u0930\u092E \u092E\u0939\u0924\u094D\u0935\u092A\u0942\u0930\u094D\u0923 \u0939\u0948: \u092A\u0926\u094B\u0902 \u0915\u094B \u0926\u093F\u090F \u0917\u090F \u0915\u094D\u0930\u092E \u092E\u0947\u0902 \u0939\u0940 \u0930\u0916\u093F\u090F\u0964"),ratio_partial:s("Keep dividing both terms until no common factor is left.","\u0926\u094B\u0928\u094B\u0902 \u092A\u0926\u094B\u0902 \u0915\u094B \u0924\u092C \u0924\u0915 \u092D\u093E\u0917 \u0926\u0947\u0924\u0947 \u0930\u0939\u093F\u090F \u091C\u092C \u0924\u0915 \u0915\u094B\u0908 \u0909\u092D\u092F\u0928\u093F\u0937\u094D\u0920 \u0917\u0941\u0923\u0928\u0916\u0902\u0921 \u0928 \u092C\u091A\u0947\u0964"),ratio_parts:s("First add the parts of the ratio, then find the value of one part.","\u092A\u0939\u0932\u0947 \u0905\u0928\u0941\u092A\u093E\u0924 \u0915\u0947 \u092D\u093E\u0917\u094B\u0902 \u0915\u094B \u091C\u094B\u0921\u093C\u093F\u090F, \u092B\u093F\u0930 \u090F\u0915 \u092D\u093E\u0917 \u0915\u093E \u092E\u093E\u0928 \u0928\u093F\u0915\u093E\u0932\u093F\u090F\u0964"),alg_concat:s("3x means 3 times x, not the digits 3 and x written together.","3x \u0915\u093E \u0905\u0930\u094D\u0925 \u0939\u0948 3 \u0917\u0941\u0923\u093E x, \u0928 \u0915\u093F 3 \u0914\u0930 x \u0915\u094B \u0938\u093E\u0925 \u0932\u093F\u0916\u0928\u093E\u0964"),eq_inverse:s("Undo each operation with its opposite on both sides: + with \u2212, \xD7 with \xF7.","\u0939\u0930 \u0938\u0902\u0915\u094D\u0930\u093F\u092F\u093E \u0915\u094B \u0926\u094B\u0928\u094B\u0902 \u092A\u0915\u094D\u0937\u094B\u0902 \u092E\u0947\u0902 \u0909\u0938\u0915\u0940 \u0909\u0932\u091F\u0940 \u0938\u0902\u0915\u094D\u0930\u093F\u092F\u093E \u0938\u0947 \u0939\u091F\u093E\u0907\u090F: + \u0915\u094B \u2212 \u0938\u0947, \xD7 \u0915\u094B \xF7 \u0938\u0947\u0964"),exp_mul:s("A power means repeated multiplication: 2\u2075 = 2 \xD7 2 \xD7 2 \xD7 2 \xD7 2, not 2 \xD7 5.","\u0918\u093E\u0924 \u0915\u093E \u0905\u0930\u094D\u0925 \u0939\u0948 \u092C\u093E\u0930-\u092C\u093E\u0930 \u0917\u0941\u0923\u093E: 2\u2075 = 2 \xD7 2 \xD7 2 \xD7 2 \xD7 2, \u0928 \u0915\u093F 2 \xD7 5\u0964"),sq_double:s("Squaring means multiplying the number by itself, not by 2.","\u0935\u0930\u094D\u0917 \u0915\u0930\u0928\u0947 \u0915\u093E \u0905\u0930\u094D\u0925 \u0939\u0948 \u0938\u0902\u0916\u094D\u092F\u093E \u0915\u094B \u0938\u094D\u0935\u092F\u0902 \u0938\u0947 \u0917\u0941\u0923\u093E \u0915\u0930\u0928\u093E, 2 \u0938\u0947 \u0928\u0939\u0940\u0902\u0964"),sqrt_half:s("A square root is the number that multiplied by itself gives the number. It is not half.","\u0935\u0930\u094D\u0917\u092E\u0942\u0932 \u0935\u0939 \u0938\u0902\u0916\u094D\u092F\u093E \u0939\u0948 \u091C\u093F\u0938\u0947 \u0938\u094D\u0935\u092F\u0902 \u0938\u0947 \u0917\u0941\u0923\u093E \u0915\u0930\u0928\u0947 \u092A\u0930 \u0926\u0940 \u0917\u0908 \u0938\u0902\u0916\u094D\u092F\u093E \u092E\u093F\u0932\u0947\u0964 \u092F\u0939 \u0906\u0927\u093E \u0928\u0939\u0940\u0902 \u0939\u0948\u0964"),si_amount:s("Interest is only the extra money. Amount = principal + interest.","\u092C\u094D\u092F\u093E\u091C \u0915\u0947\u0935\u0932 \u0905\u0924\u093F\u0930\u093F\u0915\u094D\u0924 \u0927\u0928 \u0939\u0948\u0964 \u092E\u093F\u0936\u094D\u0930\u0927\u0928 = \u092E
