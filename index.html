}

.wrap.narrow { max-width: 640px; }

.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }

.logo { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: var(--grad); box-shadow: 0 4px 12px rgb(43 85 230 / .3); color: var(--accent-ink); font: 800 1rem var(--display); flex: none; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.row > div { min-width: 0; flex: 1 1 220px; }
.tabs { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100% - 24px)); display: flex; gap: 4px; background: var(--glass); -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%); border: 1px solid var(--glass-line); box-shadow: var(--shadow); border-radius: 22px; padding: 6px; z-index: 5; }
.tab { flex: 1; display: grid; justify-items: center; gap: 1px; line-height: 1.1; text-align: center; text-decoration: none; color: var(--muted); font-weight: 600; padding: 10px 6px; border-radius: 16px; font-size: .8rem; transition: background .2s, color .2s; }

.opt:hover:not(:disabled) { border-color: var(--sc); }

.good .verdict { color: var(--good); } .bad .verdict { color: var(--bad); }

.badge-line { font-weight: 700; color: var(--good); }

.wrap-row { justify-content: flex-start; }

.passage { background: var(--bg); border-radius: 10px; padding: 10px 14px; margin-bottom: 10px; }
.passage summary { font-weight: 700; cursor: pointer; }
.grid { width: 100%; max-width: 230px; display: block; margin: 0 auto 12px; }
.grid .cell { fill: var(--bg); stroke: var(--line); }

.pill.mastered { background: var(--good-bg); color: var(--good); }

@media (max-width: 420px) { .road-row { grid-template-columns: 58px 58px 1fr 40px; gap: 6px; } .prompt { font-size: 1.15rem; } h1 { font-size: 1.45rem; } }

/* ---------- Phase 1: ambient background, bento home, motion ---------- */
body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(520px 420px at 8% -5%, var(--orb1), transparent 70%), radial-gradient(480px 420px at 100% 10%, var(--orb2), transparent 70%), radial-gradient(520px 460px at 50% 110%, var(--orb3), transparent 70%); }
.wrap { max-width: 920px; } .wrap.narrow { max-width: 640px; }
.top { max-width: 920px; }
.avatar { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; background: var(--grad); color: var(--accent-ink); font: 800 1.1rem var(--display); flex: none; box-shadow: 0 4px 12px rgb(43 85 230 / .3); }
.pills { display: flex; gap: 8px; }
.pill-stat { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 99px; background: var(--glass); border: 1px solid var(--glass-line); box-shadow: var(--shadow); font: 700 1rem/1 var(--display); font-variant-numeric: tabular-nums; -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.pill-stat .ico { font-size: 1.05rem; }
.bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.bento > * { min-width: 0; animation: rise .5s both cubic-bezier(.2, .8, .2, 1); }
.bento > :nth-child(2) { animation-delay: .06s; } .bento > :nth-child(3) { animation-delay: .12s; } .bento > :nth-child(4) { animation-delay: .18s; } .bento > :nth-child(5) { animation-delay: .24s; } .bento > :nth-child(6) { animation-delay: .3s; }
.b-hero { grid-column: span 4; } .b-wide { grid-column: span 4; } .b-half { grid-column: span 2; }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }
.hero { position: relative; overflow: hidden; border: 1.5px solid var(--accent); padding: 22px; }
.hero::after { content: ""; position: absolute; right: -50px; top: -50px; width: 180px; height: 180px; border-radius: 50%; background: var(--grad); opacity: .16; pointer-events: none; }
.hero.complete { border-color: var(--good); background: var(--good-bg); } .hero.complete::after { background: var(--good); }
.hero h2 { font-size: 2.1rem; margin: 0; font-variant-numeric: tabular-nums; }
.tile { display: grid; align-content: space-between; gap: 6px; min-height: 120px; }
.tile .big-n { font: 800 2.4rem/1 var(--display); font-variant-numeric: tabular-nums; }
.tile .big-ico { font-size: 1.8rem; line-height: 1; }
.tile .flame { display: inline-block; transform-origin: 50% 90%; animation: flicker 2.4s ease-in-out infinite; }
@keyframes flicker { 0%, 100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.12) rotate(3deg); } }
.strands { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
.strand { border-left-width: 1.5px; border-top: 5px solid var(--sc); position: relative; transition: transform .2s, box-shadow .2s, border-color .2s; box-shadow: var(--shadow); }
.strand:hover { transform: translateY(-3px); } .strand:active { transform: scale(.97); }
.strand .sico { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 12px; font-size: 1.35rem; background: color-mix(in srgb, var(--sc) 16%, transparent); }
.pulse { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { box-shadow: 0 6px 18px rgb(43 85 230 / .30), 0 0 0 0 rgb(43 85 230 / .45); } 50% { box-shadow: 0 6px 18px rgb(43 85 230 / .30), 0 0 0 12px rgb(43 85 230 / 0); } }
.view-in { animation: rise .35s both; }
@media (max-width: 640px) { .b-half { grid-column: span 2; } .hero h2 { font-size: 1.8rem; } .pill-stat { padding: 6px 10px; } }
@supports not (backdrop-filter: blur(1px)) { .card, .tabs, .pill-stat { background: var(--surface); } }

/* ---------- Phase 2: rewards ---------- */
.level-tile .lv-row { display: flex; gap: 16px; align-items: center; }
.lv-ico { display: grid; place-items: center; flex: none; width: 64px; height: 64px; border-radius: 20px; font-size: 2rem; background: var(--grad); box-shadow: 0 6px 18px rgb(43 85 230 / .3); }
.lv-main { flex: 1; min-width: 0; display: grid; gap: 6px; } .lv-main h2 { margin: 0; font-size: 1.4rem; }
.lv-main .bar i { background: var(--grad); }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; }
.badge { display: grid; justify-items: center; gap: 4px; text-align: center; padding: 10px 4px; border-radius: 16px; background: var(--bg); filter: grayscale(1); opacity: .55; }
.badge.on { filter: none; opacity: 1; background: color-mix(in srgb, var(--g) 14%, var(--surface)); animation: pop .5s both; }
.badge .b-ico { font-size: 1.7rem; line-height: 1; } .badge small { font-size: .72rem; line-height: 1.2; color: var(--muted); }
@keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.12); } 100% { transform: none; } }
.rw-box { display: grid; gap: 4px; padding: 10px 14px; margin: 6px 0 10px; border-radius: 16px; background: var(--warn-bg); animation: pop .5s both; }
.rw-line { margin: 4px 0; font-weight: 600; } .rw-line.gold { font-size: 1.15rem; } .rw-ico { display: inline-block; font-size: 1.3rem; vertical-align: -2px; }
.levelup { text-align: center; padding: 8px 0; } .levelup h2 { margin: 4px 0; font-size: 1.8rem; }
.lu-ico { font-size: 3.6rem; line-height: 1; animation: pop .7s both; }
.celebrate { text-align: left; } .celebrate .btn { margin-top: 12px; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 40; }
.confetti i { position: absolute; top: -14px; left: var(--x); width: 9px; height: 14px; border-radius: 2px; opacity: 0; animation: fall var(--d) var(--w) ease-in forwards; }
@keyframes fall { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: .9; transform: translate(var(--dx), 105vh) rotate(var(--r)); } }

/* ---------- Phase 3: gentle feedback, guidance loop, interactive widgets ---------- */
.opt.miss, .answer.miss { border-color: var(--warn-line, #e0a43a); background: var(--warn-bg); }
.feedback.try { background: color-mix(in srgb, var(--accent) 10%, var(--surface)); border-left: 5px solid var(--accent); animation: rise .3s both; }
.feedback.try .verdict { color: var(--accent); }
.hint { background: var(--warn-bg); border-radius: 12px; padding: 10px 12px; }
.star-pop { display: inline-block; font-weight: 800; color: var(--g); animation: pop .5s both; }
.card.guide { border-top-style: dashed; }
.answer-row.stack { display: grid; gap: 12px; }
.w-order, .w-match { display: grid; gap: 12px; }
.ord-line { list-style: none; margin: 0; padding: 10px; min-height: 64px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border: 2px dashed var(--line); border-radius: 14px; background: var(--bg); counter-reset: o; }
.ord-line li { margin: 0; counter-increment: o; position: relative; }
.ord-line li::before { content: counter(o); position: absolute; top: -8px; left: -4px; z-index: 1; width: 18px; height: 18px; border-radius: 50%; background: var(--sc, var(--accent)); color: var(--accent-ink); font: 700 .7rem/18px var(--display); text-align: center; }
.ord-bank { display: flex; flex-wrap: wrap; gap: 8px; }
.tile-btn { font: 600 1rem/1.25 var(--body); color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px 14px; min-height: 46px; cursor: pointer; text-align: left; transition: transform .12s, border-color .12s; }
.tile-btn:hover:not(:disabled) { border-color: var(--sc, var(--accent)); transform: translateY(-1px); }
.tile-btn:disabled { opacity: .55; cursor: default; }
.tile-btn.picked { border-color: var(--sc, var(--accent)); opacity: 1; }
.m-col { display: grid; gap: 8px; align-content: start; } .w-match { grid-template-columns: 1fr 1fr; }
.tile-btn.sel { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.tile-btn.paired { opacity: 1; color: #fff; border-color: transparent; }
.tile-btn.p0 { background: #2b55e6; } .tile-btn.p1 { background: #7b45d6; } .tile-btn.p2 { background: #148a5a; } .tile-btn.p3 { background: #c2387a; } .tile-btn.p4 { background: #b4492b; }

928 \u092C\u0928\u093E\u0924\u093E \u0939\u0948?",["Leaf","\u092A\u0924\u094D\u0924\u0940"],[["Root","\u091C\u0921\u093C"],["Stem","\u0924\u0928\u093E"],["Seed","\u092C\u0940\u091C"]],["Green leaves make food using sunlight, water and air. This is photosynthesis.","\u0939\u0930\u0940 \u092A\u0924\u094D\u0924\u093F\u092F\u093E\u0901 \u0938\u0942\u0930\u094D\u092F \u0915\u0947 \u092A\u094D\u0930\u0915\u093E\u0936, \u092A\u093E\u0928\u0940 \u0914\u0930 \u0939\u0935\u093E \u0938\u0947 \u092D\u094B\u091C\u0928 \u092C\u0928\u093E\u0924\u0940 \u0939\u0948\u0902\u0964 \u0907\u0938\u0947 \u092A\u094D\u0930\u0915\u093E\u0936 \u0938\u0902\u0936\u094D\u0932\u0947\u0937\u0923 \u0915\u0939\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Which gas do leaves take in to make food?","\u092D\u094B\u091C\u0928 \u092C\u0928\u093E\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u092A\u0924\u094D\u0924\u093F\u092F\u093E\u0901 \u0915\u094C\u0928-\u0938\u0940 \u0917\u0948\u0938 \u0932\u0947\u0924\u0940 \u0939\u0948\u0902?",["Carbon dioxide","\u0915\u093E\u0930\u094D\u092C\u0928 \u0921\u093E\u0907\u0911\u0915\u094D\u0938\u093E\u0907\u0921"],[["Oxygen","\u0911\u0915\u094D\u0938\u0940\u091C\u0928"],["Nitrogen","\u0928\u093E\u0907\u091F\u094D\u0930\u094B\u091C\u0928"],["Hydrogen","\u0939\u093E\u0907\u0921\u094D\u0930\u094B\u091C\u0928"]],["Leaves take in carbon dioxide and give out oxygen while making food.","\u092D\u094B\u091C\u0928 \u092C\u0928\u093E\u0924\u0947 \u0938\u092E\u092F \u092A\u0924\u094D\u0924\u093F\u092F\u093E\u0901 \u0915\u093E\u0930\u094D\u092C\u0928 \u0921\u093E\u0907\u0911\u0915\u094D\u0938\u093E\u0907\u0921 \u0932\u0947\u0924\u0940 \u0939\u0948\u0902 \u0914\u0930 \u0911\u0915\u094D\u0938\u0940\u091C\u0928 \u091B\u094B\u0921\u093C\u0924\u0940 \u0939\u0948\u0902\u0964"]],["What gives leaves their green colour?","\u092A\u0924\u094D\u0924\u093F\u092F\u094B\u0902 \u0915\u094B \u0939\u0930\u093E \u0930\u0902\u0917 \u0915\u093F\u0938\u0938\u0947 \u092E\u093F\u0932\u0924\u093E \u0939\u0948?" ch of these is a carrot?","\u0917\u093E\u091C\u0930 \u092A\u094C\u0927\u0947 \u0915\u093E \u0915\u094C\u0928-\u0938\u093E \u092D\u093E\u0917 \u0939\u0948?",["A root","\u091C\u0921\u093C"],[["A stem","\u0924\u0928\u093E"],["A fruit","\u092B\u0932"],["A leaf","\u092A\u0924\u094D\u0924\u0940"]],["A carrot is a root that stores food.","\u0917\u093E\u091C\u0930 \u090F\u0915 \u091C\u0921\u093C \u0939\u0948 \u091C\u093F\u0938\u092E\u0947\u0902 \u092D\u094B\u091C\u0928 \u0938\u0902\u091A\u093F\u0924 \u0930\u0939\u0924\u093E \u0939\u0948\u0964"]],["A potato is which part of the plant?","\u0906\u0932\u0942 \u092A\u094C\u0927\u0947 \u0915\u093E \u0915\u094C\u0928-\u0938\u093E \u092D\u093E\u0917 \u0939\u0948?",["An underground stem","\u092D\u0942\u092E\u093F\u0917\u0924 \u0924\u0928\u093E"],[["A root","\u091C\u0921\u093C"],["A fruit","\u092B\u0932"],["A seed","\u092C\u0940\u091C"]],['A potato is a stem: it has "eyes" (buds) from which new shoots grow.','\u0906\u0932\u0942 \u090F\u0915 \u0924\u0928\u093E \u0939\u0948: \u0907\u0938\u0915\u0940 "\u0906\u0901\u0916\u094B\u0902" (\u0915\u0932\u093F\u092F\u094B\u0902) \u0938\u0947 \u0928\u090F \u0905\u0902\u0915\u0941\u0930 \u0928\u093F\u0915\u0932\u0924\u0947 \u0939\u0948\u0902\u0964']]]),_("s.animals",4,s("Animals: food and homes","\u091C\u0902\u0924\u0941: \u092D\u094B\u091C\u0928 \u0914\u0930 \u0906\u0935\u093E\u0938"),[],s("Herbivores eat plants, carnivores eat animals, omnivores eat both.","\u0936\u093E\u0915\u093E\u0939\u093E\u0930\u0940 \u092A\u094C\u0927\u0947 \u0916\u093E\u0924\u0947 \u0939\u0948\u0902, \u092E\u093E\u0902\u0938\u093E\u0939\u093E\u0930\u0940 \u091C\u0902\u0924\u0941 \u0916\u093E\u0924\u0947 \u0939\u0948\u0902, \u0938\u0930\u094D\u0935\u093E\u0939\u093E\u0930\u0940 \u0926\u094B\u0928\u094B\u0902 \u0916\u093E\u0924\u0947 \u0939\u0948\u0902\u0964"),[["An animal that eats only plants is called a:","\u0915\u0947\u0935\u0932 \u092A\u094C\u0927\u0947 \u0916\u093E\u0928\u0947 \u0935\u093E\u0932\u0947 \u091C\u0902\u0924\u0941 \u0915\u094B \u0915\u094D\u092F\u093E \u0915\u0939\u0924\u0947 \u0939\u0948\u0902?",["Herbivore","\u0936\u093E\u0915\u093E\u0939\u093E\u0930\u0940"],[["Carnivore","\u092E\u093E\u0902\u0938\u093E\u0939\u093E\u0930\u0940"],["Omnivore","\u0938\u0930\u094D\u0935\u093E\u0939\u093E\u0930\u0940"],["Scavenger","\u0905\u092A\u092E\u093E\u0930\u094D\u091C\u0915"]],["Cows, goats and deer are herbivores.","\u0917\u093E\u092F, \u092C\u0915\u0930\u0940 \u0914\u0930 \u0939\u093F\u0930\u0923 \u0936\u093E\u0915\u093E\u0939\u093E\u0930\u0940 \u0939\u0948\u0902\u0964"]],["Which of these is a carnivore?","\u0907\u0928\u092E\u0947\u0902 \u0938\u0947 \u0915\u094C\u0928 \u092E\u093E\u0902\u0938\u093E\u0939\u093E\u0930\u0940 \u0939\u0948?",["Tiger","\u092C\u093E\u0918"],[["Cow","\u0917\u093E\u092F"],["Rabbit","\u0916\u0930\u0917\u094B\u0936"],["Elephant","\u0939\u093E\u0925\u0940"]],["A tiger hunts and eats other animals.","\u092C\u093E\u0918 \u0926\u0942\u0938\u0930\u0947 \u091C\u0902\u0924\u0941\u0913\u0902 \u0915\u093E \u0936\u093F\u0915\u093E\u0930 \u0915\u0930\u0915\u0947 \u0916\u093E\u0924\u093E \u0939\u0948\u0964"]],["Which animal is an omnivore?","\u0915\u094C\u0928-\u0938\u093E \u091C\u0902\u0924\u0941 \u0938\u0930\u094D\u0935\u093E\u0939\u093E\u0930\u0940 \u0939\u0948?",["Bear","\u092D\u093E\u0932\u0942"],[["Deer","\u0939\u093F\u0930\u0923"],["Lion","\u0936\u0947\u0930"],["Horse","\u0918\u094B\u0921\u093C\u093E"]],["A bear eats fruits, honey and fish, so it eats both plants and animals.","\u092D\u093E\u0932\u0942 \u092B\u0932, \u0936\u0939\u0926 \u0914\u0930 \u092E\u091B\u0932\u0940 \u0916\u093E\u0924\u093E \u0939\u0948, \u092F\u093E\u0928\u0940 \u092A\u094C\u0927\u0947 \u0914\u0930 \u091C\u0902\u0924\u0941 \u0926\u094B\u0928\u094B\u0902\u0964"]],["How does a fish breathe?","\u092E\u091B\u0932\u0940 \u0915\u0948\u0938\u0947 \u0938\u093E\u0901\u0938 \u0932\u0947\u0924\u0940 \u0939\u0948?",["Through gills","\u0917\u0932\u092B\u0921\u093C\u094B\u0902 \u0938\u0947"],[["Through lungs","\u092B\u0947\u092B\u0921\u093C\u094B\u0902 \u0938\u0947"],["Through its skin only","\u0915\u0947\u0935\u0932 \u0924\u094D\u0935\u091A\u093E \u0938\u0947"],["Through its fins","\u092A\u0902\u0916\u094B\u0902 (\u092B\u093F\u0928) \u0938\u0947"]],["Gills take oxygen from the water.","\u0917\u0932\u092B\u0921\u093C\u0947 \u092A\u093E\u0928\u0940 \u0938\u0947 \u0911\u0915\u094D\u0938\u0940\u091C\u0928 \u0932\u0947\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Which animal can live both on land and in water?","\u0915\u094C\u0928-\u0938\u093E \u091C\u0902\u0924\u0941 \u091C\u0932 \u0914\u0930 \u0925\u0932 \u0926\u094B\u0928\u094B\u0902 \u092A\u0930 \u0930\u0939 \u0938\u0915\u0924\u093E \u0939\u0948?",["Frog","\u092E\u0947\u0902\u0922\u0915"],[["Cat","\u092C\u093F\u0932\u094D\u0932\u0940"],["Sparrow","\u0917\u094C\u0930\u0948\u092F\u093E"],["Goat","\u092C\u0915\u0930\u0940"]],["Frogs are amphibians: they live both on land and in water.","\u092E\u0947\u0902\u0922\u0915 \u0909\u092D\u092F\u091A\u0930 \u0939\u0948: \u0935\u0939 \u091C\u0932 \u0914\u0930 \u0925\u0932 \u0926\u094B\u0928\u094B\u0902 \u092A\u0930 \u0930\u0939\u0924\u093E \u0939\u0948\u0964"]],["Why does a camel have a hump?","\u090A\u0901\u091F \u0915\u0947 \u0915\u0942\u092C\u0921\u093C \u0939\u094B\u0924\u093E \u0939\u0948 \u0915\u094D\u092F\u094B\u0902\u0915\u093F:",["It stores fat for use when food is scarce","\u0909\u0938\u092E\u0947\u0902 \u0935\u0938\u093E \u091C\u092E\u093E \u0930\u0939\u0924\u0940 \u0939\u0948 \u091C\u094B \u092D\u094B\u091C\u0928 \u0915\u092E \u0939\u094B\u0928\u0947 \u092A\u0930 \u0915\u093E\u092E \u0906\u0924\u0940 \u0939\u0948"],[["It stores water","\u0909\u0938\u092E\u0947\u0902 \u092A\u093E\u0928\u0940 \u092D\u0930\u093E \u0930\u0939\u0924\u093E \u0939\u0948"],["It helps it run fast","\u0909\u0938\u0938\u0947 \u0935\u0939 \u0924\u0947\u091C\u093C \u0926\u094C\u0921\u093C\u0924\u093E \u0939\u0948"],["It keeps it cool at night","\u0909\u0938\u0938\u0947 \u0935\u0939 \u0930\u093E\u0924 \u092E\u0947\u0902 \u0920\u0902\u0921\u093E \u0930\u0939\u0924\u093E \u0939\u0948"]],["The hump stores fat, which gives energy in the desert.","\u0915\u0942\u092C\u0921\u093C \u092E\u0947\u0902 \u0935\u0938\u093E \u091C\u092E\u093E \u0930\u0939\u0924\u0940 \u0939\u0948 \u091C\u094B \u0930\u0947\u0917\u093F\u0938\u094D\u0924\u093E\u0928 \u092E\u0947\u0902 \u090A\u0930\u094D\u091C\u093E \u0926\u0947\u0924\u0940 \u0939\u0948\u0964"]],["Which of these birds cannot fly?","\u0907\u0928\u092E\u0947\u0902 \u0938\u0947 \u0915\u094C\u0928-\u0938\u093E \u092A\u0915\u094D\u0937\u0940 \u0909\u0921\u093C \u0928\u0939\u0940\u0902 \u0938\u0915\u0924\u093E?",["Ostrich","\u0936\u0941\u0924\u0941\u0930\u092E\u0941\u0930\u094D\u0917"],[["Parrot","\u0924\u094B\u0924\u093E"],["Pigeon","\u0915\u092C\u0942\u0924\u0930"],["Eagle","\u0917\u0930\u0941\u0921\u093C (\u092C\u093E\u091C\u093C)"]],["The ostrich is too heavy to fly, but it runs very fast.","\u0936\u0941\u0924\u0941\u0930\u092E\u0941\u0930\u094D\u0917 \u0909\u0921\u093C\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u092C\u0939\u0941\u0924 \u092D\u093E\u0930\u0940 \u0939\u0948, \u092A\u0930 \u0935\u0939 \u092C\u0939\u0941\u0924 \u0924\u0947\u091C\u093C \u0926\u094C\u0921\u093C\u0924\u093E \u0939\u0948\u0964"]],["Which animal is a mammal?","\u0915\u094C\u0928-\u0938\u093E \u091C\u0902\u0924\u0941 \u0938\u094D\u0924\u0928\u0927\u093E\u0930\u0940 \u0939\u0948?",["Whale","\u0935\u094D\u0939\u0947\u0932"],[["Shark","\u0936\u093E\u0930\u094D\u0915"],["Crocodile","\u092E\u0917\u0930\u092E\u091A\u094D\u091B"],["Snake","\u0938\u093E\u0901\u092A"]],["A whale breathes air with lungs and feeds its young on milk.","\u0935\u094D\u0939\u0947\u0932 \u092B\u0947\u092B\u0921\u093C\u094B\u0902 \u0938\u0947 \u0939\u0935\u093E \u0932\u0947\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0905\u092A\u0928\u0947 \u092C\u091A\u094D\u091A\u094B\u0902 \u0915\u094B \u0926\u0942\u0927 \u092A\u093F\u0932\u093E\u0924\u0940 \u0939\u0948\u0964"]]]),_("s.body",4,s("Our body","\u0939\u092E\u093E\u0930\u093E \u0936\u0930\u0940\u0930"),[],s("Each organ has a job: the heart pumps, the lungs breathe, the brain controls.","\u0939\u0930 \u0905\u0902\u0917 \u0915\u093E \u090F\u0915 \u0915\u093E\u092E \u0939\u0948: \u0939\u0943\u0926\u092F \u0930\u0915\u094D\u0924 \u092A\u0902\u092A \u0915\u0930\u0924\u093E \u0939\u0948, \u092B\u0947\u092B\u0921\u093C\u0947 \u0938\u093E\u0901\u0938 \u0932\u0947\u0924\u0947 \u0939\u0948\u0902, \u092E\u0938\u094D\u0924\u093F\u0937\u094D\u0915 \u0928\u093F\u092F\u0902\u0924\u094D\u0930\u0923 \u0915\u0930\u0924\u093E \u0939\u0948\u0964"),[["Which organ pumps blood around the body?","\u0915\u094C\u0928-\u0938\u093E \u0905\u0902\u0917 \u092A\u0942\u0930\u0947 \u0936\u0930\u0940\u0930 \u092E\u0947\u0902 \u0930\u0915\u094D\u0924 \u092A\u0902\u092A \u0915\u0930\u0924\u093E \u0939\u0948?",["Heart","\u0939\u0943\u0926\u092F"],[["Lungs","\u092B\u0947\u092B\u0921\u093C\u0947"],["Stomach","\u0906\u092E\u093E\u0936\u092F"],["Kidney","\u0917\u0941\u0930\u094D\u0926\u093E"]],["The heart is a muscle that pumps blood without stopping.","\u0939\u0943\u0926\u092F \u090F\u0915 \u092A\u0947\u0936\u0940 \u0939\u0948 \u091C\u094B \u092C\u093F\u0928\u093E \u0930\u0941\u0915\u0947 \u0930\u0915\u094D\u0924 \u092A\u0902\u092A \u0915\u0930\u0924\u093E \u0939\u0948\u0964"]],["Which organs help us breathe?","\u0915\u094C\u0928-\u0938\u0947 \u0905\u0902\u0917 \u0938\u093E\u0901\u0938 \u0932\u0947\u0928\u0947 \u092E\u0947\u0902 \u092E\u0926\u0926 \u0915\u0930\u0924\u0947 \u0939\u0948\u0902?",["Lungs","\u092B\u0947\u092B\u0921\u093C\u0947"],[["Kidneys","\u0917\u0941\u0930\u094D\u0926\u0947"],["Liver","\u092F\u0915\u0943\u0924"],["Intestines","\u0906\u0901\u0924\u0947\u0902"]],["The lungs take in oxygen and give out carbon dioxide.","\u092B\u0947\u092B\u0921\u093C\u0947 \u0911\u0915\u094D\u0938\u0940\u091C\u0928 \u0932\u0947\u0924\u0947 \u0939\u0948\u0902 \u0914\u0930 \u0915\u093E\u0930\u094D\u092C\u0928 \u0921\u093E\u0907\u0911\u0915\u094D\u0938\u093E\u0907\u0921 \u092C\u093E\u0939\u0930 \u0928\u093F\u0915\u093E\u0932\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Which organ controls the whole body?","\u0915\u094C\u0928-\u0938\u093E \u0905\u0902\u0917 \u092A\u0942\u0930\u0947 \u0936\u0930\u0940\u0930 \u0915\u094B \u0928\u093F\u092F\u0902\u0924\u094D\u0930\u093F\u0924 \u0915\u0930\u0924\u093E \u0939\u0948?",["Brain","\u092E\u0938\u094D\u0924\u093F\u0937\u094D\u0915"],[["Heart","\u0939\u0943\u0926\u092F"],["Stomach","\u0906\u092E\u093E\u0936\u092F"],["Lungs","\u092B\u0947\u092B\u0921\u093C\u0947"]],["The brain receives messages through nerves and sends instructions back.","\u092E\u0938\u094D\u0924\u093F\u0937\u094D\u0915 \u0928\u0938\u094B\u0902 \u0938\u0947 \u0938\u0902\u0926\u0947\u0936 \u092A\u093E\u0924\u093E \u0939\u0948 \u0914\u0930 \u0928\u093F\u0930\u094D\u0926\u0947\u0936 \u0935\u093E\u092A\u0938 \u092D\u0947\u091C\u0924\u093E \u0939\u0948\u0964"]],["How many bones does an adult human body have?","\u090F\u0915 \u0935\u092F\u0938\u094D\u0915 \u092E\u0928\u0941\u0937\u094D\u092F \u0915\u0947 \u0936\u0930\u0940\u0930 \u092E\u0947\u0902 \u0915\u093F\u0924\u0928\u0940 \u0939\u0921\u094D\u0921\u093F\u092F\u093E\u0901 \u0939\u094B\u0924\u0940 \u0939\u0948\u0902?",["206","206"],[["106","106"],["306","306"],["26","26"]],["An adult has 206 bones; a newborn baby has more, which join as it grows.","\u0935\u092F\u0938\u094D\u0915 \u092E\u0947\u0902 206 \u0939\u0921\u094D\u0921\u093F\u092F\u093E\u0901 \u0939\u094B\u0924\u0940 \u0939\u0948\u0902; \u0928\u0935\u091C\u093E\u0924 \u092E\u0947\u0902 \u0905\u0927\u093F\u0915 \u0939\u094B\u0924\u0940 \u0939\u0948\u0902 \u091C\u094B \u092C\u0922\u093C\u0928\u0947 \u092A\u0930 \u091C\u0941\u0921\u093C \u091C\u093E\u0924\u0940 \u0939\u0948\u0902\u0964"]],["Which organ cleans the blood and makes urine?","\u0915\u094C\u0928-\u0938\u093E \u0905\u0902\u0917 \u0930\u0915\u094D\u0924 \u0915\u094B \u0938\u093E\u092B\u093C \u0915\u0930\u0915\u0947 \u092E\u0942\u0924\u094D\u0930 \u092C\u0928\u093E\u0924\u093E \u0939\u0948?",["Kidney","\u0917\u0941\u0930\u094D\u0926\u093E"],[["Heart","\u0939\u0943\u0926\u092F"],["Lungs","\u092B\u0947\u092B\u0921\u093C\u0947"],["Brain","\u092E\u0938\u094D\u0924\u093F\u0937\u094D\u0915"]],["The two kidneys filter waste out of the blood.","\u0926\u094B\u0928\u094B\u0902 \u0917\u0941\u0930\u094D\u0926\u0947 \u0930\u0915\u094D\u0924 \u0938\u0947 \u0905\u092A\u0936\u093F\u0937\u094D\u091F \u091B\u093E\u0928\u0915\u0930 \u0928\u093F\u0915\u093E\u0932\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Where does digestion of food begin?","\u092D\u094B\u091C\u0928 \u0915\u093E \u092A\u093E\u091A\u0928 \u0915\u0939\u093E\u0901 \u0938\u0947 \u0936\u0941\u0930\u0942 \u0939\u094B\u0924\u093E \u0939\u0948?",["In the mouth","\u092E\u0941\u0901\u0939 \u092E\u0947\u0902"],[["In the stomach","\u0906\u092E\u093E\u0936\u092F \u092E\u0947\u0902"],["In the heart","\u0939\u0943\u0926\u092F \u092E\u0947\u0902"],["In the lungs","\u092B\u0947\u092B\u0921\u093C\u094B\u0902 \u092E\u0947\u0902"]],["Chewing and saliva start breaking food down in the mouth.","\u091A\u092C\u093E\u0928\u0947 \u0914\u0930 \u0932\u093E\u0930 \u0938\u0947 \u092E\u0941\u0901\u0939 \u092E\u0947\u0902 \u0939\u0940 \u092D\u094B\u091C\u0928 \u091F\u0942\u091F\u0928\u093E \u0936\u0941\u0930\u0942 \u0939\u094B \u091C\u093E\u0924\u093E \u0939\u0948\u0964"]],["Which is the largest organ of the human body?","\u092E\u093E\u0928\u0935 \u0936\u0930\u0940\u0930 \u0915\u093E \u0938\u092C\u0938\u0947 \u092C\u0921\u093C\u093E \u0905\u0902\u0917 \u0915\u094C\u0928-\u0938\u093E \u0939\u0948?",["Skin","\u0924\u094D\u0935\u091A\u093E"],[["Heart","\u0939\u0943\u0926\u092F"],["Brain","\u092E\u0938\u094D\u0924\u093F\u0937\u094D\u0915"],["Liver","\u092F\u0915\u0943\u0924"]],["The skin covers the whole body and protects it.","\u0924\u094D\u0935\u091A\u093E \u092A\u0942\u0930\u0947 \u0936\u0930\u0940\u0930 \u0915\u094B \u0922\u0915\u0924\u0940 \u0939\u0948 \u0914\u0930 \u0909\u0938\u0915\u0940 \u0930\u0915\u094D\u0937\u093E \u0915\u0930\u0924\u0940 \u0939\u0948\u0964"]]]),_("s.food",5,s("Food and nutrients","\u092D\u094B\u091C\u0928 \u0914\u0930 \u092A\u094B\u0937\u0915 \u0924\u0924\u094D\u0935"),["s.body"],s("Carbohydrates and fats give energy, proteins build the body, vitamins and minerals protect it.","\u0915\u093E\u0930\u094D\u092C\u094B\u0939\u093E\u0907\u0921\u094D\u0930\u0947\u091F \u0914\u0930 \u0935\u0938\u093E \u090A\u0930\u094D\u091C\u093E \u0926\u0947\u0924\u0947 \u0939\u0948\u0902, \u092A\u094D\u0930\u094B\u091F\u0940\u0928 \u0936\u0930\u0940\u0930 \u092C\u0928\u093E\u0924\u0947 \u0939\u0948\u0902, \u0935\u093F\u091F\u093E\u092E\u093F\u0928 \u0914\u0930 \u0916\u0928\u093F\u091C \u0930\u0915\u094D\u0937\u093E \u0915\u0930\u0924\u0947 \u0939\u0948\u0902\u0964"),[["Which nutrient helps the body grow and repair itself?","\u0915\u094C\u0928-\u0938\u093E \u092A\u094B\u0937\u0915 \u0924\u0924\u094D\u0935 \u0936\u0930\u0940\u0930 \u0915\u0940 \u0935\u0943\u0926\u094D\u0927\u093F \u0914\u0930 \u092E\u0930\u092E\u094D\u092E\u0924 \u092E\u0947\u0902 \u092E\u0926\u0926 \u0915\u0930\u0924\u093E \u0939\u0948?",["Protein","\u092A\u094D\u0930\u094B\u091F\u0940\u0928"],[["Fat","\u0935\u0938\u093E"],["Water","\u092A\u093E\u0928\u0940"],["Fibre","\u0930\u0947\u0936\u093E"]],["Proteins are body-building foods: pulses, milk, eggs, fish.","\u092A\u094D\u0930\u094B\u091F\u0940\u0928 \u0936\u0930\u0940\u0930-\u0928\u093F\u0930\u094D\u092E\u093E\u0923 \u0915\u0930\u0928\u0947 \u0935\u093E\u0932\u0947 \u092D\u094B\u091C\u0928 \u0939\u0948\u0902: \u0926\u093E\u0932\u0947\u0902, \u0926\u0942\u0927, \u0905\u0902\u0921\u0947, \u092E\u091B\u0932\u0940\u0964"]],["Rice and wheat are rich in:","\u091A\u093E\u0935\u0932 \u0914\u0930 \u0917\u0947\u0939\u0942\u0901 \u092E\u0947\u0902 \u0915\u093F\u0938\u0915\u0940 \u092E\u093E\u0924\u094D\u0930\u093E \u0905\u0927\u093F\u0915 \u0939\u094B\u0924\u0940 \u0939\u0948?",["Carbohydrates","\u0915\u093E\u0930\u094D\u092C\u094B\u0939\u093E\u0907\u0921\u094D\u0930\u0947\u091F"],[["Proteins","\u092A\u094D\u0930\u094B\u091F\u0940\u0928"],["Vitamins","\u0935\u093F\u091F\u093E\u092E\u093F\u0928"],["Minerals","\u0916\u0928\u093F\u091C"]],["Cereals are rich in carbohydrates, which give energy.","\u0905\u0928\u093E\u091C \u092E\u0947\u0902 \u0915\u093E\u0930\u094D\u092C\u094B\u0939\u093E\u0907\u0921\u094D\u0930\u0947\u091F \u0905\u0927\u093F\u0915 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902, \u091C\u094B \u090A\u0930\u094D\u091C\u093E \u0926\u0947\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Lack of vitamin C causes which disease?","\u0935\u093F\u091F\u093E\u092E\u093F\u0928 C \u0915\u0940 \u0915\u092E\u0940 \u0938\u0947 \u0915\u094C\u0928-\u0938\u093E \u0930\u094B\u0917 \u0939\u094B\u0924\u093E \u0939\u0948?",["Scurvy","\u0938\u094D\u0915\u0930\u094D\u0935\u0940"],[["Rickets","\u0930\u093F\u0915\u0947\u091F\u094D\u0938"],["Night blindness","\u0930\u0924\u094C\u0902\u0927\u0940"],["Goitre","\u0918\u0947\u0902\u0918\u093E"]],["Scurvy causes bleeding gums. Citrus fruits like amla and lemon prevent it.","\u0938\u094D\u0915\u0930\u094D\u0935\u0940 \u092E\u0947\u0902 \u092E\u0938\u0942\u0921\u093C\u094B\u0902 \u0938\u0947 \u0916\u0942\u0928 \u0906\u0924\u093E \u0939\u0948\u0964 \u0906\u0901\u0935\u0932\u093E \u0914\u0930 \u0928\u0940\u0902\u092C\u0942 \u091C\u0948\u0938\u0947 \u0916\u091F\u094D\u091F\u0947 \u092B\u0932 \u0907\u0938\u0947 \u0930\u094B\u0915\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Lack of vitamin D causes which disease?","\u0935\u093F\u091F\u093E\u092E\u093F\u0928 D \u0915\u0940 \u0915\u092E\u0940 \u0938\u0947 \u0915\u094C\u0928-\u0938\u093E \u0930\u094B\u0917 \u0939\u094B\u0924\u093E \u0939\u0948?",["Rickets","\u0930\u093F\u0915\u0947\u091F\u094D\u0938"],[["Scurvy","\u0938\u094D\u0915\u0930\u094D\u0935\u0940"],["Anaemia","\u0930\u0915\u094D\u0924\u093E\u0932\u094D\u092A\u0924\u093E"],["Goitre","\u0918\u0947\u0902\u0918\u093E"]],["Rickets makes bones soft. Sunlight helps the body make vitamin D.","\u0930\u093F\u0915\u0947\u091F\u094D\u0938 \u092E\u0947\u0902 \u0939\u0921\u094D\u0921\u093F\u092F\u093E\u0901 \u0915\u092E\u091C\u093C\u094B\u0930 \u0939\u094B \u091C\u093E\u0924\u0940 \u0939\u0948\u0902\u0964 \u0927\u0942\u092A \u0938\u0947 \u0936\u0930\u0940\u0930 \u0935\u093F\u091F\u093E\u092E\u093F\u0928 D \u092C\u0928\u093E\u0924\u093E \u0939\u0948\u0964"]],["Lack of iodine causes:","\u0906\u092F\u094B\u0921\u0940\u0928 \u0915\u0940 \u0915\u092E\u0940 \u0938\u0947 \u0915\u094D\u092F\u093E \u0939\u094B\u0924\u093E \u0939\u0948?",["Goitre","\u0918\u0947\u0902\u0918\u093E"],[["Scurvy","\u0938\u094D\u0915\u0930\u094D\u0935\u0940"],["Rickets","\u0930\u093F\u0915\u0947\u091F\u094D\u0938"],["Night blindness","\u0930\u0924\u094C\u0902\u0927\u0940"]],["Goitre is a swelling of the thyroid gland in the neck. Iodised salt prevents it.","\u0918\u0947\u0902\u0918\u093E \u0917\u0932\u0947 \u0915\u0940 \u0925\u093E\u092F\u0930\u0949\u0907\u0921 \u0917\u094D\u0930\u0902\u0925\u093F \u0915\u0940 \u0938\u0942\u091C\u0928 \u0939\u0948\u0964 \u0906\u092F\u094B\u0921\u0940\u0928 \u092F\u0941\u0915\u094D\u0924 \u0928\u092E\u0915 \u0907\u0938\u0947 \u0930\u094B\u0915\u0924\u093E \u0939\u0948\u0964"]],["Lack of iron in food can cause:","\u092D\u094B\u091C\u0928 \u092E\u0947\u0902 \u0932\u094B\u0939\u0947 (\u0906\u092F\u0930\u0928) \u0915\u0940 \u0915\u092E\u0940 \u0938\u0947 \u0915\u094D\u092F\u093E \u0939\u094B \u0938\u0915\u0924\u093E \u0939\u0948?",["Anaemia","\u0930\u0915\u094D\u0924\u093E\u0932\u094D\u092A\u0924\u093E (\u090F\u0928\u0940\u092E\u093F\u092F\u093E)"],[["Goitre","\u0918\u0947\u0902\u0918\u093E"],["Rickets","\u0930\u093F\u0915\u0947\u091F\u094D\u0938"],["Scurvy","\u0938\u094D\u0915\u0930\u094D\u0935\u0940"]],["Iron is needed to make blood. Green leafy vegetables and jaggery contain iron.","\u0930\u0915\u094D\u0924 \u092C\u0928\u093E\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0932\u094B\u0939\u093E \u091A\u093E\u0939\u093F\u090F\u0964 \u0939\u0930\u0940 \u092A\u0924\u094D\u0924\u0947\u0926\u093E\u0930 \u0938\u092C\u094D\u091C\u093C\u093F\u092F\u094B\u0902 \u0914\u0930 \u0917\u0941\u0921\u093C \u092E\u0947\u0902 \u0932\u094B\u0939\u093E \u0939\u094B\u0924\u093E \u0939\u0948\u0964"]],["Lack of vitamin A can cause:","\u0935\u093F\u091F\u093E\u092E\u093F\u0928 A \u0915\u0940 \u0915\u092E\u0940 \u0938\u0947 \u0915\u094D\u092F\u093E \u0939\u094B \u0938\u0915\u0924\u093E \u0939\u0948?",["Night blindness","\u0930\u0924\u094C\u0902\u0927\u0940"],[["Scurvy","\u0938\u094D\u0915\u0930\u094D\u0935\u0940"],["Goitre","\u0918\u0947\u0902\u0918\u093E"],["Anaemia","\u0930\u0915\u094D\u0924\u093E\u0932\u094D\u092A\u0924\u093E"]],["Vitamin A keeps eyes healthy. Carrots, papaya and milk contain it.","\u0935\u093F\u091F\u093E\u092E\u093F\u0928 A \u0906\u0901\u0916\u094B\u0902 \u0915\u094B \u0938\u094D\u0935\u0938\u094D\u0925 \u0930\u0916\u0924\u093E \u0939\u0948\u0964 \u0917\u093E\u091C\u0930, \u092A\u092A\u0940\u0924\u093E \u0914\u0930 \u0926\u0942\u0927 \u092E\u0947\u0902 \u092F\u0939 \u0939\u094B\u0924\u093E \u0939\u0948\u0964"]],["Which test shows that a food contains starch?","\u0915\u093F\u0938 \u092A\u0930\u0940\u0915\u094D\u0937\u0923 \u0938\u0947 \u092A\u0924\u093E \u091A\u0932\u0924\u093E \u0939\u0948 \u0915\u093F \u092D\u094B\u091C\u0928 \u092E\u0947\u0902 \u092E\u0902\u0921 (\u0938\u094D\u091F\u093E\u0930\u094D\u091A) \u0939\u0948?",["Iodine turns it blue-black","\u0906\u092F\u094B\u0921\u0940\u0928 \u0921\u093E\u0932\u0928\u0947 \u092A\u0930 \u0928\u0940\u0932\u093E-\u0915\u093E\u0932\u093E \u0930\u0902\u0917"],[["Iodine turns it red","\u0906\u092F\u094B\u0921\u0940\u0928 \u0921\u093E\u0932\u0928\u0947 \u092A\u0930 \u0932\u093E\u0932 \u0930\u0902\u0917"],["It feels oily on paper","\u0915\u093E\u0917\u091C\u093C \u092A\u0930 \u091A\u093F\u0915\u0928\u093E \u0927\u092C\u094D\u092C\u093E"],["It turns violet with copper sulphate","\u0915\u0949\u092A\u0930 \u0938\u0932\u094D\u092B\u093C\u0947\u091F \u0938\u0947 \u092C\u0948\u0902\u0917\u0928\u0940 \u0930\u0902\u0917"]],["Starch turns blue-black with iodine solution.","\u0906\u092F\u094B\u0921\u0940\u0928 \u0918\u094B\u0932 \u0921\u093E\u0932\u0928\u0947 \u092A\u0930 \u092E\u0902\u0921 \u0928\u0940\u0932\u093E-\u0915\u093E\u0932\u093E \u0939\u094B \u091C\u093E\u0924\u093E \u0939\u0948\u0964"]]]),_("s.water_air",5,s("Water and air","\u091C\u0932 \u0914\u0930 \u0935\u093E\u092F\u0941"),["s.plants"],s("Water keeps moving between sea, sky and land: evaporation, condensation, rain.","\u091C\u0932 \u0938\u092E\u0941\u0926\u094D\u0930, \u0906\u0915\u093E\u0936 \u0914\u0930 \u0927\u0930\u0924\u0940 \u0915\u0947 \u092C\u0940\u091A \u0918\u0942\u092E\u0924\u093E \u0930\u0939\u0924\u093E \u0939\u0948: \u0935\u093E\u0937\u094D\u092A\u0940\u0915\u0930\u0923, \u0938\u0902\u0918\u0928\u0928, \u0935\u0930\u094D\u0937\u093E\u0964"),[["When water changes into water vapour because of heat, it is called:","\u0917\u0930\u094D\u092E\u0940 \u0938\u0947 \u091C\u0932 \u0915\u0947 \u091C\u0932\u0935\u093E\u0937\u094D\u092A \u092E\u0947\u0902 \u092C\u0926\u0932\u0928\u0947 \u0915\u094B \u0915\u094D\u092F\u093E \u0915\u0939\u0924\u0947 \u0939\u0948\u0902?",["Evaporation","\u0935\u093E\u0937\u094D\u092A\u0940\u0915\u0930\u0923"],[["Condensation","\u0938\u0902\u0918\u0928\u0928"],["Freezing","\u0939\u093F\u092E\u0940\u0915\u0930\u0923"],["Melting","\u092A\u093F\u0918\u0932\u0928\u093E"]],["The sun heats water in seas and rivers and it evaporates.","\u0938\u0942\u0930\u094D\u092F \u0938\u092E\u0941\u0926\u094D\u0930 \u0914\u0930 \u0928\u0926\u093F\u092F\u094B\u0902 \u0915\u0947 \u091C\u0932 \u0915\u094B \u0917\u0930\u094D\u092E \u0915\u0930\u0924\u093E \u0939\u0948 \u0914\u0930 \u0935\u0939 \u0935\u093E\u0937\u094D\u092A\u093F\u0924 \u0939\u094B \u091C\u093E\u0924\u093E \u0939\u0948\u0964"]],["Water drops on the outside of a cold glass form by:","\u0920\u0902\u0921\u0947 \u0917\u093F\u0932\u093E\u0938 \u0915\u0947 \u092C\u093E\u0939\u0930 \u092A\u093E\u0928\u0940 \u0915\u0940 \u092C\u0942\u0901\u0926\u0947\u0902 \u0915\u093F\u0938 \u092A\u094D\u0930\u0915\u094D\u0930\u093F\u092F\u093E \u0938\u0947 \u092C\u0928\u0924\u0940 \u0939\u0948\u0902?",["Condensation","\u0938\u0902\u0918\u0928\u0928"],[["Evaporation","\u0935\u093E\u0937\u094D\u092A\u0940\u0915\u0930\u0923"],["Leaking through the glass","\u0917\u093F\u0932\u093E\u0938 \u0938\u0947 \u0930\u093F\u0938\u0915\u0930"],["Melting","\u092A\u093F\u0918\u0932\u0915\u0930"]],["Water vapour in the air cools on the cold glass and turns into drops.","\u0939\u0935\u093E \u0915\u0940 \u091C\u0932\u0935\u093E\u0937\u094D\u092A \u0920\u0902\u0921\u0947 \u0917\u093F\u0932\u093E\u0938 \u092A\u0930 \u0920\u0902\u0921\u0940 \u0939\u094B\u0915\u0930 \u092C\u0942\u0901\u0926\u094B\u0902 \u092E\u0947\u0902 \u092C\u0926\u0932 \u091C\u093E\u0924\u0940 \u0939\u0948\u0964"]],["Which gas makes up most of the air?","\u0935\u093E\u092F\u0941 \u092E\u0947\u0902 \u0938\u092C\u0938\u0947 \u0905\u0927\u093F\u0915 \u092E\u093E\u0924\u094D\u0930\u093E \u0915\u093F\u0938 \u0917\u0948\u0938 \u0915\u0940 \u0939\u0948?",["Nitrogen","\u0928\u093E\u0907\u091F\u094D\u0930\u094B\u091C\u0928"],[["Oxygen","\u0911\u0915\u094D\u0938\u0940\u091C\u0928"],["Carbon dioxide","\u0915\u093E\u0930\u094D\u092C\u0928 \u0921\u093E\u0907\u0911\u0915\u094D\u0938\u093E\u0907\u0921"],["Hydrogen","\u0939\u093E\u0907\u0921\u094D\u0930\u094B\u091C\u0928"]],["Air is about 78% nitrogen and 21% oxygen.","\u0935\u093E\u092F\u0941 \u092E\u0947\u0902 \u0932\u0917\u092D\u0917 78% \u0928\u093E\u0907\u091F\u094D\u0930\u094B\u091C\u0928 \u0914\u0930 21% \u0911\u0915\u094D\u0938\u0940\u091C\u0928 \u0939\u0948\u0964"]],["Which gas do we need to breathe in?","\u0938\u093E\u0901\u0938 \u0932\u0947\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0939\u092E\u0947\u0902 \u0915\u094C\u0928-\u0938\u0940 \u0917\u0948\u0938 \u091A\u093E\u0939\u093F\u090F?",["Oxygen","\u0911\u0915\u094D\u0938\u0940\u091C\u0928"],[["Nitrogen","\u0928\u093E\u0907\u091F\u094D\u0930\u094B\u091C\u0928"],["Carbon dioxide","\u0915\u093E\u0930\u094D\u092C\u0928 \u0921\u093E\u0907\u0911\u0915\u094D\u0938\u093E\u0907\u0921"],["Helium","\u0939\u0940\u0932\u093F\u092F\u092E"]],["Our cells use oxygen to release energy from food.","\u0939\u092E\u093E\u0930\u0940 \u0915\u094B\u0936\u093F\u0915\u093E\u090F\u0901 \u092D\u094B\u091C\u0928 \u0938\u0947 \u090A\u0930\u094D\u091C\u093E \u0928\u093F\u0915\u093E\u0932\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0911\u0915\u094D\u0938\u0940\u091C\u0928 \u0915\u093E \u0909\u092A\u092F\u094B\u0917 \u0915\u0930\u0924\u0940 \u0939\u0948\u0902\u0964"]],["At what temperature does pure water boil at sea level?","\u0938\u092E\u0941\u0926\u094D\u0930 \u0924\u0932 \u092A\u0930 \u0936\u0941\u0926\u094D\u0927 \u091C\u0932 \u0915\u093F\u0938 \u0924\u093E\u092A \u092A\u0930 \u0909\u092C\u0932\u0924\u093E \u0939\u0948?",["100 \xB0C","100 \xB0C"],[["0 \xB0C","0 \xB0C"],["50 \xB0C","50 \xB0C"],["37 \xB0C","37 \xB0C"]],["Pure water boils at 100 \xB0C and freezes at 0 \xB0C at sea level.","\u0938\u092E\u0941\u0926\u094D\u0930 \u0924\u0932 \u092A\u0930 \u0936\u0941\u0926\u094D\u0927 \u091C\u0932 100 \xB0C \u092A\u0930 \u0909\u092C\u0932\u0924\u093E \u0939\u0948 \u0914\u0930 0 \xB0C \u092A\u0930 \u091C\u092E\u0924\u093E \u0939\u0948\u0964"]],["Collecting and storing rainwater for later use is called:","\u0935\u0930\u094D\u0937\u093E \u091C\u0932 \u0915\u094B \u0907\u0915\u091F\u094D\u0920\u093E \u0915\u0930\u0915\u0947 \u092C\u093E\u0926 \u0915\u0947 \u0932\u093F\u090F \u0930\u0916\u0928\u0947 \u0915\u094B \u0915\u094D\u092F\u093E \u0915\u0939\u0924\u0947 \u0939\u0948\u0902?",["Rainwater harvesting","\u0935\u0930\u094D\u0937\u093E \u091C\u0932 \u0938\u0902\u091A\u092F\u0928"],[["Irrigation","\u0938\u093F\u0902\u091A\u093E\u0908"],["Evaporation","\u0935\u093E\u0937\u094D\u092A\u0940\u0915\u0930\u0923"],["Flooding","\u092C\u093E\u0922\u093C"]],["Rainwater harvesting refills wells and groundwater.","\u0935\u0930\u094D\u0937\u093E \u091C\u0932 \u0938\u0902\u091A\u092F\u0928 \u0938\u0947 \u0915\u0941\u090F\u0901 \u0914\u0930 \u092D\u0942\u091C\u0932 \u092B\u093F\u0930 \u0938\u0947 \u092D\u0930\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Which method makes muddy water clear by letting the mud settle down?","\u0915\u093F\u0938 \u0935\u093F\u0927\u093F \u092E\u0947\u0902 \u092E\u093F\u091F\u094D\u091F\u0940 \u0928\u0940\u091A\u0947 \u092C\u0948\u0920 \u091C\u093E\u0928\u0947 \u0938\u0947 \u0917\u0902\u0926\u093E \u092A\u093E\u0928\u0940 \u0938\u093E\u092B\u093C \u0939\u094B\u0924\u093E \u0939\u0948?",["Sedimentation","\u0905\u0935\u0938\u093E\u0926\u0928"],[["Evaporation","\u0935\u093E\u0937\u094D\u092A\u0940\u0915\u0930\u0923"],["Boiling","\u0909\u092C\u093E\u0932\u0928\u093E"],["Freezing","\u091C\u092E\u093E\u0928\u093E"]],["In sedimentation heavy particles settle at the bottom; the clear water is then poured off (decantation).","\u0905\u0935\u0938\u093E\u0926\u0928 \u092E\u0947\u0902 \u092D\u093E\u0930\u0940 \u0915\u0923 \u0928\u0940\u091A\u0947 \u092C\u0948\u0920 \u091C\u093E\u0924\u0947 \u0939\u0948\u0902; \u092B\u093F\u0930 \u0938\u093E\u092B\u093C \u092A\u093E\u0928\u0940 \u090A\u092A\u0930 \u0938\u0947 \u0928\u093F\u0925\u093E\u0930 \u0932\u093F\u092F\u093E \u091C\u093E\u0924\u093E \u0939\u0948\u0964"]]]),_("s.matter",5,s("Materials and their states","\u092A\u0926\u093E\u0930\u094D\u0925 \u0914\u0930 \u0909\u0928\u0915\u0940 \u0905\u0935\u0938\u094D\u0925\u093E\u090F\u0901"),["s.water_air"],s("Solids keep their shape, liquids take the shape of the container, gases fill all the space.","\u0920\u094B\u0938 \u0915\u093E \u0906\u0915\u093E\u0930 \u0928\u093F\u0936\u094D\u091A\u093F\u0924 \u0939\u094B\u0924\u093E \u0939\u0948, \u0926\u094D\u0930\u0935 \u092C\u0930\u094D\u0924\u0928 \u0915\u093E \u0906\u0915\u093E\u0930 \u0932\u0947 \u0932\u0947\u0924\u093E \u0939\u0948, \u0917\u0948\u0938 \u092A\u0942\u0930\u0940 \u091C\u0917\u0939 \u092D\u0930 \u0926\u0947\u0924\u0940 \u0939\u0948\u0964"),[["Which of these is a liquid at room temperature?","\u0915\u092E\u0930\u0947 \u0915\u0947 \u0924\u093E\u092A \u092A\u0930 \u0907\u0928\u092E\u0947\u0902 \u0938\u0947 \u0915\u094C\u0928 \u0926\u094D\u0930\u0935 \u0939\u0948?",["Milk","\u0926\u0942\u0927"],[["Ice","\u092C\u0930\u094D\u092B\u093C"],["Stone","\u092A\u0924\u094D\u0925\u0930"],["Steam","\u092D\u093E\u092A"]],["Milk flows and takes the shape of its container.","\u0926\u0942\u0927 \u092C\u0939\u0924\u093E \u0939\u0948 \u0914\u0930 \u092C\u0930\u094D\u0924\u0928 \u0915\u093E \u0906\u0915\u093E\u0930 \u0932\u0947 \u0932\u0947\u0924\u093E \u0939\u0948\u0964"]],["Ice changing into water is called:","\u092C\u0930\u094D\u092B\u093C \u0915\u0947 \u092A\u093E\u0928\u0940 \u092E\u0947\u0902 \u092C\u0926\u0932\u0928\u0947 \u0915\u094B \u0915\u094D\u092F\u093E \u0915\u0939\u0924\u0947 \u0939\u0948\u0902?",["Melting","\u092A\u093F\u0918\u0932\u0928\u093E"],[["Freezing","\u091C\u092E\u0928\u093E"],["Boiling","\u0909\u092C\u0932\u0928\u093E"],["Condensation","\u0938\u0902\u0918\u0928\u0928"]],["Heat changes solid ice into liquid water.","\u090A\u0937\u094D\u092E\u093E \u0920\u094B\u0938 \u092C\u0930\u094D\u092B\u093C \u0915\u094B \u0926\u094D\u0930\u0935 \u092A\u093E\u0928\u0940 \u092E\u0947\u0902 \u092C\u0926\u0932 \u0926\u0947\u0924\u0940 \u0939\u0948\u0964"]],["Which material allows electricity to pass through it?","\u0915\u093F\u0938 \u092A\u0926\u093E\u0930\u094D\u0925 \u0938\u0947 \u0939\u094B\u0915\u0930 \u0935\u093F\u0926\u094D\u092F\u0941\u0924 \u092A\u094D\u0930\u0935\u093E\u0939\u093F\u0924 \u0939\u094B\u0924\u0940 \u0939\u0948?",["Copper","\u0924\u093E\u0901\u092C\u093E"],[["Rubber","\u0930\u092C\u0930"],["Plastic","\u092A\u094D\u0932\u093E\u0938\u094D\u091F\u093F\u0915"],["Dry wood","\u0938\u0942\u0916\u0940 \u0932\u0915\u0921\u093C\u0940"]],["Metals like copper are good conductors; rubber and plastic are insulators.","\u0924\u093E\u0901\u092C\u0947 \u091C\u0948\u0938\u0940 \u0927\u093E\u0924\u0941\u090F\u0901 \u0938\u0941\u091A\u093E\u0932\u0915 \u0939\u0948\u0902; \u0930\u092C\u0930 \u0914\u0930 \u092A\u094D\u0932\u093E\u0938\u094D\u091F\u093F\u0915 \u0915\u0941\u091A\u093E\u0932\u0915 \u0939\u0948\u0902\u0964"]],["Which of these dissolves in water?","\u0907\u0928\u092E\u0947\u0902 \u0938\u0947 \u0915\u094C\u0928 \u092A\u093E\u0928\u0940 \u092E\u0947\u0902 \u0918\u0941\u0932 \u091C\u093E\u0924\u093E \u0939\u0948?",["Sugar","\u091A\u0940\u0928\u0940"],[["Sand","\u0930\u0947\u0924"],["Oil","\u0924\u0947\u0932"],["Chalk powder","\u091A\u0949\u0915 \u0915\u093E \u091A\u0942\u0930\u094D\u0923"]],["Sugar is soluble in water; sand and chalk are not, and oil floats.","\u091A\u0940\u0928\u0940 \u092A\u093E\u0928\u0940 \u092E\u0947\u0902 \u0918\u0941\u0932\u0928\u0936\u0940\u0932 \u0939\u0948; \u0930\u0947\u0924 \u0914\u0930 \u091A\u0949\u0915 \u0928\u0939\u0940\u0902 \u0918\u0941\u0932\u0924\u0947, \u0914\u0930 \u0924\u0947\u0932 \u090A\u092A\u0930 \u0924\u0948\u0930\u0924\u093E \u0939\u0948\u0964"]],["Which change can be reversed?","\u0915\u094C\u0928-\u0938\u093E \u092A\u0930\u093F\u0935\u0930\u094D\u0924\u0928 \u0909\u0932\u091F\u093E \u091C\u093E \u0938\u0915\u0924\u093E \u0939\u0948?",["Melting of wax","\u092E\u094B\u092E \u0915\u093E \u092A\u093F\u0918\u0932\u0928\u093E"],[["Burning of paper","\u0915\u093E\u0917\u091C\u093C \u0915\u093E \u091C\u0932\u0928\u093E"],["Cooking of rice","\u091A\u093E\u0935\u0932 \u0915\u093E \u092A\u0915\u0928\u093E"],["Rusting of iron","\u0932\u094B\u0939\u0947 \u092E\u0947\u0902 \u091C\u0902\u0917 \u0932\u0917\u0928\u093E"]],["Melted wax becomes solid again on cooling. Burning, cooking and rusting cannot be undone.","\u092A\u093F\u0918\u0932\u093E \u092E\u094B\u092E \u0920\u0902\u0921\u093E \u0939\u094B\u0928\u0947 \u092A\u0930 \u092B\u093F\u0930 \u0920\u094B\u0938 \u0939\u094B \u091C\u093E\u0924\u093E \u0939\u0948\u0964 \u091C\u0932\u0928\u093E, \u092A\u0915\u0928\u093E \u0914\u0930 \u091C\u0902\u0917 \u0932\u0917\u0928\u093E \u0909\u0932\u091F\u0947 \u0928\u0939\u0940\u0902 \u091C\u093E \u0938\u0915\u0924\u0947\u0964"]],["Rusting of iron needs:","\u0932\u094B\u0939\u0947 \u092E\u0947\u0902 \u091C\u0902\u0917 \u0932\u0917\u0928\u0947 \u0915\u0947 \u0932\u093F\u090F \u0915\u094D\u092F\u093E \u0906\u0935\u0936\u094D\u092F\u0915 \u0939\u0948?",["Both air and water","\u0935\u093E\u092F\u0941 \u0914\u0930 \u091C\u0932 \u0926\u094B\u0928\u094B\u0902"],[["Only sunlight","\u0915\u0947\u0935\u0932 \u0938\u0942\u0930\u094D\u092F \u0915\u093E \u092A\u094D\u0930\u0915\u093E\u0936"],["Only heat","\u0915\u0947\u0935\u0932 \u090A\u0937\u094D\u092E\u093E"],["Only dry air","\u0915\u0947\u0935\u0932 \u0938\u0942\u0916\u0940 \u0935\u093E\u092F\u0941"]],["Iron rusts when oxygen and moisture are both present. Paint prevents it.","\u0932\u094B\u0939\u0947 \u092E\u0947\u0902 \u091C\u0902\u0917 \u0924\u092C \u0932\u0917\u0924\u093E \u0939\u0948 \u091C\u092C \u0911\u0915\u094D\u0938\u0940\u091C\u0928 \u0914\u0930 \u0928\u092E\u0940 \u0926\u094B\u0928\u094B\u0902 \u0939\u094B\u0902\u0964 \u092A\u0947\u0902\u091F \u0907\u0938\u0947 \u0930\u094B\u0915\u0924\u093E \u0939\u0948\u0964"]],["Which material is attracted by a magnet?","\u091A\u0941\u0902\u092C\u0915 \u0915\u093F\u0938 \u092A\u0926\u093E\u0930\u094D\u0925 \u0915\u094B \u0906\u0915\u0930\u094D\u0937\u093F\u0924 \u0915\u0930\u0924\u093E \u0939\u0948?",["Iron nail","\u0932\u094B\u0939\u0947 \u0915\u0940 \u0915\u0940\u0932"],[["Plastic spoon","\u092A\u094D\u0932\u093E\u0938\u094D\u091F\u093F\u0915 \u0915\u093E \u091A\u092E\u094D\u092E\u091A"],["Copper coin","\u0924\u093E\u0901\u092C\u0947 \u0915\u093E \u0938\u093F\u0915\u094D\u0915\u093E"],["Wooden pencil","\u0932\u0915\u0921\u093C\u0940 \u0915\u0940 \u092A\u0947\u0902\u0938\u093F\u0932"]],["Magnets attract iron, nickel and cobalt, but not copper, plastic or wood.","\u091A\u0941\u0902\u092C\u0915 \u0932\u094B\u0939\u093E, \u0928\u093F\u0915\u0932 \u0914\u0930 \u0915\u094B\u092C\u093E\u0932\u094D\u091F \u0915\u094B \u0906\u0915\u0930\u094D\u0937\u093F\u0924 \u0915\u0930\u0924\u093E \u0939\u0948, \u0924\u093E\u0901\u092C\u093E, \u092A\u094D\u0932\u093E\u0938\u094D\u091F\u093F\u0915 \u092F\u093E \u0932\u0915\u0921\u093C\u0940 \u0915\u094B \u0928\u0939\u0940\u0902\u0964"]]]),_("s.space",5,s("Earth, Sun and Moon","\u092A\u0943\u0925\u094D\u0935\u0940, \u0938\u0942\u0930\u094D\u092F \u0914\u0930 \u091A\u0902\u0926\u094D\u0930\u092E\u093E"),[],s("The Earth spins once a day (day and night) and goes round the Sun once a year.","\u092A\u0943\u0925\u094D\u0935\u0940 \u0926\u093F\u0928 \u092E\u0947\u0902 \u090F\u0915 \u092C\u093E\u0930 \u0918\u0942\u092E\u0924\u0940 \u0939\u0948 (\u0926\u093F\u0928 \u0914\u0930 \u0930\u093E\u0924) \u0914\u0930 \u0935\u0930\u094D\u0937 \u092E\u0947\u0902 \u090F\u0915 \u092C\u093E\u0930 \u0938\u0942\u0930\u094D\u092F \u0915\u0940 \u092A\u0930\u093F\u0915\u094D\u0930\u092E\u093E \u0915\u0930\u0924\u0940 \u0939\u0948\u0964"),[["Day and night happen because the Earth:","\u0926\u093F\u0928 \u0914\u0930 \u0930\u093E\u0924 \u0915\u093F\u0938 \u0915\u093E\u0930\u0923 \u0939\u094B\u0924\u0947 \u0939\u0948\u0902?",["Spins on its axis","\u092A\u0943\u0925\u094D\u0935\u0940 \u0905\u092A\u0928\u0940 \u0927\u0941\u0930\u0940 \u092A\u0930 \u0918\u0942\u092E\u0924\u0940 \u0939\u0948"],[["Goes round the Sun","\u092A\u0943\u0925\u094D\u0935\u0940 \u0938\u0942\u0930\u094D\u092F \u0915\u0940 \u092A\u0930\u093F\u0915\u094D\u0930\u092E\u093E \u0915\u0930\u0924\u0940 \u0939\u0948"],["Goes round the Moon","\u092A\u0943\u0925\u094D\u0935\u0940 \u091A\u0902\u0926\u094D\u0930\u092E\u093E \u0915\u0940 \u092A\u0930\u093F\u0915\u094D\u0930\u092E\u093E \u0915\u0930\u0924\u0940 \u0939\u0948"],["Moves away from the Sun","\u092A\u0943\u0925\u094D\u0935\u0940 \u0938\u0942\u0930\u094D\u092F \u0938\u0947 \u0926\u0942\u0930 \u091C\u093E\u0924\u0940 \u0939\u0948"]],["The Earth turns once in about 24 hours; the side facing the Sun has day.","\u092A\u0943\u0925\u094D\u0935\u0940 \u0932\u0917\u092D\u0917 24 \u0918\u0902\u091F\u0947 \u092E\u0947\u0902 \u090F\u0915 \u092C\u093E\u0930 \u0918\u0942\u092E\u0924\u0940 \u0939\u0948; \u0938\u0942\u0930\u094D\u092F \u0915\u0940 \u0913\u0930 \u0935\u093E\u0932\u0947 \u092D\u093E\u0917 \u092E\u0947\u0902 \u0926\u093F\u0928 \u0939\u094B\u0924\u093E \u0939\u0948\u0964"]],["How long does the Earth take to go round the Sun once?","\u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u094B \u0938\u0942\u0930\u094D\u092F \u0915\u0940 \u090F\u0915 \u092A\u0930\u093F\u0915\u094D\u0930\u092E\u093E \u092E\u0947\u0902 \u0915\u093F\u0924\u0928\u093E \u0938\u092E\u092F \u0932\u0917\u0924\u093E \u0939\u0948?",["About 365 days","\u0932\u0917\u092D\u0917 365 \u0926\u093F\u0928"],[["About 24 hours","\u0932\u0917\u092D\u0917 24 \u0918\u0902\u091F\u0947"],["About 30 days","\u0932\u0917\u092D\u0917 30 \u0926\u093F\u0928"],["About 7 days","\u0932\u0917\u092D\u0917 7 \u0926\u093F\u0928"]],["One trip round the Sun is one year: about 365\xBC days.","\u0938\u0942\u0930\u094D\u092F \u0915\u0940 \u090F\u0915 \u092A\u0930\u093F\u0915\u094D\u0930\u092E\u093E \u090F\u0915 \u0935\u0930\u094D\u0937 \u0939\u0948: \u0932\u0917\u092D\u0917 365\xBC \u0926\u093F\u0928\u0964"]],["Which planet is closest to the Sun?","\u0938\u0942\u0930\u094D\u092F \u0915\u0947 \u0938\u092C\u0938\u0947 \u0928\u093F\u0915\u091F \u0915\u094C\u0928-\u0938\u093E \u0917\u094D\u0930\u0939 \u0939\u0948?",["Mercury","\u092C\u0941\u0927"],[["Venus","\u0936\u0941\u0915\u094D\u0930"],["Earth","\u092A\u0943\u0925\u094D\u0935\u0940"],["Mars","\u092E\u0902\u0917\u0932"]],["The order from the Sun begins: Mercury, Venus, Earth, Mars.","\u0938\u0942\u0930\u094D\u092F \u0938\u0947 \u0915\u094D\u0930\u092E: \u092C\u0941\u0927, \u0936\u0941\u0915\u094D\u0930, \u092A\u0943\u0925\u094D\u0935\u0940, \u092E\u0902\u0917\u0932\u0964"]],["Which is the largest planet in our solar system?","\u0939\u092E\u093E\u0930\u0947 \u0938\u094C\u0930\u092E\u0902\u0921\u0932 \u0915\u093E \u0938\u092C\u0938\u0947 \u092C\u0921\u093C\u093E \u0917\u094D\u0930\u0939 \u0915\u094C\u0928-\u0938\u093E \u0939\u0948?",["Jupiter","\u092C\u0943\u0939\u0938\u094D\u092A\u0924\u093F"],[["Saturn","\u0936\u0928\u093F"],["Earth","\u092A\u0943\u0925\u094D\u0935\u0940"],["Mars","\u092E\u0902\u0917\u0932"]],["Jupiter is so big that more than a thousand Earths could fit inside it.","\u092C\u0943\u0939\u0938\u094D\u092A\u0924\u093F \u0907\u0924\u0928\u093E \u092C\u0921\u093C\u093E \u0939\u0948 \u0915\u093F \u0909\u0938\u092E\u0947\u0902 \u090F\u0915 \u0939\u091C\u093C\u093E\u0930 \u0938\u0947 \u0905\u0927\u093F\u0915 \u092A\u0943\u0925\u094D\u0935\u093F\u092F\u093E\u0901 \u0938\u092E\u093E \u0938\u0915\u0924\u0940 \u0939\u0948\u0902\u0964"]],["Which planet is called the Red Planet?","\u0915\u093F\u0938 \u0917\u094D\u0930\u0939 \u0915\u094B \u0932\u093E\u0932 \u0917\u094D\u0930\u0939 \u0915\u0939\u0924\u0947 \u0939\u0948\u0902?",["Mars","\u092E\u0902\u0917\u0932"],[["Jupiter","\u092C\u0943\u0939\u0938\u094D\u092A\u0924\u093F"],["Venus","\u0936\u0941\u0915\u094D\u0930"],["Mercury","\u092C\u0941\u0927"]],["Iron oxide (rust) in its soil makes Mars look red.","\u092E\u0902\u0917\u0932 \u0915\u0940 \u092E\u093F\u091F\u094D\u091F\u0940 \u092E\u0947\u0902 \u0906\u092F\u0930\u0928 \u0911\u0915\u094D\u0938\u093E\u0907\u0921 (\u091C\u0902\u0917) \u0915\u0947 \u0915\u093E\u0930\u0923 \u0935\u0939 \u0932\u093E\u0932 \u0926\u093F\u0916\u0924\u093E \u0939\u0948\u0964"]],["The Moon shines because:","\u091A\u0902\u0926\u094D\u0930\u092E\u093E \u091A\u092E\u0915\u0924\u093E \u0939\u0948 \u0915\u094D\u092F\u094B\u0902\u0915\u093F:",["It reflects sunlight","\u0935\u0939 \u0938\u0942\u0930\u094D\u092F \u0915\u0947 \u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u094B \u092A\u0930\u093E\u0935\u0930\u094D\u0924\u093F\u0924 \u0915\u0930\u0924\u093E \u0939\u0948"],[["It makes its own light","\u0935\u0939 \u0905\u092A\u0928\u093E \u092A\u094D\u0930\u0915\u093E\u0936 \u0938\u094D\u0935\u092F\u0902 \u092C\u0928\u093E\u0924\u093E \u0939\u0948"],["It is very hot","\u0935\u0939 \u092C\u0939\u0941\u0924 \u0917\u0930\u094D\u092E \u0939\u0948"],["It reflects light from the Earth only","\u0935\u0939 \u0915\u0947\u0935\u0932 \u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u093E \u092A\u094D\u0930\u0915\u093E\u0936 \u092A\u0930\u093E\u0935\u0930\u094D\u0924\u093F\u0924 \u0915\u0930\u0924\u093E \u0939\u0948"]],["The Moon has no light of its own; it reflects light from the Sun.","\u091A\u0902\u0926\u094D\u0930\u092E\u093E \u0915\u093E \u0905\u092A\u0928\u093E \u092A\u094D\u0930\u0915\u093E\u0936 \u0928\u0939\u0940\u0902 \u0939\u0948; \u0935\u0939 \u0938\u0942\u0930\u094D\u092F \u0915\u093E \u092A\u094D\u0930\u0915\u093E\u0936 \u092A\u0930\u093E\u0935\u0930\u094D\u0924\u093F\u0924 \u0915\u0930\u0924\u093E \u0939\u0948\u0964"]],["Which is a star?","\u0907\u0928\u092E\u0947\u0902 \u0938\u0947 \u0924\u093E\u0930\u093E \u0915\u094C\u0928 \u0939\u0948?",["The Sun","\u0938\u0942\u0930\u094D\u092F"],[["The Moon","\u091A\u0902\u0926\u094D\u0930\u092E\u093E"],["Mars","\u092E\u0902\u0917\u0932"],["Venus","\u0936\u0941\u0915\u094D\u0930"]],["The Sun is the star nearest to the Earth. Planets and moons do not make their own light.","\u0938\u0942\u0930\u094D\u092F \u092A\u0943\u0925\u094D\u0935\u0940 \u0915\u093E \u0938\u092C\u0938\u0947 \u0928\u093F\u0915\u091F \u0924\u093E\u0930\u093E \u0939\u0948\u0964 \u0917\u094D\u0930\u0939 \u0914\u0930 \u0909\u092A\u0917\u094D\u0930\u0939 \u0905\u092A\u0928\u093E \u092A\u094D\u0930\u0915\u093E\u0936 \u0928\u0939\u0940\u0902 \u092C\u0928\u093E\u0924\u0947\u0964"]]]),_("s.light",6,s("Light, shadows and sound","\u092A\u094D\u0930\u0915\u093E\u0936, \u091B\u093E\u092F\u093E \u0914\u0930 \u0927\u094D\u0935\u0928\u093F"),["s.space"],s("Light travels in straight lines; an opaque object blocks it and makes a shadow. Sound is made by vibration.","\u092A\u094D\u0930\u0915\u093E\u0936 \u0938\u0940\u0927\u0940 \u0930\u0947\u0916\u093E \u092E\u0947\u0902 \u091A\u0932\u0924\u093E \u0939\u0948; \u0905\u092A\u093E\u0930\u0926\u0930\u094D\u0936\u0940 \u0935\u0938\u094D\u0924\u0941 \u0909\u0938\u0947 \u0930\u094B\u0915\u0915\u0930 \u091B\u093E\u092F\u093E \u092C\u0928\u093E\u0924\u0940 \u0939\u0948\u0964 \u0927\u094D\u0935\u0928\u093F \u0915\u0902\u092A\u0928 \u0938\u0947 \u092C\u0928\u0924\u0940 \u0939\u0948\u0964"),[["A shadow forms when light is blocked by an object that is:","\u091B\u093E\u092F\u093E \u0924\u092C \u092C\u0928\u0924\u0940 \u0939\u0948 \u091C\u092C \u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u094B \u0915\u094B\u0908 \u0935\u0938\u094D\u0924\u0941 \u0930\u094B\u0915\u0924\u0940 \u0939\u0948 \u091C\u094B:",["Opaque","\u0905\u092A\u093E\u0930\u0926\u0930\u094D\u0936\u0940 \u0939\u094B"],[["Transparent","\u092A\u093E\u0930\u0926\u0930\u094D\u0936\u0940 \u0939\u094B"],["Shiny","\u091A\u092E\u0915\u0940\u0932\u0940 \u0939\u094B"],["Hot","\u0917\u0930\u094D\u092E \u0939\u094B"]],["Opaque objects do not let light pass, so a dark area forms behind them.","\u0905\u092A\u093E\u0930\u0926\u0930\u094D\u0936\u0940 \u0935\u0938\u094D\u0924\u0941\u090F\u0901 \u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u094B \u0928\u0939\u0940\u0902 \u091C\u093E\u0928\u0947 \u0926\u0947\u0924\u0940\u0902, \u0907\u0938\u0932\u093F\u090F \u0909\u0928\u0915\u0947 \u092A\u0940\u091B\u0947 \u0905\u0901\u0927\u0947\u0930\u093E \u0915\u094D\u0937\u0947\u0924\u094D\u0930 \u092C\u0928\u0924\u093E \u0939\u0948\u0964"]],["Light travels in:","\u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u093F\u0938 \u092A\u094D\u0930\u0915\u093E\u0930 \u091A\u0932\u0924\u093E \u0939\u0948?",["Straight lines","\u0938\u0940\u0927\u0940 \u0930\u0947\u0916\u093E \u092E\u0947\u0902"],[["Circles","\u0935\u0943\u0924\u094D\u0924 \u092E\u0947\u0902"],["Zig-zag lines","\u091F\u0947\u0922\u093C\u0940-\u092E\u0947\u0922\u093C\u0940 \u0930\u0947\u0916\u093E \u092E\u0947\u0902"],["Only downward","\u0915\u0947\u0935\u0932 \u0928\u0940\u091A\u0947 \u0915\u0940 \u0913\u0930"]],["This is why we cannot see round a corner.","\u0907\u0938\u0940 \u0915\u093E\u0 3E\u0928)"],[["Water","\u092A\u093E\u0928\u0940"],["Air","\u0935\u093E\u092F\u0941"],["Iron","\u0932\u094B\u0939\u093E"]],["Sound needs a medium; in space there is no air, so there is silence.","\u0927\u094D\u0935\u0928\u093F \u0915\u094B \u092E\u093E\u0927\u094D\u092F\u092E \u091A\u093E\u0939\u093F\u090F; \u0905\u0902\u0924\u0930\u093F\u0915\u094D\u0937 \u092E\u0947\u0902 \u0935\u093E\u092F\u0941 \u0928\u0939\u0940\u0902 \u0939\u0948, \u0907\u0938\u0932\u093F\u090F \u0935\u0939\u093E\u0901 \u0938\u0928\u094D\u0928\u093E\u091F\u093E \u0939\u0948\u0964"]],["Which travels faster?","\u0915\u094C\u0928 \u0905\u0927\u093F\u0915 \u0924\u0947\u091C\u093C \u091A\u0932\u0924\u093E \u0939\u0948?",["Light","\u092A\u094D\u0930\u0915\u093E\u0936"],[["Sound","\u0927\u094D\u0935\u0928\u093F"],["Both travel at the same speed","\u0926\u094B\u0928\u094B\u0902 \u0938\u092E\u093E\u0928 \u0917\u0924\u093F \u0938\u0947"],["Wind","\u0939\u0935\u093E"]],["We see lightning before we hear thunder because light is much faster than sound.","\u0939\u092E\u0947\u0902 \u092C\u093F\u091C\u0932\u0940 \u0915\u0940 \u091A\u092E\u0915 \u0917\u0930\u091C \u0938\u0947 \u092A\u0939\u0932\u0947 \u0926\u093F\u0916\u0924\u0940 \u0939\u0948 \u0915\u094D\u092F\u094B\u0902\u0915\u093F \u092A\u094D\u0930\u0915\u093E\u0936 \u0927\u094D\u0935\u0928\u093F \u0938\u0947 \u092C\u0939\u0941\u0924 \u0924\u0947\u091C\u093C \u0939\u0948\u0964"]],["An image in a plane mirror is:","\u0938\u092E\u0924\u0932 \u0926\u0930\u094D\u092A\u0923 \u092E\u0947\u0902 \u092A\u094D\u0930\u0924\u093F\u092C\u093F\u0902\u092C \u0915\u0948\u0938\u093E \u0939\u094B\u0924\u093E \u0939\u0948?",["Laterally inverted (left and right swap)","\u092A\u093E\u0930\u094D\u0936\u094D\u0935 \u0930\u0942\u092A \u0938\u0947 \u0909\u0932\u091F\u093E (\u092C\u093E\u092F\u093E\u0901-\u0926\u093E\u092F\u093E\u0901 \u092C\u0926\u0932 \u091C\u093E\u0924\u093E \u0939\u0948)"],[["Upside down","\u0909\u0932\u094D\u091F\u093E (\u0938\u093F\u0930 \u0928\u0940\u091A\u  not run out; coal, petrol and gas do.","\u0938\u0942\u0930\u094D\u092F \u0915\u093E \u092A\u094D\u0930\u0915\u093E\u0936 \u0914\u0930 \u092A\u0935\u0928 \u0938\u092E\u093E\u092A\u094D\u0924 \u0928\u0939\u0940\u0902 \u0939\u094B\u0924\u0947; \u0915\u094B\u092F\u0932\u093E, \u092A\u0947\u091F\u094D\u0930\u094B\u0932 \u0914\u0930 \u0917\u0948\u0938 \u0939\u094B \u091C\u093E\u0924\u0947 \u0939\u0948\u0902\u0964"]],["A solar cell changes sunlight into:","\u0938\u094C\u0930 \u0938\u0947\u0932 \u0938\u0942\u0930\u094D\u092F \u0915\u0947 \u092A\u094D\u0930\u0915\u093E\u0936 \u0915\u094B \u0915\u093F\u0938\u092E\u0947\u0902 \u092C\u0926\u0932\u0924\u093E \u0939\u0948?",["Electrical energy","\u0935\u093F\u0926\u094D\u092F\u0941\u0924 \u090A\u0930\u094D\u091C\u093E"],[["Sound energy","\u0927\u094D\u0935\u0928\u093F \u090A\u0930\u094D\u091C\u093E"],["Chemical energy only","\u0915\u0947\u0935\u0932 \u0930\u093E\u0938\u093E\u092F\u0928\u093F\u0915 \u090A\u0930\u094D\u091C\u093E"],["Magnetic energy","\u091A\u0941\u0902\u092C\u0915\u0940\u092F \u090A\u0930\u094D\u091C\u093E"]],["Solar panels on rooftops give electricity from sunlight.","\u091B\u0924 \u092A\u0930 \u0932\u0917\u0947 \u0938\u094C\u0930 \u092A\u0948\u0928\u0932 \u0927\u0942\u092A \u0938\u0947 \u092C\u093F\u091C\u0932\u0940 \u0926\u0947\u0924\u0947 \u0939\u0948\u0902\u0964"]],["Which unit is used to measure force?","\u092C\u0932 \u0915\u093F\u0938 \u092E\u093E\u0924\u094D\u0930\u0915 \u092E\u0947\u0902 \u092E\u093E\u092A\u093E \u091C\u093E\u0924\u093E \u0939\u0948?",["Newton","\u0928\u094D\u092F\u0942\u091F\u0928"],[["Kilogram","\u0915\u093F\u0932\u094B\u0917\u094D\u0930\u093E\u092E"],["Metre","\u092E\u0940\u091F\u0930"],["Litre","\u0932\u0940\u091F\u0930"]],["Force is measured in newtons (N), named after Isaac Newton.","\u092C\u0932 \u0915\u094B \u0928\u094D\u092F\u0942\u091F\u0928 (N) \u092E\u0947\u0902 \u092E\u093E\u092A\u0924\u0947 \u0939\u0948\u0902, \u091C\u094B \u0906\u0907\u091C\u093C\u0915 \u0928\u094D\u092F\u
